name: YADO Live Shadow Meta Selection Developmental V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_live_shadow_meta_selection_developmental_v1.py"
      - ".github/workflows/yado-live-shadow-meta-selection-developmental-v1.yml"
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run live shadow meta-selection on G0 developmental priority
        run: python runtime/yado_live_shadow_meta_selection_developmental_v1.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-live-shadow-meta-selection-developmental-v1
          path: runtime/yado_live_shadow_meta_selection_developmental_v1_receipt.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_live_shadow_meta_selection_developmental_v1_receipt.json receipts/yado-live-shadow-meta-selection-developmental-v1-latest.json
          git config user.name "YADO Live Shadow Meta Selector"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-live-shadow-meta-selection-developmental-v1-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist live shadow meta-selection developmental evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
