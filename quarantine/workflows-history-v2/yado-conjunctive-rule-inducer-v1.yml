name: YADO Conjunctive Rule Inducer V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_conjunctive_rule_inducer_v1.py"
      - ".github/workflows/yado-conjunctive-rule-inducer-v1.yml"
permissions:
  contents: write
jobs:
  induce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run bounded conjunctive rule induction
        run: python runtime/yado_conjunctive_rule_inducer_v1.py
      - name: Upload receipt and component
        uses: actions/upload-artifact@v4
        with:
          name: yado-conjunctive-rule-inducer-v1
          path: |
            runtime/yado_conjunctive_rule_inducer_v1_receipt.json
            runtime/conjunctive_rule_inducer_v1/component.json
          retention-days: 30
      - name: Persist shadow candidate evidence
        run: |
          mkdir -p receipts candidates/conjunctive-rule-inducer-v1
          cp runtime/yado_conjunctive_rule_inducer_v1_receipt.json receipts/yado-conjunctive-rule-inducer-v1-latest.json
          cp runtime/conjunctive_rule_inducer_v1/component.json candidates/conjunctive-rule-inducer-v1/component.json
          git config user.name "YADO Conjunctive Rule Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-conjunctive-rule-inducer-v1-latest.json candidates/conjunctive-rule-inducer-v1/component.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist conjunctive rule inducer candidate [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
