name: YADO Intelligence Plateau Causal Readmission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-intelligence-plateau-causal-readmission-v1-request.json]
permissions:
  contents: write
jobs:
  readmit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run causal readmission
        id: readmit
        continue-on-error: true
        run: python runtime/yado_intelligence_plateau_causal_readmission_v1.py
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_intelligence_plateau_causal_readmission_v1_receipt.json receipts/yado-intelligence-plateau-causal-readmission-v1-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Intelligence Causal Readmission'
          git config user.email 'actions@users.noreply.github.com'
          git add architecture/evolution-ledger.json architecture/yado-g2-lti-ceiling-state-v1.json receipts/yado-intelligence-plateau-causal-readmission-v1-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO intelligence causal readmission V1 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_intelligence_plateau_causal_readmission_v1_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_INTELLIGENCE_PLATEAU_CAUSAL_READMISSION_V1':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
