name: YADO advanced STEM capability inventory
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-advanced-stem-capability-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inventory mathematical programming and scientific primitives
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast,json,re
          from pathlib import Path
          keys=('math','arith','linear','matrix','graph','sort','search','plan','solver','program','code','logic','causal','equation','numeric','prime','gcd','path','tree','predicate','synth')
          out=[]
          for p in sorted(Path('.').glob('*.py')):
            try:
              txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            except Exception:
              continue
            funcs=[]; classes=[]
            for n in tree.body:
              if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef)):
                if any(k in n.name.lower() for k in keys):
                  funcs.append({'name':n.name,'args':[a.arg for a in n.args.args]})
              elif isinstance(n,ast.ClassDef):
                ms=[]
                for m in n.body:
                  if isinstance(m,(ast.FunctionDef,ast.AsyncFunctionDef)) and any(k in m.name.lower() for k in keys):
                    ms.append({'name':m.name,'args':[a.arg for a in m.args.args]})
                if ms or any(k in n.name.lower() for k in keys):
                  classes.append({'name':n.name,'methods':ms})
            if funcs or classes:
              out.append({'file':p.name,'functions':funcs,'classes':classes})
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
