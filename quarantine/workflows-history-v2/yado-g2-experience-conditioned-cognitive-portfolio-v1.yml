name: YADO G2 Experience Conditioned Cognitive Portfolio V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-experience-conditioned-cognitive-portfolio-v1-request.json"
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_experience_conditioned_cognitive_portfolio_v1.py
      - name: Let YADO select cognitive experience portfolio
        id: select
        continue-on-error: true
        run: python runtime/yado_g2_experience_conditioned_cognitive_portfolio_v1.py
      - if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist portfolio evidence
        if: always()
        run: |
          git config user.name "YADO Cognitive Experience Portfolio"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-experience-conditioned-cognitive-portfolio-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO cognitive experience portfolio V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce portfolio verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-experience-conditioned-cognitive-portfolio-v1.json").read_text())
          assert r["canonical_mutation"] is False
          if r["status"]!="PASS_SHADOW_G2_EXPERIENCE_CONDITIONED_COGNITIVE_PORTFOLIO_V1":raise SystemExit(r["status"])
          print(r["status"],r["portfolio"]["portfolio_id"],r["portfolio"]["organs"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-experience-conditioned-cognitive-portfolio-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-experience-conditioned-cognitive-portfolio-v1.json
          if-no-files-found: warn
