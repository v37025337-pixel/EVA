name: YADO G2 Native Selector Canonical Binding V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-selector-canonical-binding-v2-request.json"
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Validate V2 binding and unseen size9 transfer
        run: python runtime/yado_kernel_native_selector_canonical_binding_v2.py
      - name: Persist V2 canonical binding evidence
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources canonical
          cp runtime/yado_kernel_native_selector_canonical_binding_v2_receipt.json "receipts/yado-kernel-native-selector-canonical-binding-v2-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Canonical Binding V2"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-native-selector-canonical-binding-v2.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json candidates/kernel-self-generated/native-selector-canonical-binding-v2.json resources/yado-nine-source-transfer-history-v1.json "receipts/yado-kernel-native-selector-canonical-binding-v2-run-${GITHUB_RUN_ID}.json"
          if [ -f canonical/yado-native-selector-canonical-binding-v2.json ]; then git add canonical/yado-native-selector-canonical-binding-v2.json; fi
          git commit -m "Evaluate native selector canonical binding V2 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce V2 binding receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_native_selector_canonical_binding_v2_receipt.json"))
          assert r["status"] in {"PASS_NATIVE_SELECTOR_CANONICAL_BINDING_V2","WITHHOLD_NATIVE_SELECTOR_CANONICAL_BINDING_V2"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["history_old"],r["history_new"],r["fresh9_old"],r["fresh9_new"],r["next_required_capability"])
          PY
