name: YADO field mapper execution contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-field-mapper-execution-contract-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect FieldMapper synthesis and execution
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for fn in ['yado_core_v2_2.py','yado_core_v2_1.py']:
            p=Path(fn); txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            print('\n====',fn,'====')
            for n in tree.body:
              if isinstance(n,ast.ClassDef) and n.name in {'FieldMapperSynthesizer','FieldMapper','RuleProgram','RuleProgramSynthesizer'}:
                print('\n### CLASS',n.name)
                for m in n.body:
                  if isinstance(m,ast.FunctionDef) and m.name in {'synthesize','execute','run','apply','predict','matches','to_dict'}:
                    print('\n---',m.name,'---')
                    print(ast.get_source_segment(txt,m))
          PY
