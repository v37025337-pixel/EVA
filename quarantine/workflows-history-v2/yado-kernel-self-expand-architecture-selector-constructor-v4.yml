name: YADO Kernel Self Expand Architecture Selector Constructor V4
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-expand-architecture-selector-constructor-v4-request.json"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Execute V4 native meta-grammar with semantics-preserving memoization
        run: python runtime/yado_kernel_self_expand_architecture_selector_constructor_v4.py
      - name: Persist V4 evidence
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_self_expand_architecture_selector_constructor_v4_receipt.json "receipts/yado-kernel-self-expand-architecture-selector-constructor-v4-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Constructor V4"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-self-expand-architecture-selector-constructor-v4.json candidates/kernel-self-generated/architecture-neutral-selector-memoized-meta-grammar-v4.json "receipts/yado-kernel-self-expand-architecture-selector-constructor-v4-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 constructor V4 evidence [skip ci]"
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce V4 receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_self_expand_architecture_selector_constructor_v4_receipt.json"))
          assert r["status"]=="PASS_KERNEL_SELF_EXPAND_ARCHITECTURE_SELECTOR_CONSTRUCTOR_V4",r
          print(r["candidate_state"],r["next_required_capability"])
          PY
