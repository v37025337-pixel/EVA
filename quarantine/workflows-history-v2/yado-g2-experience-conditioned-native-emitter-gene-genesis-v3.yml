name: YADO G2 Experience Conditioned Native Emitter Gene Genesis V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-experience-conditioned-native-emitter-gene-genesis-v3-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-experience-conditioned-native-emitter-gene-genesis-v3
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before emitter gene genesis
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile emitter gene genesis
        run: python -m py_compile runtime/yado_g2_experience_conditioned_native_emitter_gene_genesis_v3.py
      - name: Let YADO create emitter gene from its memory
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_experience_conditioned_native_emitter_gene_genesis_v3.py
      - name: Canonical guard after emitter gene genesis
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist emitter gene evidence
        if: always()
        run: |
          git config user.name "YADO Native Emitter Gene V3"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-experience-conditioned-native-emitter-gene-genesis-v3.json ]; then
            git add candidates/kernel-self-generated/g2-experience-conditioned-native-emitter-gene-genesis-v3.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO experience-conditioned emitter gene V3 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest emitter gene verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-experience-conditioned-native-emitter-gene-genesis-v3.json")
          if not p.exists():raise SystemExit("MISSING_EMITTER_GENE_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          assert c["host_selected_mechanism_family"] is False,r
          assert c["external_models_used"] is False,r
          assert c["host_source_template_used"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_EXPERIENCE_CONDITIONED_NATIVE_EMITTER_GENE_GENESIS_V3":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["emitter_gene"]["gene_id"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-experience-conditioned-native-emitter-gene-v3-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-experience-conditioned-native-emitter-gene-genesis-v3.json
          if-no-files-found: warn
