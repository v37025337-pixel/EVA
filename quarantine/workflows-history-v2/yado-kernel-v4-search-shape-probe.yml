name: YADO G2 V4 Search Shape Probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-v4-search-shape-probe-request.json"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_kernel_v4_search_shape_probe.py
      - run: |
          mkdir -p receipts
          cp runtime/yado_kernel_v4_search_shape_probe_receipt.json "receipts/yado-kernel-v4-search-shape-probe-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 V4 Search Shape Probe"
          git config user.email "actions@users.noreply.github.com"
          git add "receipts/yado-kernel-v4-search-shape-probe-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 V4 search-shape probe [skip ci]"
          git push origin HEAD:yado-architecture-shadow-search
