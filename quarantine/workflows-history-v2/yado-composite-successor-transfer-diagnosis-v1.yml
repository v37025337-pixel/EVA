name: YADO G2 Composite Transfer Diagnosis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-composite-successor-transfer-diagnosis-v1-request.json"
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before diagnosis
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile diagnosis
        run: python -m py_compile runtime/yado_composite_successor_transfer_diagnosis_v1.py
      - name: Diagnose spent fresh-transfer failure
        run: python runtime/yado_composite_successor_transfer_diagnosis_v1.py
      - name: Persist diagnosis
        run: |
          mkdir -p receipts
          cp runtime/yado_composite_successor_transfer_diagnosis_v1_receipt.json "receipts/yado-composite-successor-transfer-diagnosis-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Transfer Diagnosis"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-composite-successor-transfer-diagnosis-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 composite transfer diagnosis V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce diagnosis receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_composite_successor_transfer_diagnosis_v1_receipt.json"))
          assert r["status"]=="PASS_TRANSFER_DIAGNOSIS_V1",r
          print(r["root_candidates"],r["diagnosis"]["scalar_blind_accuracy"],r["diagnosis"]["relation_blind_accuracy"],r["diagnosis"]["budget_runtime_accuracy"])
          PY
