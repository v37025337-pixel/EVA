name: YADO Self Defined Consciousness Architecture Question V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-self-defined-consciousness-architecture-question-v1-request.json]
permissions:
  contents: write
jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install native runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Kernel native research and synthesis
        id: kernel
        continue-on-error: true
        run: python runtime/yado_self_defined_consciousness_architecture_question_v1.py
      - name: Persist kernel evidence
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_self_defined_consciousness_architecture_question_v1_receipt.json receipts/yado-self-defined-consciousness-architecture-question-v1-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Kernel Native Consciousness Synthesis'
          git config user.email 'actions@users.noreply.github.com'
          git add architecture/yado-self-defined-consciousness-architecture-question-v1.json architecture/evolution-ledger.json receipts/yado-self-defined-consciousness-architecture-question-v1-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist kernel-native consciousness synthesis V1 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce receipt
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_self_defined_consciousness_architecture_question_v1_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_SELF_DEFINED_CONSCIOUSNESS_ARCHITECTURE_QUESTION_V1':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
