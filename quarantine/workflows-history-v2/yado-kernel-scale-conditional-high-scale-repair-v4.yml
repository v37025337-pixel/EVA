name: YADO G2 High Scale Repair V4
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-scale-conditional-high-scale-repair-v4-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V4
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V4 and failure-memory paths before opening fresh11
        run: python -m py_compile runtime/yado_kernel_scale_conditional_high_scale_repair_v4.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Let G2 evolve bounded interaction order and test unseen size11
        run: timeout --signal=TERM --kill-after=30s 1800s python runtime/yado_kernel_scale_conditional_high_scale_repair_v4.py
      - name: Persist unexpected V4 execution failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_HIGH_SCALE_REPAIR_V4
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record V4 aborted execution as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist V4 high-scale repair evidence
        if: success()
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources
          cp runtime/yado_kernel_scale_conditional_high_scale_repair_v4_receipt.json "receipts/yado-kernel-scale-conditional-high-scale-repair-v4-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 High Scale Repair V4"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-scale-conditional-high-scale-repair-v4.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/high-scale-repair-v4.json resources/yado-eleven-source-transfer-history-v1.json "receipts/yado-kernel-scale-conditional-high-scale-repair-v4-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 high-scale branch repair V4 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce V4 receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_scale_conditional_high_scale_repair_v4_receipt.json"))
          assert r["status"] in {"PASS_HIGH_SCALE_REPAIR_V4","WITHHOLD_HIGH_SCALE_REPAIR_V4"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["selected_skill_id"],r["metrics"],r["next_required_capability"])
          PY
