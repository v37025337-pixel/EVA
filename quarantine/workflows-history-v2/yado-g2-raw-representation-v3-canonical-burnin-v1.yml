name: YADO G2 Raw Representation V3 Canonical Burnin V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-raw-representation-v3-canonical-burnin-v1-request.json"
permissions:
  contents: write
jobs:
  burnin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V3 burnin
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V3 burnin
        run: python -m py_compile runtime/yado_g2_raw_representation_v3_canonical_burnin_v1.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Run canonical raw V3 burnin
        run: timeout --signal=TERM --kill-after=30s 1500s python runtime/yado_g2_raw_representation_v3_canonical_burnin_v1.py
      - name: Persist unexpected V3 burnin failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_RAW_REPRESENTATION_V3_CANONICAL_BURNIN_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record raw V3 burnin failure as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist V3 burnin evidence
        if: success()
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_raw_representation_v3_canonical_burnin_v1_receipt.json "receipts/yado-g2-raw-representation-v3-canonical-burnin-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Raw V3 Burnin"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json "receipts/yado-g2-raw-representation-v3-canonical-burnin-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 raw V3 canonical burnin V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after V3 burnin
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce V3 burnin receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_raw_representation_v3_canonical_burnin_v1_receipt.json"))
          assert r["status"] in {"PASS_G2_RAW_REPRESENTATION_V3_CANONICAL_BURNIN_V1","WITHHOLD_G2_RAW_REPRESENTATION_V3_CANONICAL_BURNIN_V1"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["status"],r["min_metrics"],r["rollback_v2_accuracy"],r["next_required_capability"])
          PY
