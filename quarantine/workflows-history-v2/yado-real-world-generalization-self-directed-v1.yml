name: YADO Real World Generalization Self Directed V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-real-world-generalization-request.json"
permissions:
  contents: write
concurrency:
  group: yado-real-world-generalization-self-directed
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run real-world generalization diagnostic
        id: diagnose
        continue-on-error: true
        run: python runtime/yado_real_world_generalization_self_directed_v1.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-real-world-generalization-self-directed-v1
          path: |
            runtime/yado_real_world_generalization_self_directed_v1_receipt.json
            architecture/yado-real-world-generalization-state-v1.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts architecture
          if [ -f runtime/yado_real_world_generalization_self_directed_v1_receipt.json ]; then
            cp runtime/yado_real_world_generalization_self_directed_v1_receipt.json "receipts/yado-real-world-generalization-self-directed-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Real Generalization Diagnostic"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json architecture/yado-real-world-generalization-state-v1.json)
          if [ -f "receipts/yado-real-world-generalization-self-directed-v1-run-${GITHUB_RUN_ID}.json" ]; then files+=("receipts/yado-real-world-generalization-self-directed-v1-run-${GITHUB_RUN_ID}.json"); fi
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist YADO real-world generalization diagnostic [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Preserve diagnostic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_real_world_generalization_self_directed_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_REAL_GENERALIZATION_RECEIPT")
          r=json.loads(p.read_text())
          print(r["status"])
          PY
