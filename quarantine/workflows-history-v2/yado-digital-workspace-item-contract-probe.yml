name: YADO digital workspace item contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-digital-workspace-item-contract-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect WorkspaceItem and cycle contract
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('yado_digital_consciousness_runtime_v1.py')
          txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
          for n in tree.body:
            if isinstance(n,ast.ClassDef) and n.name in {'WorkspaceItem','CausalReflectiveWorkspace'}:
              print('\n###',n.name)
              if n.name=='WorkspaceItem':
                print(ast.get_source_segment(txt,n))
              else:
                for m in n.body:
                  if isinstance(m,ast.FunctionDef) and m.name=='cycle':
                    print(ast.get_source_segment(txt,m))
          PY
