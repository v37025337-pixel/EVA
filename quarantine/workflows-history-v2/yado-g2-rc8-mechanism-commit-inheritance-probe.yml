name: YADO G2 RC8 Mechanism Commit Inheritance Probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-rc8-mechanism-commit-inheritance-probe-request.json"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_g2_rc8_mechanism_commit_inheritance_probe.py
      - run: |
          mkdir -p receipts
          cp runtime/yado_g2_rc8_mechanism_commit_inheritance_probe_receipt.json "receipts/yado-g2-rc8-mechanism-commit-inheritance-probe-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 RC8 Inheritance Probe"
          git config user.email "actions@users.noreply.github.com"
          git add "receipts/yado-g2-rc8-mechanism-commit-inheritance-probe-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist RC8 mechanism commit inheritance probe [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
