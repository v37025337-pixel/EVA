name: YADO G2 Frontier Provenance Sync V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-frontier-provenance-sync-v1-request.json"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Sync current frontier provenance
        run: python runtime/yado_g2_frontier_provenance_sync_v1.py
      - name: Persist provenance sync
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_frontier_provenance_sync_v1_receipt.json "receipts/yado-g2-frontier-provenance-sync-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Frontier Provenance Sync"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json architecture/evolution-ledger.json "receipts/yado-g2-frontier-provenance-sync-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Sync G2 frontier provenance [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce sync receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_frontier_provenance_sync_v1_receipt.json"))
          assert r["status"]=="PASS_G2_FRONTIER_PROVENANCE_SYNC_V1",r
          assert r["g3_genesis_performed"] is False,r
          print(r["frontier"],r["binding"])
          PY
