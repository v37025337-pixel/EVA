name: YADO Legacy Experience Retrieval Fresh Admission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-legacy-experience-fresh-admission-request.json"
permissions:
  contents: write
concurrency:
  group: yado-legacy-experience-fresh-admission
  cancel-in-progress: true
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run fresh admission
        id: admit
        continue-on-error: true
        run: python runtime/yado_legacy_experience_retrieval_fresh_admission_v1.py
      - name: Upload admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-legacy-experience-fresh-admission-v1
          path: |
            runtime/yado_legacy_experience_retrieval_fresh_admission_v1_receipt.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist admission evidence
        if: always()
        run: |
          mkdir -p receipts
          if [ -f runtime/yado_legacy_experience_retrieval_fresh_admission_v1_receipt.json ]; then
            cp runtime/yado_legacy_experience_retrieval_fresh_admission_v1_receipt.json "receipts/yado-legacy-experience-retrieval-fresh-admission-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Legacy Experience Admission"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          if [ -f "receipts/yado-legacy-experience-retrieval-fresh-admission-v1-run-${GITHUB_RUN_ID}.json" ]; then files+=("receipts/yado-legacy-experience-retrieval-fresh-admission-v1-run-${GITHUB_RUN_ID}.json"); fi
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist fresh admission for self-evolved experience retriever [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_legacy_experience_retrieval_fresh_admission_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_FRESH_ADMISSION_RECEIPT")
          r=json.loads(p.read_text())
          if r.get("status")!="PASS_LEGACY_EXPERIENCE_RETRIEVAL_FRESH_ADMISSION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
