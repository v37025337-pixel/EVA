name: YADO G2 Scale Conditional Successor Composition V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-scale-conditional-successor-composition-v1-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Select scale-conditional reaction norm and test unseen size-6 transfer
        run: python runtime/yado_kernel_scale_conditional_successor_composition_v1.py
      - name: Persist scale-conditional evidence
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources
          cp runtime/yado_kernel_scale_conditional_successor_composition_v1_receipt.json "receipts/yado-kernel-scale-conditional-successor-composition-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Scale Conditional Evolution"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-scale-conditional-successor-composition-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/scale-conditional-pair-knn-successor-v1.json resources/yado-six-source-transfer-history-v1.json "receipts/yado-kernel-scale-conditional-successor-composition-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 scale-conditional successor V1 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce scale-conditional receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_scale_conditional_successor_composition_v1_receipt.json"))
          assert r["status"]=="PASS_SCALE_CONDITIONAL_COMPOSITION_V1",r
          print(r["candidate_state"],r["selected_threshold"],r["metrics"],r["next_required_capability"])
          PY
