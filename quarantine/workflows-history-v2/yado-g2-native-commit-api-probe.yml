name: YADO G2 Native Commit API Probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-native-commit-api-probe-request.json"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python runtime/yado_g2_native_commit_api_probe.py
      - run: |
          mkdir -p receipts
          cp runtime/yado_g2_native_commit_api_probe_receipt.json "receipts/yado-g2-native-commit-api-probe-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Commit API Probe"
          git config user.email "actions@users.noreply.github.com"
          git add "receipts/yado-g2-native-commit-api-probe-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist native commit API probe [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
