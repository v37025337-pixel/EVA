name: YADO G2 Raw Representation V5 Canonical Admission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-raw-representation-v5-canonical-admission-v1-request.json"
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V5 admission
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5 admission
        run: python -m py_compile runtime/yado_raw_task_representation_candidate_v3.py runtime/yado_raw_task_representation_robustness_v4.py runtime/yado_raw_task_representation_robustness_v5.py runtime/yado_kernel_g2_raw_representation_v5_canonical_admission_v1.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Run independent fresh V5 admission
        run: timeout --signal=TERM --kill-after=30s 1600s python runtime/yado_kernel_g2_raw_representation_v5_canonical_admission_v1.py
      - name: Persist unexpected V5 admission failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_RAW_REPRESENTATION_V5_CANONICAL_ADMISSION_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record raw V5 canonical-admission failure as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist V5 admission evidence
        if: success()
        run: |
          mkdir -p receipts canonical resources
          cp runtime/yado_kernel_g2_raw_representation_v5_canonical_admission_v1_receipt.json "receipts/yado-g2-raw-representation-v5-canonical-admission-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Raw V5 Canonical Admission"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json resources/yado-raw-task-representation-v5-canonical-admission-fresh-v1.json runtime/yado_unified_core_v1.py "receipts/yado-g2-raw-representation-v5-canonical-admission-v1-run-${GITHUB_RUN_ID}.json"
          if [ -f canonical/yado-raw-task-representation-v5.json ]; then git add canonical/yado-raw-task-representation-v5.json; fi
          git commit -m "Persist G2 raw representation V5 canonical admission V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after V5 admission
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce V5 admission receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_g2_raw_representation_v5_canonical_admission_v1_receipt.json"))
          assert r["status"] in {"PASS_G2_RAW_REPRESENTATION_V5_CANONICAL_ADMISSION_V1","WITHHOLD_G2_RAW_REPRESENTATION_V5_CANONICAL_ADMISSION_V1"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["status"],r["selected_skill_id"],r["metrics"],r["next_required_capability"])
          PY
