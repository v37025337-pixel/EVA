name: YADO G2 Architecture Selection Robustness Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-neutral-architecture-selection-robustness-repair-v1-request.json"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before robustness repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile robustness repair
        run: python -m py_compile runtime/yado_kernel_neutral_architecture_selection_robustness_repair_v1.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Let G2 choose single-family or composite architecture direction
        run: timeout --signal=TERM --kill-after=30s 720s python runtime/yado_kernel_neutral_architecture_selection_robustness_repair_v1.py
      - name: Persist unexpected robustness-repair failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_ARCHITECTURE_SELECTION_ROBUSTNESS_REPAIR_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record robustness repair aborted execution as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist robustness-repair evidence
        if: success()
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_neutral_architecture_selection_robustness_repair_v1_receipt.json "receipts/yado-kernel-neutral-architecture-selection-robustness-repair-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Architecture Robustness Repair"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-neutral-architecture-selection-robustness-repair-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json candidates/kernel-self-generated/neutral-architecture-selection-robustness-repair-v1.json "receipts/yado-kernel-neutral-architecture-selection-robustness-repair-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 architecture robustness repair V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after persistence
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce robustness-repair receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_neutral_architecture_selection_robustness_repair_v1_receipt.json"))
          assert r["status"] in {"PASS_ARCHITECTURE_SELECTION_ROBUSTNESS_REPAIR_V1","WITHHOLD_ARCHITECTURE_SELECTION_ROBUSTNESS_REPAIR_V1"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["selected_representation"],r["selected_families"],r["fit_coverage"],r["double_ablation_coverage"],r["next_required_capability"])
          PY
