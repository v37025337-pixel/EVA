name: YADO G2 Fresh Four Source Curriculum V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-fresh-four-source-curriculum-v1-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Build unseen four-source curriculum and admit one family
        run: python runtime/yado_kernel_fresh_four_source_curriculum_v1.py
      - name: Persist fresh curriculum evidence and frontier
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources
          cp runtime/yado_kernel_fresh_four_source_curriculum_v1_receipt.json "receipts/yado-kernel-fresh-four-source-curriculum-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Fresh Curriculum"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-fresh-four-source-curriculum-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/fresh-four-source-curriculum-v1.json resources/yado-four-source-curriculum-history-v1.json "receipts/yado-kernel-fresh-four-source-curriculum-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 fresh four-source curriculum V1 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce fresh curriculum receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_fresh_four_source_curriculum_v1_receipt.json"))
          assert r["status"]=="PASS_FRESH_FOUR_SOURCE_CURRICULUM_V1",r
          assert all(r["checks"].values()),r
          print(r["candidate_state"],r["selected_skill_id"],r["metrics"],r["next_required_capability"])
          PY
