name: YADO G2 Burnin Stress V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/g2-burnin-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-burnin-stress
  cancel-in-progress: false
jobs:
  burnin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run G2 burn-in stress
        id: burnin
        continue-on-error: true
        run: python runtime/yado_g2_burnin_stress_v1.py
      - name: Upload burn-in evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-g2-burnin-stress-v1
          path: |
            runtime/yado_g2_burnin_stress_v1_receipt.json
            architecture/g2-burnin-state-v1.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist burn-in evidence
        if: always()
        run: |
          mkdir -p receipts architecture
          if [ -f runtime/yado_g2_burnin_stress_v1_receipt.json ]; then
            cp runtime/yado_g2_burnin_stress_v1_receipt.json "receipts/yado-g2-burnin-stress-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO G2 Burnin"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          if [ -f architecture/g2-burnin-state-v1.json ]; then files+=("architecture/g2-burnin-state-v1.json"); fi
          if [ -f "receipts/yado-g2-burnin-stress-v1-run-${GITHUB_RUN_ID}.json" ]; then files+=("receipts/yado-g2-burnin-stress-v1-run-${GITHUB_RUN_ID}.json"); fi
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist G2 burn-in stress evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_g2_burnin_stress_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_G2_BURNIN_RECEIPT")
          r=json.loads(p.read_text())
          if not str(r.get("status","")).startswith("PASS_"): raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
