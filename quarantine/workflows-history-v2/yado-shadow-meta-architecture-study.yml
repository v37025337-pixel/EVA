name: YADO shadow meta-architecture study
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_shadow_meta_architecture_study_v1.py"
      - ".github/workflows/yado-shadow-meta-architecture-study.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified v36
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: YADO studies architectures and synthesizes shadow candidate
        run: python runtime/yado_shadow_meta_architecture_study_v1.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-shadow-meta-architecture-study-v1
          path: runtime/yado_shadow_meta_architecture_study_v1_receipt.json
          retention-days: 30
      - name: Persist receipt
        run: |
          mkdir -p receipts
          cp runtime/yado_shadow_meta_architecture_study_v1_receipt.json receipts/yado-shadow-meta-architecture-study-v1-latest.json
          git config user.name "YADO Architecture Shadow Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-shadow-meta-architecture-study-v1-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist YADO shadow meta-architecture study receipt [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
