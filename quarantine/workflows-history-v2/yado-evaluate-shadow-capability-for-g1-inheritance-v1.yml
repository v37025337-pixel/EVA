name: YADO Evaluate Shadow Capability for G1 Inheritance V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_evaluate_shadow_capability_for_g1_inheritance_v1.py"
      - ".github/workflows/yado-evaluate-shadow-capability-for-g1-inheritance-v1.yml"
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Evaluate G1 inheritance gate
        run: python runtime/yado_evaluate_shadow_capability_for_g1_inheritance_v1.py
      - name: Upload inheritance evidence
        uses: actions/upload-artifact@v4
        with:
          name: yado-evaluate-shadow-capability-for-g1-inheritance-v1
          path: |
            runtime/yado_evaluate_shadow_capability_for_g1_inheritance_v1_receipt.json
            candidates/g1-inheritance/conjunctive-rule-inducer-v1.json
            architecture/evolution-ledger.json
          retention-days: 30
      - name: Persist evidence and causal ledger
        run: |
          mkdir -p receipts
          cp runtime/yado_evaluate_shadow_capability_for_g1_inheritance_v1_receipt.json receipts/yado-evaluate-shadow-capability-for-g1-inheritance-v1-latest.json
          git config user.name "YADO G1 Inheritance Gate"
          git config user.email "actions@users.noreply.github.com"
          git add \
            receipts/yado-evaluate-shadow-capability-for-g1-inheritance-v1-latest.json \
            candidates/g1-inheritance/conjunctive-rule-inducer-v1.json \
            architecture/evolution-ledger.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist G1 shadow capability inheritance evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
