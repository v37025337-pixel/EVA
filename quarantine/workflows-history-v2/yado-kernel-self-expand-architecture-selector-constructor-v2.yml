name: YADO Kernel Self Expand Architecture Selector Constructor V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-kernel-self-expand-architecture-selector-constructor-v2-request.json]
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Kernel-native extended meta-grammar constructor V2
        id: expand
        continue-on-error: true
        env:
          YADO_V2_GENERATOR_TIMEOUT_SECONDS: '300'
        run: python runtime/yado_kernel_self_expand_architecture_selector_constructor_v2.py
      - name: Persist kernel-generated V2 evidence
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_kernel_self_expand_architecture_selector_constructor_v2_receipt.json receipts/yado-kernel-self-expand-architecture-selector-constructor-v2-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Kernel Extended Meta Grammar'
          git config user.email 'actions@users.noreply.github.com'
          git add candidates/kernel-self-generated/architecture-neutral-selector-extended-meta-grammar-v2.json architecture/yado-kernel-self-expand-architecture-selector-constructor-v2.json architecture/evolution-ledger.json receipts/yado-kernel-self-expand-architecture-selector-constructor-v2-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO kernel-native constructor expansion V2 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce execution receipt
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_kernel_self_expand_architecture_selector_constructor_v2_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_KERNEL_SELF_EXPAND_ARCHITECTURE_SELECTOR_CONSTRUCTOR_V2':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'],r.get('candidate_state'),r.get('next_required_capability'))
          PY
