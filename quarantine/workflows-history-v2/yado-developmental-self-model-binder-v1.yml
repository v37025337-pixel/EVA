name: YADO Developmental Self-Model Binder V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_developmental_self_model_binder_v1.py"
      - ".github/workflows/yado-developmental-self-model-binder-v1.yml"
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Bind verified developmental evidence into shadow self-model
        run: python runtime/yado_developmental_self_model_binder_v1.py
      - name: Upload receipt and overlay
        uses: actions/upload-artifact@v4
        with:
          name: yado-developmental-self-model-binder-v1
          path: |
            runtime/yado_developmental_self_model_binder_v1_receipt.json
            architecture/developmental-self-model-overlay.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_developmental_self_model_binder_v1_receipt.json receipts/yado-developmental-self-model-binder-v1-latest.json
          git config user.name "YADO Developmental Self Model"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-developmental-self-model-binder-v1-latest.json architecture/developmental-self-model-overlay.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist developmental self-model binder [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
