name: YADO G2 Composite Adapter Fresh Ablation V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-composite-adapter-fresh-ablation-v1-request.json"
permissions:
  contents: write
jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile fresh ablation
        run: python -m py_compile runtime/yado_g2_composite_adapter_fresh_ablation_v1.py
      - name: Run composite compatibility fresh ablation
        run: python runtime/yado_g2_composite_adapter_fresh_ablation_v1.py
      - name: Record live references
        run: |
          mkdir -p audits
          grep -RIn --exclude='*.pyc' --exclude-dir='__pycache__' 'G2CompositeTransferRepairAdapterV1\|ALG-G2-COMPOSITE-TRANSFER-REPAIR-ADAPTER-V1' runtime canonical architecture .github/workflows > audits/yado-g2-composite-adapter-live-references-v1.txt || true
      - name: Persist fresh ablation evidence
        run: |
          git config user.name "YADO G2 Composite Ablation"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-composite-adapter-fresh-ablation-v1.json audits/yado-g2-composite-adapter-live-references-v1.txt
          git diff --cached --quiet || git commit -m "Persist composite adapter fresh ablation evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-composite-adapter-fresh-ablation-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-composite-adapter-fresh-ablation-v1.json
            audits/yado-g2-composite-adapter-live-references-v1.txt
