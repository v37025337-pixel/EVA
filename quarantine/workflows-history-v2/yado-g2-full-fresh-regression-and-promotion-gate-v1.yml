name: YADO G2 Full Fresh Regression And Promotion Gate V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_g2_typed_recurrent_capability_graph_runtime_v1.py"
      - "runtime/yado_g2_full_fresh_regression_and_promotion_gate_v1.py"
      - ".github/workflows/yado-g2-full-fresh-regression-and-promotion-gate-v1.yml"
permissions:
  contents: write
concurrency:
  group: yado-g2-full-fresh-promotion-gate
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run full fresh G2 promotion gate
        id: gate
        continue-on-error: true
        run: python runtime/yado_g2_full_fresh_regression_and_promotion_gate_v1.py
      - name: Upload G2 promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-g2-full-fresh-promotion-gate-v1
          path: |
            runtime/yado_g2_full_fresh_regression_and_promotion_gate_v1_receipt.json
            canonical/yado-main-head-g2.json
            canonical/yado-g2-architecture-v1.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist G2 promotion evidence
        if: always()
        run: |
          mkdir -p receipts canonical architecture
          if [ -f runtime/yado_g2_full_fresh_regression_and_promotion_gate_v1_receipt.json ]; then
            cp runtime/yado_g2_full_fresh_regression_and_promotion_gate_v1_receipt.json "receipts/yado-g2-full-fresh-regression-and-promotion-gate-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO G2 Promotion Gate"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          if [ -f "receipts/yado-g2-full-fresh-regression-and-promotion-gate-v1-run-${GITHUB_RUN_ID}.json" ]; then files+=("receipts/yado-g2-full-fresh-regression-and-promotion-gate-v1-run-${GITHUB_RUN_ID}.json"); fi
          if [ -f canonical/yado-main-head-g2.json ]; then files+=("canonical/yado-main-head-g2.json"); fi
          if [ -f canonical/yado-g2-architecture-v1.json ]; then files+=("canonical/yado-g2-architecture-v1.json"); fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist G2 full fresh promotion gate evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("runtime/yado_g2_full_fresh_regression_and_promotion_gate_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_G2_PROMOTION_RECEIPT")
          r=json.loads(p.read_text())
          if not str(r.get("status","")).startswith("PROMOTED_"):
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
