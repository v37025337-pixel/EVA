name: YADO G2 Physical Branch Closure Verify V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-physical-branch-closure-verify-v1-request.json"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fetch all refs
        run: git fetch --all --prune
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Compile physical closure verification
        run: python -m py_compile runtime/yado_g2_physical_branch_closure_verify_v1.py
      - name: Verify physical branch closure and bind result
        run: python runtime/yado_g2_physical_branch_closure_verify_v1.py
      - name: Persist physical closure verification
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_physical_branch_closure_verify_v1_receipt.json "receipts/yado-g2-physical-branch-closure-verify-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Physical Closure"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-unified-experience-registry-v1.json canonical/yado-algorithm-provenance-registry-v1.json canonical/yado-unified-context-kernel-v1.json architecture/evolution-ledger.json quarantine/yado-g2-quarantine-manifest-v1.json "receipts/yado-g2-physical-branch-closure-verify-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Verify physical YADO branch closure into G2 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-physical-branch-closure-verify-v1-${{ github.run_id }}
          path: runtime/yado_g2_physical_branch_closure_verify_v1_receipt.json
