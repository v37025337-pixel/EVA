name: YADO G2 Native Source IR Emitter Meta Language Evolution V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-source-ir-emitter-meta-language-evolution-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-source-ir-emitter-meta-language-evolution-v2
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V2
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V2 observer
        run: python -m py_compile runtime/yado_g2_native_source_ir_emitter_meta_language_evolution_v2.py
      - name: Let YADO evolve emitter meta language
        id: evolve
        continue-on-error: true
        run: python runtime/yado_g2_native_source_ir_emitter_meta_language_evolution_v2.py
      - name: Canonical guard after V2
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V2 evidence
        if: always()
        run: |
          git config user.name "YADO Native Emitter Meta Language V2"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-source-ir-emitter-meta-language-evolution-v2.json ]; then
            git add candidates/kernel-self-generated/g2-native-source-ir-emitter-meta-language-evolution-v2.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO native emitter meta-language V2 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-source-ir-emitter-meta-language-evolution-v2.json")
          if not p.exists(): raise SystemExit("MISSING_V2_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for key in ("external_coding_models_used","new_external_research_used","host_meta_language_template_used",
                      "host_operator_list_used","host_representation_schema_used","host_source_seed_used",
                      "host_ast_skeleton_used","host_patch_used","host_target_function_selected"):
              assert c[key] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SOURCE_IR_EMITTER_META_LANGUAGE_EVOLUTION_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-source-ir-emitter-meta-language-evolution-v2-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-source-ir-emitter-meta-language-evolution-v2.json
          if-no-files-found: warn
