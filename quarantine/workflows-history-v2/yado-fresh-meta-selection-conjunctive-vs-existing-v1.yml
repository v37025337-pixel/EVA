name: YADO Fresh Meta Selection Conjunctive vs Existing V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_fresh_meta_selection_conjunctive_vs_existing_v1.py"
      - ".github/workflows/yado-fresh-meta-selection-conjunctive-vs-existing-v1.yml"
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Compare shadow candidate against existing bank
        run: python runtime/yado_fresh_meta_selection_conjunctive_vs_existing_v1.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-fresh-meta-selection-conjunctive-vs-existing-v1
          path: runtime/yado_fresh_meta_selection_conjunctive_vs_existing_v1_receipt.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_fresh_meta_selection_conjunctive_vs_existing_v1_receipt.json receipts/yado-fresh-meta-selection-conjunctive-vs-existing-v1-latest.json
          git config user.name "YADO Fresh Meta Selector"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-fresh-meta-selection-conjunctive-vs-existing-v1-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist fresh meta selection evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
