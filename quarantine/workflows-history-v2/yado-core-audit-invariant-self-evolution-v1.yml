name: YADO Core Audit Invariant Self Evolution V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-core-audit-invariant-evolution-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run audit-invariant self-evolution
        id: evolve
        continue-on-error: true
        run: python runtime/yado_core_audit_invariant_self_evolution_v1.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-core-audit-invariant-self-evolution-v1
          path: |
            runtime/yado_core_audit_invariant_self_evolution_v1_receipt.json
            candidates/g2-self-evolution/unified_core_audit_invariant_v2.py
            candidates/g2-self-evolution/unified_core_audit_invariant_v2.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts candidates/g2-self-evolution
          if [ -f runtime/yado_core_audit_invariant_self_evolution_v1_receipt.json ]; then cp runtime/yado_core_audit_invariant_self_evolution_v1_receipt.json "receipts/yado-core-audit-invariant-self-evolution-v1-run-${GITHUB_RUN_ID}.json"; fi
          git config user.name "YADO Audit Invariant Evolution"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          for f in candidates/g2-self-evolution/unified_core_audit_invariant_v2.py candidates/g2-self-evolution/unified_core_audit_invariant_v2.json "receipts/yado-core-audit-invariant-self-evolution-v1-run-${GITHUB_RUN_ID}.json"; do [ -f "$f" ] && files+=("$f"); done
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else git commit -m 'Persist YADO audit invariant self-evolution [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Preserve verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_core_audit_invariant_self_evolution_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_AUDIT_EVOLUTION_RECEIPT")
          print(json.loads(p.read_text())["status"])
          PY
