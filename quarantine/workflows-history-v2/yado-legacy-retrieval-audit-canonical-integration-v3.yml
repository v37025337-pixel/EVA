name: YADO Legacy Retrieval Audit Canonical Integration V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-legacy-retrieval-audit-canonical-integration-v3-request.json"
permissions:
  contents: write
concurrency:
  group: yado-legacy-retrieval-audit-canonical-integration-v3
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run V3 canonical audit integration
        id: integrate
        continue-on-error: true
        run: python runtime/yado_legacy_retrieval_audit_canonical_integration_v3.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-legacy-retrieval-audit-canonical-integration-v3
          path: |
            runtime/yado_legacy_retrieval_audit_canonical_integration_v3_receipt.json
            runtime/yado_unified_core_deep_self_audit_v1.py
            canonical/yado-unified-core-v1.json
            canonical/yado-main-head-g2.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist canonical audit V3
        if: always()
        run: |
          mkdir -p receipts canonical
          if [ -f runtime/yado_legacy_retrieval_audit_canonical_integration_v3_receipt.json ]; then
            cp runtime/yado_legacy_retrieval_audit_canonical_integration_v3_receipt.json "receipts/yado-legacy-retrieval-audit-canonical-integration-v3-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Deep Audit Admission"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          for f in runtime/yado_unified_core_deep_self_audit_v1.py canonical/yado-unified-core-v1.json canonical/yado-main-head-g2.json "receipts/yado-legacy-retrieval-audit-canonical-integration-v3-run-${GITHUB_RUN_ID}.json"; do [ -f "$f" ] && files+=("$f"); done
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist canonical YADO deep self-audit V3 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_legacy_retrieval_audit_canonical_integration_v3_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_V3_CANONICAL_RECEIPT")
          r=json.loads(p.read_text())
          if r.get("status")!="PASS_LEGACY_RETRIEVAL_AUDIT_CANONICAL_INTEGRATION_V3":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
