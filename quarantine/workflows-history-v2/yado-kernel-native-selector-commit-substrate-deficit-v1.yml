name: YADO G2 Native Selector Commit Substrate Deficit V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-selector-commit-substrate-deficit-v1-request.json"
permissions:
  contents: write
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - name: Record native selector commit deficit without host overwrite
        run: python runtime/yado_kernel_native_selector_commit_substrate_deficit_v1.py
      - name: Persist deficit evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_kernel_native_selector_commit_substrate_deficit_v1_receipt.json "receipts/yado-kernel-native-selector-commit-substrate-deficit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Commit Substrate Deficit"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-native-selector-commit-substrate-deficit-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json "receipts/yado-kernel-native-selector-commit-substrate-deficit-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 native selector commit substrate deficit [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce deficit receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_native_selector_commit_substrate_deficit_v1_receipt.json"))
          assert r["status"]=="WITHHOLD_NATIVE_SELECTOR_COMMIT_SUBSTRATE_MISSING",r
          assert all(r["checks"].values()),r
          print(r["status"],r["next_required_capability"])
          PY
