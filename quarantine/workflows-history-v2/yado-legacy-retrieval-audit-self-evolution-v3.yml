name: YADO Legacy Retrieval Audit Self Evolution V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-legacy-retrieval-audit-evolution-v3-request.json"
permissions:
  contents: write
concurrency:
  group: yado-legacy-retrieval-audit-evolution-v3
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run self-audit code evolution V3
        id: evolve
        continue-on-error: true
        run: python runtime/yado_legacy_retrieval_audit_self_evolution_v3.py
      - name: Upload evolved audit and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-legacy-retrieval-audit-self-evolution-v3
          path: |
            runtime/yado_legacy_retrieval_audit_self_evolution_v3_receipt.json
            candidates/g2-self-evolution/unified_core_legacy_retrieval_audit_v3.py
            candidates/g2-self-evolution/unified_core_legacy_retrieval_audit_v3.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evolved audit and evidence
        if: always()
        run: |
          mkdir -p receipts candidates/g2-self-evolution
          if [ -f runtime/yado_legacy_retrieval_audit_self_evolution_v3_receipt.json ]; then
            cp runtime/yado_legacy_retrieval_audit_self_evolution_v3_receipt.json "receipts/yado-legacy-retrieval-audit-self-evolution-v3-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Audit Code Evolution"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          for f in candidates/g2-self-evolution/unified_core_legacy_retrieval_audit_v3.py candidates/g2-self-evolution/unified_core_legacy_retrieval_audit_v3.json "receipts/yado-legacy-retrieval-audit-self-evolution-v3-run-${GITHUB_RUN_ID}.json"; do [ -f "$f" ] && files+=("$f"); done
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist YADO legacy retrieval audit self-evolution V3 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Preserve semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_legacy_retrieval_audit_self_evolution_v3_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_AUDIT_EVOLUTION_V3_RECEIPT")
          r=json.loads(p.read_text())
          print(r["status"])
          PY
