name: YADO G2 Evolutionary Successor Centroid Genesis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-evolutionary-successor-centroid-genesis-v1-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Create continuous-feature evolutionary successor
        run: python runtime/yado_kernel_evolutionary_successor_centroid_genesis_v1.py
      - name: Persist centroid successor evidence and frontier
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_evolutionary_successor_centroid_genesis_v1_receipt.json "receipts/yado-kernel-evolutionary-successor-centroid-genesis-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Centroid Successor"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-evolutionary-successor-centroid-genesis-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/evolutionary-centroid-successor-v1.json "receipts/yado-kernel-evolutionary-successor-centroid-genesis-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 continuous centroid successor [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce centroid successor receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_evolutionary_successor_centroid_genesis_v1_receipt.json"))
          assert r["status"]=="PASS_EVOLUTIONARY_SUCCESSOR_CENTROID_GENESIS_V1",r
          assert all(r["checks"].values()),r
          print(r["candidate_state"],r["metrics"],r["next_required_capability"])
          PY
