name: YADO meta grammar runtime contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-meta-grammar-runtime-contract-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect native metagrammar runtime functions
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('yado_meta_grammar_runtime_native_v1.py'); txt=p.read_text(); tree=ast.parse(txt)
          wanted={'synth_logic_predicate','synth_intel_predicate','synth_thinking_predicate','predict_logic_component','predict_intel_component','thinking_component_acc'}
          for n in tree.body:
            if isinstance(n,ast.FunctionDef) and n.name in wanted:
              print('\n---',n.name,'---')
              print(ast.get_source_segment(txt,n))
          PY
