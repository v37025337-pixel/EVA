name: YADO Compositional Core Upgrade 20260919
on:
  workflow_dispatch:
  push:
    branches: [yado-compositional-core-upgrade-20260919]
    paths:
      - experiments/compositional-core-upgrade-20260919/**
      - .github/workflows/yado-compositional-core-upgrade-20260919.yml
      - successor/**
      - runtime/**
      - canonical/**
      - architecture/**
      - resources/**
permissions:
  contents: read
concurrency:
  group: yado-compositional-core-upgrade-20260919
  cancel-in-progress: false
jobs:
  native-compositional-upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: runtime:runtime/yado_rc8_v36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare reviewed implementation and validate fixture contracts
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
          python runtime/yado_active_kernel_contract_v1.py
          python experiments/compositional-core-upgrade-20260919/run.py --preflight
      - name: Reproduce predecessor failures with unchanged pinned code
        run: |
          git worktree add --detach "$RUNNER_TEMP/yado-predecessor-checkout" 2cc9c296137b1e9d7648ba341578725e9ae01123
          cd "$RUNNER_TEMP/yado-predecessor-checkout"
          python runtime/reconstruct_rc8v36.py
          python experiments/native-gap-repair-20260919/run.py --output "$RUNNER_TEMP/yado-predecessor"
      - name: Upgrade exact predecessor state and execute native program lineage
        run: python experiments/compositional-core-upgrade-20260919/run.py --predecessor-output "$RUNNER_TEMP/yado-predecessor" --output "$RUNNER_TEMP/yado-compositional-upgrade"
      - name: Verify canonical integrity
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Preserve predecessor and upgraded restartable state with exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-compositional-core-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/yado-predecessor/
            ${{ runner.temp }}/yado-compositional-upgrade/
          retention-days: 30
          if-no-files-found: error
