name: YADO Real Developmental Lineage V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_real_developmental_lineage_v1.py"
      - ".github/workflows/yado-real-developmental-lineage-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lineage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Reconstruct real developmental lineage
        run: python runtime/yado_real_developmental_lineage_v1.py
      - name: Upload report and next-generation spec
        uses: actions/upload-artifact@v4
        with:
          name: yado-real-developmental-lineage-v1
          path: |
            runtime/yado_real_developmental_lineage_v1_report.json
            runtime/yado_g1_candidate_s2_spec.json
          retention-days: 30
      - name: Persist lineage evidence
        run: |
          mkdir -p receipts architecture
          cp runtime/yado_real_developmental_lineage_v1_report.json receipts/yado-real-developmental-lineage-v1-latest.json
          cp runtime/yado_g1_candidate_s2_spec.json architecture/yado-g1-candidate-s2-spec.json
          git config user.name "YADO Developmental Lineage Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-real-developmental-lineage-v1-latest.json architecture/yado-g1-candidate-s2-spec.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist real developmental lineage and G1 candidate spec [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
