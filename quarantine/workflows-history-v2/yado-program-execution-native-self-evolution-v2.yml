name: YADO Program Execution Native Self Evolution V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-program-execution-native-self-evolution-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-program-execution-native-self-evolution-v2
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run counterexample-driven program self-evolution V2
        id: evolve
        continue-on-error: true
        run: python runtime/yado_program_execution_native_self_evolution_v2.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-program-execution-native-self-evolution-v2
          path: |
            runtime/yado_program_execution_native_self_evolution_v2_receipt.json
            candidates/g2-self-evolution/bounded_program_repair_v2.py
            candidates/g2-self-evolution/bounded_program_repair_v2.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts candidates/g2-self-evolution
          if [ -f runtime/yado_program_execution_native_self_evolution_v2_receipt.json ]; then
            cp runtime/yado_program_execution_native_self_evolution_v2_receipt.json "receipts/yado-program-execution-native-self-evolution-v2-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Program Native Evolution V2"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          for f in candidates/g2-self-evolution/bounded_program_repair_v2.py candidates/g2-self-evolution/bounded_program_repair_v2.json "receipts/yado-program-execution-native-self-evolution-v2-run-${GITHUB_RUN_ID}.json"; do [ -f "$f" ] && files+=("$f"); done
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist YADO native program self-evolution V2 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_program_execution_native_self_evolution_v2_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_PROGRAM_EVOLUTION_V2_RECEIPT")
          r=json.loads(p.read_text())
          if r.get("status")!="PASS_PROGRAM_EXECUTION_NATIVE_SELF_EVOLUTION_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
