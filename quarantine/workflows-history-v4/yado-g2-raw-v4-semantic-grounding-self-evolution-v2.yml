name: YADO G2 Raw V4 Semantic Grounding Self Evolution V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-raw-v4-semantic-grounding-self-evolution-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-v4-semantic-grounding-self-evolution-v2
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before semantic V2
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile semantic V2
        run: python -m py_compile runtime/yado_g2_raw_v4_semantic_grounding_self_evolution_v2.py
      - name: Let YADO learn from the new real counterexample
        id: semantic_v2
        continue-on-error: true
        run: python runtime/yado_g2_raw_v4_semantic_grounding_self_evolution_v2.py
      - name: Persist semantic PASS or WITHHOLD as causal experience
        if: always()
        run: |
          git config user.name "YADO Raw Semantic Evolution"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-raw-v4-semantic-grounding-self-evolution-v2.json ]; then
            git add candidates/kernel-self-generated/g2-raw-v4-semantic-grounding-self-evolution-v2.json
          fi
          if [ -f candidates/kernel-self-generated/raw-task-representation-v4-semantic-grounding-repair-v2.json ]; then
            git add candidates/kernel-self-generated/raw-task-representation-v4-semantic-grounding-repair-v2.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO raw semantic V2 causal evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Require strict shadow semantic PASS
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-raw-v4-semantic-grounding-self-evolution-v2.json"))
          assert r["status"]=="PASS_SHADOW_G2_RAW_V4_SEMANTIC_GROUNDING_SELF_EVOLUTION_V2",r
          c=r["checks"]
          assert c["exact_user_goal_now_routes_resource"] is True,r
          assert c["base_blind_regression_ge_0_95"] is True,r
          assert c["all_historical_regression_ge_0_95"] is True,r
          assert c["resource_transfer_ge_0_75"] is True,r
          assert c["new_user_experience_causal_gain"] is True,r
          assert c["canonical_unchanged"] is True,r
          assert c["host_selected_model"] is False,r
          assert c["host_selected_pivot"] is False,r
          print(r["status"],r["selected"],r["metrics"],r["next_required_capability"])
          PY
      - name: Canonical guard after semantic V2
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-raw-v4-semantic-grounding-self-evolution-v2-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-raw-v4-semantic-grounding-self-evolution-v2.json
            candidates/kernel-self-generated/raw-task-representation-v4-semantic-grounding-repair-v2.json
          if-no-files-found: warn
