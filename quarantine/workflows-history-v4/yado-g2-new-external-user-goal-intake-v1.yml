name: YADO G2 New External User Goal Intake V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-user-goal-ip-evidence-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-new-external-user-goal-intake-v1
  cancel-in-progress: true
jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before new goal intake
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile new goal intake
        run: python -m py_compile runtime/yado_g2_new_external_user_goal_intake_v1.py
      - name: Let YADO accept and assess the new user goal
        run: python runtime/yado_g2_new_external_user_goal_intake_v1.py
      - name: Require strict clean-slate intake PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-user-goal-ip-evidence-intake-v1.json"))
          assert r["status"]=="PASS_G2_NEW_EXTERNAL_USER_GOAL_INTAKE_V1",r
          assert r["checks"]["clean_20_of_20_self_audit_baseline"] is True,r
          assert r["checks"]["kernel_native_goal_created"] is True,r
          assert r["checks"]["autonomous_goal_loop_deficit_detected"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          assert r["host_selected_target"] is False,r
          assert r["host_selected_mechanism"] is False,r
          print(r["status"],r["raw_task_representation"]["capability"],r["next_required_capability"])
          PY
      - name: Canonical guard after new goal intake
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist new-goal evidence
        run: |
          git config user.name "YADO New Goal Intake"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-user-goal-ip-evidence-intake-v1.json
          git diff --cached --quiet || git commit -m "Persist YADO clean-slate external goal intake [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-new-external-user-goal-intake-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-user-goal-ip-evidence-intake-v1.json
          if-no-files-found: warn
