name: YADO G2 Native Action Evidence Binder Source Realization V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-action-evidence-binder-source-realization-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-action-evidence-binder-source-realization-v1
  cancel-in-progress: true
jobs:
  realize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before native binder source realization
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile native realization probe
        run: python -m py_compile runtime/yado_g2_native_action_evidence_binder_source_realization_v1.py
      - name: Let YADO attempt native binder source realization
        id: realize
        continue-on-error: true
        run: python runtime/yado_g2_native_action_evidence_binder_source_realization_v1.py
      - name: Canonical guard after native binder source realization
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist native binder source realization evidence
        if: always()
        run: |
          git config user.name "YADO Native Binder Source Realization"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-action-evidence-binder-source-realization-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-action-evidence-binder-source-realization-v1.json
          fi
          git add candidates/g2-self-evolution/native_action_evidence_binder_source_realization_v1_*.py 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO native binder source realization evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict native verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-action-evidence-binder-source-realization-v1.json")
          if not p.exists(): raise SystemExit("MISSING_NATIVE_BINDER_SOURCE_REALIZATION_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for key in ("host_selected_target","host_patch_used","host_source_template_used",
                      "external_coding_models_used","automatic_canonical_promotion"):
              assert c[key] is False,r
          assert c["canonical_unchanged"] is True,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_ACTION_EVIDENCE_BINDER_SOURCE_REALIZATION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["new_python_source_bytes_produced_by_yado"] is True,r
          assert c["candidate_source_compiles"] is True,r
          assert c["candidate_source_binder_relevant"] is True,r
          print(r["status"],r["candidate_path"],r["candidate_source_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-action-evidence-binder-source-realization-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-action-evidence-binder-source-realization-v1.json
            candidates/g2-self-evolution/native_action_evidence_binder_source_realization_v1_*.py
          if-no-files-found: warn
