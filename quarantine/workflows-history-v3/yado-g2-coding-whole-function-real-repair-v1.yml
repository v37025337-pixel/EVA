name: YADO G2 Whole Function Real Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-coding-whole-function-real-repair-v1-request.json"]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_coding_whole_function_real_repair_v1.py
      - name: Run whole-function real repair
        continue-on-error: true
        run: python runtime/yado_g2_coding_whole_function_real_repair_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist whole-function evidence
        if: always()
        run: |
          git config user.name "YADO Whole Function Real Repair V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-coding-whole-function-real-repair-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-coding-whole-function-real-repair-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO whole-function real repair V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce whole-function verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-coding-whole-function-real-repair-v1.json")
          if not p.exists():raise SystemExit("MISSING_WHOLE_FUNCTION_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_CODING_WHOLE_FUNCTION_REAL_REPAIR_V1":
              raise SystemExit("WHOLE_FUNCTION_WITHHOLD:"+r["status"]+":"+r["next_required_capability"])
          assert r["checks"]["complete_function_not_ast_fragment"] is True,r
          assert r["checks"]["hidden_never_queried"] is True,r
          assert r["checks"]["hidden_repair_exact"] is True,r
          assert r["checks"]["full_domain_exact"] is True,r
          assert r["checks"]["cognitive_layer_used"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          print(r["status"],r["selected_function"],r["mutated_hidden_score"],r["repaired_hidden_score"],r["selected_probe_count"])
          PY
