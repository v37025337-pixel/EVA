name: YADO G2 Terminal Logic Historical Transfer V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-terminal-logic-historical-transfer-v1-request.json"]
permissions: {contents: write}
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch all refs for historical blobs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_terminal_logic_historical_transfer_v1.py
      - name: Evolve terminal logic on historical adaptation and blind transfer
        continue-on-error: true
        run: python runtime/yado_g2_terminal_logic_historical_transfer_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist historical transfer evidence
        if: always()
        run: |
          git config user.name "YADO Terminal Logic Historical Transfer V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-global-experience-terminal-logic-historical-transfer-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-global-experience-terminal-logic-historical-transfer-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO terminal logic historical transfer V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce historical transfer verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-global-experience-terminal-logic-historical-transfer-v1.json").read_text())
          if r["status"]!="PASS_SHADOW_G2_GLOBAL_EXPERIENCE_TERMINAL_LOGIC_HISTORICAL_TRANSFER_V1":
              raise SystemExit("HISTORICAL_TRANSFER_WITHHOLD:"+r["next_required_capability"])
          assert r["checks"]["terminal_historical_fresh_ge_0_75"],r
          assert r["checks"]["cognitive_historical_fresh_ge_0_75"],r
          assert r["checks"]["cognitive_historical_logic_causal"] and r["checks"]["cognitive_historical_thinking_causal"] and r["checks"]["cognitive_historical_intelligence_causal"],r
          assert r["checks"]["old_corpus_regression_ge_0_93"] and r["checks"]["canonical_unchanged"],r
          print(r["status"],r["genome_id"],r["terminal_historical_fresh"],r["cognitive_historical_fresh"],r["cognitive_historical_class_scores"],r["old_corpus_regression"])
          PY
