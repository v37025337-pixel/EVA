name: YADO G2 Cognitive Continuity Canonical Admission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-cognitive-continuity-canonical-admission-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-cognitive-continuity-canonical-admission-v1
  cancel-in-progress: true
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before admission
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile admission
        run: |
          python -m py_compile runtime/yado_g2_unified_execution_fabric_v4.py
          python -m py_compile runtime/yado_g2_cognitive_continuity_canonical_admission_v1.py
      - name: Run independent fresh restart and canonical admission
        id: admit
        continue-on-error: true
        run: python runtime/yado_g2_cognitive_continuity_canonical_admission_v1.py
      - name: Canonical guard after admission
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce canonical admission verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_g2_cognitive_continuity_canonical_admission_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_CANONICAL_CONTINUITY_RECEIPT")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_G2_COGNITIVE_CONTINUITY_CANONICAL_ADMISSION_V1":
              raise SystemExit("CANONICAL_CONTINUITY_WITHHOLD:"+str(r["status"]))
          assert r["execution_fabric"]=="RUNTIME-G2-UNIFIED-EXECUTION-FABRIC-V4",r
          assert r["parent_execution_fabric"]=="RUNTIME-G2-UNIFIED-EXECUTION-FABRIC-V3",r
          assert r["architecture_mutation"] is False,r
          assert r["generation_transition"] is False,r
          assert r["g3_genesis_performed"] is False,r
          assert all(r["canonical_fresh_checks"].values()),r
          print(r["status"],r["new_head_digest"],r["receipt_sha256"])
          PY
      - name: Persist canonical continuity admission
        if: always()
        run: |
          git config user.name "YADO Continuity Canonical Admission"
          git config user.email "actions@users.noreply.github.com"
          git add             canonical/yado-main-head-g2.json             canonical/yado-unified-core-v1.json             canonical/yado-algorithm-provenance-registry-v1.json             canonical/yado-g2-cognitive-continuity-checkpoint-v1.json             architecture/evolution-ledger.json             runtime/yado_unified_core_v1.py             runtime/yado_g2_cognitive_continuity_canonical_admission_v1_receipt.json
          git add receipts/yado-g2-cognitive-continuity-canonical-admission-v1-run-*.json
          git diff --cached --quiet || git commit -m "Admit YADO cognitive continuity V4 canonical [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-cognitive-continuity-canonical-admission-v1-${{ github.run_id }}
          path: |
            runtime/yado_g2_cognitive_continuity_canonical_admission_v1_receipt.json
            canonical/yado-g2-cognitive-continuity-checkpoint-v1.json
          if-no-files-found: warn
