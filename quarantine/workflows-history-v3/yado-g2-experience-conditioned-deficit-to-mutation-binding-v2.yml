name: YADO G2 Experience Conditioned Deficit To Mutation Binding V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-experience-conditioned-deficit-to-mutation-binding-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-experience-conditioned-deficit-to-mutation-binding-v2
  cancel-in-progress: true
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before deficit binding
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V2 binder
        run: python -m py_compile runtime/yado_g2_experience_conditioned_deficit_to_mutation_binding_v2.py
      - name: Let YADO learn deficit binding from its global experience
        id: bind
        continue-on-error: true
        run: python runtime/yado_g2_experience_conditioned_deficit_to_mutation_binding_v2.py
      - name: Canonical guard after deficit binding
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V2 deficit binding evidence
        if: always()
        run: |
          git config user.name "YADO Experience Deficit Binder"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-experience-conditioned-deficit-to-mutation-binding-v2.json ]; then
            git add candidates/kernel-self-generated/g2-experience-conditioned-deficit-to-mutation-binding-v2.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO experience deficit binding V2 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V2 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-experience-conditioned-deficit-to-mutation-binding-v2.json")
          if not p.exists(): raise SystemExit("MISSING_EXPERIENCE_DEFICIT_BINDING_V2")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_selected_mutation_family","host_authored_target_capability","host_patch_used",
                    "external_models_used","retraining_v6","automatic_canonical_promotion"):
              assert c[k] is False,r
          assert c["canonical_unchanged"] is True,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_EXPERIENCE_CONDITIONED_DEFICIT_TO_MUTATION_BINDING_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["current_post_corpus_prediction_binds_deficit"] is True,r
          assert c["counterfactual_missing_next_fails_closed"] is True,r
          assert c["bound_target_is_kernel_generated_next"] is True,r
          print(r["status"],r["bound_deficit"],r["metrics"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-experience-conditioned-deficit-to-mutation-binding-v2-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-experience-conditioned-deficit-to-mutation-binding-v2.json
          if-no-files-found: warn
