name: YADO G2 Goal Autonomous Source Creation Readiness V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-goal-autonomous-source-creation-readiness-v1-request.json"]
permissions: {contents: write}
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_goal_autonomous_source_creation_readiness_v1.py
      - name: Run exact goal-autonomy readiness exam
        continue-on-error: true
        run: python runtime/yado_g2_goal_autonomous_source_creation_readiness_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist readiness evidence
        if: always()
        run: |
          git config user.name "YADO Goal Autonomy Readiness V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-goal-autonomous-source-creation-readiness-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-goal-autonomous-source-creation-readiness-v1.json 2>/dev/null || true
          git add candidates/g2-self-evolution/goal_readiness_*.py 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO goal autonomy readiness V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest readiness verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-goal-autonomous-source-creation-readiness-v1.json")
          if not p.exists():raise SystemExit("MISSING_READINESS_EVIDENCE")
          r=json.loads(p.read_text())
          print(r["status"],r["missing_capabilities"],r["next_required_capability"])
          if r["status"]!="PASS_SHADOW_G2_GOAL_AUTONOMOUS_SOURCE_CREATION_READINESS_V1":
              raise SystemExit("READINESS_WITHHOLD:"+r["next_required_capability"])
          PY
