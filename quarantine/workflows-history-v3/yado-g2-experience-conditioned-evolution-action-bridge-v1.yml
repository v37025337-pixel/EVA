name: YADO G2 Experience Conditioned Evolution Action Bridge V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-experience-conditioned-evolution-action-bridge-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-experience-conditioned-evolution-action-bridge-v1
  cancel-in-progress: true
jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before bridge probe
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile bridge probe
        run: python -m py_compile runtime/yado_g2_experience_conditioned_evolution_action_bridge_v1.py
      - name: Run frozen V6 against new evolution failure
        id: bridge
        continue-on-error: true
        run: python runtime/yado_g2_experience_conditioned_evolution_action_bridge_v1.py
      - name: Canonical guard after bridge probe
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist bridge evidence
        if: always()
        run: |
          git config user.name "YADO Evolution Action Bridge"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-experience-conditioned-evolution-action-bridge-v1.json ]; then
            git add candidates/kernel-self-generated/g2-experience-conditioned-evolution-action-bridge-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO experience evolution bridge evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce measured disconnect verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-experience-conditioned-evolution-action-bridge-v1.json")
          if not p.exists(): raise SystemExit("MISSING_EXPERIENCE_EVOLUTION_BRIDGE_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          assert c["external_models_used"] is False,r
          assert c["retraining_performed"] is False,r
          assert c["host_patch_used"] is False,r
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_EXPERIENCE_CONDITIONED_EVOLUTION_ACTION_BRIDGE_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["experience_thinking_signal_observed"] is True,r
          assert c["experience_cognitive_decision_is_revise"] is True,r
          assert c["measured_decision_to_mutation_disconnect"] is True,r
          print(r["status"],r["v6_predictions"],r["legacy_evolution_code_selection"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-experience-conditioned-evolution-action-bridge-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-experience-conditioned-evolution-action-bridge-v1.json
          if-no-files-found: warn
