name: YADO G2 Cognitive Conflict Arbitration Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-cognitive-conflict-arbitration-repair-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-cognitive-conflict-arbitration-repair-v1
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile repair runtime
        run: python -m py_compile runtime/yado_g2_cognitive_conflict_arbitration_repair_v1.py
      - name: Run YADO conflict arbitration repair
        continue-on-error: true
        run: python runtime/yado_g2_cognitive_conflict_arbitration_repair_v1.py
      - name: Canonical guard after repair
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist repair evidence
        if: always()
        run: |
          git config user.name "YADO Cognitive Conflict Repair V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-cognitive-conflict-arbitration-repair-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-cognitive-conflict-arbitration-repair-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO cognitive conflict repair V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest repair verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-cognitive-conflict-arbitration-repair-v1.json")
          if not p.exists():raise SystemExit("MISSING_CONFLICT_REPAIR_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          assert c["stress_v1_withhold_consumed"] is True,r
          assert c["stress_v1_conflict_zero_consumed"] is True,r
          assert c["native_generic_arbiter_learned"] is True,r
          assert c["arbiter_not_host_written"] is True,r
          assert c["canonical_unchanged"] is True,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_COGNITIVE_CONFLICT_ARBITRATION_REPAIR_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"]+":"+str(r["next_required_capability"]))
          print(r["status"],r["guard_fresh"],r["guard_ablation"],r["conflict_score"],r["composite_stress"],r["cognitive_gene_id"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-cognitive-conflict-repair-v1-${{ github.run_id }}
          path: |
            experience/yado-cognitive-conflict-arbitration-repair-v1.json
            candidates/kernel-self-generated/g2-cognitive-conflict-arbitration-repair-v1.json
          if-no-files-found: warn
