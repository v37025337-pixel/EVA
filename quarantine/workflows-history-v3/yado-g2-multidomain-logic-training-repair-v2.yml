name: YADO G2 Multidomain Logic Training Repair V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-multidomain-logic-training-repair-v2-request.json"]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_multidomain_logic_training_repair_v2.py
      - name: Retrain LOGIC with balanced causal evaluation
        continue-on-error: true
        run: python runtime/yado_g2_multidomain_logic_training_repair_v2.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist logic V2
        if: always()
        run: |
          git config user.name "YADO Multidomain Logic Training V2"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-multidomain-logic-training-repair-v2.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-multidomain-logic-training-repair-v2.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO multidomain logic training V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce logic V2 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-multidomain-logic-training-repair-v2.json").read_text())
          if r["status"]!="PASS_SHADOW_G2_MULTIDOMAIN_LOGIC_TRAINING_REPAIR_V2":
              raise SystemExit("LOGIC_V2_WITHHOLD:"+r["next_required_capability"])
          print(r["status"],r["summary"],r["gene_ids"],r["tasks"])
          PY
