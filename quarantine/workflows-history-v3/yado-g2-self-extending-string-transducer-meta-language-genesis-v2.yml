name: YADO G2 Self Extending String Transducer Meta Language Genesis V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-extending-string-transducer-meta-language-genesis-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-extending-string-transducer-meta-language-genesis-v2
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V2
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V2
        run: python -m py_compile runtime/yado_g2_self_extending_string_transducer_meta_language_genesis_v2.py
      - name: Run self-extending string meta-language genesis V2
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_self_extending_string_transducer_meta_language_genesis_v2.py
      - name: Canonical guard after V2
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V2 evidence
        if: always()
        run: |
          git config user.name "YADO Self Extending String Meta Language"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-self-extending-string-transducer-meta-language-genesis-v2.json ]; then
            git add candidates/kernel-self-generated/g2-self-extending-string-transducer-meta-language-genesis-v2.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO self-extending string meta-language V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V2 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-self-extending-string-transducer-meta-language-genesis-v2.json")
          if not p.exists(): raise SystemExit("MISSING_SELF_EXTENDING_STRING_META_V2")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_string_grammar_used","host_primitive_inventory_used","host_serializer_used",
                    "host_ast_compiler_used","host_patch_used","external_models_used",
                    "automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_SELF_EXTENDING_STRING_TRANSDUCER_META_LANGUAGE_GENESIS_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["new_self_extending_string_meta_language_created"] is True,r
          assert c["new_language_has_novel_identity"] is True,r
          assert c["new_language_binds_current_failure"] is True,r
          print(r["status"],r["selected_candidate"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-self-extending-string-transducer-meta-language-genesis-v2-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-self-extending-string-transducer-meta-language-genesis-v2.json
          if-no-files-found: warn
