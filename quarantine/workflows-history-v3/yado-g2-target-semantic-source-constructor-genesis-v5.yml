name: YADO G2 Target Semantic Source Constructor Genesis V5
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-target-semantic-source-constructor-genesis-v5-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-target-semantic-source-constructor-genesis-v5
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V5
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5
        run: python -m py_compile runtime/yado_g2_target_semantic_source_constructor_genesis_v5.py
      - name: Run target semantic source constructor genesis V5
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_target_semantic_source_constructor_genesis_v5.py
      - name: Canonical guard after V5
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V5 evidence
        if: always()
        run: |
          git config user.name "YADO Target Semantic Source Constructor"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-target-semantic-source-constructor-genesis-v5.json ]; then
            git add candidates/kernel-self-generated/g2-target-semantic-source-constructor-genesis-v5.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO target semantic source constructor V5 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V5 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-target-semantic-source-constructor-genesis-v5.json")
          if not p.exists(): raise SystemExit("MISSING_TARGET_SEMANTIC_SOURCE_V5")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_serializer_used","host_selected_primitive","host_source_template_used",
                    "host_patch_used","external_models_used","automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_TARGET_SEMANTIC_SOURCE_CONSTRUCTOR_GENESIS_V5":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["native_selector_selected_one_primitive"] is True,r
          assert c["selected_primitive_fresh_exact_ge_0_95"] is True,r
          assert c["selected_primitive_compile_rate_ge_0_95"] is True,r
          print(r["status"],r["selected_primitive"],r["fresh_exact"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-target-semantic-source-constructor-genesis-v5-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-target-semantic-source-constructor-genesis-v5.json
          if-no-files-found: warn
