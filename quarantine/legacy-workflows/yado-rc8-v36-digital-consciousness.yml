name: YADO RC8 v36 digital consciousness exact cycle
on:
  push:
    branches: [yado-rc8-v36-digital-consciousness]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct exact v36 package
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt pytest
      - name: Full locked RC8 unittest
        working-directory: runtime/yado_rc8_v36
        run: PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -v -p 'test_yado*.py'
      - name: Archive regression
        working-directory: runtime/yado_rc8_v36
        run: python -m pytest -q test_yado_evolution_archive_runtime_v1.py test_yado_evolution_archive_integration_v1.py
      - name: Fresh CRW holdout
        working-directory: runtime/yado_rc8_v36
        run: python yado_digital_consciousness_fresh_holdout_v1.py
      - name: Direct theory study and external CRW cycle
        run: python runtime/external_consciousness_cycle_v36.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: yado-rc8-v36-digital-consciousness
          path: |
            runtime/yado_rc8_v36_external_receipt.json
            runtime/yado_rc8_v36_theory_research_receipt.json
            runtime/yado_rc8_v36/yado_digital_consciousness_fresh_holdout_v1_report.json
          retention-days: 30
      - name: Persist receipt
        run: |
          mkdir -p receipts
          cp runtime/yado_rc8_v36_external_receipt.json receipts/yado-rc8-v36-digital-consciousness-latest.json
          cp runtime/yado_rc8_v36_theory_research_receipt.json receipts/yado-rc8-v36-consciousness-theory-research-latest.json
          git config user.name "YADO RC8 Digital Consciousness Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-rc8-v36-digital-consciousness-latest.json receipts/yado-rc8-v36-consciousness-theory-research-latest.json
          if git diff --cached --quiet; then echo unchanged; else git commit -m "Persist YADO RC8 v36 functional digital consciousness receipts [skip ci]"; git push origin HEAD:yado-rc8-v36-digital-consciousness; fi