name: YADO G2 Module Dependency Diagnostic V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-coding-module-dependency-diagnostic-v1-request.json"]
permissions: {contents: write}
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_coding_module_dependency_diagnostic_v1.py
      - run: python runtime/yado_g2_coding_module_dependency_diagnostic_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist module diagnostic
        run: |
          git config user.name "YADO Module Dependency Diagnostic V1"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-coding-module-dependency-diagnostic-v1.json
          git diff --cached --quiet || git commit -m "Persist YADO module dependency diagnostic V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
