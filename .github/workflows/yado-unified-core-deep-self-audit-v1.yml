name: YADO Unified Core Deep Self Audit V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-unified-core-self-audit-request.json"
permissions:
  contents: write
concurrency:
  group: yado-unified-core-self-audit
  cancel-in-progress: true
jobs:
  self_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before self-audit
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Run kernel-native deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Upload self-audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-unified-core-deep-self-audit-v1
          path: |
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            architecture/evolution-ledger.json
          retention-days: 30
      - name: Persist self-audit evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_unified_core_deep_self_audit_v1_receipt.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO Unified Core Self Audit"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist unified-core deep self-audit [skip ci]"
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce semantic self-audit verdict
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert r["overall_verdict"]=="PASS_WITH_LIMITATIONS",r
          assert r["status"]=="PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1",r
          assert r["summary"]["blocking_findings"]==0,r
          print(r["overall_verdict"],r["summary"])
          PY
