name: YADO Raw Task Representation V6 Integrated Readmission V1

on:
  push:
    branches: [yado-causal-ablation-cycle-v1]
    paths:
      - '.github/workflows/yado-raw-task-representation-v6-integrated-readmission-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-readmission:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify integrated ancestry and main remains unchanged
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "011c85ee09f89217e30b6463eeb598b0f9e48c94"
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path('canonical/yado-main-head-g2.json').read_text())
          c=json.loads(Path('canonical/yado-unified-core-v1.json').read_text())
          l=json.loads(Path('architecture/evolution-ledger.json').read_text())
          assert 'ALG-G2-RAW-TASK-REPRESENTATION-V6' in h['active_capabilities']
          assert 'ALG-G2-RAW-TASK-REPRESENTATION-V4' not in h['active_capabilities']
          assert c['raw_task_representation']['component_id']=='ALG-G2-RAW-TASK-REPRESENTATION-V6'
          assert l['open_deficits']==['KERNEL_G2_RAW_REPRESENTATION_V6_POST_ADMISSION_AUDIT_V1']
          assert h['g3_genesis_performed'] is False
          print('PASS_V6_STAGED_CANONICAL_STATE_PRESENT')
          PY

      - name: Install runtime and audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile complete active and candidate runtime
        run: python -m compileall -q runtime successor candidates/g2-self-evolution candidates/autonomous

      - name: Prove V6 behavior equals frozen admitted candidate
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_raw_task_representation_frozen_candidate_v3 import FrozenResidualRepairCandidateV3
          from yado_raw_task_representation_canonical_v6 import CanonicalRawTaskRepresentationRuntimeV6
          from yado_raw_task_representation_frozen_deep_admission_v1 import collect_rows,make_deep_fresh
          root=Path('.')
          v3=json.loads((root/'canonical/yado-raw-task-representation-v3.json').read_text())
          frozen=FrozenResidualRepairCandidateV3(v3)
          v6=CanonicalRawTaskRepresentationRuntimeV6(v3)
          paths=[
            root/'resources/yado-raw-task-representation-v4-canonical-admission-fresh-v1.json',
            root/'resources/yado-raw-task-representation-v4-robustness-fresh-holdout-v1.json',
            root/'resources/yado-raw-task-representation-v4-robustness-fresh-holdout-v2.json',
            root/'resources/yado-raw-task-representation-v5-canonical-admission-fresh-v1.json',
          ]
          rows=[]
          for p in paths: rows.extend(collect_rows(json.loads(p.read_text())))
          seed=collect_rows(json.loads(paths[0].read_text()))
          for fam in make_deep_fresh(seed).values(): rows.extend(fam)
          assert rows
          mismatches=[]
          for row in rows:
              a=frozen.predict_capability(row['text'])
              b=v6.predict_capability(row['text'])
              if a!=b: mismatches.append((row['text'][:80],a,b))
          assert not mismatches,mismatches[:10]
          print('PASS_V6_FROZEN_BEHAVIOR_EQUIVALENCE',len(rows))
          PY

      - name: Run integrated V6 ablation against V4 control
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_raw_task_representation_robustness_v4 import RobustRawTaskRepresentationRuntimeV4
          from yado_raw_task_representation_canonical_v6 import CanonicalRawTaskRepresentationRuntimeV6
          from yado_raw_task_representation_frozen_deep_admission_v1 import collect_rows,make_deep_fresh,score
          root=Path('.')
          v3=json.loads((root/'canonical/yado-raw-task-representation-v3.json').read_text())
          v4meta=json.loads((root/'canonical/yado-raw-task-representation-v4.json').read_text())
          control=RobustRawTaskRepresentationRuntimeV4(v3,v4meta['selected_mode'])
          v6=CanonicalRawTaskRepresentationRuntimeV6(v3)
          seed=collect_rows(json.loads((root/'resources/yado-raw-task-representation-v4-canonical-admission-fresh-v1.json').read_text()))
          families=make_deep_fresh(seed)
          c_ok=t_ok=n=0
          improved=0
          for name,rows in families.items():
              c=score(control,rows); t=score(v6,rows)
              assert t['accuracy']>=c['accuracy'],(name,c,t)
              improved += int(t['accuracy']>c['accuracy'])
              c_ok+=c['correct']; t_ok+=t['correct']; n+=c['n']
          delta=t_ok/n-c_ok/n
          assert abs(delta-0.078125)<1e-12,delta
          assert improved==3,improved
          print('PASS_V6_CAUSAL_ABLATION',{'delta':delta,'improved_families':improved,'n':n})
          PY

      - name: Run canonical invariant and native core audits
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_unified_core_v1 import UnifiedYADOCoreV1
          core=UnifiedYADOCoreV1(Path('.'))
          r=core.audit()
          assert r['pass'] is True,r
          assert core.raw_representation.COMPONENT_ID=='ALG-G2-RAW-TASK-REPRESENTATION-V6'
          print('PASS_NATIVE_UNIFIED_CORE_V6',r['current_frontier'])
          PY

      - name: Run deepest unified-core self audit
        run: |
          python runtime/yado_unified_core_deep_self_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime/yado_unified_core_deep_self_audit_v1_receipt.json').read_text())
          assert r['status']=='PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1',r
          assert r['summary']['blocking_findings']==0,r['summary']
          assert r['summary']['critical_failures']==0,r['summary']
          assert r['summary']['high_failures']==0,r['summary']
          assert r['canonical_mutation'] is False
          assert r['g3_genesis_performed'] is False
          print('PASS_DEEP_SELF_AUDIT_V6',r['summary'])
          PY
          git checkout -- architecture/evolution-ledger.json

      - name: Run full kernel audit on integrated V6
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          assert r['canonical']['ledger_validation']=='PASS'
          assert r['canonical']['g3_genesis_performed'] is False
          print('PASS_FULL_KERNEL_AUDIT_V6',r['counts'])
          PY

      - name: Build fresh Successor identity from integrated V6
        run: python -m successor build --output "$RUNNER_TEMP/yado-v6-successor"

      - name: Run complete 170 test regression on integrated V6
        run: |
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-v6-successor/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==170,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_INTEGRATED_V6_REGRESSION_170_OF_170',r['identity_digest'])
          PY

      - name: Final integrated admission boundary
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python - <<'PY'
          print('PASS_INTEGRATED_V6_READY_FOR_EXPLICIT_MAIN_ADMISSION')
          print('NEXT_ACTION=FAST_FORWARD_MAIN_ONLY_AFTER_FINAL_HEAD_COMPARE')
          PY
