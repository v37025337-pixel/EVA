name: YADO Active Native Loop V1

on:
  workflow_dispatch:
  push:
    branches: [yado-active-native-loop-v1, yado-active-native-loop-v2, yado-experience-development-v1]
  pull_request:
    branches: [main]
    paths:
      - 'successor/**'
      - 'runtime/yado_active_native_learning_v1.py'
      - 'runtime/yado_unified_core_v1.py'
      - 'runtime/yado_cognitive_tri_organ_policy_v3.py'
      - 'canonical/yado-active-native-loop-v1.json'
      - '.github/workflows/yado-active-native-loop-v1.yml'

permissions:
  contents: read

concurrency:
  group: active-native-loop-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  active-loop-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r successor/requirements.txt -r runtime/yado_rc8_v36/requirements-github.txt pyyaml
      - name: Check canonical binding and build pinned runtime
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m successor build --output "$RUNNER_TEMP/native-birth"
      - name: Complete regression including causal native tests
        run: |
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/native-birth/manifest.json"
      - name: Real external data and 20 autonomous goal cycles
        run: |
          python -m successor.active_run --manifest "$RUNNER_TEMP/native-birth/manifest.json" --output "$RUNNER_TEMP/native-run"
      - name: Experience-selected retry goals and causal memory transfer
        run: |
          python -m successor.development_run --manifest "$RUNNER_TEMP/native-birth/manifest.json" --output "$RUNNER_TEMP/development-run"
      - name: 20 endogenous continuation cycles from accumulated cognitive state
        run: |
          cp "$RUNNER_TEMP/native-run/kernel.sqlite" "$RUNNER_TEMP/endogenous.sqlite"
          python -m successor.endogenous_run \
            --manifest "$RUNNER_TEMP/native-birth/manifest.json" \
            --state "$RUNNER_TEMP/endogenous.sqlite" \
            --output "$RUNNER_TEMP/endogenous-run.json" \
            --cycles 20 \
            --budget 3
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'endogenous-run.json').read_text())
          assert report['status'] == 'PASS_BOUNDED_ENDOGENOUS_CONTINUATION_V1', report
          assert report['cycles_completed'] == 20, report
          assert report['cycles_verified'] == 20, report
          assert report['host_goal_count'] == 0, report
          assert len({row['seed'] for row in report['results']}) == 20, report
          assert all(row['status'] == 'VERIFIED' for row in report['results']), report
          assert report['state_verification']['status'] == 'PASS', report
          assert report['consciousness_established'] is False, report
          print(json.dumps({
              'status': report['status'],
              'cycles_completed': report['cycles_completed'],
              'cycles_verified': report['cycles_verified'],
              'host_goal_count': report['host_goal_count'],
              'domains': [row['selected_domain'] for row in report['results']],
          }))
          PY
      - name: Full kernel audit and final source guard
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert report['status'] == 'PASS' and report['findings'] == [], report['findings']
          PY
          python runtime/yado_canonical_invariant_guard_v1.py
          git diff --exit-code -- canonical architecture/evolution-ledger.json
      - name: Preserve evidence and restartable memory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-active-native-loop-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-birth/
            ${{ runner.temp }}/native-run/
            ${{ runner.temp }}/development-run/
            ${{ runner.temp }}/endogenous.sqlite
            ${{ runner.temp }}/endogenous-run.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
            audits/yado-full-kernel-audit-v1-report.json
