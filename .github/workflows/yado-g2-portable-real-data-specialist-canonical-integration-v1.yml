name: YADO G2 Portable Real Data Specialist Canonical Integration V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-portable-real-data-specialist-canonical-integration-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-portable-real-data-specialist-canonical-integration-v1
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Pre-integration canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5 runtime and integration controller
        run: |
          python -m py_compile runtime/yado_g2_experience_conditioned_cognitive_layer_v5.py
          python -m py_compile runtime/yado_g2_portable_real_data_specialist_canonical_integration_v1.py
      - name: Execute bounded V5 canonical integration
        run: python runtime/yado_g2_portable_real_data_specialist_canonical_integration_v1.py
      - name: Enforce integration receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_portable_real_data_specialist_canonical_integration_v1_receipt.json"))
          assert r["status"]=="PASS_G2_PORTABLE_REAL_DATA_SPECIALIST_CANONICAL_INTEGRATION_V1",r
          assert all(r["checks"].values()),r
          assert r["active_capability_count"]==31,r
          assert r["canonical_mutation"] is True,r
          assert r["generation_transition"] is False,r
          assert r["g3_genesis_performed"] is False,r
          print(r["status"],r["fresh_metrics"],r["new_head_digest"])
          PY
      - name: Rebuild full module assembly against V5
        run: python runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py
      - name: Require V5 module assembly canonical-ready
        run: |
          python - <<'PY'
          import json
          a=json.load(open("candidates/kernel-self-generated/g2-unified-module-kernel-v1.json"))
          assert a["status"]=="PASS_CURRENT_G2_UNIFIED_MODULE_ASSEMBLY_V1",a
          assert a["canonical_ready"] is True,a
          assert a["active_module_count"]==31 and a["covered_module_count"]==31,a
          print(a["status"],a["active_module_count"],a["binding_checks"])
          PY
      - name: Re-run cognitive continuity regression
        run: python -m pytest -q tests/test_g2_continuity_file_integrity.py
      - name: Run post-module full integrity
        run: python runtime/yado_g2_post_module_full_integrity_v1.py
      - name: Require post-module PASS
        run: |
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-g2-post-module-full-integrity-v1.json"))
          assert d["status"]=="PASS_G2_POST_MODULE_FULL_INTEGRITY_V1",d
          assert all(d["checks"].values()),d
          print(d["status"],d["active_module_count"],d["checks"])
          PY
      - name: Run deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Require nonblocking deep self-audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert d["status"]=="PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1",d
          assert d["summary"]["blocking_findings"]==0,d
          assert d["summary"]["critical_failures"]==0,d
          print(d["overall_verdict"],d["summary"])
          PY
      - name: Final canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist canonical integration
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_portable_real_data_specialist_canonical_integration_v1_receipt.json "receipts/yado-g2-portable-real-data-specialist-canonical-integration-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Portable Canonical Integration"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-g2-experience-conditioned-cognitive-layer-v5.json
          git add canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json
          git add architecture/evolution-ledger.json
          git add runtime/yado_unified_core_v1.py runtime/yado_g2_unified_module_kernel_v1.py runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py runtime/yado_g2_post_module_full_integrity_v1.py
          git add candidates/kernel-self-generated/g2-unified-module-kernel-v1.json
          git add audits/yado-g2-post-module-full-integrity-v1.json audits/yado-g2-module-dependency-graph-v1.json
          git add "receipts/yado-g2-portable-real-data-specialist-canonical-integration-v1-run-${GITHUB_RUN_ID}.json"
          git diff --cached --quiet || git commit -m "Integrate portable USGS specialist as cognitive layer V5 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git clean -f runtime/yado_g2_portable_real_data_specialist_canonical_integration_v1_receipt.json runtime/yado_unified_core_deep_self_audit_v1_receipt.json
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
