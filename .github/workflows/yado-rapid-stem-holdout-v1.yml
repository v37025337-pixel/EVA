name: YADO Rapid STEM Holdout V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_rapid_stem_holdout_v1.py"
      - ".github/workflows/yado-rapid-stem-holdout-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  holdout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Run rapid native STEM holdout
        run: python runtime/yado_rapid_stem_holdout_v1.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-rapid-stem-holdout-v1
          path: runtime/yado_rapid_stem_holdout_v1_receipt.json
          retention-days: 30
      - name: Persist receipt
        run: |
          mkdir -p receipts
          cp runtime/yado_rapid_stem_holdout_v1_receipt.json receipts/yado-rapid-stem-holdout-v1-latest.json
          git config user.name "YADO Rapid STEM Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-rapid-stem-holdout-v1-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist YADO rapid STEM holdout receipt [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
