name: YADO G2 Self Representation Driven Extended Controller Candidate V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-representation-driven-extended-controller-candidate-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-representation-driven-extended-controller-v1
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before candidate
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile strict observer
        run: python -m py_compile runtime/yado_g2_self_representation_driven_extended_controller_candidate_v1.py
      - name: Let YADO create extended controller shadow candidate
        id: candidate
        continue-on-error: true
        run: python runtime/yado_g2_self_representation_driven_extended_controller_candidate_v1.py
      - name: Canonical guard after candidate
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist extended controller candidate evidence
        if: always()
        run: |
          git config user.name "YADO Extended Controller Candidate"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-self-representation-driven-extended-controller-candidate-v1.json ]; then
            git add candidates/kernel-self-generated/g2-self-representation-driven-extended-controller-candidate-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO extended controller shadow candidate evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest extended controller verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-self-representation-driven-extended-controller-candidate-v1.json")
          if not p.exists(): raise SystemExit("MISSING_EXTENDED_CONTROLLER_CANDIDATE_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for key in ("external_coding_models_used","new_external_research_used","host_new_dimension_name_used",
                      "host_controller_patch_used","host_gene_schema_used","host_source_template_used",
                      "controller_source_mutation"):
              assert c[key] is False,r
          assert r["canonical_mutation"] is False,r
          assert r["controller_source_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_SELF_REPRESENTATION_DRIVEN_EXTENDED_CONTROLLER_CANDIDATE_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["structurally_broader_search_space"] is True,r
          assert c["candidate_visible_to_subsequent_evolution"] is True,r
          print(r["status"],r["selected_target"],r["candidate_controller"]["candidate_dimensions"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-self-representation-driven-extended-controller-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-self-representation-driven-extended-controller-candidate-v1.json
          if-no-files-found: warn
