name: YADO Security Audit V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'successor/**'
      - 'canonical/yado-unified-core-v1.json'
      - '.github/workflows/**'
      - '.github/yado-active-workflow-allowlist-v1.json'
      - '.github/yado-dynamic-execution-review-v1.json'
      - 'architecture/yado-security-audit-v1-request.json'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'successor/**'
      - 'canonical/yado-unified-core-v1.json'
      - '.github/workflows/**'
      - '.github/yado-active-workflow-allowlist-v1.json'
      - '.github/yado-dynamic-execution-review-v1.json'
      - 'architecture/yado-security-audit-v1-request.json'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Verify evidence rejection and acceptance
        run: python -m unittest runtime.test_yado_security_evidence_v1
      - name: Collect fresh audit of inherited and pinned Successor requirements
        run: python runtime/yado_security_audit_v1.py --collect-dependencies
      - name: Verify source, workflow policy, and bound dependency evidence
        run: python runtime/yado_security_audit_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-security-audit-v1-${{ github.run_id }}
          if-no-files-found: error
          path: |
            audits/yado-security-audit-v1-report.json
            audits/yado-pip-audit-v1.json
            audits/yado-pip-audit-v1-evidence.json
