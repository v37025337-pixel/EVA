name: YADO Security Audit V1
on:
  push:
    branches: [main, yado-architecture-shadow-search, yado-main-selective-admission-v1, yado-main-experience-refresh-v1]
    paths:
      - "architecture/yado-security-audit-v1-request.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit active requirements
        run: |
          mkdir -p audits
          pip-audit -r runtime/yado_rc8_v36/requirements-github.txt -f json > audits/yado-pip-audit-v1.json || true
      - name: Compile security audit
        run: python -m py_compile runtime/yado_security_audit_v1.py
      - name: Run security audit
        run: python runtime/yado_security_audit_v1.py
      - name: Persist security reports
        run: |
          git config user.name "YADO Security Audit"
          git config user.email "actions@users.noreply.github.com"
          git add audits/yado-security-audit-v1-report.json audits/yado-pip-audit-v1.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist YADO security audit V1 [skip ci]"
          fi
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-security-audit-v1-${{ github.run_id }}
          path: |
            audits/yado-security-audit-v1-report.json
            audits/yado-pip-audit-v1.json
