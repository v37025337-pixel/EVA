name: YADO G2 High Scale Repair V5
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-scale-conditional-high-scale-repair-v5-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V5
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5 semantic repair paths
        run: python -m py_compile runtime/yado_g2_canonical_high_scale_binding_runtime_v5.py runtime/yado_kernel_scale_conditional_high_scale_repair_v5.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Let G2 repair cardinality-to-normalized-route semantics from spent history
        run: timeout --signal=TERM --kill-after=30s 1200s python runtime/yado_kernel_scale_conditional_high_scale_repair_v5.py
      - name: Persist unexpected V5 failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_HIGH_SCALE_REPAIR_V5
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record V5 aborted execution as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist V5 semantic repair evidence
        if: success()
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_scale_conditional_high_scale_repair_v5_receipt.json "receipts/yado-kernel-scale-conditional-high-scale-repair-v5-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 High Scale Repair V5"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-scale-conditional-high-scale-repair-v5.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json candidates/kernel-self-generated/high-scale-repair-v5.json "receipts/yado-kernel-scale-conditional-high-scale-repair-v5-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 high-scale semantic repair V5 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after V5 persistence
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce V5 receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_scale_conditional_high_scale_repair_v5_receipt.json"))
          assert r["status"] in {"PASS_HIGH_SCALE_REPAIR_V5","WITHHOLD_HIGH_SCALE_REPAIR_V5"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["selected_skill_id"],r["route_score"],r["candidate_predictive_total"],r["next_required_capability"])
          PY
