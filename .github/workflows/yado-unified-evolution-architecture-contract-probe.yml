name: YADO unified evolution architecture contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-unified-evolution-architecture-contract-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect archive and lineage contracts
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          wanted={
            'yado_evolution_archive_runtime_v1.py':{
              'EvolutionArchiveRuntime','EvolutionVariant'
            },
            'yado_core_v3_0_rc7_deep_integrity.py':{
              'durable_commit_evolution_bundle','autoevolution_gate'
            },
          }
          for fn,names in wanted.items():
            p=Path(fn); txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            print('\n====',fn,'====')
            for n in tree.body:
              if isinstance(n,ast.ClassDef) and n.name in names:
                print(ast.get_source_segment(txt,n))
              elif isinstance(n,ast.FunctionDef) and n.name in names:
                print(ast.get_source_segment(txt,n))
          PY
