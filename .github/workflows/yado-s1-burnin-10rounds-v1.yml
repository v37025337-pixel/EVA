name: YADO S1 ten-round burn-in V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_s1_burnin_10rounds_v1.py"
      - ".github/workflows/yado-s1-burnin-10rounds-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  burnin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Reconstruct verified v36 RC8
        run: python runtime/reconstruct_rc8v36.py
      - name: Install verified v36 dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run S1 ten-round fresh burn-in
        run: python runtime/yado_s1_burnin_10rounds_v1.py
      - name: Upload burn-in receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-s1-burnin-10rounds-v1
          path: runtime/yado_s1_burnin_10rounds_v1_receipt.json
          retention-days: 30
      - name: Persist shadow evidence only
        run: |
          mkdir -p receipts
          cp runtime/yado_s1_burnin_10rounds_v1_receipt.json receipts/yado-s1-burnin-10rounds-v1-latest.json
          git config user.name "YADO S1 Burn-in Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-s1-burnin-10rounds-v1-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist YADO S1 ten-round burn-in receipt [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
