name: YADO G2 Native Meta Grammar Compile Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-native-meta-grammar-compile-repair-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-meta-grammar-compile-repair-v1
  cancel-in-progress: true
jobs:
  synthesize-repair-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before native meta-grammar repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile native meta-grammar repair experiment
        run: python -m py_compile runtime/yado_g2_native_meta_grammar_compile_repair_v1.py
      - name: Let YADO synthesize a compile-repair selector with its native meta-grammar
        run: python runtime/yado_g2_native_meta_grammar_compile_repair_v1.py
      - name: Require strict native meta-grammar PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-native-meta-grammar-compile-repair-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_NATIVE_META_GRAMMAR_COMPILE_REPAIR_V1",r
          assert r["checks"]["fresh_exact"] is True,r
          assert r["checks"]["same_native_model_repairs_target"] is True,r
          assert r["checks"]["no_external_model_or_ready_patch"] is True,r
          assert r["checks"]["host_did_not_supply_target_patch_or_line"] is True,r
          print(r["status"],r["invented_gene"]["gene_id"])
          PY
      - name: Install YADO-generated repaired controller
        run: |
          cp candidates/g2-self-evolution/yado_g2_autonomous_self_rewrite_v1_native_meta_repaired_candidate.py runtime/yado_g2_autonomous_self_rewrite_v1.py
          python -m py_compile runtime/yado_g2_autonomous_self_rewrite_v1.py
      - name: Canonical guard after native meta-grammar repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist generated mechanism and resume autonomous self-rewrite
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("architecture/yado-kernel-autonomous-self-rewrite-v1-request.json")
          r=json.loads(p.read_text())
          r["native_meta_compile_repair_trigger"]=(r.get("native_meta_compile_repair_trigger") or 0)+1
          r["native_meta_compile_repair_source_run"]=os.environ.get("GITHUB_RUN_ID")
          r["host_solution_hint"]=None
          r["target_path"]=None
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "YADO Native Meta Grammar Repair"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_g2_autonomous_self_rewrite_v1.py candidates/kernel-self-generated/g2-native-meta-grammar-compile-repair-v1.json candidates/g2-self-evolution/yado_g2_autonomous_self_rewrite_v1_native_meta_repaired_candidate.py architecture/yado-kernel-autonomous-self-rewrite-v1-request.json
          git commit -m "YADO native meta-grammar repairs self-rewrite controller and resumes [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
