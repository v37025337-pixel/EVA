name: YADO G2 Native Evolution Space Self Expansion V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-evolution-space-self-expansion-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-evolution-space-self-expansion-v1
  cancel-in-progress: true
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before self-expansion
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile transport
        run: python -m py_compile runtime/yado_g2_native_evolution_space_self_expansion_v1.py
      - name: Give YADO the evolution-space expansion task
        id: expand
        continue-on-error: true
        run: python runtime/yado_g2_native_evolution_space_self_expansion_v1.py
      - name: Canonical guard after self-expansion
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist self-expansion evidence
        if: always()
        run: |
          git config user.name "YADO Evolution Space Expansion"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-evolution-space-self-expansion-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-evolution-space-self-expansion-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO evolution-space expansion evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict structural expansion verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-evolution-space-self-expansion-v1.json")
          if not p.exists(): raise SystemExit("MISSING_EVOLUTION_SPACE_EXPANSION_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for key in ("external_coding_models_used","new_external_research_used","host_new_chromosome_name_used",
                      "host_gene_schema_used","host_operator_list_used","host_mutation_rule_used",
                      "host_source_seed_used","host_patch_used","host_target_file_selected"):
              assert c[key] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_EVOLUTION_SPACE_SELF_EXPANSION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["structurally_broader_search_space"] is True,r
          assert len(r["new_chromosomes"])>=1,r
          print(r["status"],r["new_chromosomes"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-evolution-space-self-expansion-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-evolution-space-self-expansion-v1.json
          if-no-files-found: warn
