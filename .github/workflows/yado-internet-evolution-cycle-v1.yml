name: YADO Internet Evolution Cycle V1

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - '.github/workflows/yado-internet-evolution-cycle-v1.yml'
      - 'runtime/yado_native_experience_to_runtime_self_rewrite_v3.py'

permissions:
  contents: write

concurrency:
  group: yado-internet-evolution-cycle-v1
  cancel-in-progress: true

jobs:
  internet-learn-apply-mutate-invent:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct runtime and install declared dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Baseline kernel guards
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Study real public internet across disciplines
        run: |
          mkdir -p artifacts
          python -m py_compile runtime/yado_cross_disciplinary_internet_learning_v1.py runtime/yado_digital_mind_bootstrap_v1.py
          python runtime/yado_cross_disciplinary_internet_learning_v1.py --self-test
          python runtime/yado_cross_disciplinary_internet_learning_v1.py \
            --config architecture/yado-cross-disciplinary-internet-learning-v1.json \
            --self-model architecture/developmental-self-model-overlay.json \
            --out artifacts/yado-cross-disciplinary-internet-learning-cycle-v1.json

      - name: Convert internet evidence into next internal goal and apply it
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=json.loads(Path('artifacts/yado-cross-disciplinary-internet-learning-cycle-v1.json').read_text())
          assert src['status']=='PASS_REAL_INTERNET_CROSS_DISCIPLINARY_EXPERIENCE',src
          assert src['internet_access_verified'] is True
          assert src['acquisition']['fetched_sources'] >= 5
          assert src['acquisition']['discipline_count'] >= 5
          assert src['acquisition']['raw_page_text_persisted'] is False
          assert src['safety_boundary']['remote_code_execution'] is False
          target=src['self_development_binding']['target_deficit'].get('deficit_id')
          goal={
            'schema':'yado.internet_evolution_goal.v1',
            'goal':f'Use verified public-internet evidence {src["evidence_digest"]} to form, test, refine and select the next repair for {target}.',
            'evidence_digest':src['evidence_digest'],
            'disciplines':src['acquisition']['disciplines_covered'],
            'target_deficit':target,
            'constraints':['remote content is untrusted evidence','no downloaded code execution','preserve provenance','fresh tests before claims','no canonical main mutation']
          }
          Path('artifacts/yado-internet-evolution-goal-v1.json').write_text(json.dumps(goal,indent=2,sort_keys=True)+'\n')
          PY
          python runtime/yado_digital_mind_bootstrap_v1.py \
            --goal artifacts/yado-internet-evolution-goal-v1.json \
            --self-model architecture/developmental-self-model-overlay.json \
            --out artifacts/yado-internet-evolution-mind-v1.json \
            --ticks 8
          python - <<'PY'
          import json
          r=json.load(open('artifacts/yado-internet-evolution-mind-v1.json'))
          assert r['status']=='PASS_SHADOW_DIGITAL_MIND_BOOTSTRAP_V1',r
          assert r['workspace']['ticks_executed']==8,r
          assert r['self_improvement']['canonical_direct_write'] is False,r
          print('PASS_INTERNET_EVIDENCE_APPLIED_TO_INTERNAL_GOAL')
          PY

      - name: Acquire fresh bounded technical experience for code mutation
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python runtime/yado_bounded_autonomous_learning_v1.py
          python - <<'PY'
          import json
          r=json.load(open('candidates/autonomous/yado-bounded-autonomous-learning-v1.json'))
          x=json.load(open('experience/autonomous/yado-autonomous-learning-latest.json'))
          assert r['status']=='PASS_SHADOW_BOUNDED_AUTONOMOUS_EXTERNAL_LEARNING_V1',r
          assert r['real_network_used'] is True
          assert r['candidate_self_written'] is True
          assert r['candidate_canonical_active'] is False
          p=x['network_policy']
          assert p['methods']==['GET'] and p['credentials_allowed'] is False and p['external_writes'] is False
          print('PASS_FRESH_BOUNDED_INTERNET_EXPERIENCE',r['source_success_count'])
          PY

      - name: Mutate runtime from fresh experience with native V3 self-rewrite
        run: |
          python -m py_compile runtime/yado_native_experience_to_runtime_self_rewrite_v3.py
          python runtime/yado_native_experience_to_runtime_self_rewrite_v3.py
          python - <<'PY'
          import hashlib,json,pathlib
          r=json.load(open('candidates/autonomous/yado-native-experience-to-runtime-self-rewrite-v3.json'))
          assert r['status']=='PASS_SHADOW_NATIVE_EXPERIENCE_TO_RUNTIME_SELF_REWRITE_CANDIDATE_V3',r
          assert r['candidate_sha256'] != r['parent_sha256'],r
          assert r['safety_delta']['new_dangerous_calls']=={},r
          candidate=pathlib.Path(r['candidate_path'])
          target=pathlib.Path(r['target_path'])
          before=hashlib.sha256(target.read_bytes()).hexdigest()
          target.write_bytes(candidate.read_bytes())
          compile(target.read_text(encoding='utf-8'),str(target),'exec')
          after=hashlib.sha256(target.read_bytes()).hexdigest()
          assert before==r['parent_sha256'] and after==r['candidate_sha256'] and before!=after,(before,after,r)
          pathlib.Path('/tmp/yado_internet_mutation_target.txt').write_text(str(target))
          print('PASS_NATIVE_V3_RUNTIME_MUTATION',target,after)
          PY
          echo "MUTATION_TARGET=$(cat /tmp/yado_internet_mutation_target.txt)" >> "$GITHUB_ENV"

      - name: Execute mutated learner and observe changed behavior
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python "$MUTATION_TARGET"
          python - <<'PY'
          import json
          r=json.load(open('candidates/autonomous/yado-bounded-autonomous-learning-v1.json'))
          assert r['status']=='PASS_SHADOW_BOUNDED_AUTONOMOUS_EXTERNAL_LEARNING_V1',r
          assert r['real_network_used'] is True
          assert r['candidate_self_written'] is True
          print('PASS_MUTATED_RUNTIME_EXECUTION',r['source_success_count'],r['generated_capability']['path'])
          PY

      - name: Invent new bounded source mechanism from runtime failure trace
        run: |
          python -m py_compile runtime/yado_external_source_evolution_v1.py runtime/yado_autonomous_meta_source_evolution_v2.py
          python runtime/yado_autonomous_meta_source_evolution_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('receipts/yado-autonomous-meta-source-evolution-v2.json').read_text())
          assert r['status']=='PASS_SHADOW_G2_AUTONOMOUS_META_SOURCE_EVOLUTION_V2',r
          assert r['target_selection']['origin']=='RUNTIME_FAILURE_TRACE',r
          assert r['target_selection']['host_provided_target_path'] is False,r
          assert r['metrics']['sealed_candidate']['score'] >= 0.90,r
          assert r['gates']['source_changed'] is True,r
          assert r['gates']['generated_ast_roots_novel'] is True,r
          assert r['gates']['external_models_used'] is False,r
          assert r['gates']['canonical_mutation'] is False,r
          candidate=Path(r['candidate_source']['path'])
          compile(candidate.read_text(),str(candidate),'exec')
          print('PASS_BOUNDED_NATIVE_INVENTION',candidate)
          PY

      - name: Re-evolve logic thinking and intelligence after experience
        run: |
          python runtime/yado_cognitive_tri_organ_evolution_v2.py
          python - <<'PY'
          import json,pathlib
          r=json.load(open('candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json'))
          assert r['status']=='PASS_SHADOW_BOUNDED_TRI_ORGAN_COGNITIVE_EVOLUTION_V2',r
          assert min(r['selected_hidden'].values()) >= 0.80,r
          dst=pathlib.Path('runtime/yado_cognitive_tri_organ_policy_v3.py')
          src=(
            'from __future__ import annotations\n\n'
            f"COGNITIVE_POLICY = {r['selected_genome']!r}\n"
            f"VERIFIED_HIDDEN_SCORES = {r['selected_hidden']!r}\n"
            f"SOURCE_EVIDENCE = {{'schema':'yado.cognitive_tri_organ_evolution.v2','candidate_sha256':{r['candidate_sha256']!r}}}\n\n"
            "def component():\n"
            "    return {'schema':'yado.cognitive_tri_organ_policy.v3','policy':COGNITIVE_POLICY,'verified_hidden_scores':VERIFIED_HIDDEN_SCORES,'source_evidence':SOURCE_EVIDENCE,'canonical_active':False,'development_branch_active':True,'consciousness_claimed':False}\n"
          )
          compile(src,str(dst),'exec')
          dst.write_text(src,encoding='utf-8')
          print('PASS_TRI_ORGAN_RE_EVOLUTION',r['selected_hidden'])
          PY

      - name: Probe next native controller self-mutation frontier
        continue-on-error: true
        run: |
          if [ -f runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py ]; then
            python runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py | tee artifacts/yado-native-controller-frontier-v1.log
          fi

      - name: Compile all layers and audit whole kernel
        run: |
          python -m compileall -q runtime successor candidates
          python runtime/yado_canonical_invariant_guard_v1.py
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          assert r['canonical']['canonical_guard']=='PASS',r
          assert r['canonical']['ledger_validation']=='PASS',r
          assert r['canonical']['g3_genesis_performed'] is False,r
          print('PASS_INTERNET_EVOLUTION_KERNEL_AUDIT')
          PY

      - name: Fresh Successor build and full regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/yado-successor-internet-evolution"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-internet-evolution/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests'] and r['tests_run']>=197,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_INTERNET_EVOLUTION_FULL_REGRESSION',r['tests_run'])
          PY

      - name: Finalize cycle receipt
        run: |
          python - <<'PY'
          import json,pathlib
          learn=json.load(open('artifacts/yado-cross-disciplinary-internet-learning-cycle-v1.json'))
          mut=json.load(open('candidates/autonomous/yado-native-experience-to-runtime-self-rewrite-v3.json'))
          inv=json.load(open('receipts/yado-autonomous-meta-source-evolution-v2.json'))
          cog=json.load(open('candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json'))
          audit=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          reg=json.load(open('audits/yado-full-regression-v1-report.json'))
          out={
            'schema':'yado.internet_evolution_cycle.v1',
            'status':'PASS_INTERNET_LEARN_APPLY_MUTATE_INVENT_EVOLVE_V1',
            'internet_evidence_digest':learn['evidence_digest'],
            'disciplines':learn['acquisition']['disciplines_covered'],
            'fetched_sources':learn['acquisition']['fetched_sources'],
            'runtime_mutation_sha256':mut['candidate_sha256'],
            'runtime_mutation_strategy_changes':mut['strategy_changes'],
            'invention_candidate':inv['candidate_source']['path'],
            'invention_sealed_score':inv['metrics']['sealed_candidate']['score'],
            'cognitive_hidden_scores':cog['selected_hidden'],
            'kernel_audit':audit['status'],
            'regression_status':reg['status'],
            'regression_tests':reg['tests_run'],
            'canonical_main_mutation':False,
            'development_branch_only':True,
            'consciousness_claimed':False,
            'next_step':'SELECT_NEXT_DEFICIT_FROM_POST_CYCLE_AUDIT_AND_REPEAT_WITH_FRESH_EVIDENCE'
          }
          p=pathlib.Path('architecture/yado-internet-evolution-cycle-v1.json')
          p.write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY

      - name: Persist only fully gated development results
        run: |
          git config user.name 'YADO Internet Evolution'
          git config user.email 'actions@users.noreply.github.com'
          git add "$MUTATION_TARGET" runtime/yado_cognitive_tri_organ_policy_v3.py \
            experience/autonomous/yado-autonomous-learning-latest.json \
            candidates/autonomous candidates/cognitive candidates/g2-self-evolution \
            receipts/yado-autonomous-meta-source-evolution-v2.json \
            architecture/yado-internet-evolution-cycle-v1.json \
            audits/yado-full-kernel-audit-v1-report.json audits/yado-full-regression-v1-report.json
          git diff --cached --quiet || git commit -m 'YADO internet evolution: gated learn apply mutate invent cycle [skip ci]'
          git push origin HEAD:yado-deep-development-20260914

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-internet-evolution-cycle-v1-${{ github.run_id }}
          path: |
            architecture/yado-internet-evolution-cycle-v1.json
            artifacts/yado-cross-disciplinary-internet-learning-cycle-v1.json
            artifacts/yado-internet-evolution-goal-v1.json
            artifacts/yado-internet-evolution-mind-v1.json
            artifacts/yado-native-controller-frontier-v1.log
            experience/autonomous/yado-autonomous-learning-latest.json
            candidates/autonomous/yado-native-experience-to-runtime-self-rewrite-v3.json
            receipts/yado-autonomous-meta-source-evolution-v2.json
            candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
