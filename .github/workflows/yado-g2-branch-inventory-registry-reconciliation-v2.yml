name: YADO G2 Branch Inventory Registry Reconciliation V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-branch-inventory-registry-reconciliation-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-branch-inventory-registry-reconciliation-v2
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install native runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Pre-reconciliation canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile reconciliation path
        run: python -m py_compile runtime/yado_g2_branch_inventory_registry_reconciliation_v2.py runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Reconcile actual remote branch inventory into G2 memory
        run: python runtime/yado_g2_branch_inventory_registry_reconciliation_v2.py
      - name: Post-reconciliation deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Require branch-memory closure and no promotion
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_branch_inventory_registry_reconciliation_v2_receipt.json"))
          assert r["status"]=="PASS_G2_BRANCH_INVENTORY_REGISTRY_RECONCILIATION_V2",r
          assert r["remote_branch_count"]==20,r
          assert r["historical_branch_count"]==19,r
          assert r["added_branch_count"]==6,r
          assert all(r["checks"].values()),r
          assert r["capability_mutation"] is False,r
          assert r["promotion_applied"] is False,r
          assert r["g3_genesis_performed"] is False,r
          d=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          f={x.get("code"):x for x in d.get("findings",[])}
          assert f["REMOTE_BRANCH_INVENTORY_MATCH"]["status"]=="PASS",d
          assert d["summary"]["blocking_findings"]==0,d
          print(r["status"],d["overall_verdict"])
          PY
      - name: Final canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist reconciled branch memory and evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_branch_inventory_registry_reconciliation_v2_receipt.json "receipts/yado-g2-branch-inventory-registry-reconciliation-v2-run-${GITHUB_RUN_ID}.json"
          cp runtime/yado_unified_core_deep_self_audit_v1_receipt.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}-post-branch-registry-v2.json"
          git config user.name "YADO G2 Branch Memory Reconciliation"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-main-head-g2.json
          git add canonical/yado-unified-core-v1.json
          git add canonical/yado-unified-experience-registry-v1.json
          git add canonical/yado-unified-context-kernel-v1.json
          git add architecture/evolution-ledger.json
          git add "receipts/yado-g2-branch-inventory-registry-reconciliation-v2-run-${GITHUB_RUN_ID}.json"
          git add "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}-post-branch-registry-v2.json"
          git diff --cached --quiet || git commit -m "Reconcile all remote branches into G2 read-only memory [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
