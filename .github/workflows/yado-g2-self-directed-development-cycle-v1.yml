name: YADO G2 Self Directed Development Cycle V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/g2-development-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-directed-development-cycle
  cancel-in-progress: false
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run one G2 self-directed developmental cycle
        id: develop
        continue-on-error: true
        run: python runtime/yado_g2_self_directed_development_cycle_v1.py
      - name: Upload G2 developmental evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-g2-self-directed-development-cycle-v1
          path: |
            runtime/yado_g2_self_directed_development_cycle_v1_receipt.json
            architecture/g2-development-state-v1.json
            candidates/g2-development/contextual-stream-capability-adapter-v1.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist G2 developmental evidence
        if: always()
        run: |
          mkdir -p receipts architecture candidates/g2-development
          if [ -f runtime/yado_g2_self_directed_development_cycle_v1_receipt.json ]; then
            cp runtime/yado_g2_self_directed_development_cycle_v1_receipt.json "receipts/yado-g2-self-directed-development-cycle-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO G2 Development Cycle"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          if [ -f architecture/g2-development-state-v1.json ]; then files+=("architecture/g2-development-state-v1.json"); fi
          if [ -f candidates/g2-development/contextual-stream-capability-adapter-v1.json ]; then files+=("candidates/g2-development/contextual-stream-capability-adapter-v1.json"); fi
          if [ -f "receipts/yado-g2-self-directed-development-cycle-v1-run-${GITHUB_RUN_ID}.json" ]; then files+=("receipts/yado-g2-self-directed-development-cycle-v1-run-${GITHUB_RUN_ID}.json"); fi
          git add "${files[@]}"
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist G2 self-directed development evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_g2_self_directed_development_cycle_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_G2_DEVELOPMENT_RECEIPT")
          r=json.loads(p.read_text())
          if not str(r.get("status","")).startswith("PASS_"):
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
