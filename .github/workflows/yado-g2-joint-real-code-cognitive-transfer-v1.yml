name: YADO G2 Joint Real Code Cognitive Transfer V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-joint-real-code-cognitive-transfer-v1-request.json"]
permissions: {contents: write}
jobs:
  joint:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_joint_real_code_cognitive_transfer_v1.py
      - name: Compare canonical and trained cognitive control on the same real code tasks
        continue-on-error: true
        run: python runtime/yado_g2_joint_real_code_cognitive_transfer_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist joint real-code evidence
        if: always()
        run: |
          git config user.name "YADO Joint Real Code Cognitive Transfer V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-joint-real-code-cognitive-transfer-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-joint-real-code-cognitive-transfer-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO joint real-code cognitive transfer V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce joint real-code verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-joint-real-code-cognitive-transfer-v1.json")
          if not p.exists(): raise SystemExit("MISSING_JOINT_REAL_CODE_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_JOINT_REAL_CODE_COGNITIVE_TRANSFER_V1":
              raise SystemExit("JOINT_REAL_CODE_WITHHOLD:"+r["next_required_capability"])
          print(r["status"],r["growth_verdict"],r["metrics"],r["task_results"],r["next_required_capability"])
          PY
