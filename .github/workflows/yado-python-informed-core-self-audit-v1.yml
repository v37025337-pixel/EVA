name: YADO Python Informed Core Self Audit V1

on:
  workflow_dispatch:
  push:
    branches: [yado-python-study-v1]
    paths:
      - 'runtime/yado_python_study_v1.py'
      - 'runtime/yado_python_informed_core_self_improvement_v1.py'
      - '.github/workflows/yado-python-informed-core-self-audit-v1.yml'

permissions:
  contents: read

jobs:
  python-informed-self-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Study official Python and verify interpreter semantics
        run: python runtime/yado_python_study_v1.py
      - name: Generate Python-informed core candidate
        run: python runtime/yado_python_informed_core_self_improvement_v1.py
      - name: Verify candidate hash compile and isolated self-check
        run: |
          python - <<'PY'
          import hashlib,json,shutil,tempfile,subprocess,sys
          from pathlib import Path
          r=json.load(open('candidates/python/yado-python-informed-core-self-improvement-v1.json'))
          assert r['status']=='PASS_SHADOW_PYTHON_INFORMED_CORE_SELF_IMPROVEMENT_V1'
          p=Path('candidates/python/yado_unified_core_v1_candidate.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['candidate_sha256']
          compile(p.read_text(),str(p),'exec')
          with tempfile.TemporaryDirectory() as td:
              dst=Path(td)/'repo'
              shutil.copytree('.',dst,ignore=shutil.ignore_patterns('.git','__pycache__','*.pyc'))
              shutil.copy2(dst/'candidates/python/yado_unified_core_v1_candidate.py',dst/'runtime/yado_unified_core_v1.py')
              code="import sys,json;sys.path.insert(0,'runtime');from yado_unified_core_v1 import UnifiedYADOCoreV1;c=UnifiedYADOCoreV1('.');r=c.python_runtime_self_check();print(json.dumps(r,sort_keys=True));assert r['pass'];assert not r['downloaded_code_executed']"
              subprocess.run([sys.executable,'-c',code],cwd=dst,check=True)
          print('PASS_ISOLATED_PYTHON_INFORMED_CORE_SELF_CHECK')
          PY
      - name: Run YADO deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Compile runtime successor and candidate
        run: python -m compileall -q runtime successor candidates/python
      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"
      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-python-informed-core-self-audit-v1-${{ github.run_id }}
          path: |
            experience/python/yado-python-study-v1.json
            candidates/python/yado-python-informed-core-self-improvement-v1.json
            candidates/python/yado_unified_core_v1_candidate.py
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json

# retry after closing external-data branch history into main
