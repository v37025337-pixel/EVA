name: YADO Real Coding Intelligence Training V1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'successor/**'
      - 'runtime/**'
      - 'canonical/**'
      - 'architecture/evolution-ledger.json'
      - '.github/workflows/yado-real-coding-intelligence-training-v1.yml'

permissions:
  contents: read

concurrency:
  group: real-coding-intelligence-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r successor/requirements.txt -r runtime/yado_rc8_v36/requirements-github.txt pyyaml
      - name: Pin clean kernel and run complete regression
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m successor build --output "$RUNNER_TEMP/real-training-birth"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/real-training-birth/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==181,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_PRE_TRAINING_REGRESSION_181_OF_181')
          PY
      - name: Measure coding programming and intellectual baseline on fresh public data
        run: |
          python -m successor.real_coding_intelligence_run \
            --manifest "$RUNNER_TEMP/real-training-birth/manifest.json" \
            --output "$RUNNER_TEMP/real-training-baseline"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'real-training-baseline'/'baseline.json'
          r=json.loads(p.read_text())
          assert r['status']=='PASS_REAL_CODING_INTELLIGENCE_BASELINE_CAPTURE_V1',r
          assert r['task_count']==15,r
          assert r['state_verification']['status']=='PASS',r
          assert r['canonical_mutation'] is False and r['architecture_mutation'] is False,r
          assert r['self_improvement_applied'] is False,r
          assert r['answers_supplied_to_kernel'] is False,r
          assert sum(v['total'] for v in r['family_summary'].values())==15,r
          print(json.dumps({
            'tasks':r['task_count'],
            'passes':r['pass_count'],
            'deficits':r['deficit_count'],
            'families':r['family_summary'],
            'deficit_ids':[d['task_id'] for d in r['deficits']],
            'repositories':r['repositories'],
          },sort_keys=True))
          PY
      - name: Audit unchanged kernel after baseline
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          PY
          python runtime/yado_canonical_invariant_guard_v1.py
          git diff --exit-code -- canonical architecture/evolution-ledger.json
      - name: Preserve baseline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-real-coding-intelligence-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/real-training-birth/
            ${{ runner.temp }}/real-training-baseline/
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
            audits/yado-full-kernel-audit-v1-report.json
