name: YADO G2 Native Source Constructor Genesis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-source-constructor-genesis-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-source-constructor-genesis-v1
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before native source genesis
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile native source genesis transport
        run: python -m py_compile runtime/yado_g2_native_source_constructor_genesis_v1.py
      - name: Let YADO attempt native source constructor genesis
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_native_source_constructor_genesis_v1.py
      - name: Canonical guard after native source genesis
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist native source genesis evidence
        if: always()
        run: |
          git config user.name "YADO Native Source Genesis"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-source-constructor-genesis-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-source-constructor-genesis-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO native source constructor genesis evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict native verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-source-constructor-genesis-v1.json")
          if not p.exists(): raise SystemExit("MISSING_NATIVE_SOURCE_GENESIS_EVIDENCE")
          r=json.loads(p.read_text())
          assert r["checks"]["external_models_used"] is False,r
          assert r["checks"]["host_patch_used"] is False,r
          assert r["checks"]["host_target_file_selected"] is False,r
          assert r["checks"]["host_solution_template_used"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SOURCE_CONSTRUCTOR_GENESIS_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["checks"]["candidate_source_produced_by_yado"] is True,r
          print(r["status"],r["native_evolution"]["code_gene"]["gene_id"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-native-source-constructor-genesis-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-source-constructor-genesis-v1.json
          if-no-files-found: warn
