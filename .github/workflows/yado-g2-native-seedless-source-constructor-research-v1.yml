name: YADO G2 Native Seedless Source Constructor Research V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-seedless-source-constructor-research-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-seedless-source-constructor-research-v1
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before research
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile research transport
        run: python -m py_compile runtime/yado_g2_native_seedless_source_constructor_research_v1.py
      - name: Let YADO study Python, study itself, and birth a native mechanism
        id: research
        continue-on-error: true
        run: python runtime/yado_g2_native_seedless_source_constructor_research_v1.py
      - name: Canonical guard after research
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist study and native mechanism evidence
        if: always()
        run: |
          git config user.name "YADO Native Source Research"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f experience/yado-native-seedless-source-constructor-python-self-study-v1.json ] && files+=(experience/yado-native-seedless-source-constructor-python-self-study-v1.json)
          [ -f candidates/kernel-self-generated/g2-native-seedless-source-constructor-research-v1.json ] && files+=(candidates/kernel-self-generated/g2-native-seedless-source-constructor-research-v1.json)
          [ ${#files[@]} -gt 0 ] && git add "${files[@]}"
          git diff --cached --quiet || git commit -m "Persist YADO native source constructor research evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest native verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-seedless-source-constructor-research-v1.json")
          if not p.exists(): raise SystemExit("MISSING_NATIVE_SOURCE_RESEARCH_EVIDENCE")
          r=json.loads(p.read_text())
          assert r["checks"]["external_coding_models_used"] is False,r
          assert r["checks"]["host_patch_used"] is False,r
          assert r["checks"]["host_target_file_selected"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]=="WITHHOLD_G2_NATIVE_SEEDLESS_SOURCE_CONSTRUCTOR_RESEARCH_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["process_mechanism_born"],r["candidate_source_produced_by_yado"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-native-seedless-source-constructor-research-v1-${{ github.run_id }}
          path: |
            experience/yado-native-seedless-source-constructor-python-self-study-v1.json
            candidates/kernel-self-generated/g2-native-seedless-source-constructor-research-v1.json
          if-no-files-found: warn
