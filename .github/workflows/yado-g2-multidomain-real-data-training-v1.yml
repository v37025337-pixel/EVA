name: YADO G2 Multidomain Real Data Training V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-multidomain-real-data-training-v1-request.json"]
permissions:
  contents: write
  actions: read
jobs:
  realdata:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_multidomain_real_data_training_v1.py
      - name: Train on external real data and real YADO operations
        continue-on-error: true
        run: python runtime/yado_g2_multidomain_real_data_training_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist real-data evidence
        if: always()
        run: |
          git config user.name "YADO Multidomain Real Data Training V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-multidomain-real-data-training-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-multidomain-real-data-training-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO multidomain real data training V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce real-data verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-multidomain-real-data-training-v1.json").read_text())
          if r["status"]!="PASS_SHADOW_G2_MULTIDOMAIN_REAL_DATA_TRAINING_V1":
              raise SystemExit("REAL_DATA_WITHHOLD:"+r["next_required_capability"])
          print(r["status"],r["metrics"],r["gene_ids"],r["portfolio_id"],r["next_required_capability"])
          PY
