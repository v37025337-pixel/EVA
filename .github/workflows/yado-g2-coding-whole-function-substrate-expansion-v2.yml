name: YADO G2 Whole Function Substrate Expansion V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-coding-whole-function-substrate-expansion-v2-request.json"]
permissions: {contents: write}
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_coding_whole_function_substrate_expansion_v2.py
      - name: Evolve readonly attribute substrate
        continue-on-error: true
        run: python runtime/yado_g2_coding_whole_function_substrate_expansion_v2.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist substrate expansion V2
        if: always()
        run: |
          git config user.name "YADO Whole Function Substrate Expansion V2"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-coding-whole-function-substrate-expansion-v2.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-coding-whole-function-substrate-expansion-v2.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO whole-function substrate expansion V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce substrate expansion verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-coding-whole-function-substrate-expansion-v2.json")
          if not p.exists():raise SystemExit("MISSING_SUBSTRATE_EXPANSION_V2")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_CODING_WHOLE_FUNCTION_SUBSTRATE_EXPANSION_V2":
              raise SystemExit("SUBSTRATE_EXPANSION_WITHHOLD:"+r["status"]+":"+r["next_required_capability"])
          assert r["unlocked_candidate_count"]>=2,r
          assert r["unlocked_source_file_count"]>=2,r
          assert r["checks"]["readonly_profiles_only"] is True,r
          assert r["checks"]["no_mutating_attribute_method"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          print(r["status"],r["selected_profile"],r["allowed_readonly_attributes"],r["unlocked_candidate_count"],r["unlocked_source_file_count"])
          PY
