name: YADO G2 Native Source Realization Extended Controller V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-native-source-primitive-execution-serialization-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-source-realization-extended-controller-v1
  cancel-in-progress: true
jobs:
  source_realization:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before native source realization
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile strict observer
        run: python -m py_compile runtime/yado_g2_native_source_primitive_execution_serialization_v1.py
      - name: Let YADO realize its extended controller as source
        id: realize
        continue-on-error: true
        run: python runtime/yado_g2_native_source_primitive_execution_serialization_v1.py
      - name: Canonical guard after native source realization
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist native source-realization evidence
        if: always()
        run: |
          git config user.name "YADO Native Source Realization"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-native-source-primitive-execution-serialization-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO native source serialization V1 evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict native source provenance verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-source-primitive-execution-serialization-v1.json")
          if not p.exists(): raise SystemExit("MISSING_SERIALIZATION_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          for key in ("external_models_used","new_external_research_used","host_selected_mechanism_family","host_source_template_used",
                      "host_ast_emitter_template_used","host_grammar_used","host_patch_used","automatic_canonical_promotion"):
              assert c[key] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"] not in ("PASS_SHADOW_G2_NATIVE_SOURCE_PRIMITIVE_EXECUTION_SERIALIZATION_V1","WITHHOLD_G2_NATIVE_SOURCE_PRIMITIVE_EXECUTION_SERIALIZATION_V1"):
              raise SystemExit("BAD_SERIALIZATION_STATUS:"+str(r["status"]))
          print(r["status"],r.get("selected_mechanism_kind"),r.get("fresh_exact"),r.get("next_required_capability"))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-source-primitive-serialization-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-source-primitive-execution-serialization-v1.json
          if-no-files-found: warn
