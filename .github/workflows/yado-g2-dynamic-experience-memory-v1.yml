name: YADO G2 Dynamic Experience Memory V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-dynamic-experience-memory-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-dynamic-experience-memory-v1
  cancel-in-progress: true
jobs:
  build-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch lineage refs
        run: git fetch --all --prune
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Canonical guard before dynamic memory
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile dynamic memory
        run: python -m py_compile runtime/yado_g2_dynamic_experience_memory_v1.py
      - name: Build dynamic experience memory
        run: python runtime/yado_g2_dynamic_experience_memory_v1.py
      - name: Require strict memory semantics
        run: |
          python - <<'PY'
          import json
          r=json.load(open("experience/yado-g2-dynamic-experience-memory-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_DYNAMIC_EXPERIENCE_MEMORY_V1",r
          assert r["remote_branch_count"]>=r["canonical_registry_branch_count"],r
          assert all(not x["semantic_use_allowed"] for x in r["branches"] if x["inventory_class"]=="RAW_BRANCH_INVENTORY_ONLY"),r
          assert all(not x["lessons"] for x in r["branches"] if x["inventory_class"]=="RAW_BRANCH_INVENTORY_ONLY"),r
          assert r["policy"]["raw_branch_inventory_is_not_semantic_knowledge"] is True,r
          assert r["policy"]["canonical_mutation"] is False,r
          assert r["policy"]["automatic_promotion"] is False,r
          print(r["status"],r["remote_branch_count"],r["raw_lineage_count"],r["next_required_capability"])
          PY
      - name: Canonical guard after dynamic memory
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist dynamic memory
        run: |
          git config user.name "YADO Dynamic Experience Memory"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-g2-dynamic-experience-memory-v1.json
          git diff --cached --quiet || git commit -m "Persist dynamic experience memory V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-g2-dynamic-experience-memory-v1-${{ github.run_id }}
          path: experience/yado-g2-dynamic-experience-memory-v1.json
