name: YADO G1 Multiround Development Training V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/g1-training-request.json"
      - "runtime/yado_g1_multiround_training_v1.py"
      - "runtime/yado_neutral_evidence_profile_selector_v1.py"
      - ".github/workflows/yado-g1-multiround-development-training-v1.yml"
permissions:
  contents: write
concurrency:
  group: yado-g1-multiround-development-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Run one G1 developmental training round
        id: train
        continue-on-error: true
        run: python runtime/yado_g1_multiround_training_v1.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-g1-multiround-training-v1
          path: |
            runtime/yado_g1_multiround_training_v1_receipt.json
            architecture/g1-training-state-v1.json
            architecture/evolution-ledger.json
          retention-days: 30
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts architecture
          if [ -f runtime/yado_g1_multiround_training_v1_receipt.json ]; then
            cp runtime/yado_g1_multiround_training_v1_receipt.json "receipts/yado-g1-multiround-training-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO G1 Development Trainer"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "receipts/yado-g1-multiround-training-v1-run-${GITHUB_RUN_ID}.json" \
            architecture/g1-training-state-v1.json \
            architecture/evolution-ledger.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist G1 developmental training round evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("runtime/yado_g1_multiround_training_v1_receipt.json")
          if not p.exists():
              raise SystemExit("MISSING_G1_TRAINING_RECEIPT")
          r=json.loads(p.read_text())
          if not str(r.get("status","")).startswith("PASS_"):
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
