name: YADO G2 Global Historical Experience Census V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-global-historical-experience-census-v2-request.json"]
permissions: {contents: write}
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch every reachable branch
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_global_historical_experience_census_v2.py
      - name: Scan all reachable historical evidence blobs
        continue-on-error: true
        run: python runtime/yado_g2_global_historical_experience_census_v2.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist historical census
        if: always()
        run: |
          git config user.name "YADO Global Historical Experience Census V2"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-global-historical-experience-corpus-v2.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-global-historical-experience-census-v2.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO global historical experience census V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce historical census verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-global-historical-experience-census-v2.json").read_text())
          if r["status"]!="PASS_G2_GLOBAL_HISTORICAL_EXPERIENCE_CENSUS_V2":
              raise SystemExit("HISTORICAL_CENSUS_WITHHOLD:"+r["next_required_capability"])
          print(r["status"],r["counts"],r["new_outcome_by_class"],r["new_outcome_by_domain"],r["next_required_capability"])
          PY
