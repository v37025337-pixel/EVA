name: YADO Kernel-Native Developmental Self-Model Binding V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_kernel_native_developmental_self_model_binding_v1.py"
      - ".github/workflows/yado-kernel-native-developmental-self-model-binding-v1.yml"
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Let YADO synthesize native developmental priority binder
        run: python runtime/yado_kernel_native_developmental_self_model_binding_v1.py
      - name: Upload receipt and component
        uses: actions/upload-artifact@v4
        with:
          name: yado-kernel-native-developmental-self-model-binding-v1
          path: |
            runtime/yado_kernel_native_developmental_self_model_binding_v1_receipt.json
            runtime/kernel_native_developmental_self_model_binding_v1/component.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts candidates/kernel-native-developmental-self-model
          cp runtime/yado_kernel_native_developmental_self_model_binding_v1_receipt.json receipts/yado-kernel-native-developmental-self-model-binding-v1-latest.json
          cp runtime/kernel_native_developmental_self_model_binding_v1/component.json candidates/kernel-native-developmental-self-model/component.json
          git config user.name "YADO Native Self Model Binder"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-kernel-native-developmental-self-model-binding-v1-latest.json candidates/kernel-native-developmental-self-model/component.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist kernel-native developmental self-model binder [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
