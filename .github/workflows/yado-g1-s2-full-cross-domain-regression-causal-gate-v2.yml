name: YADO G1 S2 Full Cross Domain Regression Causal Gate V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_g1_s2_full_cross_domain_regression_causal_gate_v2.py"
      - ".github/workflows/yado-g1-s2-full-cross-domain-regression-causal-gate-v2.yml"
permissions:
  contents: write
concurrency:
  group: yado-g1-full-cross-domain-gate-v2
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run independent repaired G1 full gate V2
        run: python runtime/yado_g1_s2_full_cross_domain_regression_causal_gate_v2.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: yado-g1-s2-full-cross-domain-regression-causal-gate-v2
          path: |
            runtime/yado_g1_s2_full_cross_domain_regression_causal_gate_v2_receipt.json
            architecture/evolution-ledger.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_g1_s2_full_cross_domain_regression_causal_gate_v2_receipt.json receipts/yado-g1-s2-full-cross-domain-regression-causal-gate-v2-latest.json
          git config user.name "YADO G1 Full Gate V2"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-g1-s2-full-cross-domain-regression-causal-gate-v2-latest.json architecture/evolution-ledger.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist repaired G1 full cross-domain gate V2 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
