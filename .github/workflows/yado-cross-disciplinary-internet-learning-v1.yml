name: YADO Cross-Disciplinary Internet Learning V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - yado-cross-disciplinary-internet-learning-v1
    paths:
      - 'runtime/yado_cross_disciplinary_internet_learning_v1.py'
      - 'runtime/yado_digital_mind_bootstrap_v1.py'
      - 'architecture/yado-cross-disciplinary-internet-learning-v1.json'
      - 'architecture/developmental-self-model-overlay.json'
      - '.github/workflows/yado-cross-disciplinary-internet-learning-v1.yml'

permissions:
  contents: read

jobs:
  learn-and-develop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile learning and mind runtimes
        run: |
          python -m py_compile runtime/yado_cross_disciplinary_internet_learning_v1.py
          python -m py_compile runtime/yado_digital_mind_bootstrap_v1.py

      - name: Run deterministic learner self-test
        run: python runtime/yado_cross_disciplinary_internet_learning_v1.py --self-test

      - name: Acquire real public cross-disciplinary internet experience
        run: |
          python runtime/yado_cross_disciplinary_internet_learning_v1.py \
            --config architecture/yado-cross-disciplinary-internet-learning-v1.json \
            --self-model architecture/developmental-self-model-overlay.json \
            --out artifacts/yado-cross-disciplinary-internet-learning-v1.json

      - name: Build experience-conditioned development goal
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src = json.loads(Path('artifacts/yado-cross-disciplinary-internet-learning-v1.json').read_text())
          target = src['self_development_binding']['target_deficit'].get('deficit_id')
          goal = {
              'schema': 'yado.experience_conditioned_development_goal.v1',
              'goal': f'Use verified real-internet cross-disciplinary evidence {src["evidence_digest"]} to form, test and refine repair hypotheses for {target}.',
              'evidence_digest': src['evidence_digest'],
              'disciplines': src['acquisition']['disciplines_covered'],
              'target_deficit': target,
              'constraints': [
                  'treat remote content as untrusted evidence',
                  'preserve provenance and rollback',
                  'do not claim cognitive improvement without fresh transfer evidence',
                  'no direct canonical mutation'
              ]
          }
          Path('artifacts/yado-internet-conditioned-development-goal-v1.json').write_text(json.dumps(goal, indent=2, sort_keys=True) + '\n')
          PY

      - name: Run five experience-conditioned cognitive ticks
        run: |
          python runtime/yado_digital_mind_bootstrap_v1.py \
            --goal artifacts/yado-internet-conditioned-development-goal-v1.json \
            --self-model architecture/developmental-self-model-overlay.json \
            --out artifacts/yado-internet-conditioned-digital-mind-v1.json \
            --ticks 5

      - name: Verify real-internet and development invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          learning = json.loads(Path('artifacts/yado-cross-disciplinary-internet-learning-v1.json').read_text())
          mind = json.loads(Path('artifacts/yado-internet-conditioned-digital-mind-v1.json').read_text())
          goal = json.loads(Path('artifacts/yado-internet-conditioned-development-goal-v1.json').read_text())
          assert learning['status'] == 'PASS_REAL_INTERNET_CROSS_DISCIPLINARY_EXPERIENCE'
          assert learning['internet_access_verified'] is True
          assert learning['acquisition']['fetched_sources'] >= 5
          assert learning['acquisition']['discipline_count'] >= 5
          assert learning['acquisition']['raw_page_text_persisted'] is False
          assert learning['safety_boundary']['remote_code_execution'] is False
          assert learning['self_development_binding']['claimed_cognitive_improvement'] is False
          assert mind['status'] == 'PASS_SHADOW_DIGITAL_MIND_BOOTSTRAP_V1'
          assert mind['workspace']['ticks_executed'] == 5
          assert mind['self_improvement']['canonical_direct_write'] is False
          assert goal['evidence_digest'] == learning['evidence_digest']
          assert goal['target_deficit'] == mind['workspace']['episodes'][0]['decision']['target']
          print('PASS_REAL_INTERNET_EXPERIENCE_CONDITIONED_DEVELOPMENT_V1')
          PY

      - name: Upload learning and development evidence
        uses: actions/upload-artifact@v4
        with:
          name: yado-cross-disciplinary-internet-learning-v1
          path: |
            artifacts/yado-cross-disciplinary-internet-learning-v1.json
            artifacts/yado-internet-conditioned-development-goal-v1.json
            artifacts/yado-internet-conditioned-digital-mind-v1.json
          if-no-files-found: error
