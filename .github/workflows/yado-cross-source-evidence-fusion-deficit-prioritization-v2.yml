name: YADO Cross Source Evidence Fusion Deficit Prioritization V2

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - 'runtime/yado_cross_source_evidence_fusion_deficit_prioritization_v2.py'
      - 'architecture/yado-cross-source-evidence-fusion-deficit-prioritization-v2.json'
      - 'experience/yado-multi-resource-self-directed-data-task-loop-v1.json'
      - '.github/workflows/yado-cross-source-evidence-fusion-deficit-prioritization-v2.yml'

permissions:
  contents: read

jobs:
  unresolved-evidence-fusion-deficit-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare verified development kernel and compile prioritizer
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Self-test resolved-history rejection
        run: |
          python runtime/yado_cross_source_evidence_fusion_deficit_prioritization_v2.py --self-test

      - name: Prioritize only unresolved causal deficits
        run: |
          mkdir -p artifacts
          python runtime/yado_cross_source_evidence_fusion_deficit_prioritization_v2.py \
            --config architecture/yado-cross-source-evidence-fusion-deficit-prioritization-v2.json \
            --out artifacts/yado-cross-source-evidence-fusion-deficit-prioritization-v2.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/yado-cross-source-evidence-fusion-deficit-prioritization-v2.json'))
          assert r['status']=='PASS_CROSS_SOURCE_EVIDENCE_FUSION_DEFICIT_PRIORITIZATION_V2',r
          p=r['priority']; s=p['selected']; rf=s['resolution_filter']
          assert r['candidate_scan']['candidate_count']>=5,r
          assert s['evidence_overlap_count']>=2,r
          assert rf['explicit_deficit_evidence']>=1,r
          assert rf['negative_evidence']>=1,r
          assert rf['pure_next_only'] is False,r
          assert rf['all_resolved_pass'] is False,r
          assert p['selected_evidence_score_lift']>=20.0,r
          assert p['v1_top_rejected_as_unresolved'] is True,r
          controls=r['resolution_controls']
          assert controls['v1_false_priority_rejected'] is True,r
          causal=r['causal_controls']
          assert causal['case_order_permutation_selected_same_deficit'] is True,r
          assert causal['evidence_ablation_reduces_selected_score'] is True,r
          claim=r['selection_claim']
          assert claim['host_preselected_deficit'] is False,r
          assert claim['selected_from_checked_in_unresolved_causal_history'] is True,r
          print('PASS_UNRESOLVED_DEFICIT_PRIORITY_V2', {
            'selected':s['label'],
            'overlap':s['evidence_overlap_families'],
            'negative':rf['negative_evidence'],
            'explicit_deficit':rf['explicit_deficit_evidence'],
            'unresolved_score':s['unresolved_score'],
            'evidence_lift':p['selected_evidence_score_lift'],
            'v1_rejected':p['v1_top_candidate']['label'] if p['v1_top_candidate'] else None,
          })
          PY

      - name: Full kernel audit
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          print('PASS_FULL_KERNEL_AUDIT',r['counts'])
          PY
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Fresh Successor and complete regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/unresolved-deficit-priority-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/unresolved-deficit-priority-successor/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['failures']==[] and r['errors']==[],r
          assert r['tests_run']>=200,r
          assert r['source_unchanged'] is True,r
          print('PASS_FULL_REGRESSION',r['tests_run'])
          PY

      - name: Upload unresolved-priority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-cross-source-evidence-fusion-deficit-prioritization-v2-${{ github.run_id }}
          path: |
            architecture/yado-cross-source-evidence-fusion-deficit-prioritization-v2.json
            experience/yado-multi-resource-self-directed-data-task-loop-v1.json
            artifacts/yado-cross-source-evidence-fusion-deficit-prioritization-v2.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
