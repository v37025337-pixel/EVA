name: YADO Peer Systems Learning V1

on:
  pull_request:
    branches: [main]
    paths:
      - "architecture/yado-peer-systems-learning-request-20260918.json"
      - "runtime/yado_peer_systems_learning_v1.py"
      - "runtime/yado_unified_core_peer_systems_learning_v1.py"
      - "runtime/test_yado_peer_systems_learning_v1.py"
      - ".github/workflows/yado-peer-systems-learning-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-systems-learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
      - name: Compile and focused tests
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python -m py_compile runtime/yado_peer_systems_learning_v1.py runtime/yado_unified_core_peer_systems_learning_v1.py
          python -m unittest runtime.test_yado_peer_systems_learning_v1 -v
      - name: Read and compare real public peer repositories
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from yado_unified_core_peer_systems_learning_v1 import UnifiedYADOCorePeerSystemsLearningV1

          core = UnifiedYADOCorePeerSystemsLearningV1()
          audit = core.audit()
          assert audit["pass"] is True, audit
          result = core.study_peer_systems(timeout=25)
          assert result["status"] == "PASS_SHADOW_PEER_SYSTEMS_LEARNING_V1", result
          assert result["verified_source_count"] >= 8, result
          assert result["read_only_external"] is True
          assert result["third_party_code_executed"] is False
          assert result["third_party_code_copied"] is False
          assert result["automatic_canonical_mutation"] is False
          evidence = {
              "schema": "yado.peer_systems_learning.real_run.v1",
              "status": result["status"],
              "commit": os.environ.get("GITHUB_SHA"),
              "verified_source_count": result["verified_source_count"],
              "withheld_sources": result["withheld_sources"],
              "source_repositories": [x["repo"] for x in result["sources"] if x["status"] == "VERIFIED"],
              "mechanism_cards": result["mechanism_cards"],
              "study_digest": result["study_digest"],
              "next": result["next"],
              "third_party_code_executed": False,
              "third_party_code_copied": False,
              "credentials_used": False,
              "external_writes": False,
              "automatic_canonical_mutation": False,
              "g3_genesis_performed": False,
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "yado-peer-systems-learning-v1.json"
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(evidence, sort_keys=True))
          PY
      - name: Preserve peer-learning evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-peer-systems-learning-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/yado-peer-systems-learning-v1.json
          if-no-files-found: error
