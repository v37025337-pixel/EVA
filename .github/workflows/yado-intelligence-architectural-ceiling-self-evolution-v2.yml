name: YADO Intelligence Architectural Ceiling Self Evolution V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-intelligence-architectural-ceiling-self-evolution-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-intelligence-architectural-ceiling-self-evolution-v2
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run intelligence runtime-dispatch self-evolution V2
        id: evolve
        continue-on-error: true
        run: python runtime/yado_intelligence_architectural_ceiling_self_evolution_v2.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-intelligence-architectural-ceiling-self-evolution-v2
          path: |
            runtime/yado_intelligence_architectural_ceiling_self_evolution_v2_receipt.json
            candidates/g2-self-evolution/bounded_capability_set_coordinator_v1.py
            candidates/g2-self-evolution/bounded_capability_set_coordinator_v1.json
            architecture/yado-g2-lti-ceiling-state-v1.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts candidates/g2-self-evolution
          if [ -f runtime/yado_intelligence_architectural_ceiling_self_evolution_v2_receipt.json ]; then
            cp runtime/yado_intelligence_architectural_ceiling_self_evolution_v2_receipt.json "receipts/yado-intelligence-architectural-ceiling-self-evolution-v2-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Intelligence Runtime Evolution"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json architecture/yado-g2-lti-ceiling-state-v1.json)
          for f in candidates/g2-self-evolution/bounded_capability_set_coordinator_v1.py candidates/g2-self-evolution/bounded_capability_set_coordinator_v1.json "receipts/yado-intelligence-architectural-ceiling-self-evolution-v2-run-${GITHUB_RUN_ID}.json"; do [ -f "$f" ] && files+=("$f"); done
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist YADO intelligence runtime self-evolution V2 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_intelligence_architectural_ceiling_self_evolution_v2_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_INTELLIGENCE_V2_RECEIPT")
          r=json.loads(p.read_text())
          if r.get("status")!="PASS_INTELLIGENCE_ARCHITECTURAL_CEILING_SELF_EVOLUTION_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
