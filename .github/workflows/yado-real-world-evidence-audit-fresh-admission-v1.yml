name: YADO Real World Evidence Audit Fresh Admission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-real-world-evidence-audit-fresh-admission-request.json"
permissions:
  contents: write
concurrency:
  group: yado-real-world-evidence-audit-fresh-admission-v1
  cancel-in-progress: true
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run audit V4 fresh admission
        id: admit
        continue-on-error: true
        run: python runtime/yado_real_world_evidence_audit_fresh_admission_v1.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-real-world-evidence-audit-fresh-admission-v1
          path: |
            runtime/yado_real_world_evidence_audit_fresh_admission_v1_receipt.json
            architecture/evolution-ledger.json
          if-no-files-found: warn
          retention-days: 30
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts
          if [ -f runtime/yado_real_world_evidence_audit_fresh_admission_v1_receipt.json ]; then
            cp runtime/yado_real_world_evidence_audit_fresh_admission_v1_receipt.json "receipts/yado-real-world-evidence-audit-fresh-admission-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO Audit Evidence Admission"
          git config user.email "actions@users.noreply.github.com"
          files=(architecture/evolution-ledger.json)
          if [ -f "receipts/yado-real-world-evidence-audit-fresh-admission-v1-run-${GITHUB_RUN_ID}.json" ]; then files+=("receipts/yado-real-world-evidence-audit-fresh-admission-v1-run-${GITHUB_RUN_ID}.json"); fi
          git add "${files[@]}"
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist YADO audit V4 fresh admission [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_real_world_evidence_audit_fresh_admission_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_AUDIT_V4_FRESH_RECEIPT")
          r=json.loads(p.read_text())
          if r.get("status")!="PASS_REAL_WORLD_EVIDENCE_AUDIT_FRESH_ADMISSION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
