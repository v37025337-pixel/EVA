name: YADO G2 History Guided Compile Repair Invention V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-history-guided-compile-repair-invention-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-history-guided-compile-repair-invention-v1
  cancel-in-progress: true
jobs:
  invent-repair-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before history-guided repair invention
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile generic history repair substrate
        run: python -m py_compile runtime/yado_generic_history_compile_repair_meta_language_v1.py runtime/yado_g2_history_guided_compile_repair_invention_v1.py
      - name: Let YADO invent and apply history-guided compile repair
        run: python runtime/yado_g2_history_guided_compile_repair_invention_v1.py
      - name: Require strict history-guided repair PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-history-guided-compile-repair-invention-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_HISTORY_GUIDED_COMPILE_REPAIR_INVENTION_V1",r
          assert r["checks"]["fresh_exact"] is True,r
          assert r["checks"]["same_program_repairs_target"] is True,r
          assert r["checks"]["no_external_model_or_ready_patch"] is True,r
          assert r["checks"]["host_did_not_supply_target_line_or_patch"] is True,r
          print(r["status"],r["invented_gene"]["gene_id"])
          PY
      - name: Install YADO-generated repaired controller candidate
        run: |
          cp candidates/g2-self-evolution/yado_g2_autonomous_self_rewrite_v1_history_repaired_candidate.py runtime/yado_g2_autonomous_self_rewrite_v1.py
          python -m py_compile runtime/yado_g2_autonomous_self_rewrite_v1.py
      - name: Canonical guard after history-guided repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist repair evidence and resume autonomous self-rewrite
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("architecture/yado-kernel-autonomous-self-rewrite-v1-request.json")
          r=json.loads(p.read_text())
          r["history_compile_repair_trigger"]=(r.get("history_compile_repair_trigger") or 0)+1
          r["history_compile_repair_source_run"]=os.environ.get("GITHUB_RUN_ID")
          r["host_solution_hint"]=None
          r["target_path"]=None
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "YADO History Guided Compile Repair"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_g2_autonomous_self_rewrite_v1.py candidates/kernel-self-generated/g2-history-guided-compile-repair-invention-v1.json candidates/g2-self-evolution/yado_g2_autonomous_self_rewrite_v1_history_repaired_candidate.py architecture/yado-kernel-autonomous-self-rewrite-v1-request.json
          git commit -m "YADO invents history-guided compile repair and resumes self-rewrite [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
