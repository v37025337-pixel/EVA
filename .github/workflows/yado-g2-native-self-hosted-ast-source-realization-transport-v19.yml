name: YADO G2 Native Self Hosted AST Source Realization Transport V19
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-self-hosted-ast-source-realization-transport-v19-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-self-hosted-ast-source-realization-transport-v19
  cancel-in-progress: true
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Pre-transport canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V19 transport
        run: python -m py_compile runtime/yado_g2_native_self_hosted_ast_source_realization_transport_v19.py
      - name: Transport exact YADO V18 source and verify
        run: python runtime/yado_g2_native_self_hosted_ast_source_realization_transport_v19.py
      - name: Post-module integrity after V19
        run: python runtime/yado_g2_post_module_full_integrity_v1.py
      - name: Final canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Require V19 PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-native-self-hosted-ast-source-realization-transport-v19.json"))
          assert r["status"]=="PASS_CANONICAL_G2_NATIVE_SELF_HOSTED_AST_SOURCE_REALIZATION_TRANSPORT_V19",r
          assert r["checks"]["exact_yado_bytes_transported"] is True,r
          assert r["checks"]["live_resource_finding_closed"] is True,r
          assert r["checks"]["invalid_evidence_fails_closed"] is True,r
          assert r["checks"]["selected_regression_suite_pass"] is True,r
          assert r["checks"]["host_authored_semantic_logic"] is False,r
          assert r["checks"]["external_models_used"] is False,r
          print(r["status"],r["candidate_source_sha256"],r["deep_audit_next_step"])
          PY
      - name: Persist V19 canonical transport
        run: |
          mkdir -p receipts
          cp runtime/yado_unified_core_deep_self_audit_v1_receipt.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          cp candidates/kernel-self-generated/g2-native-self-hosted-ast-source-realization-transport-v19.json "receipts/yado-g2-native-self-hosted-ast-source-realization-transport-v19-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO V19 Source Transport"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_unified_core_deep_self_audit_v1.py
          git add canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json architecture/evolution-ledger.json
          git add candidates/kernel-self-generated/g2-native-self-hosted-ast-source-realization-transport-v19.json
          git add audits/yado-g2-post-module-full-integrity-v1.json audits/yado-g2-module-dependency-graph-v1.json
          git add "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git add "receipts/yado-g2-native-self-hosted-ast-source-realization-transport-v19-run-${GITHUB_RUN_ID}.json"
          git diff --cached --quiet || git commit -m "Admit exact YADO V18 self-audit source through V19 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-self-hosted-ast-source-realization-transport-v19-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-self-hosted-ast-source-realization-transport-v19.json
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            audits/yado-g2-post-module-full-integrity-v1.json
          if-no-files-found: warn
