name: YADO G2 Cognitive Experience Consolidation V4
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-cognitive-experience-consolidation-v4-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-cognitive-experience-consolidation-v4
  cancel-in-progress: true
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Pre-development canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile development chain
        run: >
          python -m py_compile
          runtime/yado_g2_multidomain_organ_training_v1.py
          runtime/yado_g2_multidomain_logic_training_repair_v2.py
          runtime/yado_g2_multidomain_cognitive_composition_training_v1.py
          runtime/yado_g2_multidomain_real_data_training_v1.py
          runtime/yado_g2_global_experience_cognitive_genesis_v6.py
          runtime/yado_g2_global_experience_cognitive_stress_v3.py
          runtime/yado_g2_experience_conditioned_cognitive_layer_v4.py
          runtime/yado_g2_cognitive_experience_consolidation_v4.py
      - name: Reproduce multidomain organ weakness
        continue-on-error: true
        run: python runtime/yado_g2_multidomain_organ_training_v1.py
      - name: Require informative organ WITHHOLD
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-multidomain-organ-training-v1.json"))
          assert r["status"]=="WITHHOLD_G2_MULTIDOMAIN_ORGAN_TRAINING_V1",r
          assert r["checks"]["thinking_causal_drop"] is True,r
          assert r["checks"]["intelligence_causal_drop"] is True,r
          assert r["checks"]["logic_causal_drop"] is False,r
          print(r["status"])
          PY
      - name: Repair multidomain logic from failure experience
        run: python runtime/yado_g2_multidomain_logic_training_repair_v2.py
      - name: Compose multidomain cognition
        run: python runtime/yado_g2_multidomain_cognitive_composition_training_v1.py
      - name: Train on fresh real data
        run: python runtime/yado_g2_multidomain_real_data_training_v1.py
      - name: Rebuild global historical cognitive genome
        run: python runtime/yado_g2_global_experience_cognitive_genesis_v6.py
      - name: Stress global historical genome
        continue-on-error: true
        run: python runtime/yado_g2_global_experience_cognitive_stress_v3.py
      - name: Require global negative experience remains visible
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-global-experience-cognitive-stress-v3.json"))
          assert r["status"]=="WITHHOLD_G2_GLOBAL_EXPERIENCE_COGNITIVE_STRESS_V3",r
          assert r["checks"]["commit_ge_0_70"] is False,r
          assert r["checks"]["terminal_overall_ge_0_75"] is False,r
          print(r["status"])
          PY
      - name: Native admission and V4 same-G2 replacement
        run: python runtime/yado_g2_cognitive_experience_consolidation_v4.py
      - name: Dynamic 27-module assembly
        run: python runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py
      - name: Post-module integrity
        run: python runtime/yado_g2_post_module_full_integrity_v1.py
      - name: Kernel-native deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Final canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Require V4 development PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-cognitive-experience-consolidation-v4.json"))
          assert r["status"]=="PASS_G2_COGNITIVE_EXPERIENCE_CONSOLIDATION_V4",r
          assert all(r["checks"].values()),r
          assert r["active_capability_count"]==27,r
          m=json.load(open("candidates/kernel-self-generated/g2-unified-module-kernel-v1.json"))
          assert m["status"]=="PASS_CURRENT_G2_UNIFIED_MODULE_ASSEMBLY_V1",m
          assert m["active_module_count"]==27 and m["covered_module_count"]==27,m
          d=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert d["summary"]["blocking_findings"]==0,d
          print(r["status"],r["fresh_evidence"],r["next_required_capability"])
          PY
      - name: Persist cognitive development
        run: |
          mkdir -p receipts
          cp runtime/yado_unified_core_deep_self_audit_v1_receipt.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO Cognitive Development V4"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_unified_core_v1.py
          git add runtime/yado_g2_unified_module_kernel_v1.py runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py runtime/yado_g2_post_module_full_integrity_v1.py
          git add canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json
          git add canonical/yado-g2-experience-conditioned-cognitive-layer-v4.json
          git add architecture/evolution-ledger.json
          git add candidates/kernel-self-generated/g2-cognitive-experience-consolidation-v4.json
          git add candidates/kernel-self-generated/g2-multidomain-organ-training-v1.json
          git add candidates/kernel-self-generated/g2-multidomain-logic-training-repair-v2.json
          git add candidates/kernel-self-generated/g2-multidomain-cognitive-composition-training-v1.json
          git add candidates/kernel-self-generated/g2-multidomain-real-data-training-v1.json
          git add candidates/kernel-self-generated/g2-global-experience-cognitive-genesis-v6.json
          git add candidates/kernel-self-generated/g2-global-experience-cognitive-stress-v3.json
          git add experience/yado-multidomain-organ-training-v1.json experience/yado-multidomain-logic-training-repair-v2.json
          git add experience/yado-multidomain-cognitive-composition-training-v1.json experience/yado-multidomain-real-data-training-v1.json
          git add experience/yado-global-experience-cognitive-genesis-v6.json experience/yado-global-experience-cognitive-stress-v3.json
          git add candidates/kernel-self-generated/g2-unified-module-kernel-v1.json audits/yado-g2-post-module-full-integrity-v1.json audits/yado-g2-module-dependency-graph-v1.json
          git add "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git diff --cached --quiet || git commit -m "Develop G2 cognition from accumulated experience V4 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-cognitive-experience-consolidation-v4-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-cognitive-experience-consolidation-v4.json
            canonical/yado-g2-experience-conditioned-cognitive-layer-v4.json
            candidates/kernel-self-generated/g2-unified-module-kernel-v1.json
            audits/yado-g2-post-module-full-integrity-v1.json
          if-no-files-found: warn
