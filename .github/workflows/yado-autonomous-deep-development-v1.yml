name: YADO Autonomous Deep Development V1

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "successor/**"
      - "candidates/**"
      - "architecture/**"
      - "canonical/**"
      - "experience/**"
      - "receipts/**"
      - ".github/workflows/yado-autonomous-deep-development-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/**"
      - "successor/**"
      - "candidates/**"
      - "architecture/**"
      - "canonical/**"
      - "experience/**"
      - "receipts/**"
      - ".github/workflows/yado-autonomous-deep-development-v1.yml"

permissions:
  contents: read

concurrency:
  group: yado-autonomous-deep-development-v1
  cancel-in-progress: false

jobs:
  deep-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Let the kernel select the next development deficit
        run: |
          python -m py_compile runtime/yado_autonomous_deep_development_v1.py runtime/test_yado_autonomous_deep_development_v1.py
          PYTHONPATH=runtime python -m unittest runtime.test_yado_autonomous_deep_development_v1
          python runtime/yado_autonomous_deep_development_v1.py
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/yado-autonomous-deep-development-v1.json"))
          assert r["status"]=="PASS_SHADOW_AUTONOMOUS_DEEP_DEVELOPMENT_PLAN_V1",r
          assert len(r["development_sequence"])==7,r
          assert all(row["file_count"]>0 for row in r["layers"].values()),r
          assert r["boundaries"]["automatic_main_mutation"] is False,r
          print(r["selected_target"],r["selected_action"])
          PY

      - name: Baseline canonical and compilation gates
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Acquire fresh experience and verify effective native binding
        run: |
          python runtime/yado_bounded_autonomous_learning_v1.py --output-root "$RUNNER_TEMP/yado-fresh-learning"
          python runtime/yado_native_learning_cycle_v1.py \
            --experience-root "$RUNNER_TEMP/yado-fresh-learning" \
            --output audits/yado-native-learning-cycle-v1

      - name: Evolve logic thinking intelligence candidate
        run: |
          python runtime/yado_cognitive_tri_organ_evolution_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          receipt=json.loads(Path("candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json").read_text())
          assert receipt["status"]=="PASS_SHADOW_BOUNDED_TRI_ORGAN_COGNITIVE_EVOLUTION_V2",receipt
          assert min(receipt["selected_hidden"].values()) >= 0.80,receipt
          destination=Path("candidates/cognitive/yado_cognitive_tri_organ_policy_v3.py")
          source=(
              "from __future__ import annotations\n\n"
              f"COGNITIVE_POLICY = {receipt['selected_genome']!r}\n"
              f"VERIFIED_HIDDEN_SCORES = {receipt['selected_hidden']!r}\n"
              f"SOURCE_EVIDENCE = {{'schema':'yado.cognitive_tri_organ_evolution.v2','candidate_sha256':{receipt['candidate_sha256']!r}}}\n\n"
              "def component():\n"
              "    return {'schema':'yado.cognitive_tri_organ_policy.v3','policy':COGNITIVE_POLICY,'verified_hidden_scores':VERIFIED_HIDDEN_SCORES,'source_evidence':SOURCE_EVIDENCE,'canonical_active':False,'development_branch_active':True,'consciousness_claimed':False}\n"
          )
          compile(source,str(destination),"exec")
          destination.write_text(source,encoding="utf-8")
          print("PASS_COGNITIVE_SHADOW_MATERIALIZATION",destination)
          PY
          python -m compileall -q runtime successor candidates

      - name: Audit active kernel after isolated candidate probes
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          report=json.load(open("audits/yado-full-kernel-audit-v1-report.json"))
          assert report["status"]=="PASS",report
          assert report["findings"]==[],report
          assert report["canonical"]["canonical_guard"]=="PASS",report
          assert report["canonical"]["ledger_validation"]=="PASS",report
          assert report["canonical"]["g3_genesis_performed"] is False,report
          print("PASS_ACTIVE_KERNEL_WITH_UNADMITTED_SHADOW_CANDIDATES")
          PY

      - name: Build Successor identity and complete regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
          python - <<'PY'
          import json
          report=json.load(open("audits/yado-full-regression-v1-report.json"))
          assert report["status"]=="PASS",report
          assert report["tests_run"]==report["expected_tests"],report
          assert not report["failures"] and not report["errors"] and not report["skipped"],report
          assert report["source_unchanged"] is True,report
          print("PASS_DEEP_DEVELOPMENT_REGRESSION",report["tests_run"])
          PY

      - name: Run autonomous successor development and 20 endogenous cycles
        run: |
          python -m successor.active_run --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json" --output "$RUNNER_TEMP/yado-native-run"
          python -m successor.development_run --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json" --output "$RUNNER_TEMP/yado-development-run"
          cp "$RUNNER_TEMP/yado-native-run/kernel.sqlite" "$RUNNER_TEMP/yado-endogenous.sqlite"
          python -m successor.endogenous_run \
            --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json" \
            --state "$RUNNER_TEMP/yado-endogenous.sqlite" \
            --output "$RUNNER_TEMP/yado-endogenous-run.json" \
            --cycles 20 \
            --budget 3
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report=json.loads((Path(os.environ["RUNNER_TEMP"]) / "yado-endogenous-run.json").read_text())
          assert report["status"]=="PASS_BOUNDED_ENDOGENOUS_CONTINUATION_V1",report
          assert report["cycles_completed"]==20 and report["cycles_verified"]==20,report
          assert report["host_goal_count"]==0,report
          assert all(row["status"]=="VERIFIED" for row in report["results"]),report
          assert report["state_verification"]["status"]=="PASS",report
          assert report["consciousness_established"] is False,report
          print("PASS_AUTONOMOUS_DEEP_DEVELOPMENT_20_CYCLES")
          PY

      - name: Restore checkpoint and continue five state-derived cycles
        run: |
          python - <<'PY'
          """Host-authored checkpoint verifier; all goal choices stay in SuccessorKernel."""
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          import sqlite3
          import subprocess
          import sys

          from successor.kernel import SuccessorKernel

          root = Path(os.environ["RUNNER_TEMP"])
          checkpoint = root / "yado-continuation-checkpoint-v1"
          checkpoint.mkdir(exist_ok=False)
          receipt_path = checkpoint / "continuation-receipt.json"
          receipt = {
              "schema": "yado.stateful_restart_continuation.v1",
              "status": "WITHHOLD_CHECKPOINT_UNVERIFIED",
              "tested_commit": os.environ["GITHUB_SHA"],
              "source_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "source_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "transport_authorship": "ASSISTANT_AUTHORED_CHECKPOINT_VERIFIER",
              "goal_instance_authorship": "YADO_STATE_DERIVED",
              "goal_grammar_authorship": "ASSISTANT_AUTHORED_BOUNDED_GRAMMAR",
              "scope": "SAME_IDENTITY_FRESH_PROCESS_RESUME_WITHIN_THIS_JOB",
              "cross_workflow_state_restored": False,
              "runtime_decision_code_modified": False,
              "automatic_canonical_promotion": False,
              "consciousness_established": False,
          }
          receipt_path.write_text(json.dumps(receipt, indent=2) + "\n")
          manifest = root / "yado-successor-birth/manifest.json"
          initial = json.loads((root / "yado-endogenous-run.json").read_text())
          assert initial["status"] == "PASS_BOUNDED_ENDOGENOUS_CONTINUATION_V1"
          assert initial["cycles_completed"] == initial["cycles_verified"] == 20
          assert initial["host_goal_count"] == 0
          state = checkpoint / "kernel.sqlite"
          old = SuccessorKernel(manifest, root / "yado-endogenous.sqlite")
          try:
              before = old.verify_state()
              identity = old.identity
              prefix = [tuple(row) for row in old.db.execute("SELECT * FROM events ORDER BY tick")]
              old_goals = set(old.cognitive_snapshot()["goals"])
              assert before["status"] == "PASS" and before["tick"] > 0
              assert before == initial["state_verification"]
              with sqlite3.connect(state) as restored:
                  old.db.backup(restored)
          finally:
              old.close()
          restored = SuccessorKernel(manifest, state)
          try:
              assert restored.identity == identity
              assert restored.verify_state() == before
              assert [tuple(row) for row in restored.db.execute("SELECT * FROM events ORDER BY tick")] == prefix
          finally:
              restored.close()
          resumed_path = checkpoint / "resumed-five-cycles.json"
          subprocess.run([
              sys.executable, "-m", "successor.endogenous_run", "--manifest", str(manifest),
              "--state", str(state), "--output", str(resumed_path), "--cycles", "5", "--budget", "3",
          ], check=True, timeout=180)
          resumed = json.loads(resumed_path.read_text())
          assert resumed["status"] == "PASS_BOUNDED_ENDOGENOUS_CONTINUATION_V1"
          assert resumed["cycles_completed"] == resumed["cycles_verified"] == 5
          assert resumed["host_goal_count"] == 0
          new = SuccessorKernel(manifest, state)
          try:
              after = new.verify_state()
              events = [tuple(row) for row in new.db.execute("SELECT * FROM events ORDER BY tick")]
              assert new.identity == identity
              assert after["status"] == "PASS" and after["tick"] > before["tick"]
              assert after == resumed["state_verification"]
              assert events[:len(prefix)] == prefix
              goals = new.cognitive_snapshot()["goals"]
              assert all(str(row["goal_id"]) not in old_goals for row in resumed["results"])
              assert all(row["proposal_tick"] > before["tick"] for row in resumed["results"])
              assert all(row["status"] == goals[str(row["goal_id"])]["status"] == "VERIFIED" for row in resumed["results"])
              assert {row["spec_digest"] for row in initial["results"]}.isdisjoint(
                  row["spec_digest"] for row in resumed["results"]
              )
          finally:
              new.close()
          shutil.copytree(manifest.parent, checkpoint / "birth")
          shutil.copy2(root / "yado-endogenous-run.json", checkpoint / "initial-twenty-cycles.json")
          for relative in (
              "runtime/yado_bounded_autonomous_learning_v1.py",
              "runtime/yado_cognitive_tri_organ_policy_v3.py",
              "candidates/cognitive/yado_cognitive_tri_organ_policy_v3.py",
              "audits/yado-native-learning-cycle-v1/runtime_candidate.py",
              "audits/yado-native-learning-cycle-v1/receipt.json",
          ):
              destination = checkpoint / "source-overlay" / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(relative, destination)
          files = {str(p.relative_to(checkpoint)): hashlib.sha256(p.read_bytes()).hexdigest()
                   for p in sorted(checkpoint.rglob("*")) if p.is_file() and p != receipt_path}
          receipt.update({
              "status": "PASS_SHADOW_STATEFUL_RESTART_CONTINUATION_V1",
              "identity_digest": identity,
              "initial_cycles_verified": 20,
              "resumed_cycles_verified": 5,
              "total_cycles_verified": 25,
              "host_goal_count": 0,
              "state_restored_before_resume": True,
              "prior_events_preserved_exactly": True,
              "fresh_goal_instances_verified": True,
              "state_before": before,
              "state_after": after,
              "checkpoint_files_sha256": files,
          })
          receipt_path.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Final canonical immutability check
        run: |
          git diff --exit-code -- canonical architecture/evolution-ledger.json
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Upload deep-development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-autonomous-deep-development-v1
          path: |
            candidates/kernel-self-generated/yado-autonomous-deep-development-v1.json
            audits/yado-native-learning-cycle-v1/
            ${{ runner.temp }}/yado-fresh-learning/
            candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json
            candidates/cognitive/yado_cognitive_tri_organ_policy_v3.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log

      - name: Preserve stateful continuation checkpoint
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-continuation-checkpoint-v1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yado-continuation-checkpoint-v1/
          if-no-files-found: error
