name: YADO External Dev MultiGoal Campaign V1

on:
  workflow_dispatch:
  push:
    branches: [codex/yado-self-directed-dev-campaign-v1-20260916]
    paths:
      - '.github/workflows/yado-external-dev-multigoal-campaign-v1.yml'
      - 'runtime/yado_external_dev_multigoal_campaign_v1.py'
      - 'runtime/yado_unified_core_external_dev_multigoal_campaign_v1.py'
      - 'runtime/test_yado_external_dev_multigoal_campaign_v1.py'
      - 'architecture/yado-external-dev-multigoal-campaign-v1.json'

permissions:
  contents: write

concurrency:
  group: yado-external-dev-multigoal-campaign-v1
  cancel-in-progress: false

jobs:
  campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile campaign layers
        run: |
          python -m py_compile runtime/yado_external_dev_multigoal_campaign_v1.py
          python -m py_compile runtime/yado_unified_core_external_dev_multigoal_campaign_v1.py
      - name: Run focused campaign regression
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: python -m unittest runtime.test_yado_external_dev_multigoal_campaign_v1 -v
      - name: Run first three live self-directed goals
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from yado_unified_core_external_dev_multigoal_campaign_v1 import UnifiedYADOCoreExternalDevMultiGoalCampaignV1
          objective = 'Improve the reliability and continuity of YADO external developer self-development without naming a preferred tool'
          core = UnifiedYADOCoreExternalDevMultiGoalCampaignV1()
          out = core.external_dev_campaign_advance(objective, steps=3, timeout=25)
          assert out['goal_count'] == 3, out
          assert len(set(out['selected_capabilities'])) == 3, out
          state = core.external_dev_campaign_export_state()
          path = Path(os.environ['RUNNER_TEMP']) / 'yado-multigoal-state.json'
          path.write_text(json.dumps(state, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: Restart process and continue goals four and five
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from yado_unified_core_external_dev_multigoal_campaign_v1 import UnifiedYADOCoreExternalDevMultiGoalCampaignV1
          objective = 'Improve the reliability and continuity of YADO external developer self-development without naming a preferred tool'
          state_path = Path(os.environ['RUNNER_TEMP']) / 'yado-multigoal-state.json'
          state = json.loads(state_path.read_text(encoding='utf-8'))
          core = UnifiedYADOCoreExternalDevMultiGoalCampaignV1(campaign_state=state)
          out = core.external_dev_campaign_advance(objective, steps=2, timeout=25)
          receipt = core.external_dev_campaign_receipt()
          assert receipt['status'] == 'PASS_SHADOW_EXTERNAL_DEV_MULTIGOAL_CAMPAIGN_V1', receipt
          assert receipt['goal_count'] == 5
          assert receipt['distinct_capability_count'] == 5
          assert receipt['restart_count'] == 1
          assert receipt['unknown_withhold'] is True
          assert receipt['chain_verification']['status'] == 'PASS'
          assert receipt['third_party_code_executed'] is False
          assert receipt['credentials_used'] is False
          assert receipt['external_writes_to_third_parties'] is False
          assert receipt['automatic_main_mutation'] is False
          assert receipt['g3_genesis_performed'] is False
          dest = Path('candidates/autonomous/yado-external-dev-multigoal-campaign-v1.json')
          dest.write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          final_state = core.external_dev_campaign_export_state()
          (Path(os.environ['RUNNER_TEMP']) / 'yado-multigoal-final-state.json').write_text(json.dumps(final_state, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: Run full kernel audit before persistence
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Build fresh Successor identity for regression
        run: python -m successor build --output "$RUNNER_TEMP/yado-multigoal-successor-birth"
      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-multigoal-successor-birth/manifest.json"
      - name: Persist verified campaign receipt in shadow branch
        if: github.ref == 'refs/heads/codex/yado-self-directed-dev-campaign-v1-20260916'
        run: |
          git config user.name 'YADO External Dev MultiGoal Campaign'
          git config user.email 'actions@users.noreply.github.com'
          git add candidates/autonomous/yado-external-dev-multigoal-campaign-v1.json
          if git diff --cached --quiet; then
            echo 'No campaign receipt change to persist'
          else
            git commit -m 'YADO campaign: persist five-goal self-directed development proof [skip ci]'
            git push origin HEAD:codex/yado-self-directed-dev-campaign-v1-20260916
          fi
      - name: Preserve campaign evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-external-dev-multigoal-campaign-v1-${{ github.run_id }}
          if-no-files-found: error
          path: |
            candidates/autonomous/yado-external-dev-multigoal-campaign-v1.json
            ${{ runner.temp }}/yado-multigoal-state.json
            ${{ runner.temp }}/yado-multigoal-final-state.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
