name: YADO G2 Five Source Parent Admission Reassessment V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-five-source-parent-admission-reassessment-v1-request.json"
permissions:
  contents: write
jobs:
  reassess:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Reassess FRESH_FOUR_PAIR_KNN on recorded fresh transfer with ablation restore
        run: python runtime/yado_kernel_five_source_parent_admission_reassessment_v1.py
      - name: Persist reassessment
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_five_source_parent_admission_reassessment_v1_receipt.json "receipts/yado-kernel-five-source-parent-admission-reassessment-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Fresh Transfer Reassessment"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-five-source-parent-admission-reassessment-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/fresh-four-pair-knn-five-source-admission-v1.json "receipts/yado-kernel-five-source-parent-admission-reassessment-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 fresh-transfer parent reassessment V1 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce reassessment receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_five_source_parent_admission_reassessment_v1_receipt.json"))
          assert r["status"]=="PASS_PARENT_ADMISSION_REASSESSMENT_V1",r
          print(r["candidate_state"],r["fresh5_score"],r["fresh5_ablation"],r["history_candidate"],r["history_ablation"],r["next_required_capability"])
          PY
