name: YADO G2 Unified Execution Fabric V2 Fresh Gate
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-unified-execution-fabric-v2-fresh-gate-request.json"
permissions:
  contents: write
jobs:
  fresh-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile fabric V2
        run: python -m py_compile runtime/yado_g2_unified_execution_fabric_v2.py runtime/yado_g2_unified_execution_fabric_v2_fresh_gate.py
      - name: Run fresh live fabric V2 gate
        run: python runtime/yado_g2_unified_execution_fabric_v2_fresh_gate.py
      - name: Persist shadow evidence
        run: |
          git config user.name "YADO G2 Fabric V2 Gate"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-unified-execution-fabric-v2.json
          git diff --cached --quiet || git commit -m "Persist unified execution fabric V2 fresh evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-unified-execution-fabric-v2-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-unified-execution-fabric-v2.json
