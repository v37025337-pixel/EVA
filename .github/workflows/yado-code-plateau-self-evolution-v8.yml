name: YADO Code Plateau Self Evolution V8
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-code-plateau-self-evolution-v8-request.json]
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Evolve
        id: evolve
        continue-on-error: true
        run: python runtime/yado_code_plateau_self_evolution_v8.py
      - name: Persist
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_code_plateau_self_evolution_v8_receipt.json receipts/yado-code-plateau-self-evolution-v8-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Code Plateau Evolution V8'
          git config user.email 'actions@users.noreply.github.com'
          git add candidates/g2-self-evolution/canonical_split_recursive_program_repair_v10.py candidates/g2-self-evolution/canonical_split_recursive_program_repair_v10.json architecture/evolution-ledger.json architecture/yado-g2-lti-ceiling-state-v1.json receipts/yado-code-plateau-self-evolution-v8-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO code plateau self-evolution V8 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_code_plateau_self_evolution_v8_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_CODE_PLATEAU_SELF_EVOLUTION_V8':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
