name: YADO G2 Native Executable Evolution Controller Self Representation V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-executable-evolution-controller-self-representation-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-executable-evolution-controller-self-representation-v1
  cancel-in-progress: true
jobs:
  selfrep:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before self-representation
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile strict observer
        run: python -m py_compile runtime/yado_g2_native_executable_evolution_controller_self_representation_v1.py
      - name: Let YADO create executable controller self-representation
        id: selfrep
        continue-on-error: true
        run: python runtime/yado_g2_native_executable_evolution_controller_self_representation_v1.py
      - name: Canonical guard after self-representation
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist self-representation evidence
        if: always()
        run: |
          git config user.name "YADO Controller Self Representation"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-executable-evolution-controller-self-representation-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-executable-evolution-controller-self-representation-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO executable controller self-representation evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest self-representation verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-executable-evolution-controller-self-representation-v1.json")
          if not p.exists(): raise SystemExit("MISSING_EXECUTABLE_SELF_REPRESENTATION_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for key in ("external_coding_models_used","new_external_research_used","host_model_family_used",
                      "host_rule_used","host_target_function_selected","host_new_dimension_name_used",
                      "host_patch_used","host_source_template_used","controller_mutation"):
              assert c[key] is False,r
          assert r["canonical_mutation"] is False,r
          assert r["controller_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_EXECUTABLE_EVOLUTION_CONTROLLER_SELF_REPRESENTATION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["representation_visible_to_subsequent_evolution"] is True,r
          assert c["controller_source_unchanged"] is True,r
          print(r["status"],r["representation"]["program_id"],r["representation"]["program_type"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-native-executable-controller-self-representation-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-executable-evolution-controller-self-representation-v1.json
          if-no-files-found: warn
