name: YADO G2 External Resource Goal Binder V1

on:
  push:
    branches:
      - yado-architecture-shadow-search
    paths:
      - architecture/yado-external-resource-goal-binder-v1-request.json

permissions:
  contents: write

jobs:
  bind-goal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt

      - name: Canonical guard before goal binding
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Compile goal binder and discovery dependencies
        run: |
          python -m py_compile runtime/yado_native_integration_broker_v1.py
          python -m py_compile runtime/yado_native_integration_broker_v1_1.py
          python -m py_compile runtime/yado_native_openapi_discovery_integration_v2.py
          python -m py_compile runtime/yado_external_resource_goal_binder_v1.py

      - name: Execute ordinary external and local goals through binder
        run: python runtime/yado_external_resource_goal_binder_v1.py

      - name: Enforce strict goal-binding verdict
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('candidates/kernel-self-generated/g2-external-resource-goal-binder-v1.json')
          r=pathlib.Path('candidates/kernel-self-generated/g2-external-resource-goal-registry-v1.json')
          if not p.exists(): raise SystemExit('MISSING_GOAL_BINDER_REPORT')
          if not r.exists(): raise SystemExit('MISSING_GOAL_BINDER_REGISTRY')
          x=json.loads(p.read_text())
          g=json.loads(r.read_text())
          c=x['checks']
          assert x['status']=='PASS_SHADOW_G2_EXTERNAL_RESOURCE_GOAL_BINDER_V1', x
          assert all(c.values()), c
          assert x['cases']['external']['route']=='OPENAPI_DISCOVERY_INTEGRATION', x
          assert x['cases']['external']['discovery_invoked'] is True, x
          assert x['cases']['external']['result']['http_status'] >= 200 and x['cases']['external']['result']['http_status'] < 300, x
          assert x['cases']['external']['result']['json_parsed'] is True, x
          assert x['cases']['local']['route']=='LOCAL_ONLY', x
          assert x['cases']['local']['discovery_invoked'] is False, x
          assert x['cases']['local']['network_route_invoked'] is False, x
          assert x['cases']['local']['result']['result']=='LOCAL_ONLY_OK', x
          assert g['status']=='PASS_SHADOW', g
          assert g['capabilities'][0]['state']=='SHADOW_VERIFIED', g
          assert g['capabilities'][0]['canonical_active'] is False, g
          print(x['status'], x['cases']['external']['result']['api_id'], x['cases']['external']['result']['http_status'], x['cases']['local']['result']['result'])
          PY

      - name: Canonical guard after goal binding
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Persist goal-binding evidence
        if: always()
        run: |
          git config user.name "YADO External Resource Goal Binder"
          git config user.email "actions@users.noreply.github.com"
          for p in \
            candidates/kernel-self-generated/g2-external-resource-goal-binder-v1.json \
            candidates/kernel-self-generated/g2-external-resource-goal-registry-v1.json; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          git diff --cached --quiet || git commit -m "Persist external resource goal binding evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-external-resource-goal-binder-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-external-resource-goal-binder-v1.json
            candidates/kernel-self-generated/g2-external-resource-goal-registry-v1.json
          if-no-files-found: warn
