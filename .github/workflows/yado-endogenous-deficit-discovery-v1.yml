name: YADO Endogenous Fresh Deficit Discovery V1

on:
  push:
    branches: [yado-endogenous-goal-genesis-v1]
    paths:
      - 'runtime/yado_endogenous_deficit_discovery_v1.py'
      - '.github/workflows/yado-endogenous-deficit-discovery-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover-fresh-deficit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Pin clean canonical baseline
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime/yado_unified_core_deep_self_audit_v1_receipt.json').read_text())
          s=r['summary']
          assert r['status']=='PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1',r
          assert s['finding_count']==s['pass_findings']==21,s
          assert s['blocking_findings']==s['critical_failures']==s['high_failures']==s['partial_findings']==0,s
          assert r['self_selected_next_step'] is None,r['self_selected_next_step']
          assert r['self_selected_priority']==[],r['self_selected_priority']
          print('PASS_CLEAN_BASELINE_21_OF_21_NO_SELECTED_DEFICIT')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile discovery substrate
        run: python -m py_compile runtime/yado_endogenous_deficit_discovery_v1.py

      - name: Discover twice from identical evidence and require determinism
        run: |
          python runtime/yado_endogenous_deficit_discovery_v1.py --out "$RUNNER_TEMP/discovery-a.json"
          python runtime/yado_endogenous_deficit_discovery_v1.py --out "$RUNNER_TEMP/discovery-b.json"
          cmp "$RUNNER_TEMP/discovery-a.json" "$RUNNER_TEMP/discovery-b.json"

      - name: Verify fresh endogenous deficit contract
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/discovery-a.json').read_text())
          audit=json.loads(Path('runtime/yado_unified_core_deep_self_audit_v1_receipt.json').read_text())
          known={str(x.get('code')) for x in audit['findings'] if isinstance(x,dict)}
          opened=set((((audit.get('core_snapshot') or {}).get('frontier') or {}).get('open_deficits') or []))
          d=r['discovered_deficit']; p=r['probe']; g=r['proposed_goal']
          assert r['status']=='PASS_SHADOW_ENDOGENOUS_FRESH_DEFICIT_DISCOVERY_V1',r
          assert r['trigger']['deep_audit_clean_21_of_21'] is True
          assert r['trigger']['preexisting_self_selected_next_step'] is None
          assert p['host_bounded_probe_domain'] is True
          assert p['host_supplied_goal'] is False
          assert p['host_selected_deficit'] is False
          assert p['identity_control_mismatches']==0,p
          assert p['cross_label_mismatches']>0,p
          assert p['cross_label_mismatch_rate']>p['same_label_mismatch_rate'],p
          assert p['causal_cross_vs_same_delta']>0,p
          assert d['fresh_counterexample_count']>0,d
          assert d['deficit_id'] not in known,d
          assert d['deficit_id'] not in opened,d
          assert d['was_present_in_fixed_audit_codes'] is False
          assert d['was_present_in_canonical_open_deficits'] is False
          assert g['host_supplied'] is False
          assert g['selected_from_fixed_checklist'] is False
          assert r['canonical_mutation'] is False and r['architecture_mutation'] is False
          assert r['execution_contract']['canonical_direct_write'] is False
          assert r['execution_contract']['automatic_main_mutation'] is False
          assert r['g3_genesis_performed'] is False
          assert r['consciousness_claimed'] is False
          assert r['next_required_capability']=='BIND_ENDOGENOUS_FRESH_DEFICIT_TO_BOUNDED_REPAIR_EXPERIMENT_V1'
          print(json.dumps({
            'deficit_id':d['deficit_id'],
            'fresh_counterexamples':d['fresh_counterexample_count'],
            'same_rate':p['same_label_mismatch_rate'],
            'cross_rate':p['cross_label_mismatch_rate'],
            'causal_delta':p['causal_cross_vs_same_delta'],
            'next':r['next_required_capability'],
          },sort_keys=True))
          PY

      - name: Install audit and Successor dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile checkout
        run: python -m compileall -q runtime successor candidates/g2-self-evolution candidates/autonomous

      - name: Prove active canonical identity unchanged
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          git diff --exit-code origin/main HEAD -- canonical architecture/evolution-ledger.json runtime/yado_unified_core_v1.py
          echo PASS_DISCOVERY_ONLY_NO_ACTIVE_CANONICAL_MUTATION

      - name: Full Kernel Audit on discovery shadow
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          assert r['canonical']['ledger_validation']=='PASS'
          assert r['canonical']['g3_genesis_performed'] is False
          print('PASS_DISCOVERY_SHADOW_FULL_KERNEL_AUDIT',r['counts'])
          PY

      - name: Fresh Successor and exact 170 regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/yado-endogenous-deficit-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-endogenous-deficit-successor/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==170,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_ENDOGENOUS_DISCOVERY_REGRESSION_170_OF_170',r['identity_digest'])
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-endogenous-deficit-discovery-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/discovery-a.json
