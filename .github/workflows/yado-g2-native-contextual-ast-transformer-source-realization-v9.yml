name: YADO G2 Contextual AST Transformer Source Realization V9
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-contextual-ast-transformer-source-realization-v9-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-contextual-ast-transformer-source-realization-v9
  cancel-in-progress: true
jobs:
  realize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V9
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V9
        run: python -m py_compile runtime/yado_g2_native_contextual_ast_transformer_source_realization_v9.py
      - name: Run contextual AST transformer source realization V9
        id: realize
        continue-on-error: true
        run: python runtime/yado_g2_native_contextual_ast_transformer_source_realization_v9.py
      - name: Canonical guard after V9
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V9 evidence
        if: always()
        run: |
          git config user.name "YADO Contextual AST Source Realization"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-transformer-source-realization-v9.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-transformer-source-realization-v9.json
          fi
          if [ -f candidates/g2-self-evolution/yado_native_contextual_ast_transformer_v9.py ]; then
            git add candidates/g2-self-evolution/yado_native_contextual_ast_transformer_v9.py
          fi
          git diff --cached --quiet || git commit -m "Persist YADO contextual AST source realization V9 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V9 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-contextual-ast-transformer-source-realization-v9.json")
          if not p.exists(): raise SystemExit("MISSING_CONTEXTUAL_AST_SOURCE_V9")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_authored_ast_subtree","host_authored_condition_expression","host_authored_patch",
                    "host_source_template_used","external_models_used","automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_CONTEXTUAL_AST_TRANSFORMER_SOURCE_REALIZATION_V9":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["new_target_bound_source_candidate_created"] is True,r
          assert c["candidate_source_compiles"] is True,r
          assert c["isolated_real_evidence_probe_pass"] is True,r
          print(r["status"],r["selected_source_candidate"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-contextual-ast-transformer-source-v9-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-contextual-ast-transformer-source-realization-v9.json
            candidates/g2-self-evolution/yado_native_contextual_ast_transformer_v9.py
          if-no-files-found: warn
