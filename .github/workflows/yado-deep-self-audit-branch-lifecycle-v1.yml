name: YADO Deep Self Audit Branch Lifecycle V1

on:
  push:
    branches: [yado-deep-self-audit-branch-lifecycle-20260918]
    paths:
      - "runtime/yado_branch_lifecycle_audit_v1.py"
      - "architecture/yado-deep-self-audit-branch-lifecycle-request-20260918.json"
      - ".github/workflows/yado-deep-self-audit-branch-lifecycle-v1.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/yado_branch_lifecycle_audit_v1.py"
      - "architecture/yado-deep-self-audit-branch-lifecycle-request-20260918.json"
      - ".github/workflows/yado-deep-self-audit-branch-lifecycle-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yado-deep-self-audit-branch-lifecycle-v1-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  deep-self-audit-branch-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      YADO_AUDIT_BRANCH: yado-deep-self-audit-branch-lifecycle-20260918

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fetch every remote branch
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          git branch -r

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Refresh current remote inventory for self-audit
        run: |
          python -m py_compile runtime/yado_g2_remote_branch_inventory_reconcile_v1.py
          python runtime/yado_g2_remote_branch_inventory_reconcile_v1.py

      - name: Audit lifecycle of every remote branch
        run: |
          python -m py_compile runtime/yado_branch_lifecycle_audit_v1.py
          python runtime/yado_branch_lifecycle_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("canonical/yado-branch-lifecycle-v1.json").read_text())
          assert d["status"]=="PASS_COMPLETE_BRANCH_LIFECYCLE_AUDIT", d
          assert d["coverage_complete"] is True, d
          assert not d["withheld_refs"], d["withheld_refs"]
          assert d["remote_branch_count"] == len(d["rows"]), d
          print(json.dumps({
              "remote": d["remote_branch_count"],
              "classes": d["classification_counts"],
              "active_candidates": d["admission_candidates"],
              "memory": len(d["memory_refs"]),
              "history": len(d["history_refs"]),
          }, sort_keys=True))
          PY

      - name: Run deepest unified-core self audit
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python runtime/yado_unified_core_deep_self_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/yado_unified_core_deep_self_audit_v1_receipt.json").read_text())
          assert d["status"]=="PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1", d
          assert d["summary"]["blocking_findings"]==0, d["summary"]
          assert d["summary"]["critical_failures"]==0, d["summary"]
          assert d["summary"]["high_failures"]==0, d["summary"]
          assert d["g3_genesis_performed"] is False
          print(json.dumps({"status":d["status"],"summary":d["summary"],"next":d["self_selected_next_step"]},sort_keys=True))
          PY

      - name: Full kernel audit
        run: |
          rm -f audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md audits/yado-full-regression-v1-report.json audits/yado-full-regression-v1-report.log
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-kernel-audit-v1-report.json"))
          assert d["status"]=="PASS", d
          assert d["findings"]==[], d["findings"]
          assert d["canonical"]["canonical_guard"]=="PASS"
          assert d["canonical"]["ledger_validation"]=="PASS"
          PY

      - name: Fresh Successor build and complete regression
        run: |
          rm -rf "$RUNNER_TEMP/yado-successor-branch-lifecycle-v1"
          python -m successor build --output "$RUNNER_TEMP/yado-successor-branch-lifecycle-v1"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-branch-lifecycle-v1/manifest.json"
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-regression-v1-report.json"))
          assert d["status"].startswith("PASS"), d
          assert d["tests_run"]==d["expected_tests"], d
          assert not d["failures"] and not d["errors"] and not d["skipped"], d
          assert d["source_unchanged"] is True, d
          print("PASS_COMPLETE_REGRESSION",d["tests_run"])
          PY

      - name: Start next bounded development cycle
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python -m py_compile runtime/yado_autonomous_deep_development_v1.py runtime/test_yado_autonomous_deep_development_v1.py
          python -m unittest runtime.test_yado_autonomous_deep_development_v1 -v
          python runtime/yado_autonomous_deep_development_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("candidates/kernel-self-generated/yado-autonomous-deep-development-v1.json").read_text())
          assert d["status"]=="PASS_SHADOW_AUTONOMOUS_DEEP_DEVELOPMENT_PLAN_V1", d
          assert d["boundaries"]["automatic_main_mutation"] is False, d
          print(json.dumps({
              "status":d["status"],
              "selected_target":d["selected_target"],
              "selected_action":d["selected_action"],
              "development_sequence":d["development_sequence"],
          },sort_keys=True))
          PY

      - name: Persist deterministic canonical lifecycle artifacts
        if: github.event_name == 'push'
        run: |
          git checkout -- canonical/yado-remote-branch-inventory-v1.json || true
          git config user.name "YADO Branch Lifecycle Audit"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-branch-lifecycle-v1.json experience/branch-lifecycle/yado-branch-memory-index-v1.json
          if git diff --cached --quiet; then
            echo "No deterministic lifecycle changes to persist"
          else
            git commit -m "YADO: persist audited branch lifecycle and memory index [skip ci]"
            git push origin HEAD:${YADO_AUDIT_BRANCH}
          fi

      - name: Preserve full audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-deep-self-audit-branch-lifecycle-v1-${{ github.run_id }}
          path: |
            canonical/yado-branch-lifecycle-v1.json
            experience/branch-lifecycle/yado-branch-memory-index-v1.json
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            candidates/kernel-self-generated/yado-autonomous-deep-development-v1.json
          if-no-files-found: warn
