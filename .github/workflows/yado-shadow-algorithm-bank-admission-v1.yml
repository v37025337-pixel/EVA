name: YADO Shadow Algorithm Bank Admission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_shadow_algorithm_bank_admission_v1.py"
      - ".github/workflows/yado-shadow-algorithm-bank-admission-v1.yml"
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Admit G0-authorized algorithm to shadow bank
        run: python runtime/yado_shadow_algorithm_bank_admission_v1.py
      - name: Upload receipt and entry
        uses: actions/upload-artifact@v4
        with:
          name: yado-shadow-algorithm-bank-admission-v1
          path: |
            runtime/yado_shadow_algorithm_bank_admission_v1_receipt.json
            candidates/shadow-algorithm-bank/conjunctive-rule-inducer-v1.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_shadow_algorithm_bank_admission_v1_receipt.json receipts/yado-shadow-algorithm-bank-admission-v1-latest.json
          git config user.name "YADO Shadow Bank Admission"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-shadow-algorithm-bank-admission-v1-latest.json candidates/shadow-algorithm-bank/conjunctive-rule-inducer-v1.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist G0-authorized shadow algorithm admission [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
