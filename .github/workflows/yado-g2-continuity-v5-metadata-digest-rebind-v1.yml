name: YADO G2 Continuity V5 Metadata Digest Rebind V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-continuity-v5-metadata-digest-rebind-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-continuity-v5-metadata-digest-rebind-v1
  cancel-in-progress: true
jobs:
  rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before metadata rebind
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile metadata rebind
        run: python -m py_compile runtime/yado_g2_continuity_v5_metadata_digest_rebind_v1.py
      - name: Rebind V5 continuity canonical component digest
        run: python runtime/yado_g2_continuity_v5_metadata_digest_rebind_v1.py
      - name: Canonical guard after metadata rebind
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce metadata rebind verdict
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("runtime/yado_g2_continuity_v5_metadata_digest_rebind_v1_receipt.json").read_text())
          assert r["status"]=="PASS_G2_CONTINUITY_V5_METADATA_DIGEST_REBIND_V1",r
          assert r["architecture_mutation"] is False,r
          assert r["generation_transition"] is False,r
          assert r["g3_genesis_performed"] is False,r
          print(r["status"],r["canonical_component_digest"],r["receipt_sha256"])
          PY
      - name: Persist metadata rebind
        run: |
          git config user.name "YADO Continuity Metadata Rebind"
          git config user.email "actions@users.noreply.github.com"
          git add             canonical/yado-main-head-g2.json             canonical/yado-unified-core-v1.json             canonical/yado-algorithm-provenance-registry-v1.json             architecture/evolution-ledger.json             runtime/yado_g2_continuity_v5_metadata_digest_rebind_v1_receipt.json
          git add receipts/yado-g2-continuity-v5-metadata-digest-rebind-v1-run-*.json
          git diff --cached --quiet || git commit -m "Rebind YADO V5 continuity metadata digest [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
