name: YADO G2 Global Experience Cognitive Stress V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-global-experience-cognitive-stress-v1-request.json"]
permissions: {contents: write}
jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_global_experience_cognitive_stress_v1.py
      - name: Stress frozen global-experience genome
        continue-on-error: true
        run: python runtime/yado_g2_global_experience_cognitive_stress_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist stress evidence
        if: always()
        run: |
          git config user.name "YADO Global Experience Cognitive Stress V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-global-experience-cognitive-stress-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-global-experience-cognitive-stress-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO global experience cognitive stress V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce stress verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-global-experience-cognitive-stress-v1.json").read_text())
          if r["status"]!="PASS_SHADOW_G2_GLOBAL_EXPERIENCE_COGNITIVE_STRESS_V1":raise SystemExit("STRESS_WITHHOLD:"+r["next_required_capability"])
          assert r["checks"]["logic_ablation_positive"] and r["checks"]["thinking_ablation_positive"] and r["checks"]["intelligence_ablation_positive"],r
          assert r["checks"]["organ_only_material"] and r["checks"]["context_only_below_full"],r
          assert r["checks"]["post_corpus_accuracy_ge_0_66"] and r["checks"]["canonical_unchanged"],r
          print(r["status"],r["base_accuracy"],r["individual_organ_ablations"],r["organ_only_accuracy"],r["post_corpus_accuracy"])
          PY
