name: YADO G2 Fresh Real Data Cognitive Transfer V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-fresh-real-data-cognitive-transfer-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-fresh-real-data-cognitive-transfer-v1
  cancel-in-progress: false
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Pre-load canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile real-data transfer harness
        run: python -m py_compile runtime/yado_g2_fresh_real_data_cognitive_transfer_v1.py
      - name: Execute fresh real-data cognitive transfer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python runtime/yado_g2_fresh_real_data_cognitive_transfer_v1.py
      - name: Enforce real-data transfer gates
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.load(open("runtime/yado_g2_fresh_real_data_cognitive_transfer_v1_receipt.json"))
          assert r["status"]=="PASS_WITH_LIMITATIONS_SHADOW_G2_FRESH_REAL_DATA_COGNITIVE_TRANSFER_V1",r
          assert all(r["checks"].values()),r
          assert r["frozen_usgs_portability"]["raw_portability_status"].startswith("WITHHOLD_RAW_PORTABILITY"),r
          assert r["portable_usgs_shadow_repair"]["newer_blind_balanced"]>=0.90,r
          assert r["github_temporal_transfer"]["accuracy"]>=0.95,r
          assert pathlib.Path("candidates/kernel-self-generated/g2-portable-usgs-real-data-specialist-repair-v1.json").exists()
          assert r["canonical_mutation"] is False and r["promotion_applied"] is False and r["g3_genesis_performed"] is False,r
          print(r["status"],r["portable_usgs_shadow_repair"],r["github_temporal_transfer"])
          PY
      - name: Re-run cognitive continuity regression
        run: python -m pytest -q tests/test_g2_continuity_file_integrity.py
      - name: Post-transfer deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Require nonblocking deep self-audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert d["status"]=="PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1",d
          assert d["summary"]["blocking_findings"]==0,d
          assert d["summary"]["critical_failures"]==0,d
          print(d["overall_verdict"],d["summary"])
          PY
      - name: Post-transfer canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist real-data transfer evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_fresh_real_data_cognitive_transfer_v1_receipt.json "receipts/yado-g2-fresh-real-data-cognitive-transfer-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Real Data Transfer"
          git config user.email "actions@users.noreply.github.com"
          git add "receipts/yado-g2-fresh-real-data-cognitive-transfer-v1-run-${GITHUB_RUN_ID}.json"
          git add candidates/kernel-self-generated/g2-portable-usgs-real-data-specialist-repair-v1.json
          git diff --cached --quiet || git commit -m "Persist fresh real-data cognitive transfer evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git clean -f runtime/yado_g2_fresh_real_data_cognitive_transfer_v1_receipt.json runtime/yado_unified_core_deep_self_audit_v1_receipt.json
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
