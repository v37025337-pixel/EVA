name: YADO Logic Plateau Canonical Integration V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-logic-plateau-canonical-integration-v1-request.json]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate
        id: integrate
        continue-on-error: true
        run: python runtime/yado_logic_plateau_canonical_integration_v1.py
      - name: Persist
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_logic_plateau_canonical_integration_v1_receipt.json receipts/yado-logic-plateau-canonical-integration-v1-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Logic Plateau Integration'
          git config user.email 'actions@users.noreply.github.com'
          git add runtime/yado_budget_adaptive_compositional_logic_v2.py runtime/yado_unified_core_v1.py canonical/yado-unified-core-v1.json canonical/yado-main-head-g2.json architecture/yado-g2-lti-ceiling-state-v1.json architecture/evolution-ledger.json receipts/yado-logic-plateau-canonical-integration-v1-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO logic plateau canonical integration V1 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_logic_plateau_canonical_integration_v1_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_LOGIC_PLATEAU_CANONICAL_INTEGRATION_V1': raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
