name: YADO meta-autoevolution source probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-meta-autoevolution-source-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Print meta-autoevolution public API source
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ['yado_core_v3_0_rc3_autoevolution.py','yado_core_v3_0_rc4_meta_autoevolution.py']:
              p=Path(name); txt=p.read_text(); tree=ast.parse(txt)
              print("\n====",name,"====")
              for n in tree.body:
                  if isinstance(n,ast.ClassDef):
                      print("\nCLASS",n.name)
                      for m in n.body:
                          if isinstance(m,ast.FunctionDef):
                              print(" ",m.name,[a.arg for a in m.args.args])
                  elif isinstance(n,ast.FunctionDef):
                      print("FUNC",n.name,[a.arg for a in n.args.args])
          PY
