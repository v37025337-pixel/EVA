name: YADO Code Plateau Fresh Admission V9
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-code-plateau-fresh-admission-v9-request.json]
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit
        id: admit
        continue-on-error: true
        run: python runtime/yado_code_plateau_fresh_admission_v9.py
      - name: Persist
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_code_plateau_fresh_admission_v9_receipt.json receipts/yado-code-plateau-fresh-admission-v9-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Code Plateau Admission V9'
          git config user.email 'actions@users.noreply.github.com'
          git add architecture/evolution-ledger.json receipts/yado-code-plateau-fresh-admission-v9-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO code plateau fresh admission V9 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_code_plateau_fresh_admission_v9_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_CODE_PLATEAU_FRESH_ADMISSION_V9':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
