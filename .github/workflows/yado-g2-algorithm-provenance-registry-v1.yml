name: YADO G2 Algorithm Provenance Registry V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-algorithm-provenance-registry-v1-request.json"
permissions:
  contents: write
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Build and bind canonical algorithm provenance registry
        run: python runtime/yado_g2_algorithm_provenance_registry_v1.py
      - name: Persist registry and receipt
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_algorithm_provenance_registry_v1_receipt.json "receipts/yado-g2-algorithm-provenance-registry-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Provenance Registry"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-algorithm-provenance-registry-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json architecture/evolution-ledger.json "receipts/yado-g2-algorithm-provenance-registry-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Bind canonical G2 algorithm provenance registry [skip ci]"
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce provenance receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_algorithm_provenance_registry_v1_receipt.json"))
          assert r["status"]=="PASS_G2_ALGORITHM_PROVENANCE_REGISTRY_V1",r
          assert all(r["checks"].values()),r
          print(r["current_execution_label"],r["frontier"])
          PY
