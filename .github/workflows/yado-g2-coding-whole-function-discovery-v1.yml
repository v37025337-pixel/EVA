name: YADO G2 Whole Function Discovery V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-coding-whole-function-discovery-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-whole-function-discovery-v1
  cancel-in-progress: true
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before discovery
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile discovery
        run: python -m py_compile runtime/yado_g2_coding_whole_function_discovery_v1.py
      - name: Discover bounded whole functions
        continue-on-error: true
        run: python runtime/yado_g2_coding_whole_function_discovery_v1.py
      - name: Canonical guard after discovery
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist discovery evidence
        if: always()
        run: |
          git config user.name "YADO Whole Function Discovery V1"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-coding-whole-function-discovery-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO whole-function discovery V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce discovery evidence
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-coding-whole-function-discovery-v1.json")
          if not p.exists():raise SystemExit("MISSING_DISCOVERY_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_DISCOVERY":
              raise SystemExit("DISCOVERY_WITHHOLD:"+r["status"])
          assert r["candidate_count"]>0,r
          print(r["status"],r["candidate_count"],r["source_file_count"],r["branched_candidate_count"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-whole-function-discovery-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-coding-whole-function-discovery-v1.json
          if-no-files-found: warn
