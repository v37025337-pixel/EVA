name: YADO G2 Native Code Writer V1

on:
  push:
    branches:
      - yado-architecture-shadow-search
    paths:
      - architecture/yado-native-code-writer-v1-request.json

permissions:
  contents: write

jobs:
  write-code:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt

      - name: Canonical guard before code writer
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Compile code writer
        run: python -m py_compile runtime/yado_native_code_writer_v1.py

      - name: Let YADO materialize fresh candidate source
        run: python runtime/yado_native_code_writer_v1.py

      - name: Compile generated candidate
        run: python -m py_compile candidates/kernel-self-generated/yado_native_public_link_traversal_v1.py

      - name: Enforce strict writer verdict
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('candidates/kernel-self-generated/g2-native-code-writer-v1.json')
          if not p.exists():
              raise SystemExit('MISSING_NATIVE_CODE_WRITER_REPORT')
          r=json.loads(p.read_text())
          c=r['checks']
          assert r['status']=='PASS_SHADOW_G2_NATIVE_CODE_WRITER_V1', r
          assert r['candidate_source_produced_by_yado'] is True, r
          assert r['candidate_source_sha256'], r
          assert c['candidate_source_compiles'] is True, r
          assert c['static_safety_gate_pass'] is True, r
          assert c['fresh_tests_pass'] is True, r
          assert c['host_source_seed_used'] is False, r
          assert c['external_coding_models_used'] is False, r
          assert c['canonical_unchanged'] is True, r
          print(r['status'], r['candidate_source_sha256'])
          PY

      - name: Canonical guard after code writer
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Persist shadow writer evidence
        if: always()
        run: |
          git config user.name "YADO Native Code Writer"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-code-writer-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-code-writer-v1.json
          fi
          if [ -f candidates/kernel-self-generated/yado_native_public_link_traversal_v1.py ]; then
            git add candidates/kernel-self-generated/yado_native_public_link_traversal_v1.py
          fi
          git diff --cached --quiet || git commit -m "Persist native code writer evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-code-writer-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-code-writer-v1.json
            candidates/kernel-self-generated/yado_native_public_link_traversal_v1.py
          if-no-files-found: warn
