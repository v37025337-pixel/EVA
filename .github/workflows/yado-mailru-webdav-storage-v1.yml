name: YADO MailRu WebDAV Storage V1

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - 'runtime/yado_mailru_webdav_store_v1.py'
      - 'runtime/test_yado_mailru_webdav_store_v1.py'
      - 'architecture/yado-mailru-webdav-storage-v1.json'
      - '.github/workflows/yado-mailru-webdav-storage-v1.yml'

permissions:
  contents: read

jobs:
  validate-storage-layer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      YADO_MAILRU_USER: ${{ secrets.YADO_MAILRU_USER }}
      YADO_MAILRU_APP_PASSWORD: ${{ secrets.YADO_MAILRU_APP_PASSWORD }}
      YADO_MAILRU_ROOT: /YADO
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile and test Mail.ru WebDAV adapter
        run: |
          python -m py_compile runtime/yado_mailru_webdav_store_v1.py runtime/test_yado_mailru_webdav_store_v1.py
          PYTHONPATH=runtime python -m unittest runtime/test_yado_mailru_webdav_store_v1.py
          PYTHONPATH=runtime python runtime/yado_mailru_webdav_store_v1.py --status
      - name: Validate canonical invariants before optional external write
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Optional live Mail.ru Cloud write probe
        run: |
          if [ -n "$YADO_MAILRU_USER" ] && [ -n "$YADO_MAILRU_APP_PASSWORD" ]; then
            PYTHONPATH=runtime python runtime/yado_mailru_webdav_store_v1.py \
              --upload architecture/yado-mailru-webdav-storage-v1.json \
              --remote "/YADO/probes/yado-mailru-webdav-storage-v1-${GITHUB_RUN_ID}.json"
            echo "PASS_LIVE_MAILRU_WEBDAV_WRITE_V1"
          else
            echo "SKIP_LIVE_MAILRU_WEBDAV_WRITE_NO_PROTECTED_CREDENTIALS"
          fi
      - name: Compile all Python layers
        run: python -m compileall -q runtime successor candidates
      - name: Full kernel audit
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          print('PASS_MAILRU_STORAGE_POST_INTEGRATION_KERNEL_AUDIT')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-mailru-webdav-storage-v1-${{ github.run_id }}
          path: |
            architecture/yado-mailru-webdav-storage-v1.json
            audits/yado-full-kernel-audit-v1-report.json
