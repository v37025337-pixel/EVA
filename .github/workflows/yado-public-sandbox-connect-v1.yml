name: YADO Public Sandbox Connect V1

on:
  workflow_dispatch:
  push:
    branches:
      - yado-deep-development-20260914
    paths:
      - runtime/yado_public_sandbox_connect_v1.py
      - runtime/test_yado_public_sandbox_connect_v1.py
      - architecture/yado-public-sandbox-connect-v1.json
      - .github/workflows/yado-public-sandbox-connect-v1.yml

permissions:
  contents: read

jobs:
  connect-and-execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile and unit-test sandbox adapter
        run: |
          python -m py_compile runtime/yado_public_sandbox_connect_v1.py runtime/test_yado_public_sandbox_connect_v1.py
          PYTHONPATH=runtime python -m unittest runtime/test_yado_public_sandbox_connect_v1.py
      - name: Canonical invariant guard before external execution
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Real public sandbox discovery and execution
        run: |
          mkdir -p reports
          set -o pipefail
          PYTHONPATH=runtime python runtime/yado_public_sandbox_connect_v1.py --provider auto | tee reports/yado-public-sandbox-connect-v1.json
          python - <<'PY'
          import json
          r=json.load(open('reports/yado-public-sandbox-connect-v1.json'))
          assert r['status']=='PASS_REAL_EXTERNAL_CODE_EXECUTION', r
          assert r['selected_provider'] in {'judge0','runlet'}, r
          assert r['credentials_used'] is False, r
          assert any(x['executed'] for x in r['results']), r
          print('PASS_YADO_REAL_PUBLIC_SANDBOX_EXECUTION_V1', r['selected_provider'])
          PY
      - name: Independent Runlet execution probe
        run: |
          set -o pipefail
          PYTHONPATH=runtime python runtime/yado_public_sandbox_connect_v1.py --provider runlet | tee reports/yado-public-sandbox-runlet-v1.json
          python - <<'PY'
          import json
          r=json.load(open('reports/yado-public-sandbox-runlet-v1.json'))
          x=r['results'][0]
          assert x['provider']=='runlet', r
          assert x['connected'] is True, r
          assert x['executed'] is True, r
          assert x['status']=='PASS_PUBLIC_SANDBOX_EXECUTION', r
          assert 'YADO_SANDBOX_OK 140' in x['stdout'], r
          print('PASS_YADO_REAL_RUNLET_EXECUTION_V1')
          PY
      - name: Compile all Python layers
        run: python -m compileall -q runtime successor candidates
      - name: Full kernel audit after external execution
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS', r
          assert r['findings']==[], r['findings']
          assert r['canonical']['canonical_guard']=='PASS', r
          print('PASS_PUBLIC_SANDBOX_POST_EXECUTION_KERNEL_AUDIT')
          PY
      - name: Preserve evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-public-sandbox-connect-v1-${{ github.run_id }}
          path: |
            architecture/yado-public-sandbox-connect-v1.json
            reports/yado-public-sandbox-connect-v1.json
            reports/yado-public-sandbox-runlet-v1.json
            audits/yado-full-kernel-audit-v1-report.json
