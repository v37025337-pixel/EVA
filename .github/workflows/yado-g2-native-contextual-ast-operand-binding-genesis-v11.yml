name: YADO G2 Contextual AST Operand Binding Genesis V11
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-contextual-ast-operand-binding-genesis-v11-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-contextual-ast-operand-binding-genesis-v11
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V11
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V11
        run: python -m py_compile runtime/yado_g2_native_contextual_ast_operand_binding_genesis_v11.py
      - name: Run contextual AST operand binding genesis V11
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_native_contextual_ast_operand_binding_genesis_v11.py
      - name: Canonical guard after V11
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V11 evidence
        if: always()
        run: |
          git config user.name "YADO AST Operand Binding"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-genesis-v11.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-genesis-v11.json
          fi
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-gene-v11.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-gene-v11.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO AST operand binding V11 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V11 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-genesis-v11.json")
          if not p.exists(): raise SystemExit("MISSING_AST_OPERAND_BINDING_V11")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_authored_operand_ast","host_authored_test_expression",
                    "host_selected_role_mapping","external_models_used",
                    "automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_CONTEXTUAL_AST_OPERAND_BINDING_GENESIS_V11":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          g=r["gene"]
          assert g and g["field_role_mapping"]=={
            "test":"EVIDENCE_ACCEPTANCE_PREDICATE",
            "body":"HISTORY_RESOLVED_STATUS",
            "orelse":"PARENT_STATUS"
          },r
          assert g["actual_target_ast_materialization_proven"] is False,r
          assert g["python_source_emission_proven"] is False,r
          print(r["status"],g["gene_id"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-contextual-ast-operand-binding-v11-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-genesis-v11.json
            candidates/kernel-self-generated/g2-native-contextual-ast-operand-binding-gene-v11.json
          if-no-files-found: warn
