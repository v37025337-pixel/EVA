name: YADO Thinking Boundary Adaptive Repair V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - yado-thinking-boundary-adaptive-repair-v1
    paths:
      - 'runtime/yado_thinking_boundary_adaptive_repair_v1.py'
      - 'runtime/yado_cross_disciplinary_internet_learning_v1.py'
      - 'architecture/yado-thinking-boundary-adaptive-repair-v1.json'
      - 'architecture/yado-cross-disciplinary-internet-learning-v1.json'
      - 'architecture/developmental-self-model-overlay.json'
      - '.github/workflows/yado-thinking-boundary-adaptive-repair-v1.yml'

permissions:
  contents: read

jobs:
  adaptive-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile learning and adaptive repair runtimes
        run: |
          python -m py_compile runtime/yado_cross_disciplinary_internet_learning_v1.py
          python -m py_compile runtime/yado_thinking_boundary_adaptive_repair_v1.py

      - name: Run adaptive repair self-test
        run: python runtime/yado_thinking_boundary_adaptive_repair_v1.py --self-test

      - name: Acquire fresh real-internet experience
        run: |
          python runtime/yado_cross_disciplinary_internet_learning_v1.py \
            --config architecture/yado-cross-disciplinary-internet-learning-v1.json \
            --self-model architecture/developmental-self-model-overlay.json \
            --out artifacts/yado-thinking-boundary-fresh-internet-v1.json

      - name: Let measured development errors select repair primitives
        run: |
          python runtime/yado_thinking_boundary_adaptive_repair_v1.py \
            --self-model architecture/developmental-self-model-overlay.json \
            --experience artifacts/yado-thinking-boundary-fresh-internet-v1.json \
            --dev-seed 20260912 \
            --ood-seed 20260913 \
            --out artifacts/yado-thinking-boundary-adaptive-repair-v1.json

      - name: Verify shadow repair and fresh OOD gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('artifacts/yado-thinking-boundary-adaptive-repair-v1.json').read_text())
          e = json.loads(Path('artifacts/yado-thinking-boundary-fresh-internet-v1.json').read_text())
          assert e['status'] == 'PASS_REAL_INTERNET_CROSS_DISCIPLINARY_EXPERIENCE'
          assert e['internet_access_verified'] is True
          assert e['acquisition']['discipline_count'] >= 5
          assert r['status'] == 'PASS_SHADOW_THINKING_BOUNDARY_ADAPTIVE_REPAIR_V1'
          assert r['binding']['target_present'] is True
          assert r['candidate']['target_deficit'] == 'THINKING_BOUNDARY_REASONING'
          assert r['candidate']['canonical_direct_write'] is False
          assert r['gates']['input_gate'] is True
          assert r['gates']['benchmark_gate'] is True
          assert r['fresh_ood']['candidate']['score'] >= 0.85
          assert r['fresh_ood']['absolute_gain'] >= 0.20
          assert r['fresh_ood']['no_critical_regression'] is True
          assert r['fresh_ood']['critical_family_floor_pass'] is True
          assert r['claims']['measured_benchmark_improvement'] is True
          assert r['claims']['general_intelligence_improvement_claimed'] is False
          assert r['claims']['phenomenal_consciousness_claimed'] is False
          print('PASS_THINKING_BOUNDARY_FRESH_OOD_ADAPTIVE_REPAIR_V1')
          PY

      - name: Upload adaptive repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: yado-thinking-boundary-adaptive-repair-v1
          path: |
            artifacts/yado-thinking-boundary-fresh-internet-v1.json
            artifacts/yado-thinking-boundary-adaptive-repair-v1.json
          if-no-files-found: error
