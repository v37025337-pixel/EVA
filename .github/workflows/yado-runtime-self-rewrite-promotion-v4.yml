name: YADO Physical Runtime Promotion V4

on:
  push:
    branches: [yado-physical-runtime-promotion-v4-20260918]
    paths:
      - "runtime/yado_bounded_autonomous_learning_v1.py"
      - "architecture/yado-runtime-self-rewrite-promotion-v4.json"
      - ".github/workflows/yado-runtime-self-rewrite-promotion-v4.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/yado_bounded_autonomous_learning_v1.py"
      - "architecture/yado-runtime-self-rewrite-promotion-v4.json"
      - ".github/workflows/yado-runtime-self-rewrite-promotion-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-promotion-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Verify historical V4 and the exact active implementation
        env:
          PYTHONPATH: runtime
        run: |
          python -m py_compile runtime/yado_bounded_autonomous_learning_v1.py runtime/yado_runtime_self_rewrite_admission_v4.py
          python -m unittest runtime.test_yado_runtime_self_rewrite_admission_v4 -v
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from yado_runtime_self_rewrite_admission_v4 import MAINTENANCE_STATE, analyze_committed
          from yado_active_kernel_contract_v1 import active_kernel_identity

          root=Path(".")
          target=root/"runtime/yado_bounded_autonomous_learning_v1.py"
          candidate=root/"candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py"
          admission=json.loads((root/"candidates/autonomous/yado-runtime-self-rewrite-admission-v4.json").read_text())
          target_sha=hashlib.sha256(target.read_bytes()).hexdigest()
          candidate_sha=hashlib.sha256(candidate.read_bytes()).hexdigest()

          assert admission["status"]=="PASS_SHADOW_RUNTIME_SELF_REWRITE_ADMISSION_V4", admission
          assert admission["isolated_full_regression"] is True, admission
          assert admission["isolated_regression_tests"] >= 467, admission
          assert candidate_sha==admission["candidate_sha256"], (candidate_sha,admission)
          probe=analyze_committed()
          assert probe["status"]=="PASS_SHADOW_RUNTIME_SELF_REWRITE_ADMISSION_V4_PROBE", probe
          assert probe["repository_view"]=="COMMITTED_HEAD", probe
          assert probe["target_sha256"]==target_sha, (probe,target_sha)
          assert probe["candidate_sha256"]==candidate_sha, (probe,candidate_sha)
          recorded_admission=subprocess.check_output([
              "git", "show", probe["tested_commit"]+":candidates/autonomous/yado-runtime-self-rewrite-admission-v4.json"
          ])
          assert recorded_admission==(root/"candidates/autonomous/yado-runtime-self-rewrite-admission-v4.json").read_bytes()
          if probe["runtime_state"]==MAINTENANCE_STATE:
              identity=active_kernel_identity(root)
              assert identity==probe["active_kernel_identity"], (identity,probe)
              assert identity["controller_sha256"]==target_sha, identity
              assert target_sha!=candidate_sha, (target_sha,candidate_sha)
              print("PASS_VERIFIED_V4_MAINTENANCE_BINDING",target_sha)
          else:
              assert probe["runtime_state"]=="V4_CANDIDATE_APPLIED_IN_ISOLATED_WORKTREE", probe
              assert target_sha==candidate_sha, (target_sha,candidate_sha)
              assert probe["checks"]["target_matches_candidate_when_shadow_applied"] is True, probe
              print("PASS_EXACT_PHYSICAL_V4_BINDING",target_sha)
          (root/"audits").mkdir(exist_ok=True)
          (root/"audits/yado-physical-v4-active-binding-probe.json").write_text(json.dumps(probe,indent=2,sort_keys=True)+"\n")
          PY

      - name: Full kernel audit and canonical guard
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          rm -f audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-kernel-audit-v1-report.json"))
          assert d["status"]=="PASS", d
          assert d["findings"]==[], d
          assert d["canonical"]["canonical_guard"]=="PASS", d
          assert d["canonical"]["ledger_validation"]=="PASS", d
          print("PASS_PHYSICAL_V4_FULL_KERNEL_AUDIT")
          PY

      - name: Complete Successor regression on the active implementation
        run: |
          rm -rf "$RUNNER_TEMP/yado-successor-v4-physical"
          python -m successor build --output "$RUNNER_TEMP/yado-successor-v4-physical"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-v4-physical/manifest.json"
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-regression-v1-report.json"))
          assert d["status"]=="PASS", d
          assert d["tests_run"]==d["expected_tests"], d
          assert not d["failures"] and not d["errors"] and not d["skipped"], d
          assert d["source_unchanged"] is True, d
          print("PASS_PHYSICAL_V4_REGRESSION",d["tests_run"])
          PY

      - name: Verify immutability and record separate active implementation evidence
        env:
          PYTHONPATH: runtime
        run: |
          git diff HEAD --exit-code -- canonical architecture/evolution-ledger.json candidates/autonomous/yado-runtime-self-rewrite-admission-v4.json candidates/autonomous/yado-runtime-self-rewrite-promotion-v4.json candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json
          python runtime/yado_canonical_invariant_guard_v1.py
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          from yado_runtime_self_rewrite_admission_v4 import MAINTENANCE_STATE, analyze_committed
          from yado_active_kernel_contract_v1 import active_kernel_identity
          root=Path(".")
          target=root/"runtime/yado_bounded_autonomous_learning_v1.py"
          admission=json.loads((root/"candidates/autonomous/yado-runtime-self-rewrite-admission-v4.json").read_text())
          regression=json.loads((root/"audits/yado-full-regression-v1-report.json").read_text())
          audit=json.loads((root/"audits/yado-full-kernel-audit-v1-report.json").read_text())
          probe=analyze_committed()
          commit=subprocess.check_output(["git","rev-parse","HEAD"],text=True).strip()
          assert probe["status"]=="PASS_SHADOW_RUNTIME_SELF_REWRITE_ADMISSION_V4_PROBE", probe
          assert probe["repository_view"]=="COMMITTED_HEAD" and probe["tested_commit"]==commit, probe
          assert commit==os.environ["GITHUB_SHA"]==regression["tested_commit"], (commit,regression)
          assert regression["status"]=="PASS" and regression["tests_run"]==regression["expected_tests"], regression
          assert not regression["failures"] and not regression["errors"] and not regression["skipped"], regression
          assert regression["source_unchanged"] is True, regression
          assert audit["status"]=="PASS" and audit["findings"]==[], audit
          target_sha=hashlib.sha256(target.read_bytes()).hexdigest()
          assert target_sha==probe["target_sha256"], (target_sha,probe)
          candidate_sha=hashlib.sha256((root/"candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py").read_bytes()).hexdigest()
          assert candidate_sha==probe["candidate_sha256"]==admission["candidate_sha256"], (candidate_sha,probe,admission)
          maintenance=probe["runtime_state"]==MAINTENANCE_STATE
          if maintenance:
              assert active_kernel_identity(root)==probe["active_kernel_identity"], probe
              assert target_sha!=admission["candidate_sha256"], (target_sha,admission)
          else:
              assert probe["runtime_state"]=="V4_CANDIDATE_APPLIED_IN_ISOLATED_WORKTREE", probe
              assert target_sha==admission["candidate_sha256"], (target_sha,admission)
          receipt={
            "schema":"yado.runtime_maintenance_verification.v1" if maintenance else "yado.runtime_self_rewrite_promotion.v4",
            "status":"PASS_VERIFIED_V4_MAINTENANCE_IMPLEMENTATION" if maintenance else "PASS_SHADOW_PHYSICAL_RUNTIME_PROMOTION_V4",
            "tested_commit":commit,
            "runtime_state":probe["runtime_state"],
            "active_kernel_identity":probe["active_kernel_identity"],
            "parent_runtime_sha256":admission["parent_runtime_sha256"],
            "candidate_sha256":admission["candidate_sha256"],
            "target_sha256":target_sha,
            "physical_runtime_promotion":not maintenance,
            "exact_candidate_binding":not maintenance,
            "historical_v4_candidate_binding_verified":True,
            "verified_maintenance_binding":maintenance,
            "full_kernel_audit":True,
            "canonical_guard":True,
            "full_regression":True,
            "regression_tests":regression["tests_run"],
            "automatic_canonical_metadata_mutation":False,
            "consciousness_claimed":False,
            "next_required_capability":"POST_MERGE_MAINTENANCE_VALIDATION" if maintenance else "MERGE_PROMOTION_AND_POST_MERGE_CANONICAL_AUDIT"
          }
          out=root/"audits"/("yado-runtime-v4-maintenance-verification.json" if maintenance else "yado-runtime-self-rewrite-promotion-v4-verification.json")
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,sort_keys=True))
          PY

      - name: Preserve promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-physical-runtime-promotion-v4
          path: |
            candidates/autonomous/yado-runtime-self-rewrite-promotion-v4.json
            audits/yado-physical-v4-active-binding-probe.json
            audits/yado-runtime-v4-maintenance-verification.json
            audits/yado-runtime-self-rewrite-promotion-v4-verification.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
          if-no-files-found: warn
