name: YADO Residual Repair Synthesis V3

on:
  push:
    branches: [yado-causal-ablation-cycle-v1]
    paths:
      - 'runtime/yado_raw_task_representation_residual_repair_v3.py'
      - 'runtime/yado_residual_repair_synthesis_v3.py'
      - '.github/workflows/yado-residual-repair-synthesis-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthesize-from-residuals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile residual synthesis family
        run: |
          python -m py_compile runtime/yado_raw_task_representation_candidate_v3.py
          python -m py_compile runtime/yado_raw_task_representation_robustness_v4.py
          python -m py_compile runtime/yado_raw_task_representation_residual_repair_v3.py
          python -m py_compile runtime/yado_residual_repair_synthesis_v3.py

      - name: Execute residual-driven policy synthesis
        run: |
          python runtime/yado_residual_repair_synthesis_v3.py \
            --out candidates/autonomous/yado-residual-repair-synthesis-v3.json

      - name: Verify bounded selection and next action
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('candidates/autonomous/yado-residual-repair-synthesis-v3.json').read_text())
          assert r['status'] in {
            'PASS_SHADOW_RESIDUAL_REPAIR_SYNTHESIS_V3',
            'WITHHOLD_SHADOW_RESIDUAL_REPAIR_SYNTHESIS_V3',
          },r
          assert r['canonical_mutation'] is False,r
          assert r['automatic_main_mutation'] is False,r
          assert r['causal_evaluation']['admit_candidate'] is False,r
          assert r['generated_holdout']['created_after_policy_selection'] is True,r
          assert len(r['search']['policy_family']) >= 10,r
          selected=r['search']['selected']
          if r['status'].startswith('PASS'):
              assert selected['policy']!='V4_CONTROL',r
              assert selected['validation_gain']>0,r
              assert selected['all_experience_gain']>0,r
              assert selected['fit_gain']>=0,r
              assert selected['regression_ok'] is True,r
              assert r['generated_holdout']['no_regression'] is True,r
              assert r['self_selected_next_action']=='FREEZE_SELECTED_POLICY_THEN_RUN_DEEP_ADMISSION_AUDIT_SUCCESSOR_REGRESSION',r
          else:
              assert r['self_selected_next_action']=='EXPAND_REPAIR_REPRESENTATION_FROM_RESIDUAL_ERROR_CLUSTERS_WITHOUT_CANONICAL_MUTATION',r
          print(json.dumps({
            'status':r['status'],
            'selected_policy':selected['policy'],
            'fit_gain':selected['fit_gain'],
            'validation_gain':selected['validation_gain'],
            'all_experience_gain':selected['all_experience_gain'],
            'changed_on_experience':selected['changed_on_experience'],
            'regression_ok':selected['regression_ok'],
            'generated_holdout_gain':r['generated_holdout']['gain'],
            'next_action':r['self_selected_next_action'],
            'receipt_sha256':r['receipt_sha256'],
          },sort_keys=True))
          PY

      - name: Repeat synthesis for reproducibility
        run: |
          cp candidates/autonomous/yado-residual-repair-synthesis-v3.json "$RUNNER_TEMP/first.json"
          python runtime/yado_residual_repair_synthesis_v3.py --out "$RUNNER_TEMP/second.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ['RUNNER_TEMP'])/'first.json').read_text())
          b=json.loads((Path(os.environ['RUNNER_TEMP'])/'second.json').read_text())
          assert a['status']==b['status']
          assert a['search']['selected']['policy']==b['search']['selected']['policy']
          assert a['search']['selected']['validation_gain']==b['search']['selected']['validation_gain']
          assert a['generated_holdout']['gain']==b['generated_holdout']['gain']
          assert a['self_selected_next_action']==b['self_selected_next_action']
          assert a['receipt_sha256']==b['receipt_sha256']
          print('PASS_REPRODUCIBLE_RESIDUAL_SYNTHESIS')
          PY

      - name: Prove no tracked canonical mutation
        run: git diff --exit-code

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-residual-repair-synthesis-v3-${{ github.run_id }}
          path: candidates/autonomous/yado-residual-repair-synthesis-v3.json
