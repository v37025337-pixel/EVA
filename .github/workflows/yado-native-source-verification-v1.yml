name: YADO Native Source Verification V1
on:
  push:
    branches: [yado-native-self-rewrite-20260910]
  pull_request:
    branches: [yado-architecture-shadow-search]
    paths:
      - 'runtime/yado_g2_autonomous_self_rewrite_v1.py'
      - 'runtime/yado_g2_autonomous_self_improvement_task_v1.py'
      - 'runtime/yado_g2_goal_action_binding_v1.py'
      - 'runtime/yado_g2_native_semantic_ast_backend_v1.py'
      - 'runtime/yado_g2_self_rewrite_repaired_controller_fresh_regression_gate_v1.py'
      - 'tests/test_yado_native_self_rewrite_v1.py'
      - 'architecture/yado-kernel-autonomous-self-rewrite-v1-request.json'
      - 'architecture/yado-kernel-autonomous-self-improvement-v1-request.json'
      - '.github/workflows/yado-native-source-verification-v1.yml'
permissions:
  contents: read
concurrency:
  group: yado-native-source-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before verification
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Fresh native source, goal intake, and regression gate
        id: fresh
        continue-on-error: true
        run: python runtime/yado_g2_self_rewrite_repaired_controller_fresh_regression_gate_v1.py --output audits/native-source-20260910/ci-fresh-gate.json
      - name: Canonical guard after verification
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Upload current verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-native-source-verification-${{ github.run_id }}
          path: audits/native-source-20260910/ci-fresh-gate.json
          if-no-files-found: error
      - name: Require actual source admission PASS
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path('audits/native-source-20260910/ci-fresh-gate.json').read_text())
          print(json.dumps({'status': report['status'], 'checks': report['checks']}, indent=2))
          assert report['status'].startswith('PASS_SHADOW_'), report['status']
          assert all(report['checks'].values()), report['checks']
          PY
