name: YADO G2 Unified Module Kernel Fresh Gate V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-unified-module-kernel-fresh-gate-v1-request.json"
permissions:
  contents: write
jobs:
  fresh-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile unified module kernel
        run: python -m py_compile runtime/yado_g2_integrated_execution_fabric_v1.py runtime/yado_g2_unified_module_kernel_v1.py runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py
      - name: Run all-module fresh gate
        run: python runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py
      - name: Persist shadow module assembly evidence
        run: |
          git config user.name "YADO G2 Module Kernel Gate"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-unified-module-kernel-v1.json
          git commit -m "Persist unified G2 module kernel fresh evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-unified-module-kernel-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-unified-module-kernel-v1.json
