name: YADO Main Evolution V1 (retired external proposer)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare runtime
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Explain retirement
        run: |
          echo 'The external no-key coding-model proposer is retired from main evolution.'
          echo 'Native source generation/admission is handled by the YADO native AST evolution line.'
      - name: Read current YADO self-selected frontier
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Verify canonical invariants
        run: python runtime/yado_canonical_invariant_guard_v1.py
