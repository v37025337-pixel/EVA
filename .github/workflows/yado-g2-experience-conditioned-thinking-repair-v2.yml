name: YADO G2 Experience Conditioned Thinking Repair V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-experience-conditioned-thinking-repair-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-experience-conditioned-thinking-repair-v2
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before thinking repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile thinking repair
        run: python -m py_compile runtime/yado_g2_experience_conditioned_thinking_repair_v2.py
      - name: Let current G2 relearn thinking from verified history
        id: repair
        continue-on-error: true
        run: python runtime/yado_g2_experience_conditioned_thinking_repair_v2.py
      - name: Canonical guard after thinking repair
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist thinking repair evidence
        if: always()
        run: |
          git config user.name "YADO Thinking Experience Repair"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-experience-conditioned-thinking-repair-v2.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO experience-conditioned thinking repair V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest thinking repair verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-experience-conditioned-thinking-repair-v2.json")
          if not p.exists():raise SystemExit("MISSING_THINKING_REPAIR_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("legacy_runtime_activated","external_models_used","new_external_research_used","host_written_planner","host_selected_new_order","automatic_canonical_promotion"):
              assert c[k] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_EXPERIENCE_CONDITIONED_THINKING_REPAIR_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["fresh_score"],r["context_ablation_score"],r["thinking_gene"]["gene_id"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-experience-conditioned-thinking-repair-v2-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-experience-conditioned-thinking-repair-v2.json
          if-no-files-found: warn
