name: YADO G2 Composite Canonical Post Admission Audit V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-composite-canonical-post-admission-audit-v1-request.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before audit
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile post-admission audit
        run: python -m py_compile runtime/yado_g2_composite_canonical_post_admission_audit_v1.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Audit canonical composite after restart
        run: timeout --signal=TERM --kill-after=30s 900s python runtime/yado_g2_composite_canonical_post_admission_audit_v1.py
      - name: Persist unexpected audit failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_COMPOSITE_CANONICAL_POST_ADMISSION_AUDIT_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record post-admission audit aborted execution as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist post-admission audit evidence
        if: success()
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_composite_canonical_post_admission_audit_v1_receipt.json "receipts/yado-g2-composite-canonical-post-admission-audit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Composite Post Admission Audit"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json "receipts/yado-g2-composite-canonical-post-admission-audit-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 composite canonical post-admission audit V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after audit persistence
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce audit receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_composite_canonical_post_admission_audit_v1_receipt.json"))
          assert r["status"] in {"PASS_G2_COMPOSITE_CANONICAL_POST_ADMISSION_AUDIT_V1","WITHHOLD_G2_COMPOSITE_CANONICAL_POST_ADMISSION_AUDIT_V1"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["status"],r["canary"],r["next_required_capability"])
          PY
