name: YADO Logic Filter Order V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_logic_filter_order_v1.py"
      - ".github/workflows/yado-logic-filter-order-v1.yml"
permissions:
  contents: write
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run YADO LOGIC filter plus THINKING order
        run: python runtime/yado_logic_filter_order_v1.py
      - name: Upload receipt and component
        uses: actions/upload-artifact@v4
        with:
          name: yado-logic-filter-order-v1
          path: |
            runtime/yado_logic_filter_order_v1_receipt.json
            runtime/logic_filter_order_v1/component.json
          retention-days: 30
      - name: Persist evidence
        run: |
          mkdir -p receipts candidates/logic-filter-order-v1
          cp runtime/yado_logic_filter_order_v1_receipt.json receipts/yado-logic-filter-order-v1-latest.json
          cp runtime/logic_filter_order_v1/component.json candidates/logic-filter-order-v1/component.json
          git config user.name "YADO Logic Filter Order"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-logic-filter-order-v1-latest.json candidates/logic-filter-order-v1/component.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist logic-filter order evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
