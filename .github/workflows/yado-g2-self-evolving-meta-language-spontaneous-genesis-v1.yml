name: YADO G2 Self Evolving Meta Language Spontaneous Genesis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-evolving-meta-language-spontaneous-genesis-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-evolving-meta-language-spontaneous-genesis-v1
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before spontaneous genesis
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile transport
        run: python -m py_compile runtime/yado_g2_self_evolving_meta_language_spontaneous_genesis_v1.py
      - name: Give YADO only the meta-language task
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_self_evolving_meta_language_spontaneous_genesis_v1.py
      - name: Canonical guard after spontaneous genesis
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist spontaneous genesis evidence
        if: always()
        run: |
          git config user.name "YADO Meta Language Genesis"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-self-evolving-meta-language-spontaneous-genesis-v1.json ]; then
            git add candidates/kernel-self-generated/g2-self-evolving-meta-language-spontaneous-genesis-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO spontaneous meta-language genesis evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict task-only verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-self-evolving-meta-language-spontaneous-genesis-v1.json")
          if not p.exists(): raise SystemExit("MISSING_SPONTANEOUS_META_LANGUAGE_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          assert c["external_coding_models_used"] is False,r
          assert c["new_external_research_used"] is False,r
          assert c["host_meta_language_template_used"] is False,r
          assert c["host_operator_list_used"] is False,r
          assert c["host_representation_schema_used"] is False,r
          assert c["host_source_seed_used"] is False,r
          assert c["host_patch_used"] is False,r
          assert c["host_target_file_selected"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_SELF_EVOLVING_META_LANGUAGE_SPONTANEOUS_GENESIS_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          print(r["status"],r["candidate_source_sha256"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-self-evolving-meta-language-spontaneous-genesis-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-self-evolving-meta-language-spontaneous-genesis-v1.json
          if-no-files-found: warn
