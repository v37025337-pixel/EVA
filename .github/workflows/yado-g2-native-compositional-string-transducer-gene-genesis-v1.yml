name: YADO G2 Native Compositional String Transducer Gene Genesis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-compositional-string-transducer-gene-genesis-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-compositional-string-transducer-gene-genesis-v1
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before genesis
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile genesis probe
        run: python -m py_compile runtime/yado_g2_native_compositional_string_transducer_gene_genesis_v1.py
      - name: Run native transducer gene genesis
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_native_compositional_string_transducer_gene_genesis_v1.py
      - name: Canonical guard after genesis
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist genesis evidence
        if: always()
        run: |
          git config user.name "YADO String Transducer Genesis"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-compositional-string-transducer-gene-genesis-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-compositional-string-transducer-gene-genesis-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO string transducer gene genesis V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict genesis verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-compositional-string-transducer-gene-genesis-v1.json")
          if not p.exists(): raise SystemExit("MISSING_STRING_TRANSDUCER_GENESIS_V1")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_string_grammar_used","host_operator_inventory_used","host_serializer_used",
                    "host_ast_compiler_used","host_source_template_used","host_patch_used",
                    "external_models_used","automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_COMPOSITIONAL_STRING_TRANSDUCER_GENE_GENESIS_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["new_compositional_string_transducer_gene_created"] is True,r
          assert c["new_transducer_gene_has_novel_identity"] is True,r
          assert c["new_transducer_gene_binds_current_failure"] is True,r
          print(r["status"],r["selected_candidate"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-compositional-string-transducer-gene-genesis-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-compositional-string-transducer-gene-genesis-v1.json
          if-no-files-found: warn
