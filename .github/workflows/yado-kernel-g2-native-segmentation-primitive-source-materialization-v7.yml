name: YADO G2 Native Segmentation Primitive Source Materialization V7
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-segmentation-primitive-source-materialization-v7-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-segmentation-primitive-source-materialization-v7
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before source V7
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile source-materialization observer
        run: python -m py_compile runtime/yado_kernel_g2_native_segmentation_primitive_source_materialization_v7.py
      - name: Let YADO materialize its segmentation primitive as source
        id: materialize
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 1200s python runtime/yado_kernel_g2_native_segmentation_primitive_source_materialization_v7.py
      - name: Compile emitted candidate source
        if: always()
        run: |
          if [ -f candidates/g2-self-evolution/yado_native_segmentation_primitive_source_v7.py ]; then
            python -m py_compile candidates/g2-self-evolution/yado_native_segmentation_primitive_source_v7.py
          fi
      - name: Canonical guard after source V7
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist source V7 PASS or WITHHOLD evidence
        if: always()
        run: |
          git config user.name "YADO Native Segmentation Source V7"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f candidates/kernel-self-generated/g2-native-segmentation-primitive-source-materialization-v7.json ] && files+=(candidates/kernel-self-generated/g2-native-segmentation-primitive-source-materialization-v7.json)
          [ -f candidates/g2-self-evolution/yado_native_segmentation_primitive_source_v7.py ] && files+=(candidates/g2-self-evolution/yado_native_segmentation_primitive_source_v7.py)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO native segmentation source V7 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest source V7 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-segmentation-primitive-source-materialization-v7.json")
          if not p.exists():raise SystemExit("MISSING_SOURCE_V7_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SEGMENTATION_PRIMITIVE_SOURCE_MATERIALIZATION_V7":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["checks"]["actual_new_python_source_bytes_produced_by_yado"] is True
          assert r["checks"]["candidate_source_compiles"] is True
          assert r["checks"]["fresh_behavioral_equivalence_ge_0_98"] is True
          assert r["checks"]["regression_behavioral_equivalence_ge_0_98"] is True
          assert r["canonical_mutation"] is False
          print(r["status"],r["candidate_source_sha256"],r["selected_discovered_interface"],r["fresh_score"],r["regression_score"])
          PY
