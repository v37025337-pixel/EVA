name: YADO G2 Native Selector Commit Substrate Genesis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-selector-commit-substrate-genesis-v1-request.json"
permissions:
  contents: write
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Let RC8 executive synthesize and commit selector substrate
        run: python runtime/yado_kernel_native_selector_commit_substrate_genesis_v1.py
      - name: Persist native registry, evidence, and frontier
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_native_selector_commit_substrate_genesis_v1_receipt.json "receipts/yado-kernel-native-selector-commit-substrate-genesis-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Native Commit Genesis"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_g2_native_selector_commit_registry_v1.sqlite architecture/evolution-ledger.json architecture/yado-kernel-native-selector-commit-substrate-genesis-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/native-selector-commit-substrate-v1.json "receipts/yado-kernel-native-selector-commit-substrate-genesis-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 native selector commit substrate V1 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce native commit substrate receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_native_selector_commit_substrate_genesis_v1_receipt.json"))
          assert r["status"]=="PASS_NATIVE_SELECTOR_COMMIT_SUBSTRATE_GENESIS_V1",r
          assert all(r["checks"].values()),r
          print(r["candidate_state"],r["program_id"],r["program_digest"],r["next_required_capability"])
          PY
