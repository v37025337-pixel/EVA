name: YADO Native Self Rewrite V4 Fresh Experience

on:
  push:
    branches: [yado-native-self-rewrite-v4-fresh-experience-20260918]
    paths:
      - "runtime/yado_native_self_rewrite_v4_fresh_experience.py"
      - "runtime/test_yado_native_self_rewrite_v4_fresh_experience.py"
      - "runtime/yado_full_kernel_audit_v1.py"
      - "architecture/yado-native-self-rewrite-v4-fresh-experience.json"
      - "architecture/yado-active-managed-branch-policy-v1.json"
      - "candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json"
      - "candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py"
      - "candidates/autonomous/yado-runtime-self-rewrite-admission-v3.json"
      - ".github/workflows/yado-native-self-rewrite-v4-fresh-experience.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/yado_native_self_rewrite_v4_fresh_experience.py"
      - "runtime/test_yado_native_self_rewrite_v4_fresh_experience.py"
      - "architecture/yado-native-self-rewrite-v4-fresh-experience.json"
      - "candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json"
      - "candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py"
      - ".github/workflows/yado-native-self-rewrite-v4-fresh-experience.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-self-rewrite-v4:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile and focused V4 generation tests
        env:
          PYTHONPATH: runtime
        run: |
          python -m py_compile runtime/yado_native_self_rewrite_v4_fresh_experience.py runtime/test_yado_native_self_rewrite_v4_fresh_experience.py
          python -m unittest runtime.test_yado_native_self_rewrite_v4_fresh_experience -v

      - name: Reproduce and verify V4 from committed V3 parent
        env:
          PYTHONPATH: runtime
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from yado_native_self_rewrite_v4_fresh_experience import build_committed

          reproduced=build_committed()
          persisted=json.loads(Path("candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json").read_text())
          candidate=Path("candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py")
          candidate_sha=hashlib.sha256(candidate.read_bytes()).hexdigest()

          assert reproduced["status"]=="PASS_SHADOW_NATIVE_SELF_REWRITE_V4_FRESH_EXPERIENCE", reproduced
          assert reproduced["historical_parent_reconstructed_from_v3_candidate"] is True, reproduced
          assert reproduced["candidate_sha256"] != reproduced["parent_runtime_sha256"], reproduced
          assert reproduced["latest_experience_digest"] != reproduced["parent_experience_digest"], reproduced
          assert reproduced["checks"]["structural_ast_unchanged_except_learned_binding"] is True, reproduced
          assert reproduced["checks"]["python_unittest_new_success_affinity"] is True, reproduced
          assert reproduced["checks"]["former_failed_source_penalty_removed"] is True, reproduced
          assert reproduced["runtime_mutation_applied"] is False, reproduced
          assert reproduced["next_required_capability"]=="ISOLATED_RUNTIME_EXECUTION_AND_REGRESSION_ADMISSION_V4", reproduced

          assert persisted["status"]=="PASS_SHADOW_NATIVE_SELF_REWRITE_V4_FRESH_EXPERIENCE", persisted
          assert persisted["candidate_sha256"]==reproduced["candidate_sha256"]==candidate_sha, (persisted,reproduced,candidate_sha)
          assert persisted["parent_runtime_sha256"]==reproduced["parent_runtime_sha256"], (persisted,reproduced)
          assert persisted["latest_experience_digest"]==reproduced["latest_experience_digest"], (persisted,reproduced)

          print(json.dumps({
              "status":reproduced["status"],
              "parent_sha":reproduced["parent_runtime_sha256"],
              "candidate_sha":reproduced["candidate_sha256"],
              "parent_experience":reproduced["parent_experience_digest"],
              "latest_experience":reproduced["latest_experience_digest"],
              "score_deltas":reproduced["ranking_score_deltas"],
              "persisted_evidence_exact":True
          },sort_keys=True))
          PY

      - name: Full kernel audit
        run: |
          rm -f audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md audits/yado-full-regression-v1-report.json audits/yado-full-regression-v1-report.log
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-kernel-audit-v1-report.json"))
          assert d["status"]=="PASS", d
          assert d["findings"]==[], d["findings"]
          PY

      - name: Fresh Successor regression
        run: |
          rm -rf "$RUNNER_TEMP/yado-successor-self-rewrite-v4"
          python -m successor build --output "$RUNNER_TEMP/yado-successor-self-rewrite-v4"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-self-rewrite-v4/manifest.json"
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-regression-v1-report.json"))
          assert d["status"].startswith("PASS"), d
          assert d["tests_run"]==d["expected_tests"], d
          assert not d["failures"] and not d["errors"] and not d["skipped"], d
          assert d["source_unchanged"] is True, d
          print("PASS_V4_SHADOW_REGRESSION",d["tests_run"])
          PY

      - name: Preserve V4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-native-self-rewrite-v4-${{ github.run_id }}
          path: |
            candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json
            candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
          if-no-files-found: warn


  persist-v4-evidence:
    if: github.event_name == 'push' && github.ref == 'refs/heads/yado-native-self-rewrite-v4-fresh-experience-20260918'
    needs: native-self-rewrite-v4
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Regenerate exact deterministic V4 evidence
        env:
          PYTHONPATH: runtime
        run: |
          python runtime/yado_native_self_rewrite_v4_fresh_experience.py --historical-v4
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json").read_text())
          assert d["status"]=="PASS_SHADOW_NATIVE_SELF_REWRITE_V4_FRESH_EXPERIENCE", d
          assert d["next_required_capability"]=="ISOLATED_RUNTIME_EXECUTION_AND_REGRESSION_ADMISSION_V4", d
          PY

      - name: Persist exact V4 candidate and receipt
        run: |
          # Persist only from the commit accepted by the preceding verification job.
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin yado-native-self-rewrite-v4-fresh-experience-20260918
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          git config user.name "YADO Native Self Rewrite V4"
          git config user.email "actions@users.noreply.github.com"
          git add             candidates/autonomous/yado-native-self-rewrite-v4-fresh-experience.json             candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py
          if git diff --cached --quiet; then
            echo "V4 evidence already persisted exactly"
          else
            git commit -m "YADO V4: persist verified fresh-experience self-rewrite evidence"
            git push origin HEAD:yado-native-self-rewrite-v4-fresh-experience-20260918
          fi
