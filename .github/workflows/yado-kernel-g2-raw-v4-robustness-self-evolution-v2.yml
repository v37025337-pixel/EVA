name: YADO G2 Raw V4 Robustness Self Evolution V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-raw-v4-robustness-self-evolution-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-v4-robustness-self-evolution-v2
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V2
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V2 observer
        run: python -m py_compile runtime/yado_kernel_g2_raw_representation_v4_robustness_self_evolution_v2.py
      - name: Let YADO select the V2 robustness successor
        id: evolve
        continue-on-error: true
        run: python runtime/yado_kernel_g2_raw_representation_v4_robustness_self_evolution_v2.py
      - name: Canonical guard after V2
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V2 PASS or WITHHOLD evidence
        if: always()
        run: |
          git config user.name "YADO Raw Robustness V2"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f architecture/yado-kernel-g2-raw-representation-v4-robustness-self-evolution-v2.json ] && files+=(architecture/yado-kernel-g2-raw-representation-v4-robustness-self-evolution-v2.json)
          [ -f candidates/kernel-self-generated/raw-task-representation-v5-robustness-v2.json ] && files+=(candidates/kernel-self-generated/raw-task-representation-v5-robustness-v2.json)
          [ -f resources/yado-raw-task-representation-v5-robustness-v2-fresh-holdout.json ] && files+=(resources/yado-raw-task-representation-v5-robustness-v2-fresh-holdout.json)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO raw robustness self-evolution V2 evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest V2 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("architecture/yado-kernel-g2-raw-representation-v4-robustness-self-evolution-v2.json")
          if not p.exists(): raise SystemExit("MISSING_RAW_V4_ROBUSTNESS_V2_EVIDENCE")
          r=json.loads(p.read_text())
          assert r["canonical_mutation"] is False,r
          assert r["failed_critics"]==["regression"],r
          if r["status"]!="PASS_SHADOW_G2_RAW_REPRESENTATION_V4_ROBUSTNESS_SELF_EVOLUTION_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["selected_mode"] and r["selected_mode"]!=r["failed_mode"],r
          print(r["status"],r["selected_mode"],r["fresh_metrics"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-raw-v4-robustness-self-evolution-v2-${{ github.run_id }}
          path: |
            architecture/yado-kernel-g2-raw-representation-v4-robustness-self-evolution-v2.json
            candidates/kernel-self-generated/raw-task-representation-v5-robustness-v2.json
            resources/yado-raw-task-representation-v5-robustness-v2-fresh-holdout.json
          if-no-files-found: warn
