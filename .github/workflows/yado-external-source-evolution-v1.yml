name: YADO External Source Evolution V1

on:
  workflow_dispatch:
  push:
    branches:
      - yado-external-source-evolution-v1
    paths:
      - 'runtime/yado_external_source_evolution_v1.py'
      - 'architecture/yado-external-source-evolution-v1.json'
      - '.github/workflows/yado-external-source-evolution-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/yado_external_source_evolution_v1.py'
      - 'architecture/yado-external-source-evolution-v1.json'
      - '.github/workflows/yado-external-source-evolution-v1.yml'

permissions:
  contents: read

jobs:
  external-source-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile source-evolution controller
        run: python -m py_compile runtime/yado_external_source_evolution_v1.py

      - name: Run external tasks and synthesize shadow Python source
        run: python runtime/yado_external_source_evolution_v1.py

      - name: Verify frozen external evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('receipts/yado-external-source-evolution-v1.json').read_text())
          assert report['status'] == 'PASS_SHADOW_G2_EXTERNAL_SOURCE_EVOLUTION_V1', report['status']
          assert report['scope']['training_cases'] == 18
          assert report['scope']['sealed_cases'] == 7
          assert report['scope']['sealed_not_used_for_selection'] is True
          assert report['metrics']['training_candidate']['score'] == 1.0
          assert report['metrics']['sealed_candidate']['score'] >= 0.85
          assert report['metrics']['sealed_absolute_gain'] >= 0.50
          assert report['gates']['source_changed'] is True
          assert report['gates']['candidate_frozen_before_sealed_eval'] is True
          candidate = Path(report['candidate_source']['path'])
          compile(candidate.read_text(), str(candidate), 'exec')
          print('PASS_EXTERNAL_SOURCE_EVOLUTION_EVIDENCE_GATE')
          PY

      - name: Reconstruct inherited runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile complete runtime
        run: python -m compileall -q runtime successor candidates/g2-self-evolution

      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"

      - name: Upload external evolution evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-external-source-evolution-v1-${{ github.run_id }}
          path: |
            architecture/yado-external-source-evolution-v1.json
            receipts/yado-external-source-evolution-v1.json
            candidates/g2-self-evolution/yado_external_synth_*.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
