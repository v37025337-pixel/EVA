name: YADO G2 Portfolio Deficit Invention Cycle V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-portfolio-deficit-invention-cycle-v1-request.json"
permissions:
  contents: write
jobs:
  adaptive-cycle-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before adaptive cycle
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile adaptive evolution cycle runtimes
        run: python -m py_compile runtime/yado_generic_weighted_state_meta_language_v1.py runtime/yado_g2_adaptive_evolution_controller_v1.py runtime/yado_g2_portfolio_deficit_invention_cycle_v1.py
      - name: Run portfolio deficit invention cycle
        run: python runtime/yado_g2_portfolio_deficit_invention_cycle_v1.py
      - name: Require strict adaptive cycle PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-portfolio-deficit-invention-cycle-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_PORTFOLIO_DEFICIT_INVENTION_CYCLE_V1",r
          assert r["checks"]["existing_portfolio_insufficient_for_new_contract"] is True,r
          assert r["checks"]["temporal_stall_reached_20"] is True,r
          assert r["checks"]["new_gene_self_synthesized_after_stall"] is True,r
          assert r["checks"]["expanded_portfolio_has_three_genes"] is True,r
          assert r["checks"]["h2_retains_all_three_task_families"] is True,r
          assert r["checks"]["new_gene_removal_breaks_only_new_family"] is True,r
          assert r["canonical_mutation"] is False,r
          assert r["generation_transition"] is False,r
          print(r["status"],r["invented"]["gene"]["gene_id"])
          PY
      - name: Canonical guard after adaptive cycle
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist adaptive cycle evidence
        run: |
          git config user.name "YADO G2 Adaptive Evolution Gate"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-portfolio-deficit-invention-cycle-v1.json
          git diff --cached --quiet || git commit -m "Persist adaptive portfolio deficit invention evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-g2-portfolio-deficit-invention-cycle-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-portfolio-deficit-invention-cycle-v1.json
