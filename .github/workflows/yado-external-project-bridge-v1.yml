name: YADO External Project Bridge V1

on:
  pull_request:
    paths:
      - "runtime/yado_external_project_bridge_v1.py"
      - "runtime/test_yado_external_project_bridge_v1.py"
      - "architecture/yado-external-project-bridge-v1.json"
      - "candidates/yado_external_project_bridge_candidate_v1.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m py_compile runtime/yado_external_project_bridge_v1.py runtime/test_yado_external_project_bridge_v1.py candidates/yado_external_project_bridge_candidate_v1.py
      - run: |
          PYTHONPATH=runtime:. python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location("bridge_tests", "runtime/test_yado_external_project_bridge_v1.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in sorted(name for name in dir(module) if name.startswith("test_")):
              getattr(module, name)()
              print("PASS", name)
          PY
