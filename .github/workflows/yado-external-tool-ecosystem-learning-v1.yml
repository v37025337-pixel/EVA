name: YADO External Tool Ecosystem Aggregation V1

on:
  pull_request:
    branches: [main]
    paths:
      - "runtime/yado_external_tool_ecosystem_learning_v1.py"
      - "runtime/yado_unified_core_external_tool_ecosystem_learning_v1.py"
      - "runtime/test_yado_external_tool_ecosystem_learning_v1.py"
      - "architecture/yado-external-tool-ecosystem-learning-20260918.json"
      - ".github/workflows/yado-external-tool-ecosystem-learning-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-tool-ecosystem-aggregation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Compile aggregate and existing bindings
        env:
          PYTHONPATH: runtime
        run: |
          python -m py_compile \
            runtime/yado_external_tool_ecosystem_learning_v1.py \
            runtime/yado_unified_core_external_tool_ecosystem_learning_v1.py \
            runtime/test_yado_external_tool_ecosystem_learning_v1.py \
            runtime/yado_exa_mcp_web_research_v1.py \
            runtime/yado_external_project_bridge_v1.py

      - name: Run aggregate and existing focused tests
        env:
          PYTHONPATH: runtime:.
        run: |
          python -m unittest runtime.test_yado_external_tool_ecosystem_learning_v1 -v
          python -m unittest runtime.test_yado_exa_mcp_web_research_v1 -v
          python - <<'PY'
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "bridge_tests",
              "runtime/test_yado_external_project_bridge_v1.py",
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in sorted(name for name in dir(module) if name.startswith("test_")):
              getattr(module, name)()
              print("PASS", name)
          PY

      - name: Fresh read of four public repositories
        env:
          PYTHONPATH: runtime
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from pathlib import Path

          from yado_external_tool_ecosystem_learning_v1 import ExternalToolEcosystemLearningV1

          def fetch(url: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "YADO-read-only-evidence/1.0",
                      "Accept": "application/vnd.github+json,text/plain,*/*",
                  },
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  content = response.read().decode("utf-8", errors="replace")
              return {
                  "content": content,
                  "receipt": {
                      "read_only": True,
                      "credentials_used": False,
                      "external_write": False,
                      "private_network_access": False,
                      "downloaded_code_executed": False,
                      "sha256": hashlib.sha256(content.encode("utf-8")).hexdigest(),
                  },
              }

          result = ExternalToolEcosystemLearningV1().study(fetch, repo_root=".")
          assert result["status"] == "PASS_SHADOW_EXTERNAL_TOOL_ECOSYSTEM_AGGREGATION_V1", result
          assert result["component_bindings"]["status"] == "PASS", result
          assert result["component_bindings"]["new_third_party_adapter_count"] == 0, result
          assert result["verified_source_count"] == 4, result
          assert result["evidence_gate"]["status"] == "PASS", result
          assert result["third_party_code_executed"] is False
          assert result["third_party_code_copied"] is False
          assert result["automatic_install"] is False
          assert result["automatic_canonical_mutation"] is False

          evidence = {
              "schema": "yado.external_tool_ecosystem_aggregation.real_run.v1",
              "status": result["status"],
              "commit": os.environ.get("GITHUB_SHA"),
              "verified_source_count": result["verified_source_count"],
              "withheld_sources": result["withheld_sources"],
              "component_bindings": result["component_bindings"],
              "evidence_gate": result["evidence_gate"],
              "study_digest": result["study_digest"],
              "reuses_existing_components": result["reuses_existing_components"],
              "new_third_party_adapter_count": result["new_third_party_adapter_count"],
              "third_party_code_executed": False,
              "third_party_code_copied": False,
              "credentials_used": False,
              "external_writes": False,
              "automatic_install": False,
              "automatic_canonical_mutation": False
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "yado-external-tool-ecosystem-aggregation-v1.json"
          out.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Preserve aggregate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-external-tool-ecosystem-aggregation-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/yado-external-tool-ecosystem-aggregation-v1.json
          if-no-files-found: error
