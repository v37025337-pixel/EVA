name: YADO G2 Task Conditioned Source Binding V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-task-conditioned-source-binding-v1-request.json"]
permissions: {contents: write}
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_task_conditioned_source_binding_v1.py
      - name: Run task-conditioned source binding
        continue-on-error: true
        run: python runtime/yado_g2_task_conditioned_source_binding_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist binding evidence
        if: always()
        run: |
          git config user.name "YADO Task Conditioned Source Binding V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-task-conditioned-source-binding-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-task-conditioned-source-binding-v1.json 2>/dev/null || true
          git add candidates/g2-self-evolution/task_conditioned_source_binding_v1_goal_*.py 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO task-conditioned source binding V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce binding verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-task-conditioned-source-binding-v1.json")
          if not p.exists():raise SystemExit("MISSING_BINDING_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_TASK_CONDITIONED_SOURCE_BINDING_V1":
              raise SystemExit("BINDING_WITHHOLD:"+r["next_required_capability"])
          assert r["checks"]["two_goal_fresh_exact"] is True,r
          assert r["checks"]["two_different_goal_sources"] is True,r
          assert r["checks"]["policy_ablation_blocks_source"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          print(r["status"],r["gene_id"],r["next_required_capability"])
          PY
