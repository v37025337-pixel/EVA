name: YADO G2 Coding Apprenticeship V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-coding-apprenticeship-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-coding-apprenticeship-v1
  cancel-in-progress: true
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before apprenticeship
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile apprenticeship runtime
        run: python -m py_compile runtime/yado_g2_coding_apprenticeship_v1.py
      - name: Run coding apprenticeship
        id: train
        continue-on-error: true
        run: python runtime/yado_g2_coding_apprenticeship_v1.py
      - name: Canonical guard after apprenticeship
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist coding experience
        if: always()
        run: |
          git config user.name "YADO Coding Apprenticeship"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-coding-apprenticeship-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-coding-cognitive-layer-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO coding apprenticeship experience [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest apprenticeship verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-coding-cognitive-layer-v1.json")
          if not p.exists():raise SystemExit("MISSING_CODING_APPRENTICESHIP_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          assert c["third_party_code_executed"] is False,r
          assert c["external_coding_model_used"] is False,r
          assert c["ready_patch_from_host_used"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_CODING_APPRENTICESHIP_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"]+":"+str(r["next_required_capability"]))
          print(r["status"],r["repair_fresh_exact_rate"],r["write_fresh_exact_rate"],r["fresh_scores"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-coding-apprenticeship-v1-${{ github.run_id }}
          path: |
            experience/yado-coding-apprenticeship-v1.json
            candidates/kernel-self-generated/g2-coding-cognitive-layer-v1.json
          if-no-files-found: warn
