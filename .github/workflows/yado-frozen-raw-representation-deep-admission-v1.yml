name: YADO Frozen Raw Representation Deep Admission V1

on:
  push:
    branches: [yado-causal-ablation-cycle-v1]
    paths:
      - 'runtime/yado_raw_task_representation_residual_repair_v3.py'
      - 'runtime/yado_residual_repair_synthesis_v3.py'
      - 'runtime/yado_raw_task_representation_frozen_candidate_v3.py'
      - 'runtime/yado_raw_task_representation_frozen_deep_admission_v1.py'
      - '.github/workflows/yado-frozen-raw-representation-deep-admission-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deepest-candidate-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify shadow ancestry and read-only admission context
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/yado-frozen-raw-representation-deep-admission-v1.yml').read_text()
          assert 'contents: read' in text
          assert 'git push' not in text
          print('PASS_SHADOW_ANCESTRY_READ_ONLY_CONTEXT')
          PY

      - name: Compile selected family and frozen candidate
        run: |
          python -m py_compile \
            runtime/yado_raw_task_representation_candidate_v3.py \
            runtime/yado_raw_task_representation_robustness_v4.py \
            runtime/yado_raw_task_representation_residual_repair_v3.py \
            runtime/yado_residual_repair_synthesis_v3.py \
            runtime/yado_raw_task_representation_frozen_candidate_v3.py \
            runtime/yado_raw_task_representation_frozen_deep_admission_v1.py

      - name: Reproduce the selection that was frozen
        run: |
          python runtime/yado_residual_repair_synthesis_v3.py --out "$RUNNER_TEMP/reproduced-selection.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          from runtime.yado_raw_task_representation_frozen_candidate_v3 import FrozenResidualRepairCandidateV3
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'reproduced-selection.json').read_text())
          assert r['status']=='PASS_SHADOW_RESIDUAL_REPAIR_SYNTHESIS_V3',r
          assert r['search']['selected']['policy']==FrozenResidualRepairCandidateV3.SELECTED_POLICY,r
          assert r['receipt_sha256']==FrozenResidualRepairCandidateV3.SELECTION_RECEIPT_SHA256,(r['receipt_sha256'],FrozenResidualRepairCandidateV3.SELECTION_RECEIPT_SHA256)
          assert r['search']['selected']['regression_ok'] is True,r
          print('PASS_FROZEN_SELECTION_REPRODUCED',r['receipt_sha256'])
          PY

      - name: Run second post-freeze raw-representation admission holdout
        run: |
          python runtime/yado_raw_task_representation_frozen_deep_admission_v1.py \
            --out candidates/autonomous/yado-raw-task-representation-frozen-deep-admission-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('candidates/autonomous/yado-raw-task-representation-frozen-deep-admission-v1.json').read_text())
          assert r['status']=='PASS_SHADOW_FROZEN_RAW_REPRESENTATION_DEEP_ADMISSION_V1',r
          assert r['gate']['regression_preserved'] is True,r
          assert r['gate']['deep_fresh_all_families_preserved'] is True,r
          assert r['gate']['deep_fresh_positive_gain'] is True,r
          assert r['gate']['admit_to_canonical'] is False,r
          assert r['canonical_mutation'] is False,r
          assert r['self_selected_next_action']=='RUN_NATIVE_CORE_DEEP_AUDIT_FRESH_SUCCESSOR_AND_COMPLETE_170_REGRESSION',r
          print('PASS_SECOND_POST_FREEZE_HOLDOUT',json.dumps({
            'delta':r['deep_fresh_holdout']['delta'],
            'improved_family_count':r['deep_fresh_holdout']['improved_family_count'],
            'receipt_sha256':r['receipt_sha256'],
          },sort_keys=True))
          PY

      - name: Re-run complete V1 through V6 proof chain
        run: |
          python runtime/yado_external_source_evolution_v1.py
          python runtime/yado_autonomous_meta_source_evolution_v2.py
          python runtime/yado_autonomous_grammar_extension_v3.py
          python runtime/yado_autonomous_meta_grammar_evolution_v4.py
          python runtime/yado_autonomous_external_library_discovery_v5.py
          python runtime/yado_autonomous_open_catalog_discovery_v6.py

      - name: Verify fresh V1 through V6 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected={
            'yado-external-source-evolution-v1.json':'PASS_SHADOW_G2_EXTERNAL_SOURCE_EVOLUTION_V1',
            'yado-autonomous-meta-source-evolution-v2.json':'PASS_SHADOW_G2_AUTONOMOUS_META_SOURCE_EVOLUTION_V2',
            'yado-autonomous-grammar-extension-v3.json':'PASS_SHADOW_G2_AUTONOMOUS_GRAMMAR_EXTENSION_V3',
            'yado-autonomous-meta-grammar-evolution-v4.json':'PASS_SHADOW_G2_AUTONOMOUS_META_GRAMMAR_EVOLUTION_V4',
            'yado-autonomous-external-library-discovery-v5.json':'PASS_SHADOW_G2_AUTONOMOUS_EXTERNAL_LIBRARY_DISCOVERY_V5',
            'yado-autonomous-open-catalog-discovery-v6.json':'PASS_SHADOW_G2_AUTONOMOUS_OPEN_CATALOG_DISCOVERY_V6',
          }
          for name,status in expected.items():
              row=json.loads((Path('receipts')/name).read_text())
              assert row['status']==status,(name,row.get('status'))
          v5=json.loads(Path('receipts/yado-autonomous-external-library-discovery-v5.json').read_text())
          v6=json.loads(Path('receipts/yado-autonomous-open-catalog-discovery-v6.json').read_text())
          for row in (v5,v6):
              g=row['gates']
              assert g['artifact_digest_verified'] is True
              assert g['external_write_methods_used'] is False
              assert g['credentials_used'] is False
              assert g['external_models_used'] is False
              assert g['canonical_mutation'] is False
          assert v6['discovery']['candidate_names_host_provided'] is False
          assert v6['selection']['host_provided_selected_package'] is False
          assert v6['artifact_connection']['wheel_metadata']['host_provided_dependency_name'] is False
          assert v6['sealed_validation']['matched'] is True
          assert v6['sealed_validation']['selection_data_used'] is False
          print('PASS_FRESH_V1_V6_EVIDENCE_CHAIN')
          PY

      - name: Reconstruct inherited runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Parse canonical architecture and receipt JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          count=0
          for root in (Path('canonical'),Path('architecture'),Path('receipts')):
              for p in root.rglob('*.json'):
                  json.loads(p.read_text(encoding='utf-8'))
                  count+=1
          assert count>500,count
          print('PASS_JSON_PARSE_COUNT',count)
          PY

      - name: Compile all active and candidate Python layers
        run: python -m compileall -q runtime successor candidates/g2-self-evolution candidates/autonomous

      - name: Run native UnifiedYADOCoreV1 audit
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_unified_core_v1 import UnifiedYADOCoreV1
          core=UnifiedYADOCoreV1(Path('.'))
          report=core.audit()
          assert report['pass'] is True,report
          assert all(report['checks'].values()),report['checks']
          assert report['generation']=='G2_CANDIDATE_TRCG_V1'
          print('PASS_NATIVE_UNIFIED_CORE_AUDIT')
          PY

      - name: Run deepest unified-core self audit
        run: |
          python runtime/yado_unified_core_deep_self_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime/yado_unified_core_deep_self_audit_v1_receipt.json').read_text())
          assert r['status']=='PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1',r['status']
          assert r['summary']['blocking_findings']==0,r['summary']
          assert r['canonical_mutation'] is False
          assert r['g3_genesis_performed'] is False
          print('PASS_DEEPEST_UNIFIED_CORE_SELF_AUDIT',r['summary'])
          PY
          git checkout -- architecture/evolution-ledger.json
          git diff --exit-code -- canonical architecture/evolution-ledger.json

      - name: Run full kernel audit after deep audit restoration
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          assert r['canonical']['ledger_validation']=='PASS'
          assert r['canonical']['g3_genesis_performed'] is False
          print('PASS_FULL_KERNEL_AUDIT')
          PY

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression
        run: |
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==170,r
          assert not r['failures'] and not r['errors'] and not r['skipped']
          assert r['source_unchanged'] is True
          print('PASS_COMPLETE_REGRESSION_170_OF_170')
          PY

      - name: Repeat frozen candidate admission decision
        run: |
          cp candidates/autonomous/yado-raw-task-representation-frozen-deep-admission-v1.json "$RUNNER_TEMP/first-deep.json"
          python runtime/yado_raw_task_representation_frozen_deep_admission_v1.py --out "$RUNNER_TEMP/second-deep.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((root/'first-deep.json').read_text())
          b=json.loads((root/'second-deep.json').read_text())
          assert a['status']==b['status']
          assert a['frozen_candidate']==b['frozen_candidate']
          assert a['deep_fresh_holdout']==b['deep_fresh_holdout']
          assert a['receipt_sha256']==b['receipt_sha256']
          print('PASS_REPRODUCIBLE_FROZEN_DEEP_ADMISSION',a['receipt_sha256'])
          PY

      - name: Final canonical immutability and readiness receipt
        run: |
          git diff --exit-code -- canonical architecture/evolution-ledger.json
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          candidate=json.loads(Path('candidates/autonomous/yado-raw-task-representation-frozen-deep-admission-v1.json').read_text())
          audit=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          regression=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          receipt={
            'schema':'yado.g2.frozen_raw_representation_deep_admission_readiness.v1',
            'status':'PASS_SHADOW_DEEP_ADMISSION_READY_NOT_CANONICAL',
            'candidate_component':candidate['frozen_candidate']['component_id'],
            'candidate_policy':candidate['frozen_candidate']['selected_policy'],
            'candidate_receipt_sha256':candidate['receipt_sha256'],
            'full_kernel_audit_status':audit['status'],
            'full_kernel_findings':audit['findings'],
            'regression_status':regression['status'],
            'regression_tests_run':regression['tests_run'],
            'canonical_mutation':False,
            'automatic_main_mutation':False,
            'admitted_to_canonical':False,
            'next_action':'PREPARE_EXPLICIT_CANONICAL_INTEGRATION_PATCH_AND_REAUDIT_BEFORE_MAIN_ADMISSION',
            'semantic_boundary':'Admission readiness only; candidate is not yet integrated into UnifiedYADOCoreV1 or canonical registries.',
          }
          receipt['receipt_sha256']=hashlib.sha256(json.dumps(receipt,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          p=Path('candidates/autonomous/yado-frozen-raw-representation-deep-admission-readiness-v1.json')
          p.write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print(json.dumps(receipt,sort_keys=True))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-frozen-raw-representation-deep-admission-v1-${{ github.run_id }}
          path: |
            candidates/autonomous/yado-raw-task-representation-frozen-deep-admission-v1.json
            candidates/autonomous/yado-frozen-raw-representation-deep-admission-readiness-v1.json
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
