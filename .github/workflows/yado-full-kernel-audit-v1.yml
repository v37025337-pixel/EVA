name: YADO Full Kernel Audit V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-full-kernel-audit-v1-request.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch all branch refs
        run: git fetch --all --prune
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8/V36 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile audit
        run: python -m py_compile runtime/yado_full_kernel_audit_v1.py
      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Persist audit report only
        run: |
          git config user.name "YADO Full Kernel Audit"
          git config user.email "actions@users.noreply.github.com"
          git add audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md
          git commit -m "Persist YADO full kernel audit V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-full-kernel-audit-v1-${{ github.run_id }}
          path: |
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
