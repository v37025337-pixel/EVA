name: YADO Full Kernel Audit V1
on:
  push:
    branches: [main, yado-architecture-shadow-search, yado-main-selective-admission-v1, yado-main-experience-refresh-v1]
    paths:
      - "architecture/yado-full-kernel-audit-v1-request.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch all branch refs
        run: git fetch --all --prune
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8/V36 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime and audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile audit
        run: python -m py_compile runtime/yado_full_kernel_audit_v1.py
      - name: Compile accumulated-experience refresh
        run: >
          python -m py_compile
          runtime/yado_g2_global_historical_experience_census_v2.py
          runtime/yado_g2_terminal_logic_historical_transfer_v1.py
      - name: Rebuild historical experience census from all refs
        run: python runtime/yado_g2_global_historical_experience_census_v2.py
      - name: Re-run native historical transfer on expanded experience
        id: historical_transfer
        continue-on-error: true
        run: python runtime/yado_g2_terminal_logic_historical_transfer_v1.py
      - name: Report historical transfer verdict
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-global-experience-terminal-logic-historical-transfer-v1.json")
          if not p.exists():
              raise SystemExit("MISSING_HISTORICAL_TRANSFER_REPORT")
          r=json.loads(p.read_text())
          print(r["status"])
          print("terminal_historical_fresh",r.get("terminal_historical_fresh"))
          print("terminal_historical_pass_recall",r.get("terminal_historical_pass_recall"))
          print("terminal_historical_withhold_recall",r.get("terminal_historical_withhold_recall"))
          print("cognitive_historical_fresh",r.get("cognitive_historical_fresh"))
          print("next_required_capability",r.get("next_required_capability"))
          PY
      - name: Run top-level regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Persist audit report only
        run: |
          git config user.name "YADO Full Kernel Audit"
          git config user.email "actions@users.noreply.github.com"
          git add audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md
          git add experience/yado-global-historical-experience-corpus-v2.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-global-historical-experience-census-v2.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-global-experience-terminal-logic-historical-transfer-v1.json 2>/dev/null || true
          git add experience/yado-global-experience-terminal-logic-historical-transfer-v1.json 2>/dev/null || true
          git commit -m "Persist YADO accumulated-experience refresh evidence [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-full-kernel-audit-v1-${{ github.run_id }}
          path: |
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
