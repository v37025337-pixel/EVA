name: YADO RC8 runtime overlay contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-rc8-runtime-overlay-contract-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Inspect active organ model load and direct predictors
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          wanted={
            'yado_core_v3_0_rc3_autoevolution.py':{
              'organ_autoevolution_models','logic_evolved_decision','thinking_evolved_plan',
              'intelligence_evolved_strategy','unified_snapshot'
            },
            'yado_algorithm_component_runtime_native_v1.py':{
              'predict_logic_component','predict_intel_component','thinking_component_acc','_thinking_predict'
            },
          }
          for fn,names in wanted.items():
            p=Path(fn); txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            print('\n====',fn,'====')
            for n in tree.body:
              if isinstance(n,ast.FunctionDef) and n.name in names:
                print('\n---',n.name,'---')
                print(ast.get_source_segment(txt,n))
              elif isinstance(n,ast.ClassDef):
                for m in n.body:
                  if isinstance(m,ast.FunctionDef) and m.name in names:
                    print('\n---',n.name+'.'+m.name,'---')
                    print(ast.get_source_segment(txt,m))
          PY
