name: YADO G2 Cognitive Temporal Kernel Fresh Gate V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-cognitive-temporal-kernel-v1-request.json"
permissions:
  contents: write
jobs:
  fresh-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before shadow temporal gate
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile temporal kernel and fabric V3
        run: python -m py_compile runtime/yado_g2_cognitive_clock_v1.py runtime/yado_g2_unified_execution_fabric_v3.py runtime/yado_g2_cognitive_temporal_kernel_fresh_gate_v1.py
      - name: Run fresh temporal kernel gate
        run: python runtime/yado_g2_cognitive_temporal_kernel_fresh_gate_v1.py
      - name: Require temporal kernel PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-cognitive-temporal-kernel-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_COGNITIVE_TEMPORAL_KERNEL_V1",r
          assert all(r["checks"].values()),r
          assert r["canonical_mutation"] is False,r
          assert r["generation_transition"] is False,r
          print(r["status"],r["memory_snapshot"]["temporal"])
          PY
      - name: Canonical guard after shadow temporal gate
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist shadow temporal evidence
        run: |
          git config user.name "YADO G2 Temporal Kernel Gate"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-cognitive-temporal-kernel-v1.json
          git diff --cached --quiet || git commit -m "Persist cognitive temporal kernel V1 fresh evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-cognitive-temporal-kernel-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-cognitive-temporal-kernel-v1.json
