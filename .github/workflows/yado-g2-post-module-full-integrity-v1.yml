name: YADO G2 Post Module Full Integrity V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-post-module-full-integrity-v1-request.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile module and integrity audits
        run: python -m py_compile runtime/yado_g2_unified_module_kernel_v1.py runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py runtime/yado_g2_post_module_full_integrity_v1.py
      - name: Re-run 25-module interaction gate
        run: python runtime/yado_g2_unified_module_kernel_fresh_gate_v1.py
      - name: Run post-module full integrity and dependency graph
        run: python runtime/yado_g2_post_module_full_integrity_v1.py
      - name: Kernel-native self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Require kernel-native audit
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert r["overall_verdict"]=="PASS_WITH_LIMITATIONS",r
          assert r["summary"]["blocking_findings"]==0,r
          print(r["overall_verdict"],r["summary"])
          PY
      - name: Final canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist integrity evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_unified_core_deep_self_audit_v1_receipt.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Integrity Audit"
          git config user.email "actions@users.noreply.github.com"
          git add audits/yado-g2-post-module-full-integrity-v1.json audits/yado-g2-module-dependency-graph-v1.json candidates/kernel-self-generated/g2-unified-module-kernel-v1.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git diff --cached --quiet || git commit -m "Persist post-module G2 full integrity evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-post-module-full-integrity-v1-${{ github.run_id }}
          path: |
            audits/yado-g2-post-module-full-integrity-v1.json
            audits/yado-g2-module-dependency-graph-v1.json
            candidates/kernel-self-generated/g2-unified-module-kernel-v1.json
