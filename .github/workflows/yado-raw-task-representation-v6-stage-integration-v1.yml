name: YADO Raw Task Representation V6 Stage Integration V1

on:
  push:
    branches: [yado-causal-ablation-cycle-v1]
    paths:
      - '.github/workflows/yado-raw-task-representation-v6-stage-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify shadow ancestry and unchanged main base
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "011c85ee09f89217e30b6463eeb598b0f9e48c94"
          git merge-base --is-ancestor origin/main HEAD
          echo PASS_INTEGRATION_BASE

      - name: Build exact staged canonical integration
        run: python runtime/yado_integrate_raw_task_representation_v6.py

      - name: Compile integrated runtime
        run: |
          python -m py_compile \
            runtime/yado_raw_task_representation_residual_repair_v3.py \
            runtime/yado_raw_task_representation_canonical_v6.py \
            runtime/yado_unified_core_v1.py \
            runtime/yado_integrate_raw_task_representation_v6.py

      - name: Validate ledger and canonical invariant guard before commit
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_evolution_ledger_v2 import validate_ledger_v2
          ledger=json.loads(Path('architecture/evolution-ledger.json').read_text())
          print(validate_ledger_v2(ledger))
          PY
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Install native runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt

      - name: Run native unified-core audit on staged files
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_unified_core_v1 import UnifiedYADOCoreV1
          r=UnifiedYADOCoreV1(Path('.')).audit()
          assert r['pass'] is True,r
          print('PASS_NATIVE_UNIFIED_CORE_V6_STAGED',r['current_frontier'])
          PY

      - name: Commit staged integration to shadow only
        run: |
          git status --short
          git config user.name "YADO V6 Integration"
          git config user.email "actions@users.noreply.github.com"
          git add \
            runtime/yado_unified_core_v1.py \
            canonical/yado-raw-task-representation-v6.json \
            canonical/yado-unified-core-v1.json \
            canonical/yado-main-head-g2.json \
            canonical/yado-algorithm-provenance-registry-v1.json \
            architecture/evolution-ledger.json \
            receipts/yado-g2-raw-representation-v6-integration-v1.json
          git diff --cached --exit-code && { echo NO_INTEGRATION_DIFF; exit 1; } || true
          git commit -m "Stage G2 raw task representation V6 canonical integration [skip ci]"
          git push origin HEAD:yado-causal-ablation-cycle-v1
