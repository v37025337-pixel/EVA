name: YADO G2 Integrity And Branch History Closure Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-integrity-branch-closure-repair-v1-request.json"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run G2 control-plane integrity and branch-history closure repair
        run: python runtime/yado_g2_integrity_branch_closure_repair_v1.py
      - name: Persist repaired canonical state and receipt
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_integrity_branch_closure_repair_v1_receipt.json "receipts/yado-g2-integrity-branch-closure-repair-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Integrity Repair"
          git config user.email "actions@users.noreply.github.com"
          git add canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-unified-experience-registry-v1.json canonical/yado-unified-context-kernel-v1.json architecture/evolution-ledger.json "receipts/yado-g2-integrity-branch-closure-repair-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Repair G2 control plane and close legacy branches as history [skip ci]"
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce repair receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_integrity_branch_closure_repair_v1_receipt.json"))
          assert r["status"]=="PASS_G2_INTEGRITY_BRANCH_HISTORY_CLOSURE_REPAIR_V1",r
          assert all(r["checks"].values()),r
          print(r["frontier"],r["historical_branch_count"])
          PY
