name: YADO Autonomous Grammar Extension V3

on:
  workflow_dispatch:
  push:
    branches:
      - yado-autonomous-grammar-extension-v3
    paths:
      - 'runtime/yado_autonomous_grammar_extension_v3.py'
      - 'architecture/yado-autonomous-grammar-extension-v3.json'
      - '.github/workflows/yado-autonomous-grammar-extension-v3.yml'
  pull_request:
    branches:
      - yado-autonomous-meta-source-evolution-v2
    paths:
      - 'runtime/yado_autonomous_grammar_extension_v3.py'
      - 'architecture/yado-autonomous-grammar-extension-v3.json'
      - '.github/workflows/yado-autonomous-grammar-extension-v3.yml'

permissions:
  contents: read

jobs:
  autonomous-grammar-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile inherited controllers and V3
        run: python -m py_compile runtime/yado_external_source_evolution_v1.py runtime/yado_autonomous_meta_source_evolution_v2.py runtime/yado_autonomous_grammar_extension_v3.py

      - name: Run autonomous mutation-grammar extension
        run: python runtime/yado_autonomous_grammar_extension_v3.py

      - name: Verify frozen V3 grammar evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('receipts/yado-autonomous-grammar-extension-v3.json').read_text())
          assert report['status'] == 'PASS_SHADOW_G2_AUTONOMOUS_GRAMMAR_EXTENSION_V3', report['status']
          assert report['fresh_scope']['training_cases'] == 4
          assert report['fresh_scope']['sealed_cases'] == 2
          assert report['fresh_scope']['sealed_not_used_for_grammar_selection'] is True
          assert report['target_selection']['origin'] == 'META_GRAMMAR_RUNTIME_FAILURE_TRACE'
          assert report['target_selection']['selected_path'] == 'runtime/yado_autonomous_meta_source_evolution_v2.py'
          assert report['target_selection']['host_provided_target_path'] is False
          assert report['grammar_extension']['selected_operator'] == 'adjacent_run_fold'
          assert report['gates']['parent_meta_grammar_rejected_fresh_signature'] is True
          assert report['gates']['new_operator_absent_in_parent_grammar'] is True
          assert report['gates']['new_operator_present_in_candidate_grammar'] is True
          assert report['gates']['candidate_grammar_source_changed'] is True
          assert report['gates']['candidate_solver_source_changed'] is True
          assert report['gates']['candidate_grammar_frozen_before_sealed_eval'] is True
          assert report['gates']['candidate_solver_frozen_before_sealed_eval'] is True
          assert report['gates']['fresh_sealed_uuid_leak_count'] == 0
          assert report['gates']['external_models_used'] is False
          assert report['gates']['canonical_mutation'] is False
          assert report['metrics']['parent_training']['score'] == 0.0
          assert report['metrics']['candidate_training']['score'] == 1.0
          assert report['metrics']['sealed_parent']['score'] == 0.0
          assert report['metrics']['sealed_candidate']['score'] == 1.0
          assert report['metrics']['sealed_absolute_gain'] == 1.0
          assert report['metrics']['v1_external_sealed_retention']['score'] == 1.0
          assert report['metrics']['v2_external_sealed_retention']['score'] == 1.0
          for key in ('candidate_grammar_controller', 'candidate_solver'):
              path = Path(report[key]['path'])
              compile(path.read_text(), str(path), 'exec')
          print('PASS_AUTONOMOUS_GRAMMAR_EXTENSION_V3_EVIDENCE_GATE')
          PY

      - name: Reconstruct inherited runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile complete runtime and generated shadow sources
        run: python -m compileall -q runtime successor candidates/g2-self-evolution

      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"

      - name: Upload V3 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-autonomous-grammar-extension-v3-${{ github.run_id }}
          path: |
            architecture/yado-autonomous-grammar-extension-v3.json
            receipts/yado-autonomous-grammar-extension-v3.json
            candidates/g2-self-evolution/yado_autonomous_grammar_*_v3.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
