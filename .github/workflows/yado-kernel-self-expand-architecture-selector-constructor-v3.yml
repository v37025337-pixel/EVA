name: YADO Kernel Self Expand Architecture Selector Constructor V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-expand-architecture-selector-constructor-v3-request.json"
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Execute kernel-selected REACTION_NORM V3
        run: python runtime/yado_kernel_self_expand_architecture_selector_constructor_v3.py
      - name: Persist V3 evidence
        if: always()
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_self_expand_architecture_selector_constructor_v3_receipt.json "receipts/yado-kernel-self-expand-architecture-selector-constructor-v3-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Reaction Norm V3"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/yado-kernel-self-expand-architecture-selector-constructor-v3.json architecture/evolution-ledger.json candidates/kernel-self-generated/architecture-neutral-selector-reaction-norm-v3.json "receipts/yado-kernel-self-expand-architecture-selector-constructor-v3-run-${GITHUB_RUN_ID}.json"
          if ! git diff --cached --quiet; then
            git commit -m "Persist G2 reaction-norm constructor V3 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_self_expand_architecture_selector_constructor_v3_receipt.json"))
          assert r["status"]=="PASS_KERNEL_SELF_EXPAND_ARCHITECTURE_SELECTOR_CONSTRUCTOR_V3",r
          print(r["candidate_state"],r["next_required_capability"])
          PY
