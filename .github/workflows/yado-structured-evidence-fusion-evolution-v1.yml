name: YADO Structured Evidence Fusion Evolution V1

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - 'runtime/yado_structured_evidence_fusion_evolution_v1.py'
      - 'runtime/yado_cross_disciplinary_internet_learning_v1.py'
      - 'runtime/yado_endogenous_research_apply_v1.py'
      - 'architecture/yado-cross-disciplinary-internet-learning-v1.json'
      - 'architecture/yado-structured-evidence-fusion-evolution-v1.json'
      - '.github/workflows/yado-structured-evidence-fusion-evolution-v1.yml'

permissions:
  contents: read

jobs:
  live-data-fusion-genesis-and-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare verified kernel
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Acquire fresh structured and cross-disciplinary public data
        run: |
          mkdir -p artifacts
          python runtime/yado_cross_disciplinary_internet_learning_v1.py --self-test
          python runtime/yado_cross_disciplinary_internet_learning_v1.py \
            --config architecture/yado-cross-disciplinary-internet-learning-v1.json \
            --self-model architecture/developmental-self-model-overlay.json \
            --out artifacts/yado-cross-disciplinary-internet-learning-v1.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/yado-cross-disciplinary-internet-learning-v1.json'))
          assert r['status']=='PASS_REAL_INTERNET_CROSS_DISCIPLINARY_EXPERIENCE',r
          assert r['acquisition']['fetched_sources']>=10,r
          assert r['acquisition']['structured_sources_fetched']>=3,r
          assert len(r['acquisition']['structured_disciplines'])>=3,r
          assert r['acquisition']['raw_json_payload_persisted'] is False,r
          assert r['safety_boundary']['structured_remote_payload_executed'] is False,r
          print('PASS_LIVE_STRUCTURED_PUBLIC_DATA',r['acquisition']['structured_sources_fetched'],r['acquisition']['structured_disciplines'],r['evidence_digest'])
          PY

      - name: Bind public data into endogenous causal experience
        run: |
          python runtime/yado_endogenous_research_apply_v1.py
          python - <<'PY'
          import json
          r=json.load(open('candidates/cognitive/yado-endogenous-research-apply-v1.json'))
          assert r['status']=='PASS_ENDOGENOUS_RESEARCH_EXPERIENCE_BINDING_V1',r
          assert r['structured_sources_fetched']>=3,r
          assert len(r['structured_disciplines'])>=3,r
          assert r['structured_raw_payload_persisted'] is False,r
          assert r['credentials_used'] is False and r['external_writes'] is False,r
          print('PASS_STRUCTURED_EXPERIENCE_BINDING',r['experience_digest'],r['fact_count'])
          PY

      - name: Evolve new structured evidence fusion capability with causal ablation
        run: |
          python runtime/yado_structured_evidence_fusion_evolution_v1.py
          python - <<'PY'
          import json
          r=json.load(open('candidates/cognitive/yado-structured-evidence-fusion-evolution-v1.json'))
          assert r['status']=='PASS_SHADOW_STRUCTURED_EVIDENCE_FUSION_EVOLUTION_V1',r
          assert r['new_capability']=='MULTI_SOURCE_STRUCTURED_EVIDENCE_FUSION_V1',r
          assert r['selected_held_out']['score']==1.0,r
          assert r['selected_held_out']['score']>r['baseline_held_out']['score'],r
          assert r['no_experience_ablation']['causal_effect_observed'] is True,r
          assert r['no_experience_ablation']['held_out']['score']<r['selected_held_out']['score'],r
          assert r['experience_signal']['structured_sources_fetched']>=3,r
          assert r['raw_remote_payload_persisted'] is False,r
          print('PASS_NEW_STRUCTURED_FUSION_CAPABILITY',r['selected_policy'],r['candidate_sha256'])
          PY

      - name: Compile and independently replay emitted candidate source
        run: |
          python -m py_compile candidates/cognitive/yado_structured_evidence_fusion_candidate_v1.py
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('candidates/cognitive/yado_structured_evidence_fusion_candidate_v1.py')
          s=importlib.util.spec_from_file_location('fusion_candidate',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          rows=[
            {'source_id':'a','host':'a.test','value':10},
            {'source_id':'b','host':'b.test','value':11},
            {'source_id':'out','host':'c.test','value':30},
          ]
          result=m.fuse(rows,tolerance=5)
          assert result['status']=='FUSED',result
          assert result['median']==11.0,result
          assert result['divergent_sources']==['out'],result
          c=m.component()
          assert c['canonical_active'] is False and c['development_candidate'] is True,c
          print('PASS_INDEPENDENT_CANDIDATE_REPLAY',result,c['experience_binding'])
          PY

      - name: Full kernel audit with candidate kept outside canonical runtime
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          print('PASS_FULL_KERNEL_AUDIT')
          PY
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Fresh Successor build and complete regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/fusion-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/fusion-successor/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS_REGRESSION',r
          assert r['failures']==[] and r['errors']==[],r
          assert r['tests_run']>=200,r
          assert r['source_unchanged'] is True,r
          print('PASS_FULL_REGRESSION',r['tests_run'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-structured-evidence-fusion-evolution-v1-${{ github.run_id }}
          path: |
            architecture/yado-structured-evidence-fusion-evolution-v1.json
            artifacts/yado-cross-disciplinary-internet-learning-v1.json
            candidates/cognitive/yado-endogenous-research-apply-v1.json
            candidates/cognitive/yado-structured-evidence-fusion-evolution-v1.json
            candidates/cognitive/yado_structured_evidence_fusion_candidate_v1.py
            experience/autonomous/yado-autonomous-learning-latest.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
