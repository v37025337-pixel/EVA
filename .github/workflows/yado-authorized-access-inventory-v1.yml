name: YADO Authorized Access Inventory V1

on:
  workflow_dispatch:
  push:
    branches:
      - yado-deep-development-20260914
    paths:
      - runtime/yado_authorized_access_inventory_v1.py
      - runtime/test_yado_authorized_access_inventory_v1.py
      - architecture/yado-authorized-access-inventory-v1.json
      - successor/autonomous-run-request-20260914.json
      - .github/workflows/yado-authorized-access-inventory-v1.yml

permissions:
  contents: read

jobs:
  inventory-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile and unit-test access inventory
        run: |
          python -m py_compile runtime/yado_authorized_access_inventory_v1.py runtime/test_yado_authorized_access_inventory_v1.py
          PYTHONPATH=runtime python -m unittest runtime/test_yado_authorized_access_inventory_v1.py
      - name: Canonical invariant guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Build authorized access inventory
        env:
          YADO_MAILRU_USER: ${{ secrets.YADO_MAILRU_USER }}
          YADO_MAILRU_APP_PASSWORD: ${{ secrets.YADO_MAILRU_APP_PASSWORD }}
        run: |
          mkdir -p reports
          PYTHONPATH=runtime python runtime/yado_authorized_access_inventory_v1.py --output reports/yado-authorized-access-inventory-v1.json > /tmp/yado-access-inventory.log
          python - <<'PY'
          import json
          r=json.load(open('reports/yado-authorized-access-inventory-v1.json'))
          assert r['status']=='PASS_AUTHORIZED_ACCESS_INVENTORY', r
          p=r['policy']
          assert p['credential_value_capture'] is False
          assert p['credential_guessing'] is False
          assert p['credential_bypass'] is False
          assert p['secret_values_exposed'] is False
          print(json.dumps({
              'status': r['status'],
              'credential_reference_names': r['counts']['credential_reference_names'],
              'public_no_auth_endpoints': r['counts']['public_no_auth_endpoints'],
              'protected_access_profiles': r['counts']['protected_access_profiles'],
              'configured_credential_profiles': r['counts']['configured_credential_profiles'],
              'credential_names': [x['name'] for x in r['credential_references']],
          }, sort_keys=True))
          PY
      - name: Re-verify public external execution arms
        run: |
          PYTHONPATH=runtime python runtime/yado_public_sandbox_connect_v1.py --provider judge0 > reports/yado-access-judge0.json
          PYTHONPATH=runtime python runtime/yado_public_sandbox_connect_v1.py --provider runlet > reports/yado-access-runlet.json
          python - <<'PY'
          import json
          for path in ['reports/yado-access-judge0.json','reports/yado-access-runlet.json']:
              r=json.load(open(path))
              x=r['results'][0]
              assert x['connected'] is True and x['executed'] is True, (path, r)
          print('PASS_AUTHORIZED_PUBLIC_EXECUTION_ARMS')
          PY
      - name: Compile all Python layers
        run: python -m compileall -q runtime successor candidates
      - name: Full kernel audit
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[], r
          assert r['canonical']['canonical_guard']=='PASS', r
          print('PASS_AUTHORIZED_ACCESS_POST_INTEGRATION_KERNEL_AUDIT')
          PY
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-authorized-access-inventory-v1-${{ github.run_id }}
          path: |
            architecture/yado-authorized-access-inventory-v1.json
            reports/yado-authorized-access-inventory-v1.json
            reports/yado-access-judge0.json
            reports/yado-access-runlet.json
            audits/yado-full-kernel-audit-v1-report.json
