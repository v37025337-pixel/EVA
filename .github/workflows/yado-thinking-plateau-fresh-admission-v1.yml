name: YADO Thinking Plateau Fresh Admission V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-thinking-plateau-fresh-admission-v1-request.json]
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Admit
        id: admit
        continue-on-error: true
        run: python runtime/yado_thinking_plateau_fresh_admission_v1.py
      - name: Persist
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_thinking_plateau_fresh_admission_v1_receipt.json receipts/yado-thinking-plateau-fresh-admission-v1-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Thinking Plateau Admission'
          git config user.email 'actions@users.noreply.github.com'
          git add architecture/evolution-ledger.json receipts/yado-thinking-plateau-fresh-admission-v1-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO thinking plateau fresh admission V1 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_thinking_plateau_fresh_admission_v1_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_THINKING_PLATEAU_FRESH_ADMISSION_V1':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
