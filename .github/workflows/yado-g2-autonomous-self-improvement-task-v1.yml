name: YADO G2 Autonomous Self Improvement Task V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-autonomous-self-improvement-v1-request.json"
permissions:
  contents: write
jobs:
  self-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before autonomous task
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile autonomous task transport
        run: python -m py_compile runtime/yado_g2_autonomous_self_improvement_task_v1.py
      - name: Run kernel-native self improvement task
        run: python runtime/yado_g2_autonomous_self_improvement_task_v1.py
      - name: Require host non-interference invariants
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-autonomous-self-improvement-task-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_AUTONOMOUS_SELF_IMPROVEMENT_TASK_V1",r
          assert r["host_selected_target"] is False,r
          assert r["host_selected_gene"] is False,r
          assert r["host_selected_operator"] is False,r
          assert r["host_wrote_candidate_mechanism"] is False,r
          assert r["direct_priority_evidence"] is True,r
          assert r["selected_action"],r
          assert r["canonical_mutation"] is False,r
          assert r["canonical_head_unchanged"] is True,r
          print(r["status"],r["kernel_selected_next_step"],r["shadow_change_produced"])
          PY
      - name: Canonical guard after autonomous task
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist kernel result
        run: |
          git config user.name "YADO Autonomous Self Improvement"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-autonomous-self-improvement-task-v1.json
          git diff --cached --quiet || git commit -m "Persist kernel autonomous self-improvement task result [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-autonomous-self-improvement-task-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-autonomous-self-improvement-task-v1.json
