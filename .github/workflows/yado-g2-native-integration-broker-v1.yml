name: YADO G2 Native Integration Broker V1

on:
  push:
    branches:
      - yado-architecture-shadow-search
    paths:
      - architecture/yado-native-integration-broker-v1-request.json

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt

      - name: Canonical guard before integration broker
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Compile repaired integration broker
        run: |
          python -m py_compile runtime/yado_native_integration_broker_v1.py
          python -m py_compile runtime/yado_native_integration_broker_v1_1.py

      - name: Let YADO select, materialize, connect, integrate, and reuse
        run: python runtime/yado_native_integration_broker_v1_1.py

      - name: Compile generated adapter
        run: python -m py_compile candidates/kernel-self-generated/yado_native_http_json_adapter_v1.py

      - name: Enforce strict integration verdict
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('candidates/kernel-self-generated/g2-native-integration-broker-v1.json')
          q=pathlib.Path('candidates/kernel-self-generated/g2-native-integration-registry-v1.json')
          if not p.exists(): raise SystemExit('MISSING_INTEGRATION_REPORT')
          if not q.exists(): raise SystemExit('MISSING_INTEGRATION_REGISTRY')
          r=json.loads(p.read_text())
          g=json.loads(q.read_text())
          c=r['checks']
          assert r['status']=='PASS_SHADOW_G2_NATIVE_INTEGRATION_BROKER_V1', r
          assert r.get('broker_revision')=='V1_1_DUNDER_FREE_SUMMARY', r
          assert r['adapter_source_materialized_by_kernel'] is True, r
          assert r['candidate_source_sha256'], r
          assert c['resource_selected_by_broker'] is True, r
          assert c['semantic_ir_created'] is True, r
          assert c['adapter_source_compiles'] is True, r
          assert c['static_safety_gate_pass'] is True, r
          assert c['fresh_tests_pass'] is True, r
          assert c['selected_live_connection_pass'] is True, r
          assert c['live_json_parse_pass'] is True, r
          assert c['adapter_reused_on_second_resource'] is True, r
          assert c['get_only'] is True, r
          assert c['host_source_seed_used'] is False, r
          assert c['external_coding_models_used'] is False, r
          assert c['account_creation_attempted'] is False, r
          assert c['credential_bypass_attempted'] is False, r
          assert c['canonical_unchanged'] is True, r
          assert len([x for x in r['live_attempts'] if x.get('pass') is True]) >= 2, r
          assert all(x.get('status') == 200 for x in r['live_attempts'] if x.get('pass') is True), r
          assert g['status']=='PASS_SHADOW', g
          assert g['capabilities'][0]['state']=='SHADOW_VERIFIED', g
          assert g['capabilities'][0]['canonical_active'] is False, g
          print(r['status'], r['broker_revision'], r['candidate_source_sha256'], r['registry_digest'])
          PY

      - name: Canonical guard after integration broker
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Persist shadow integration evidence
        if: always()
        run: |
          git config user.name "YADO Native Integration Broker"
          git config user.email "actions@users.noreply.github.com"
          for p in \
            candidates/kernel-self-generated/g2-native-integration-broker-v1.json \
            candidates/kernel-self-generated/g2-native-integration-registry-v1.json \
            candidates/kernel-self-generated/yado_native_http_json_adapter_v1.py; do
            if [ -f "$p" ]; then git add "$p"; fi
          done
          git diff --cached --quiet || git commit -m "Persist repaired native integration broker evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-integration-broker-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-integration-broker-v1.json
            candidates/kernel-self-generated/g2-native-integration-registry-v1.json
            candidates/kernel-self-generated/yado_native_http_json_adapter_v1.py
          if-no-files-found: warn
