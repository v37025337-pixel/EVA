name: YADO Endogenous Deficit Bounded Repair Experiment V1

on:
  push:
    branches: [yado-endogenous-repair-experiment-v1]
    paths:
      - 'runtime/yado_endogenous_deficit_repair_experiment_v1.py'
      - '.github/workflows/yado-endogenous-deficit-repair-experiment-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Pin clean canonical baseline
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('runtime/yado_unified_core_deep_self_audit_v1_receipt.json').read_text())
          s=r['summary']
          assert r['status']=='PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1',r
          assert s['finding_count']==s['pass_findings']==21,s
          assert s['blocking_findings']==s['critical_failures']==s['high_failures']==s['partial_findings']==0,s
          assert r['self_selected_next_step'] is None,r['self_selected_next_step']
          print('PASS_CLEAN_BASELINE_BEFORE_ENDOGENOUS_REPAIR')
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile bounded repair experiment
        run: python -m py_compile runtime/yado_endogenous_deficit_repair_experiment_v1.py

      - name: Run repair experiment twice and require determinism
        run: |
          python runtime/yado_endogenous_deficit_repair_experiment_v1.py --out "$RUNNER_TEMP/repair-a.json"
          python runtime/yado_endogenous_deficit_repair_experiment_v1.py --out "$RUNNER_TEMP/repair-b.json"
          cmp "$RUNNER_TEMP/repair-a.json" "$RUNNER_TEMP/repair-b.json"

      - name: Verify endogenous deficit to repair contract
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path(os.environ['RUNNER_TEMP']+'/repair-a.json').read_text())
          assert r['status']=='PASS_SHADOW_ENDOGENOUS_DEFICIT_BOUNDED_REPAIR_EXPERIMENT_V1',r
          assert r['source_discovery']['host_supplied_goal'] is False,r
          assert r['source_discovery']['selected_from_fixed_checklist'] is False,r
          assert r['goal']['host_supplied'] is False,r
          h=r['hypothesis_search']
          assert h['host_bounded_family'] is True,r
          assert h['host_selected_hypothesis'] is False,r
          assert h['selected_mode']!='BASELINE_V6',r
          assert h['candidate_digest_fixed_before_fresh_holdout'],r
          a=r['causal_ablation']
          assert all(a['gates'].values()),a
          assert a['causal_cross_error_reduction'] >= 0.50,a
          assert r['fresh_holdout']['candidate']['identity']['accuracy']==1.0,r
          assert r['fresh_holdout']['candidate']['cross']['accuracy']>=0.90,r
          d=r['decision']
          assert d['admit_candidate_to_canonical_gate'] is True,r
          assert d['automatic_main_mutation'] is False,r
          assert d['canonical_direct_write'] is False,r
          assert d['rollback_required'] is True,r
          assert d['next_selected_step']=='CANONICAL_ADMISSION_GATE_FOR_ENDOGENOUS_REPAIR_CANDIDATE_V1',r
          assert r['canonical_mutation'] is False and r['architecture_mutation'] is False,r
          assert r['g3_genesis_performed'] is False and r['consciousness_claimed'] is False,r
          print(json.dumps({
            'deficit_id':r['source_discovery']['deficit_id'],
            'selected_mode':h['selected_mode'],
            'baseline_cross_error':a['baseline_cross_error_rate'],
            'candidate_cross_error':a['candidate_cross_error_rate'],
            'causal_gain':a['causal_cross_error_reduction'],
            'next':d['next_selected_step'],
          },sort_keys=True))
          PY

      - name: Install audit and Successor dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile checkout
        run: python -m compileall -q runtime successor candidates/g2-self-evolution candidates/autonomous

      - name: Prove active canonical identity unchanged
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          git diff --exit-code origin/main HEAD -- canonical architecture/evolution-ledger.json runtime/yado_unified_core_v1.py
          echo PASS_REPAIR_EXPERIMENT_NO_ACTIVE_CANONICAL_MUTATION

      - name: Full Kernel Audit on repair shadow
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          assert r['canonical']['ledger_validation']=='PASS'
          assert r['canonical']['g3_genesis_performed'] is False
          print('PASS_REPAIR_SHADOW_FULL_KERNEL_AUDIT')
          PY

      - name: Fresh Successor and exact 170 regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/yado-endogenous-repair-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-endogenous-repair-successor/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==170,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_ENDOGENOUS_REPAIR_REGRESSION_170_OF_170',r['identity_digest'])
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-endogenous-deficit-repair-v1-${{ github.run_id }}
          path: ${{ runner.temp }}/repair-a.json
