name: YADO Cross Source Evidence Fusion Deficit Prioritization V1

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - 'runtime/yado_cross_source_evidence_fusion_deficit_prioritization_v1.py'
      - 'architecture/yado-cross-source-evidence-fusion-deficit-prioritization-v1.json'
      - 'experience/yado-multi-resource-self-directed-data-task-loop-v1.json'
      - '.github/workflows/yado-cross-source-evidence-fusion-deficit-prioritization-v1.yml'

permissions:
  contents: read

jobs:
  evidence-fusion-deficit-priority:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare verified development kernel and compile prioritizer
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Self-test evidence fusion and causal prioritization
        run: |
          python runtime/yado_cross_source_evidence_fusion_deficit_prioritization_v1.py --self-test

      - name: Fuse verified external evidence and prioritize endogenous deficit
        run: |
          mkdir -p artifacts
          python runtime/yado_cross_source_evidence_fusion_deficit_prioritization_v1.py \
            --config architecture/yado-cross-source-evidence-fusion-deficit-prioritization-v1.json \
            --out artifacts/yado-cross-source-evidence-fusion-deficit-prioritization-v1.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/yado-cross-source-evidence-fusion-deficit-prioritization-v1.json'))
          assert r['status']=='PASS_CROSS_SOURCE_EVIDENCE_FUSION_DEFICIT_PRIORITIZATION_V1',r
          assert r['candidate_scan']['candidate_count']>=5,r
          e=r['evidence_fusion']
          assert len(e['domains'])>=3 and len(e['task_classes'])>=3,r
          p=r['priority']
          s=p['selected']
          assert s['evidence_overlap_count']>=2,r
          assert p['selected_evidence_score_lift']>=20.0,r
          c=r['causal_controls']
          assert c['case_order_permutation_selected_same_deficit'] is True,r
          assert c['evidence_ablation_reduces_selected_score'] is True,r
          claim=r['selection_claim']
          assert claim['host_preselected_deficit'] is False,r
          assert claim['selected_from_checked_in_causal_history'] is True,r
          assert claim['selection_depends_on_verified_multi_source_experience'] is True,r
          b=r['safety_boundary']
          assert b['credentials_used'] is False and b['external_writes'] is False,r
          assert b['canonical_mutation'] is False,r
          print('PASS_CROSS_SOURCE_DEFICIT_PRIORITY', {
            'candidate_count':r['candidate_scan']['candidate_count'],
            'selected':s['label'],
            'overlap':s['evidence_overlap_families'],
            'score':s['score'],
            'evidence_lift':p['selected_evidence_score_lift'],
          })
          PY

      - name: Full kernel audit
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          print('PASS_FULL_KERNEL_AUDIT',r['counts'])
          PY
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Fresh Successor and complete regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/cross-source-deficit-priority-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/cross-source-deficit-priority-successor/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['failures']==[] and r['errors']==[],r
          assert r['tests_run']>=200,r
          assert r['source_unchanged'] is True,r
          print('PASS_FULL_REGRESSION',r['tests_run'])
          PY

      - name: Upload evidence-fusion priority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-cross-source-evidence-fusion-deficit-prioritization-v1-${{ github.run_id }}
          path: |
            architecture/yado-cross-source-evidence-fusion-deficit-prioritization-v1.json
            experience/yado-multi-resource-self-directed-data-task-loop-v1.json
            artifacts/yado-cross-source-evidence-fusion-deficit-prioritization-v1.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
