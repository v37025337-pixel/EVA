name: YADO Autonomous Meta Source Evolution V2

on:
  workflow_dispatch:
  push:
    branches:
      - yado-autonomous-meta-source-evolution-v2
    paths:
      - 'runtime/yado_autonomous_meta_source_evolution_v2.py'
      - 'architecture/yado-autonomous-meta-source-evolution-v2.json'
      - '.github/workflows/yado-autonomous-meta-source-evolution-v2.yml'
  pull_request:
    branches:
      - main
      - yado-external-source-evolution-v1
    paths:
      - 'runtime/yado_autonomous_meta_source_evolution_v2.py'
      - 'architecture/yado-autonomous-meta-source-evolution-v2.json'
      - '.github/workflows/yado-autonomous-meta-source-evolution-v2.yml'

permissions:
  contents: read

jobs:
  autonomous-meta-source-evolution:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile V1 parent mechanism and V2 controller
        run: python -m py_compile runtime/yado_external_source_evolution_v1.py runtime/yado_autonomous_meta_source_evolution_v2.py

      - name: Run autonomous target selection and meta source evolution
        run: python runtime/yado_autonomous_meta_source_evolution_v2.py

      - name: Verify frozen V2 evidence gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('receipts/yado-autonomous-meta-source-evolution-v2.json').read_text())
          assert report['status'] == 'PASS_SHADOW_G2_AUTONOMOUS_META_SOURCE_EVOLUTION_V2', report['status']
          assert report['target_selection']['origin'] == 'RUNTIME_FAILURE_TRACE'
          assert report['target_selection']['host_provided_target_path'] is False
          assert report['fresh_scope']['training_cases'] == 25
          assert report['fresh_scope']['sealed_cases'] == 12
          assert report['fresh_scope']['sealed_not_used_for_selection'] is True
          assert report['metrics']['parent_training']['score'] == 0.0
          assert report['metrics']['training_candidate']['score'] == 1.0
          assert report['metrics']['sealed_candidate']['score'] >= 0.90
          assert report['metrics']['sealed_absolute_gain'] >= 0.75
          assert report['metrics']['previous_external_sealed_retention']['score'] == 1.0
          assert report['gates']['source_changed'] is True
          assert report['gates']['candidate_frozen_before_sealed_eval'] is True
          assert report['gates']['fresh_sealed_uuid_leak_count'] == 0
          assert report['gates']['generated_ast_roots_novel'] is True
          assert report['gates']['external_models_used'] is False
          assert report['gates']['canonical_mutation'] is False
          assert report['gates']['task_named_formulas_used'] is False
          assert report['gates']['bounded_python_primitive_vocabulary'] is True
          specs = report['generated_mutation_specs']
          assert set(specs) == {'hamming', 'isogram', 'raindrops'}
          assert all(spec['training_score'] == 1.0 for spec in specs.values())
          candidate = Path(report['candidate_source']['path'])
          compile(candidate.read_text(), str(candidate), 'exec')
          print('PASS_AUTONOMOUS_META_SOURCE_EVOLUTION_V2_EVIDENCE_GATE')
          PY

      - name: Reconstruct inherited runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile complete runtime and generated shadow sources
        run: python -m compileall -q runtime successor candidates/g2-self-evolution

      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"

      - name: Upload V2 evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-autonomous-meta-source-evolution-v2-${{ github.run_id }}
          path: |
            architecture/yado-autonomous-meta-source-evolution-v2.json
            receipts/yado-autonomous-meta-source-evolution-v2.json
            candidates/g2-self-evolution/yado_autonomous_meta_source_*_v2.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
