name: YADO rule program execution contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-rule-program-execution-contract-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect RuleProgram synthesis and execution
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          wanted={'RuleProgramSynthesizer','RuleSandbox','RuleProgramSandbox','MechanismExecutor','Mechanism','RuleProgram'}
          for p in Path('.').glob('*.py'):
            try:
              txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            except: continue
            for n in tree.body:
              if isinstance(n,ast.ClassDef) and (n.name in wanted or 'RuleProgram' in n.name or 'MechanismExecutor' in n.name):
                print('\n====',p.name,n.name,'====')
                print(ast.get_source_segment(txt,n))
          PY
