name: YADO G2 Raw V4 Robustness Self Evolution V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-raw-v4-robustness-self-evolution-v1-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V4 robustness evolution
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5 shadow evolution
        run: python -m py_compile runtime/yado_raw_task_representation_robustness_v5.py runtime/yado_kernel_g2_raw_representation_v4_robustness_self_evolution_v1.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Let G2 evolve V4 sequential robustness
        run: timeout --signal=TERM --kill-after=30s 1200s python runtime/yado_kernel_g2_raw_representation_v4_robustness_self_evolution_v1.py
      - name: Persist unexpected evolution failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_RAW_REPRESENTATION_V4_ROBUSTNESS_SELF_EVOLUTION_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record raw-V4 robustness evolution failure as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist V5 shadow evidence
        if: success()
        run: |
          mkdir -p receipts resources candidates
          cp runtime/yado_kernel_g2_raw_representation_v4_robustness_self_evolution_v1_receipt.json "receipts/yado-g2-raw-v4-robustness-self-evolution-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Raw V4 Robustness Evolution"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-g2-raw-representation-v4-robustness-self-evolution-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json candidates/kernel-self-generated/raw-task-representation-v5-sequential-robustness-v1.json resources/yado-raw-task-representation-v5-sequential-robustness-fresh-holdout-v1.json "receipts/yado-g2-raw-v4-robustness-self-evolution-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 raw-V4 robustness self-evolution V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: yado-g2-raw-v4-robustness-self-evolution-v1-${{ github.run_id }}
          path: runtime/yado_kernel_g2_raw_representation_v4_robustness_self_evolution_v1_receipt.json
