name: YADO External Dev Self Development V1

on:
  workflow_dispatch:
  push:
    branches: [codex/yado-external-dev-self-development-v1-20260916]
    paths:
      - '.github/workflows/yado-external-dev-self-development-v1.yml'
      - 'runtime/yado_external_dev_self_development_v1.py'
      - 'runtime/yado_unified_core_external_dev_self_development_v1.py'
      - 'runtime/test_yado_external_dev_self_development_v1.py'

permissions:
  contents: write

concurrency:
  group: yado-external-dev-self-development-v1
  cancel-in-progress: false

jobs:
  self-develop:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Compile self-development layers
        run: |
          python -m py_compile runtime/yado_external_dev_self_development_v1.py
          python -m py_compile runtime/yado_unified_core_external_dev_self_development_v1.py
      - name: Run focused self-development regression
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python -m unittest runtime.test_yado_external_dev_self_development_v1 -v
          python -m unittest runtime.test_yado_unified_core_external_dev_capability_pack_v1 -v
          python -m unittest runtime.test_yado_unified_core_self_directed_web_research_v1 -v
      - name: Let YADO use all five live sources and materialize its router candidate
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from yado_unified_core_external_dev_self_development_v1 import UnifiedYADOCoreExternalDevSelfDevelopmentV1

          candidate = Path('candidates/autonomous/yado_external_dev_capability_router_candidate_v1.py')
          receipt = Path('candidates/autonomous/yado-external-dev-self-development-v1.json')
          core = UnifiedYADOCoreExternalDevSelfDevelopmentV1()
          out = core.external_dev_self_develop(
              'Improve YADO by autonomously selecting and orchestrating the admitted external developer capabilities from measured deficits',
              candidate_path=candidate,
              receipt_path=receipt,
              timeout=25,
          )
          assert out['status'] == 'PASS_SHADOW_EXTERNAL_DEV_SELF_DEVELOPMENT_V1', out
          assert out['fresh_evaluation']['accuracy'] == 1.0, out['fresh_evaluation']
          assert out['fresh_evaluation']['gain'] > 0.0, out['fresh_evaluation']
          assert out['fresh_evaluation']['unknown_withhold'] is True
          assert len(out['development_generations']) == 5
          assert len(set(out['used_source_patterns'])) == 5
          assert out['third_party_code_executed'] is False
          assert out['third_party_code_copied'] is False
          assert out['credentials_used'] is False
          assert out['external_writes_to_third_parties'] is False
          assert out['automatic_main_mutation'] is False
          assert out['g3_genesis_performed'] is False
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
      - name: Compile and independently re-evaluate generated candidate
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python -m py_compile candidates/autonomous/yado_external_dev_capability_router_candidate_v1.py
          python - <<'PY'
          from pathlib import Path
          from yado_external_dev_self_development_v1 import ExternalDevSelfDevelopmentV1
          source = Path('candidates/autonomous/yado_external_dev_capability_router_candidate_v1.py').read_text(encoding='utf-8')
          report = ExternalDevSelfDevelopmentV1.evaluate_router_source(source)
          assert report['status'] == 'PASS_FRESH_ROUTER_TRANSFER', report
          assert report['accuracy'] == 1.0
          assert report['unknown_withhold'] is True
          print(report)
          PY
      - name: Run full kernel audit before persistence
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py
      - name: Persist YADO-generated shadow candidate and receipt
        run: |
          git config user.name 'YADO External Dev Self Development'
          git config user.email 'actions@users.noreply.github.com'
          git add candidates/autonomous/yado_external_dev_capability_router_candidate_v1.py candidates/autonomous/yado-external-dev-self-development-v1.json
          if git diff --cached --quiet; then
            echo 'No generated candidate change to persist'
          else
            git commit -m 'YADO self-development: materialize external dev capability router [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Preserve self-development evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-external-dev-self-development-v1-${{ github.run_id }}
          if-no-files-found: error
          path: |
            candidates/autonomous/yado_external_dev_capability_router_candidate_v1.py
            candidates/autonomous/yado-external-dev-self-development-v1.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
