name: YADO G2 Successor Genesis From Enriched G1 V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_g2_successor_genesis_from_g1_enriched_head_v1.py"
      - ".github/workflows/yado-g2-successor-genesis-from-g1-enriched-head-v1.yml"
permissions:
  contents: write
concurrency:
  group: yado-g2-successor-genesis
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Build and test G2 successor architecture
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_successor_genesis_from_g1_enriched_head_v1.py
      - name: Upload G2 genesis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yado-g2-successor-genesis-v1
          path: |
            runtime/yado_g2_successor_genesis_from_g1_enriched_head_v1_receipt.json
            candidates/g2-successor-v1/architecture.json
            candidates/g2-successor-v1/candidate.json
            architecture/evolution-ledger.json
          retention-days: 30
      - name: Persist G2 genesis evidence
        if: always()
        run: |
          mkdir -p receipts candidates/g2-successor-v1
          if [ -f runtime/yado_g2_successor_genesis_from_g1_enriched_head_v1_receipt.json ]; then
            cp runtime/yado_g2_successor_genesis_from_g1_enriched_head_v1_receipt.json "receipts/yado-g2-successor-genesis-from-g1-enriched-head-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO G2 Successor Genesis"
          git config user.email "actions@users.noreply.github.com"
          git add \
            "receipts/yado-g2-successor-genesis-from-g1-enriched-head-v1-run-${GITHUB_RUN_ID}.json" \
            candidates/g2-successor-v1/architecture.json \
            candidates/g2-successor-v1/candidate.json \
            architecture/evolution-ledger.json
          if git diff --cached --quiet; then echo unchanged; else
            git commit -m "Persist G2 successor genesis evidence [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_g2_successor_genesis_from_g1_enriched_head_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_G2_GENESIS_RECEIPT")
          r=json.loads(p.read_text())
          if not str(r.get("status","")).startswith("PASS_"): raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          print(r["status"])
          PY
