name: YADO G2 Native Action Evidence Binder Invention V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-action-evidence-binder-invention-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-action-evidence-binder-invention-v1
  cancel-in-progress: true
jobs:
  invent:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before native invention
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile native invention experiment
        run: python -m py_compile runtime/yado_g2_native_action_evidence_binder_invention_v1.py
      - name: Let YADO create its own evidence-binding mechanism
        id: invent
        continue-on-error: true
        run: python runtime/yado_g2_native_action_evidence_binder_invention_v1.py
      - name: Canonical guard after native invention
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist native PASS or WITHHOLD evidence
        if: always()
        run: |
          git config user.name "YADO Native Evidence Binder"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-action-evidence-binder-invention-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-action-evidence-binder-invention-v1.json
          fi
          if [ -f candidates/kernel-self-generated/g2-native-action-evidence-binder-gene-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-action-evidence-binder-gene-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO native evidence-binder invention [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce native self-synthesis verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-action-evidence-binder-invention-v1.json")
          if not p.exists(): raise SystemExit("MISSING_NATIVE_BINDER_EVIDENCE")
          r=json.loads(p.read_text())
          assert r["canonical_mutation"] is False,r
          assert r["checks"]["external_models_used"] is False,r
          assert r["checks"]["host_patch_supplied"] is False,r
          assert r["checks"]["host_target_file_supplied"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_ACTION_EVIDENCE_BINDER_INVENTION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          print(r["status"],r["invented_gene"]["gene_id"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-native-action-evidence-binder-invention-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-action-evidence-binder-invention-v1.json
            candidates/kernel-self-generated/g2-native-action-evidence-binder-gene-v1.json
          if-no-files-found: warn
