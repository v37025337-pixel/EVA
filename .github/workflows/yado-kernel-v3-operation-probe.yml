name: YADO G2 V3 Operation Probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-kernel-v3-operation-probe-request.json]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Ask G2 for next evolution operation
        run: python runtime/yado_kernel_v3_operation_probe.py
      - name: Persist probe receipt
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_kernel_v3_operation_probe_receipt.json receipts/yado-kernel-v3-operation-probe-run-${GITHUB_RUN_ID}.json
          git config user.name 'YADO G2 V3 Operation Probe'
          git config user.email 'actions@users.noreply.github.com'
          git add receipts/yado-kernel-v3-operation-probe-run-${GITHUB_RUN_ID}.json
          if ! git diff --cached --quiet; then git commit -m 'Persist G2 V3 operation probe [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
