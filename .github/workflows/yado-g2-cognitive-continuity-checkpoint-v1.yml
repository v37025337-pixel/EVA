name: YADO G2 Cognitive Continuity Checkpoint V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-cognitive-continuity-checkpoint-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-cognitive-continuity-checkpoint-v1
  cancel-in-progress: true
jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before continuity candidate
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile continuity runtime
        run: |
          python -m py_compile runtime/yado_g2_unified_execution_fabric_v4.py
          python -m py_compile runtime/yado_g2_cognitive_continuity_checkpoint_v1.py
      - name: Run real destroy-and-restore continuity gate
        id: continuity
        continue-on-error: true
        run: python runtime/yado_g2_cognitive_continuity_checkpoint_v1.py
      - name: Canonical guard after continuity candidate
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist continuity evidence
        if: always()
        run: |
          git config user.name "YADO Continuity Gate"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-cognitive-continuity-checkpoint-v1.json ]; then
            git add candidates/kernel-self-generated/g2-cognitive-continuity-checkpoint-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO cognitive continuity checkpoint V1 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict restart continuity verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-cognitive-continuity-checkpoint-v1.json")
          if not p.exists(): raise SystemExit("MISSING_CONTINUITY_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          if r["status"]!="PASS_SHADOW_G2_COGNITIVE_CONTINUITY_CHECKPOINT_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          for k in (
            "restart_restores_exact_tick",
            "restart_restores_exact_recurrent_sequence",
            "restart_restores_episode_count",
            "restart_restores_stage_outcome_count",
            "restart_restores_failed_stage_attempt",
            "decision_after_restart_matches_before",
            "memory_feedback_after_restart",
            "budget_after_restart_does_not_retry_failed_stage",
            "first_post_restart_tick_continues_monotonically",
            "first_post_restart_predecessor_preserved",
            "tampered_recurrent_memory_rejected",
            "cross_layer_forgery_rejected",
            "canonical_unchanged"
          ):
              assert c[k] is True,(k,r)
          assert r["canonical_mutation"] is False,r
          assert r["promotion_applied"] is False,r
          print(r["status"],r["checkpoint_projection"],r["decision_projection"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-cognitive-continuity-checkpoint-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-cognitive-continuity-checkpoint-v1.json
          if-no-files-found: warn
