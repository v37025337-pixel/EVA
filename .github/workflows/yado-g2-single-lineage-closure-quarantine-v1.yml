name: YADO G2 Single Lineage Closure Quarantine V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-single-lineage-closure-quarantine-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-single-lineage-closure
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Pre-closure canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile closure and guards
        run: python -m py_compile runtime/yado_g2_single_lineage_closure_quarantine_v1.py runtime/yado_g2_single_lineage_closure_guard_v1.py runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Quarantine legacy control plane and bind accumulated experience
        run: python runtime/yado_g2_single_lineage_closure_quarantine_v1.py
      - name: Verify G2-only executable closure
        run: python runtime/yado_g2_single_lineage_closure_guard_v1.py
      - name: Kernel-native post-closure self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Require post-closure self-audit pass
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert r["overall_verdict"]=="PASS_WITH_LIMITATIONS",r
          assert r["summary"]["blocking_findings"]==0,r
          print(r["overall_verdict"],r["summary"])
          PY
      - name: Final closure guard after self-audit ledger append
        run: python runtime/yado_g2_single_lineage_closure_guard_v1.py
      - name: Persist G2 closure, quarantine, experience binding, and evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_single_lineage_closure_quarantine_v1_receipt.json "receipts/yado-g2-single-lineage-closure-quarantine-v1-run-${GITHUB_RUN_ID}.json"
          cp runtime/yado_unified_core_deep_self_audit_v1_receipt.json "receipts/yado-unified-core-deep-self-audit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Single Lineage Closure"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Close YADO control plane onto G2 and quarantine legacy workflows [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-single-lineage-closure-quarantine-v1-${{ github.run_id }}
          path: |
            runtime/yado_g2_single_lineage_closure_quarantine_v1_receipt.json
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            canonical/yado-g2-applied-experience-binding-v1.json
            quarantine/yado-g2-quarantine-manifest-v1.json
