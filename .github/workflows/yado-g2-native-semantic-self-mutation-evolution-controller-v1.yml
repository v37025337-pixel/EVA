name: YADO G2 Native Semantic Self Mutation Evolution Controller V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-semantic-self-mutation-evolution-controller-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-semantic-self-mutation-evolution-controller-v1
  cancel-in-progress: true
jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before semantic self-mutation
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile strict observer
        run: python -m py_compile runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py
      - name: Let YADO solve its evolutionary-controller limitation
        id: mutate
        continue-on-error: true
        run: python runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py
      - name: Canonical guard after semantic self-mutation
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist native self-mutation evidence
        if: always()
        run: |
          git config user.name "YADO Semantic Controller Self Mutation"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-semantic-self-mutation-evolution-controller-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-semantic-self-mutation-evolution-controller-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO semantic controller self-mutation evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict native verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-semantic-self-mutation-evolution-controller-v1.json")
          if not p.exists(): raise SystemExit("MISSING_NATIVE_SEMANTIC_SELF_MUTATION_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for key in ("host_target_function_selected","host_patch_used","host_source_template_used",
                      "host_new_dimension_name_used","host_gene_schema_used","host_mutation_rule_used",
                      "external_coding_models_used","new_external_research_used"):
              assert c[key] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SEMANTIC_SELF_MUTATION_EVOLUTION_CONTROLLER_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["structurally_broader_search_space"] is True,r
          assert c["previously_absent_class_created"] is True,r
          print(r["status"],r["new_dimensions"])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yado-g2-native-semantic-self-mutation-evolution-controller-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-semantic-self-mutation-evolution-controller-v1.json
          if-no-files-found: warn
