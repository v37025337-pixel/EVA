name: YADO G2 Whole Function Substrate Evolution V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-coding-whole-function-substrate-evolution-v1-request.json"]
permissions: {contents: write}
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_coding_whole_function_substrate_evolution_v1.py
      - name: Evolve shadow code substrate
        continue-on-error: true
        run: python runtime/yado_g2_coding_whole_function_substrate_evolution_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist substrate evidence
        if: always()
        run: |
          git config user.name "YADO Whole Function Substrate Evolution V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-coding-whole-function-substrate-evolution-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-coding-whole-function-substrate-evolution-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO whole-function substrate evolution V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce substrate verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-coding-whole-function-substrate-evolution-v1.json")
          if not p.exists():raise SystemExit("MISSING_SUBSTRATE_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_CODING_WHOLE_FUNCTION_SUBSTRATE_EVOLUTION_V1":
              raise SystemExit("SUBSTRATE_WITHHOLD:"+r["status"])
          assert r["unlocked_candidate_count"]>=1,r
          assert r["checks"]["no_attribute_permission_added"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          print(r["status"],r["selected_profile"],r["added_safe_calls"],r["unlocked_candidate_count"])
          PY
