name: YADO All Experience Application V1

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Run containing the verified predecessor checkpoint
        required: true
        default: '35456725134'
      checkpoint_name:
        description: Exact checkpoint artifact name
        required: true
        default: yado-repository-learning-checkpoint-35456725134-1
  push:
    branches: [codex/yado-all-experience-20260919]
    paths:
      - '.github/workflows/yado-all-experience-application-v1.yml'
      - 'experiments/all-experience-application-20260919/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: yado-all-experience-application-v1
  cancel-in-progress: false

jobs:
  apply-experience:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
      - name: Download verified predecessor checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35456725134' }}
          name: ${{ inputs.checkpoint_name || 'yado-repository-learning-checkpoint-35456725134-1' }}
          path: ${{ runner.temp }}/yado-predecessor
      - name: Apply available history and native memory through existing kernel selectors
        env:
          SOURCE_RUN: ${{ inputs.source_run || '35456725134' }}
        run: |
          python experiments/all-experience-application-20260919/run.py \
            --checkpoint "$RUNNER_TEMP/yado-predecessor" --source-run "$SOURCE_RUN" \
            --output "$RUNNER_TEMP/yado-experience-checkpoint" --cycles 10
      - name: Verify canonical continuity
        run: |
          git diff --exit-code -- canonical architecture/evolution-ledger.json
          python runtime/yado_canonical_invariant_guard_v1.py
      - name: Preserve complete state, component executor and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-all-experience-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yado-experience-checkpoint/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
