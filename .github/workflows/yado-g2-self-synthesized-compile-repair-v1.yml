name: YADO G2 Self Synthesized Compile Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-self-synthesized-compile-repair-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-synthesized-compile-repair-v1
  cancel-in-progress: true
jobs:
  invent-and-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before compile-repair invention
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile generic compile-repair substrate and invention gate
        run: python -m py_compile runtime/yado_generic_compile_repair_meta_language_v1.py runtime/yado_g2_self_synthesized_compile_repair_v1.py
      - name: Let YADO synthesize and validate its own compile-repair mechanism
        run: python runtime/yado_g2_self_synthesized_compile_repair_v1.py
      - name: Require strict self-synthesized compile-repair PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-self-synthesized-compile-repair-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_SELF_SYNTHESIZED_COMPILE_REPAIR_V1",r
          assert r["checks"]["fresh_exact"] is True,r
          assert r["checks"]["structural_ablation_causes_drop"] is True,r
          assert r["checks"]["target_repaired_by_same_program"] is True,r
          assert r["checks"]["no_external_patch_or_model_used"] is True,r
          assert r["checks"]["host_did_not_supply_target_patch"] is True,r
          print(r["status"],r["invented_gene"]["gene_id"])
          PY
      - name: Install YADO-repaired controller source from its shadow candidate
        run: |
          cp candidates/g2-self-evolution/yado_g2_autonomous_self_rewrite_v1_compile_repaired_candidate.py runtime/yado_g2_autonomous_self_rewrite_v1.py
          python -m py_compile runtime/yado_g2_autonomous_self_rewrite_v1.py
      - name: Canonical guard after compile-repair invention
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist invented gene, repaired controller, and trigger autonomous self-rewrite
        run: |
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path("architecture/yado-kernel-autonomous-self-rewrite-v1-request.json")
          r=json.loads(p.read_text())
          r["native_compile_repair_trigger"]=(r.get("native_compile_repair_trigger") or 0)+1
          r["native_compile_repair_source_run"]=os.environ.get("GITHUB_RUN_ID")
          r["host_solution_hint"]=None
          r["target_path"]=None
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          PY
          git config user.name "YADO Self Synthesized Compile Repair"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_g2_autonomous_self_rewrite_v1.py candidates/kernel-self-generated/g2-self-synthesized-compile-repair-v1.json candidates/g2-self-evolution/yado_g2_autonomous_self_rewrite_v1_compile_repaired_candidate.py architecture/yado-kernel-autonomous-self-rewrite-v1-request.json
          git commit -m "YADO self-synthesizes compile repair and resumes self-rewrite [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
