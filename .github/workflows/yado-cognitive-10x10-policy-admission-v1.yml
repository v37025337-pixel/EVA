name: YADO Cognitive 10x10 Policy Admission V1

on:
  workflow_dispatch:
  push:
    branches:
      - yado-cognitive-10x10-policy-admission-v1
    paths:
      - 'runtime/yado_cognitive_tri_organ_policy_v3.py'
      - 'architecture/yado-cognitive-10x10-policy-admission-v1.json'
      - '.github/workflows/yado-cognitive-10x10-policy-admission-v1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/yado_cognitive_tri_organ_policy_v3.py'
      - 'architecture/yado-cognitive-10x10-policy-admission-v1.json'
      - '.github/workflows/yado-cognitive-10x10-policy-admission-v1.yml'

permissions:
  contents: read

jobs:
  verify-active-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile active policy and 10x10 evaluator
        run: python -m py_compile runtime/yado_cognitive_tri_organ_policy_v3.py runtime/yado_cognitive_10x10_evolution_v1.py

      - name: Verify admitted active policy on reconstructed sealed suite
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path

          def load(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              if spec is None or spec.loader is None:
                  raise RuntimeError(path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          policy = load('active_policy', Path('runtime/yado_cognitive_tri_organ_policy_v3.py'))
          suite = load('suite', Path('runtime/yado_cognitive_10x10_evolution_v1.py'))

          expected = {
              'abstraction_families': 8,
              'contradiction_check': True,
              'logic_depth': 4,
              'thinking_beam': 3,
              'thinking_depth': 6,
          }
          assert policy.COGNITIVE_POLICY == expected
          component = policy.component()
          assert component['canonical_active'] is True
          assert component['consciousness_claimed'] is False
          assert component['general_intelligence_claimed'] is False
          assert component['verified_10x10_evidence']['evidence_digest'] == '0cce6c75bb7352748ccf73703b537f0438699e75380730223ce531e694501f43'

          genome = suite.Genome(**policy.COGNITIVE_POLICY)
          tasks = suite.make_tasks(202609121502)
          assert len(tasks) == 100
          assert len(suite.DOMAINS) == 10
          assert all(sum(t.domain == d for t in tasks) == 10 for d in suite.DOMAINS)
          sealed = [t for t in tasks if t.split == 'sealed']
          assert len(sealed) == 40
          metrics = suite.evaluate(sealed, genome)
          assert metrics['score'] == 1.0, metrics
          assert metrics['correct'] == 40
          assert all(v == 1.0 for v in metrics['domain_accuracy'].values()), metrics
          print('PASS_ACTIVE_10X10_POLICY_SEALED_REPLAY')
          PY

      - name: Reconstruct inherited runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile complete runtime
        run: python -m compileall -q runtime successor

      - name: Run full kernel audit with active policy
        run: python runtime/yado_full_kernel_audit_v1.py

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression with active policy
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"

      - name: Upload admission evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-cognitive-10x10-policy-admission-v1-${{ github.run_id }}
          path: |
            architecture/yado-cognitive-10x10-policy-admission-v1.json
            runtime/yado_cognitive_tri_organ_policy_v3.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
