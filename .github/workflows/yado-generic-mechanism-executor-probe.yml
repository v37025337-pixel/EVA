name: YADO generic mechanism executor probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-generic-mechanism-executor-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect bounded mechanism executors
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          for fn in ['yado_core_v2_1.py','yado_core_v2_2.py']:
            p=Path(fn); txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            print('\n====',fn,'====')
            for n in tree.body:
              if isinstance(n,ast.ClassDef) and n.name in {'BoundedRuleSandbox','SequencePlannerSandbox','FieldMapperSandbox'}:
                for m in n.body:
                  if isinstance(m,ast.FunctionDef) and m.name=='execute':
                    print(n.name,ast.get_source_segment(txt,m))
          PY
