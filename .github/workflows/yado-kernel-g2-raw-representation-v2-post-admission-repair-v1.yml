name: YADO G2 Raw Representation V2 Post Admission Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-raw-representation-v2-post-admission-repair-v1-request.json"
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V2 repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V2 repair
        run: python -m py_compile runtime/yado_kernel_g2_raw_representation_v2_post_admission_repair_v1.py runtime/yado_raw_task_representation_candidate_v2.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Let G2 repair raw representation from counterexamples
        run: timeout --signal=TERM --kill-after=30s 1200s python runtime/yado_kernel_g2_raw_representation_v2_post_admission_repair_v1.py
      - name: Persist unexpected repair failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_RAW_REPRESENTATION_V2_POST_ADMISSION_REPAIR_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record raw V2 counterexample repair failure as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist V3 shadow repair evidence
        if: success()
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources
          cp runtime/yado_kernel_g2_raw_representation_v2_post_admission_repair_v1_receipt.json "receipts/yado-g2-raw-representation-v2-post-admission-repair-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Raw Counterexample Repair"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-g2-raw-representation-v2-post-admission-repair-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json candidates/kernel-self-generated/raw-task-representation-v3.json resources/yado-raw-task-representation-v3-fresh-holdout-v1.json "receipts/yado-g2-raw-representation-v2-post-admission-repair-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 raw representation V3 shadow repair V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after V2 repair
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce V2 repair receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_g2_raw_representation_v2_post_admission_repair_v1_receipt.json"))
          assert r["status"]=="PASS_G2_RAW_REPRESENTATION_V2_POST_ADMISSION_REPAIR_V1",r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["selected_family"],r["metrics"],r["next_required_capability"])
          PY
