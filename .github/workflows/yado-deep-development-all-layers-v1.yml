name: YADO Deep Development All Layers V1

on:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - '.github/workflows/yado-deep-development-all-layers-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yado-deep-development-all-layers-v1
  cancel-in-progress: true

jobs:
  deep-development:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Baseline whole-kernel guards
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates
          python runtime/yado_unified_core_deep_self_audit_v1.py
          git checkout -- architecture/evolution-ledger.json

      - name: Generate and apply native experience-conditioned runtime mutation
        run: |
          python -m py_compile runtime/yado_native_experience_to_runtime_self_rewrite_v2.py
          python runtime/yado_native_experience_to_runtime_self_rewrite_v2.py
          python - <<'PY'
          import hashlib, json, pathlib
          receipt_path=pathlib.Path('candidates/autonomous/yado-native-experience-to-runtime-self-rewrite-v2.json')
          r=json.loads(receipt_path.read_text())
          assert r['status']=='PASS_SHADOW_NATIVE_EXPERIENCE_TO_RUNTIME_SELF_REWRITE_CANDIDATE_V2', r
          assert r['candidate_sha256'] != r['parent_sha256'], r
          candidate=pathlib.Path(r['candidate_path'])
          target=pathlib.Path(r['target_path'])
          before=hashlib.sha256(target.read_bytes()).hexdigest()
          target.write_bytes(candidate.read_bytes())
          compile(target.read_text(encoding='utf-8'), str(target), 'exec')
          after=hashlib.sha256(target.read_bytes()).hexdigest()
          assert before != after == r['candidate_sha256'], (before,after,r)
          pathlib.Path('/tmp/yado_mutation_target.txt').write_text(str(target))
          pathlib.Path('architecture/yado-deep-development-all-layers-v1.json').write_text(json.dumps({
            'schema':'yado.deep_development_all_layers.v1',
            'status':'MUTATION_APPLIED_PENDING_GATES',
            'base_main':'b77a9739c8ad36ef4d7db996398f5f3aa60cfdf9',
            'mutation_target':str(target),
            'parent_sha256':before,
            'candidate_sha256':after,
            'all_layer_compile':True,
            'canonical_mutation':False,
            'development_branch_only':True,
          },indent=2,sort_keys=True)+'\n')
          print('APPLIED_RUNTIME_MUTATION',target,before,after)
          PY
          echo "MUTATION_TARGET=$(cat /tmp/yado_mutation_target.txt)" >> "$GITHUB_ENV"

      - name: Execute mutated runtime target
        run: |
          PYTHONPATH=runtime:runtime/yado_rc8_v36 python "$MUTATION_TARGET"

      - name: Re-evolve logic thinking intelligence policy
        run: |
          python -m py_compile runtime/yado_cognitive_tri_organ_evolution_v2.py
          python runtime/yado_cognitive_tri_organ_evolution_v2.py
          python - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path('candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json').read_text())
          assert r['status']=='PASS_SHADOW_BOUNDED_TRI_ORGAN_COGNITIVE_EVOLUTION_V2',r
          assert min(r['selected_hidden'].values()) >= 0.80,r
          dst=pathlib.Path('runtime/yado_cognitive_tri_organ_policy_v3.py')
          src=(
            'from __future__ import annotations\n\n'
            f"COGNITIVE_POLICY = {r['selected_genome']!r}\n"
            f"VERIFIED_HIDDEN_SCORES = {r['selected_hidden']!r}\n"
            f"SOURCE_EVIDENCE = {{'schema':'yado.cognitive_tri_organ_evolution.v2','candidate_sha256':{r['candidate_sha256']!r}}}\n\n"
            "def component():\n"
            "    return {'schema':'yado.cognitive_tri_organ_policy.v3','policy':COGNITIVE_POLICY,'verified_hidden_scores':VERIFIED_HIDDEN_SCORES,'source_evidence':SOURCE_EVIDENCE,'canonical_active':False,'development_branch_active':True,'consciousness_claimed':False}\n"
          )
          compile(src,str(dst),'exec')
          dst.write_text(src,encoding='utf-8')
          print('MATERIALIZED_TRI_ORGAN_POLICY',dst)
          PY

      - name: Probe native semantic self-mutation controller
        continue-on-error: true
        run: |
          if [ -f runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py ]; then
            python -m py_compile runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py
            python runtime/yado_g2_native_semantic_self_mutation_evolution_controller_v1.py
          fi

      - name: Compile every active and candidate Python layer
        run: python -m compileall -q runtime successor candidates

      - name: Whole-kernel audit after mutations
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          assert r['canonical']['ledger_validation']=='PASS'
          assert r['canonical']['g3_genesis_performed'] is False
          print('PASS_POST_MUTATION_FULL_KERNEL_AUDIT')
          PY

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Complete inherited and Successor regression
        run: |
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests'] and r['tests_run']>=197,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_DEEP_DEVELOPMENT_REGRESSION',r['tests_run'])
          PY

      - name: Finalize development receipt
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('architecture/yado-deep-development-all-layers-v1.json')
          r=json.loads(p.read_text())
          reg=json.load(open('audits/yado-full-regression-v1-report.json'))
          audit=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          r.update({
            'status':'PASS_DEEP_DEVELOPMENT_ALL_LAYERS_V1',
            'full_kernel_audit':audit['status'],
            'regression_tests':reg['tests_run'],
            'regression_status':reg['status'],
            'promotion_to_main':'REQUIRES_SEPARATE_REVIEW_AND_ADMISSION',
          })
          p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,sort_keys=True))
          PY

      - name: Persist verified development branch
        run: |
          git config user.name "YADO Deep Development"
          git config user.email "actions@users.noreply.github.com"
          git add "$MUTATION_TARGET" runtime/yado_cognitive_tri_organ_policy_v3.py candidates audits architecture/yado-deep-development-all-layers-v1.json experience
          git diff --cached --quiet || git commit -m "YADO deep development: gated all-layer code mutation [skip ci]"
          git push origin HEAD:yado-deep-development-20260914

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-deep-development-all-layers-v1-${{ github.run_id }}
          path: |
            architecture/yado-deep-development-all-layers-v1.json
            candidates/autonomous/yado-native-experience-to-runtime-self-rewrite-v2.json
            candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
