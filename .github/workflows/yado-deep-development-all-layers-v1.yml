name: YADO Deep Development All Layers V1

# Compatibility entrypoint for the current verified fresh-learning cycle.
# Historical generation proofs remain in dedicated admission workflows.
# This alias does not replay V2/V3 admission or promote a runtime candidate.
on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - '.github/workflows/yado-deep-development-all-layers-v1.yml'

permissions:
  contents: read

# The reusable workflow owns the shared development concurrency group.
# Keeping concurrency there avoids a caller waiting on its own group.
jobs:
  current-learning-cycle:
    uses: ./.github/workflows/yado-autonomous-deep-development-v1.yml
