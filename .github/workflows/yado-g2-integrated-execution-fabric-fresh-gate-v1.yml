name: YADO G2 Integrated Execution Fabric Fresh Gate V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-integrated-execution-fabric-fresh-gate-v1-request.json"
permissions:
  contents: write
jobs:
  fresh-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited RC8 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile integrated fabric
        run: python -m py_compile runtime/yado_g2_integrated_execution_fabric_v1.py runtime/yado_g2_integrated_execution_fabric_fresh_gate_v1.py
      - name: Run fresh integration gate
        run: python runtime/yado_g2_integrated_execution_fabric_fresh_gate_v1.py
      - name: Persist shadow evidence
        run: |
          git config user.name "YADO G2 Integration Gate"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-integrated-execution-fabric-v1.json
          git commit -m "Persist G2 integrated execution fabric fresh evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@v4
        with:
          name: yado-g2-integrated-execution-fabric-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-integrated-execution-fabric-v1.json
