name: YADO G2 Task Conditioned Source Binding V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-task-conditioned-source-binding-v3-request.json"]
permissions: {contents: write}
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_task_conditioned_source_binding_v3.py
      - name: Run balanced causal binding V3
        continue-on-error: true
        run: python runtime/yado_g2_task_conditioned_source_binding_v3.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist V3 binding evidence
        if: always()
        run: |
          git config user.name "YADO Task Conditioned Source Binding V3"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-task-conditioned-source-binding-v3.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-task-conditioned-source-binding-v3.json 2>/dev/null || true
          git add candidates/g2-self-evolution/task_conditioned_source_binding_v3_goal_*.py 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO task-conditioned source binding V3 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce V3 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          r=json.loads(pathlib.Path("candidates/kernel-self-generated/g2-task-conditioned-source-binding-v3.json").read_text())
          if r["status"]!="PASS_SHADOW_G2_TASK_CONDITIONED_SOURCE_BINDING_V3":raise SystemExit("V3_WITHHOLD:"+r["next_required_capability"])
          assert r["checks"]["two_fresh_exact"] and r["checks"]["negative_unknown_fail_closed"] and r["checks"]["canonical_unchanged"],r
          print(r["status"],r["gene_id"],r["next_required_capability"])
          PY
