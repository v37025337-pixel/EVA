name: YADO G2 Raw Strategy Canonical Admission V5
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-raw-representation-strategy-canonical-admission-v5-request.json"
permissions:
  contents: write
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before admission
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile admission evaluator
        run: python -m py_compile runtime/yado_kernel_g2_native_raw_representation_strategy_canonical_admission_v5.py
      - name: Run independent admission readiness gate
        id: admit
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 1200s python runtime/yado_kernel_g2_native_raw_representation_strategy_canonical_admission_v5.py
      - name: Canonical guard after admission
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist admission evidence
        if: always()
        run: |
          git config user.name "YADO Raw Canonical Admission V5"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f architecture/yado-kernel-g2-native-raw-representation-strategy-canonical-admission-v5.json ] && files+=(architecture/yado-kernel-g2-native-raw-representation-strategy-canonical-admission-v5.json)
          [ -f resources/yado-raw-task-representation-v6-canonical-admission-fresh-v1.json ] && files+=(resources/yado-raw-task-representation-v6-canonical-admission-fresh-v1.json)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO raw canonical admission V5 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest admission verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("architecture/yado-kernel-g2-native-raw-representation-strategy-canonical-admission-v5.json")
          if not p.exists():raise SystemExit("MISSING_ADMISSION_V5")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_READY_G2_NATIVE_RAW_REPRESENTATION_STRATEGY_CANONICAL_ADMISSION_V5":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["canonical_mutation"] is False
          print(r["status"],r["selected_family"],r["admission_metrics"],r["post_selection_fresh_metrics"],r["next_required_capability"])
          PY
