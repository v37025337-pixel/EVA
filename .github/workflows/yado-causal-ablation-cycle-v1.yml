name: YADO Causal Ablation Cycle V1

on:
  push:
    branches: [yado-causal-ablation-cycle-v1]
    paths:
      - 'runtime/yado_causal_ablation_cycle_v1.py'
      - '.github/workflows/yado-causal-ablation-cycle-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  causal-ablation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Compile goal and ablation mechanisms
        run: |
          python -m py_compile runtime/yado_endogenous_goal_genesis_v1.py
          python -m py_compile runtime/yado_causal_ablation_cycle_v1.py

      - name: Rebuild endogenous goal from canonical evidence
        run: |
          python runtime/yado_endogenous_goal_genesis_v1.py \
            --out candidates/autonomous/yado-endogenous-goal-genesis-v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('candidates/autonomous/yado-endogenous-goal-genesis-v1.json')
          r=json.loads(p.read_text())
          assert r['selected_goal']=='KERNEL_G2_RAW_REPRESENTATION_V4_ROBUSTNESS_SELF_EVOLUTION_V2',r
          assert r['selected_action']['action']=='CAUSAL_ABLATION_OF_CANDIDATE_IMPROVEMENT',r
          assert r['host_supplied_goal'] is False and r['host_selected_goal'] is False,r
          assert r['trigger']['repair_queue_empty'] is True,r
          print('PASS_ENDOGENOUS_GOAL_BOUND_TO_ABLATION')
          PY

      - name: Reconstruct authoritative G2 runtime
        run: |
          python runtime/reconstruct_rc8v36.py
          test -d runtime/yado_rc8_v36

      - name: Install runtime test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          if [ -f runtime/yado_rc8_v36/requirements.txt ]; then
            python -m pip install -r runtime/yado_rc8_v36/requirements.txt
          fi

      - name: Execute paired causal ablation
        run: |
          python runtime/yado_causal_ablation_cycle_v1.py \
            --out candidates/autonomous/yado-causal-ablation-cycle-v1.json

      - name: Verify causal evaluation and next self-selected action
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('candidates/autonomous/yado-causal-ablation-cycle-v1.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS_SHADOW_CAUSAL_ABLATION_CYCLE_V1',r
          assert r['goal_provenance']['host_supplied_goal'] is False,r
          assert r['goal_provenance']['host_selected_goal'] is False,r
          assert r['goal_provenance']['action']=='CAUSAL_ABLATION_OF_CANDIDATE_IMPROVEMENT',r
          assert r['causal_evaluation']['verdict']=='REJECT_AND_REVISE_CANDIDATE',r
          assert r['causal_evaluation']['admit_candidate'] is False,r
          assert r['causal_evaluation']['automatic_main_mutation'] is False,r
          assert r['experiment']['control']['raw_representation_consumers']==['raw_processor'],r
          assert r['experiment']['treatment']['raw_representation_consumers']==['raw_processor','router'],r
          assert r['experiment']['causal_delta']['canonical_consumer_invariant_preserved'] is False,r
          assert r['self_selected_next_action']=='EXPERIENCE_GUIDED_SHADOW_REDERIVATION_PRESERVE_CANONICAL_COUPLING',r
          assert r['next_action_constraints']['preserve_raw_representation_consumers']==['raw_processor'],r
          assert r['next_action_constraints']['canonical_direct_write'] is False,r
          assert r['canonical_mutation'] is False,r
          assert r['consciousness_claimed'] is False,r
          print(json.dumps({
            'verdict':r['causal_evaluation']['verdict'],
            'fresh_test_regression_signal':r['experiment']['causal_delta']['fresh_test_regression_signal'],
            'next_action':r['self_selected_next_action'],
            'receipt_sha256':r['receipt_sha256'],
          },sort_keys=True))
          PY

      - name: Repeat decision for reproducibility
        run: |
          cp candidates/autonomous/yado-causal-ablation-cycle-v1.json "$RUNNER_TEMP/first.json"
          python runtime/yado_causal_ablation_cycle_v1.py --out "$RUNNER_TEMP/second.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          a=json.loads((Path(os.environ['RUNNER_TEMP'])/'first.json').read_text())
          b=json.loads((Path(os.environ['RUNNER_TEMP'])/'second.json').read_text())
          fields=[
            ('goal_provenance','goal'),
            ('goal_provenance','action'),
            ('causal_evaluation','verdict'),
          ]
          for x,y in fields:
            assert a[x][y]==b[x][y],(x,y,a[x][y],b[x][y])
          assert a['experiment']['control']['raw_representation_consumers']==b['experiment']['control']['raw_representation_consumers']
          assert a['experiment']['treatment']['raw_representation_consumers']==b['experiment']['treatment']['raw_representation_consumers']
          assert a['self_selected_next_action']==b['self_selected_next_action']
          print('PASS_REPRODUCIBLE_CAUSAL_DECISION')
          PY

      - name: Prove experiment did not mutate tracked canonical files
        run: git diff --exit-code

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-causal-ablation-cycle-v1-${{ github.run_id }}
          path: candidates/autonomous/yado-causal-ablation-cycle-v1.json
