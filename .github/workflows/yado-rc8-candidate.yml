name: YADO RC8 candidate migration
on:
  push:
    branches: [yado-rc8-candidate]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rc8-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified v29 parent package
        run: python runtime/reconstruct_v29.py
      - name: Overlay RC8 migration candidate
        run: cp runtime/rc8_overlay/* runtime/yado_v29/
      - name: Install YADO dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_v29/requirements-github.txt
      - name: Run RC8 migration tests
        working-directory: runtime/yado_v29
        run: python -W error::ResourceWarning -m unittest -v test_yado_rc8_migration.py
      - name: Boot RC8 candidate externally
        working-directory: runtime/yado_v29
        run: python ../rc8_candidate_cycle.py
      - name: Upload RC8 candidate receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-rc8-candidate-receipt
          path: runtime/rc8_candidate_receipt.json
          retention-days: 30
      - name: Persist RC8 candidate receipt
        run: |
          mkdir -p receipts
          cp runtime/rc8_candidate_receipt.json receipts/yado-rc8-candidate-latest.json
          git config user.name "YADO RC8 Migration Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-rc8-candidate-latest.json
          if git diff --cached --quiet; then
            echo "receipt unchanged"
          else
            git commit -m "Persist YADO RC8 candidate receipt [skip ci]"
            git push origin HEAD:yado-rc8-candidate
          fi