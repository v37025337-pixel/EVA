name: YADO RC8 cognitive uplift V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_rc8_cognitive_uplift_v1.py"
      - ".github/workflows/yado-rc8-cognitive-uplift-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  uplift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Reconstruct verified v36
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: YADO evolves LOGIC THINKING INTELLIGENCE and commits shadow RC8 candidate
        run: python runtime/yado_rc8_cognitive_uplift_v1.py
      - name: Upload candidate and receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-rc8-cognitive-uplift-v1
          path: |
            runtime/yado_rc8_cognitive_uplift_v1_receipt.json
            runtime/rc8_cognitive_uplift_candidate/yado_canonical_state_rc8_cognitive_uplift_candidate.json
          retention-days: 30
      - name: Persist receipt and candidate state
        run: |
          mkdir -p receipts candidates/rc8-cognitive-uplift-v1
          cp runtime/yado_rc8_cognitive_uplift_v1_receipt.json receipts/yado-rc8-cognitive-uplift-v1-latest.json
          cp runtime/rc8_cognitive_uplift_candidate/yado_canonical_state_rc8_cognitive_uplift_candidate.json candidates/rc8-cognitive-uplift-v1/candidate-state.json
          git config user.name "YADO RC8 Cognitive Uplift Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-rc8-cognitive-uplift-v1-latest.json candidates/rc8-cognitive-uplift-v1/candidate-state.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist YADO RC8 cognitive uplift candidate [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
