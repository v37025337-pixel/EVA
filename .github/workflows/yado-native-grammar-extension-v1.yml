name: YADO Native Grammar Extension V1

on:
  push:
    branches:
      - yado-native-grammar-extension-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shadow:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare runtime
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Run bounded native grammar extension
        run: |
          python -m py_compile runtime/yado_g2_native_grammar_extension_v1.py
          python runtime/yado_g2_native_grammar_extension_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('candidates/kernel-self-generated/g2-native-grammar-extension-v1.json')
          x=json.loads(p.read_text())
          assert x['status']=='PASS_SHADOW_BOUNDED_NATIVE_GRAMMAR_EXTENSION_V1',x
          assert x['checks']['external_model_used'] is False
          assert x['checks']['behavior_formula_supplied_to_controller'] is False
          assert x['checks']['legacy_bound_exhausted'] is True
          assert x['checks']['legacy_fit_found'] is False
          assert x['checks']['yado_native_ifexp_gene_consumed'] is True
          assert x['checks']['yado_skill_gate_selected_extension'] is True
          assert x['checks']['generated_source_compiles'] is True
          assert x['checks']['fresh_hidden_full_pass'] is True
          assert x['checks']['ablation_withholds_without_extension'] is True
          assert x['checks']['tamper_detected'] is True
          assert x['canonical_mutation'] is False
          assert x['promotion_applied'] is False
          print(json.dumps({'status':x['status'],'hidden':[x['fresh_hidden_pass_count'],x['fresh_hidden_total']],'source_sha':x['generated_source_sha256'],'receipt':x['receipt_sha256']},sort_keys=True))
          PY
      - name: Full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Fresh Successor build and full regression
        run: |
          rm -rf "$RUNNER_TEMP/yado-successor-native-grammar-extension-v1"
          python -m successor build --output "$RUNNER_TEMP/yado-successor-native-grammar-extension-v1"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-native-grammar-extension-v1/manifest.json"
      - name: Verify gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          r=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert a['status']=='PASS' and not a.get('findings'),a
          assert r['status']=='PASS' and r['tests_run']==r['expected_tests'],r
          print(json.dumps({'audit':a['status'],'regression':r['status'],'tests':r['tests_run']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-native-grammar-extension-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-grammar-extension-v1.json
            candidates/g2-native-grammar-extension/
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
