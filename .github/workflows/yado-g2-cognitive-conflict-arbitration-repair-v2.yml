name: YADO G2 Cognitive Conflict Arbitration Repair V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-cognitive-conflict-arbitration-repair-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-cognitive-conflict-arbitration-repair-v2
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before evidence repair
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile evidence repair
        run: python -m py_compile runtime/yado_g2_cognitive_conflict_arbitration_repair_v2.py
      - name: Run YADO causal evidence repair
        continue-on-error: true
        run: python runtime/yado_g2_cognitive_conflict_arbitration_repair_v2.py
      - name: Canonical guard after evidence repair
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist evidence repair
        if: always()
        run: |
          git config user.name "YADO Cognitive Evidence Repair V2"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-cognitive-conflict-arbitration-repair-v2.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-cognitive-conflict-arbitration-repair-v2.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO cognitive evidence repair V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest evidence verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-cognitive-conflict-arbitration-repair-v2.json")
          if not p.exists():raise SystemExit("MISSING_EVIDENCE_REPAIR_V2")
          r=json.loads(p.read_text());c=r["checks"]
          assert c["exhaustive_behavior_336_preserved"] is True,r
          assert c["mechanism_changed_to_chase_metric"] is False,r
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_EVIDENCE_REPAIR_G2_COGNITIVE_CONFLICT_ARBITRATION_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"]+":"+str(r["next_required_capability"]))
          print(r["status"],r["exhaustive_composite"],r["balanced_fresh"],r["balanced_ablation"],r["balanced_ablation_drop"],r["admission_state"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-cognitive-evidence-repair-v2-${{ github.run_id }}
          path: |
            experience/yado-cognitive-conflict-arbitration-repair-v2.json
            candidates/kernel-self-generated/g2-cognitive-conflict-arbitration-repair-v2.json
          if-no-files-found: warn
