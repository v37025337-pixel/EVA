name: YADO G2 Native Source IR Emitter Birth V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-source-ir-emitter-birth-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-source-ir-emitter-birth-v1
  cancel-in-progress: true
jobs:
  birth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before emitter birth
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile emitter-birth transport
        run: python -m py_compile runtime/yado_g2_native_source_ir_emitter_birth_v1.py
      - name: Let YADO attempt native IR-to-source emitter birth
        id: birth
        continue-on-error: true
        run: python runtime/yado_g2_native_source_ir_emitter_birth_v1.py
      - name: Canonical guard after emitter birth
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist emitter-birth evidence
        if: always()
        run: |
          git config user.name "YADO Native IR Emitter Birth"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-source-ir-emitter-birth-v1.json ]; then
            git add candidates/kernel-self-generated/g2-native-source-ir-emitter-birth-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO native IR emitter birth evidence [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict native emitter verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-source-ir-emitter-birth-v1.json")
          if not p.exists(): raise SystemExit("MISSING_NATIVE_IR_EMITTER_EVIDENCE")
          r=json.loads(p.read_text())
          assert r["checks"]["external_coding_models_used"] is False,r
          assert r["checks"]["host_source_seed_used"] is False,r
          assert r["checks"]["host_source_template_used"] is False,r
          assert r["checks"]["host_patch_used"] is False,r
          assert r["checks"]["host_target_file_selected"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SOURCE_IR_EMITTER_BIRTH_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["checks"]["candidate_source_produced_by_yado"] is True,r
          assert r["checks"]["candidate_source_compiles"] is True,r
          print(r["status"],r["candidate_source_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-source-ir-emitter-birth-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-source-ir-emitter-birth-v1.json
          if-no-files-found: warn
