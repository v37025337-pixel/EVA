name: YADO G2 Native Context Bound AST Source Realization V18
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-context-bound-ast-source-realization-v18-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-context-bound-ast-source-realization-v18
  cancel-in-progress: true
jobs:
  realize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V18
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V18 transport
        run: python -m py_compile runtime/yado_g2_native_context_bound_ast_source_realization_v18.py
      - name: Run context-bound AST source realization V18
        id: realize
        continue-on-error: true
        run: python runtime/yado_g2_native_context_bound_ast_source_realization_v18.py
      - name: Canonical guard after V18
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V18 shadow evidence
        if: always()
        run: |
          git config user.name "YADO AST Source Realization V18"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-context-bound-ast-source-realization-v18.json ]; then
            git add candidates/kernel-self-generated/g2-native-context-bound-ast-source-realization-v18.json
          fi
          if [ -f candidates/g2-self-evolution/yado_native_context_bound_ast_source_v18.py ]; then
            git add candidates/g2-self-evolution/yado_native_context_bound_ast_source_v18.py
          fi
          git diff --cached --quiet || git commit -m "Persist YADO context-bound AST source V18 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V18 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-context-bound-ast-source-realization-v18.json")
          if not p.exists(): raise SystemExit("MISSING_V18_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          if r["status"]!="PASS_SHADOW_G2_NATIVE_CONTEXT_BOUND_AST_SOURCE_REALIZATION_V18":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["actual_target_source_integration_proven"] is True,r
          assert c["valid_evidence_closes_finding"] is True,r
          assert c["valid_evidence_changes_future_priority"] is True,r
          assert c["counterfactual_fails_closed"] is True,r
          assert c["counterfactual_retains_priority"] is True,r
          assert c["regression_suite_pass"] is True,r
          assert c["native_skill_selector_selected_realized_source"] is True,r
          assert c["host_authored_semantic_logic"] is False,r
          assert c["host_authored_context_values"] is False,r
          assert c["host_selected_target_file"] is False,r
          assert c["host_integration_transport"] is True,r
          assert c["canonical_unchanged"] is True,r
          assert r["canonical_mutation"] is False,r
          assert r["promotion_applied"] is False,r
          print(r["status"],r["candidate_source_sha256"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-context-bound-ast-source-realization-v18-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-context-bound-ast-source-realization-v18.json
            candidates/g2-self-evolution/yado_native_context_bound_ast_source_v18.py
          if-no-files-found: warn
