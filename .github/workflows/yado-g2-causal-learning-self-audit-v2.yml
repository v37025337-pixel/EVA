name: YADO G2 Causal Learning Self Audit V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-causal-learning-self-audit-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-causal-learning-self-audit-v2
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Canonical guard before causal self audit
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile causal learning runtime
        run: python -m py_compile runtime/yado_g2_causal_library_kernel_v1.py runtime/yado_g2_causal_learning_self_audit_v2.py
      - name: Run causal kernel regression
        run: python -m unittest discover -s tests -p 'test_yado_g2_causal_library_kernel_v1.py' -v
      - name: Run causal learning self audit
        run: python runtime/yado_g2_causal_learning_self_audit_v2.py
      - name: Require applied-learning behavior change
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-causal-learning-self-audit-v2.json"))
          q=json.load(open("architecture/yado-g2-causal-learning-self-audit-v2-request.json"))
          assert r["status"]=="PASS_SHADOW_G2_CAUSAL_LEARNING_SELF_AUDIT_V2",r
          assert r["previous_deficit_now_pass"] is True,r
          assert r["behavior_changed"] is True,r
          assert r["self_selected_next_step"]==q["expected_next_step"],(r,q)
          assert r["canonical_mutation"] is False,r
          assert r["automatic_promotion"] is False,r
          print(r["status"],r["self_selected_next_step"],r["behavior_changed"])
          PY
      - name: Canonical guard after causal self audit
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist causal self audit
        run: |
          git config user.name "YADO Causal Learning Self Audit"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-causal-learning-self-audit-v2.json
          git add "receipts/yado-g2-causal-learning-self-audit-v2-run-${GITHUB_RUN_ID}.json"
          git diff --cached --quiet || git commit -m "Persist causal learning self audit V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-g2-causal-learning-self-audit-v2-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-causal-learning-self-audit-v2.json
            receipts/yado-g2-causal-learning-self-audit-v2-run-${{ github.run_id }}.json
