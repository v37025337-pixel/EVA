name: YADO G2 Raw V4 Hierarchical Residual Self Evolution V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-raw-v4-hierarchical-residual-self-evolution-v3-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-v4-hierarchical-residual-self-evolution-v3
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before residual V3
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile residual V3
        run: python -m py_compile runtime/yado_g2_raw_v4_hierarchical_residual_self_evolution_v3.py
      - name: Let YADO select and test hierarchical residual V3
        id: residual_v3
        continue-on-error: true
        run: python runtime/yado_g2_raw_v4_hierarchical_residual_self_evolution_v3.py
      - name: Persist V3 PASS or WITHHOLD causal evidence
        if: always()
        run: |
          git config user.name "YADO Raw Residual Evolution"
          git config user.email "actions@users.noreply.github.com"
          [ -f candidates/kernel-self-generated/g2-raw-v4-hierarchical-residual-self-evolution-v3.json ] && git add candidates/kernel-self-generated/g2-raw-v4-hierarchical-residual-self-evolution-v3.json
          [ -f candidates/kernel-self-generated/raw-task-representation-hierarchical-residual-v3.json ] && git add candidates/kernel-self-generated/raw-task-representation-hierarchical-residual-v3.json
          git diff --cached --quiet || git commit -m "Persist YADO raw residual V3 causal evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Require strict residual V3 PASS
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-raw-v4-hierarchical-residual-self-evolution-v3.json"))
          assert r["status"]=="PASS_SHADOW_G2_RAW_V4_HIERARCHICAL_RESIDUAL_SELF_EVOLUTION_V3",r
          c=r["checks"]
          assert c["exact_user_goal_repaired_to_resource"] is True,r
          assert c["parent_correct_retention_exact"] is True,r
          assert c["old_blind_not_worse"] is True,r
          assert c["historical_not_worse"] is True,r
          assert c["fresh_resource_transfer_ge_0_80"] is True,r
          assert c["fresh_nonresource_transfer_exact"] is True,r
          assert c["causal_ablation_restores_original_failure"] is True,r
          assert c["canonical_unchanged"] is True,r
          print(r["status"],r["selected"],r["metrics"],r["next_required_capability"])
          PY
      - name: Canonical guard after residual V3
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-raw-v4-hierarchical-residual-self-evolution-v3-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-raw-v4-hierarchical-residual-self-evolution-v3.json
            candidates/kernel-self-generated/raw-task-representation-hierarchical-residual-v3.json
          if-no-files-found: warn
