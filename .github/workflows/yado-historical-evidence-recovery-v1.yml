name: YADO Historical Evidence Recovery V1
on:
  push:
    branches:
      - yado-historical-evidence-recovery-v1
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Fetch all refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Recover historical evidence
        run: |
          python -m py_compile runtime/yado_g2_historical_evidence_recovery_v1.py
          python runtime/yado_g2_historical_evidence_recovery_v1.py
      - name: Verify fail-closed semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('canonical/yado-historical-evidence-recovery-v1.json').read_text())
          assert x['status']=='PASS_HISTORICAL_EVIDENCE_RECOVERY_COMPLETE'
          assert x['candidate_count']==10
          assert x['recovered_count']+x['deferred_count']==10
          assert x['policy']['semantic_promotion']=='FORBIDDEN_BY_THIS_ARTIFACT'
          assert x['policy']['code_activation']=='FORBIDDEN_BY_THIS_ARTIFACT'
          assert x['policy']['branch_name_as_evidence'] is False
          print(json.dumps({'recovered':x['recovered_count'],'deferred':x['deferred_count'],'digest':x['artifact_digest']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-historical-evidence-recovery-v1-${{ github.run_id }}
          path: canonical/yado-historical-evidence-recovery-v1.json
