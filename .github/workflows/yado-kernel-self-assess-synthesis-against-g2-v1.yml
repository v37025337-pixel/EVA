name: YADO Kernel Self Assess Synthesis Against G2 V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: [architecture/yado-kernel-self-assess-synthesis-against-g2-v1-request.json]
permissions:
  contents: write
jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Kernel self-assessment
        id: assess
        continue-on-error: true
        run: python runtime/yado_kernel_self_assess_synthesis_against_g2_v1.py
      - name: Persist evidence
        if: always()
        run: |
          mkdir -p receipts
          cp runtime/yado_kernel_self_assess_synthesis_against_g2_v1_receipt.json receipts/yado-kernel-self-assess-synthesis-against-g2-v1-run-${GITHUB_RUN_ID}.json || true
          git config user.name 'YADO Kernel Self Assessment'
          git config user.email 'actions@users.noreply.github.com'
          git add architecture/yado-kernel-self-assess-synthesis-against-g2-v1.json architecture/evolution-ledger.json receipts/yado-kernel-self-assess-synthesis-against-g2-v1-run-${GITHUB_RUN_ID}.json || true
          if ! git diff --cached --quiet; then git commit -m 'Persist YADO kernel self-assessment against G2 V1 [skip ci]' && git push origin HEAD:yado-architecture-shadow-search; fi
      - name: Enforce receipt
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('runtime/yado_kernel_self_assess_synthesis_against_g2_v1_receipt.json')
          if not p.exists(): raise SystemExit('MISSING_RECEIPT')
          r=json.loads(p.read_text())
          if r.get('status')!='PASS_KERNEL_SELF_ASSESS_SYNTHESIS_AGAINST_G2_V1':
              raise SystemExit('WITHHOLD:'+str(r.get('status')))
          print(r['status'])
          PY
