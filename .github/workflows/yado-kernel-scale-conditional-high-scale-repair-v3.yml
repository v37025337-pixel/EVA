name: YADO G2 High Scale Repair V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-scale-conditional-high-scale-repair-v3-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before V3
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile bounded V3 and failure-memory paths before opening fresh10
        run: python -m py_compile runtime/yado_kernel_scale_conditional_high_scale_repair_v3.py runtime/yado_v3_execution_failure_history_v1.py
      - name: Let G2 choose KNN refresh or bounded native RC5 constructor and test unseen size10
        run: timeout --signal=TERM --kill-after=30s 1800s python runtime/yado_kernel_scale_conditional_high_scale_repair_v3.py
      - name: Persist unexpected V3 execution failure as causal history
        if: failure()
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_v3_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_v3_execution_failure_history_v1_receipt.json "receipts/yado-v3-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 V3 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-v3-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record aborted V3 execution as causal history [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Persist V3 high-scale repair evidence
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources
          cp runtime/yado_kernel_scale_conditional_high_scale_repair_v3_receipt.json "receipts/yado-kernel-scale-conditional-high-scale-repair-v3-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 High Scale Repair V3"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-scale-conditional-high-scale-repair-v3.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/high-scale-repair-v3.json resources/yado-ten-source-transfer-history-v1.json "receipts/yado-kernel-scale-conditional-high-scale-repair-v3-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 high-scale branch repair V3 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce V3 receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_scale_conditional_high_scale_repair_v3_receipt.json"))
          assert r["status"] in {"PASS_HIGH_SCALE_REPAIR_V3","WITHHOLD_HIGH_SCALE_REPAIR_V3"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["selected_skill_id"],r["metrics"],r["next_required_capability"])
          PY
