name: YADO Native Main Provenance Admission V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "runtime/yado_g2_native_main_provenance_admission_v2.py"
      - ".github/workflows/yado-native-main-provenance-admission-v2.yml"

permissions:
  contents: write

concurrency:
  group: yado-native-main-provenance-admission-v2
  cancel-in-progress: false

jobs:
  native-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Pin starting main head
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare runtime
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile native evolution path
        run: |
          python -m py_compile runtime/yado_g2_native_main_provenance_rewrite_v1.py
          python -m py_compile runtime/yado_g2_native_main_provenance_admission_v2.py
          python -m py_compile runtime/yado_canonical_invariant_guard_v1.py
          python -m py_compile runtime/yado_full_kernel_audit_v1.py
          python -m py_compile runtime/yado_full_regression_v1.py

      - name: Generate bounded source inside YADO AST path
        run: python runtime/yado_g2_native_main_provenance_rewrite_v1.py

      - name: Admit exact native candidate with canonical hash and ledger binding
        run: python runtime/yado_g2_native_main_provenance_admission_v2.py

      - name: Full kernel audit
        run: |
          rm -f audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md audits/yado-full-regression-v1-report.json audits/yado-full-regression-v1-report.log
          python runtime/yado_full_kernel_audit_v1.py

      - name: Build fresh Successor identity and run complete regression
        run: |
          rm -rf "$RUNNER_TEMP/yado-successor-birth-native-v2"
          python -m successor build --output "$RUNNER_TEMP/yado-successor-birth-native-v2"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth-native-v2/manifest.json"

      - name: Verify admission evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v1=json.loads(Path('candidates/kernel-self-generated/g2-native-main-provenance-rewrite-v1.json').read_text())
          v2=json.loads(Path('candidates/kernel-self-generated/g2-native-main-provenance-admission-v2.json').read_text())
          audit=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          reg=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert v1['external_model_used'] is False
          assert v1['status']=='PASS_SHADOW_G2_NATIVE_MAIN_PROVENANCE_REWRITE_V1'
          assert v2['status']=='PASS_CANONICAL_PENDING_FULL_AUDIT_G2_NATIVE_MAIN_PROVENANCE_ADMISSION_V2'
          assert v2['provenance_finding']['status']=='PASS'
          assert v2['deep_audit_next_step']!='LEGACY_EXPERIENCE_SUMMARY_PROVENANCE'
          assert audit['status']=='PASS', audit
          assert not audit.get('findings'), audit
          assert audit['canonical']['canonical_guard']=='PASS', audit['canonical']
          assert audit['canonical']['ledger_validation']=='PASS', audit['canonical']
          assert reg['status']=='PASS', reg
          assert reg['tests_run']==reg['expected_tests']==170, reg
          print(json.dumps({'v1':v1['status'],'v2':v2['status'],'audit':audit['status'],'regression':reg['status'],'tests':reg['tests_run'],'next_step':v2['deep_audit_next_step']},sort_keys=True))
          PY

      - name: Fail closed if main changed concurrently
        run: |
          git fetch origin main
          REMOTE_SHA=$(git rev-parse origin/main)
          echo "base=$BASE_SHA remote=$REMOTE_SHA"
          test "$REMOTE_SHA" = "$BASE_SHA"

      - name: Persist verified native evolution into main
        run: |
          git config user.name "YADO Native Main Evolution"
          git config user.email "actions@users.noreply.github.com"
          git add \
            runtime/yado_unified_core_deep_self_audit_v1.py \
            canonical/yado-unified-core-v1.json \
            canonical/yado-main-head-g2.json \
            architecture/evolution-ledger.json \
            candidates/g2-self-evolution/yado_unified_core_deep_self_audit_native_provenance_candidate_v1.py \
            candidates/kernel-self-generated/g2-native-main-provenance-rewrite-v1.json \
            candidates/kernel-self-generated/g2-native-main-provenance-admission-v2.json \
            audits/yado-full-kernel-audit-v1-report.json \
            audits/yado-full-kernel-audit-v1-summary.md \
            audits/yado-full-regression-v1-report.json \
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json \
            receipts
          git commit -m "YADO native main evolution: admit provenance AST repair after full gate [skip ci]"
          git push origin HEAD:main

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-native-main-provenance-admission-v2-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-main-provenance-rewrite-v1.json
            candidates/kernel-self-generated/g2-native-main-provenance-admission-v2.json
            candidates/g2-self-evolution/yado_unified_core_deep_self_audit_native_provenance_candidate_v1.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
