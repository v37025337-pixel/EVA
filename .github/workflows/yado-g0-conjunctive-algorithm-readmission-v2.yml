name: YADO G0 Conjunctive Algorithm Readmission V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_g0_conjunctive_algorithm_readmission_v2.py"
      - ".github/workflows/yado-g0-conjunctive-algorithm-readmission-v2.yml"
permissions:
  contents: write
jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Let G0 reconsider admission after extended transfer
        run: python runtime/yado_g0_conjunctive_algorithm_readmission_v2.py
      - name: Upload decision
        uses: actions/upload-artifact@v4
        with:
          name: yado-g0-conjunctive-algorithm-readmission-v2
          path: runtime/yado_g0_conjunctive_algorithm_readmission_v2_receipt.json
          retention-days: 30
      - name: Persist decision
        run: |
          mkdir -p receipts
          cp runtime/yado_g0_conjunctive_algorithm_readmission_v2_receipt.json receipts/yado-g0-conjunctive-algorithm-readmission-v2-latest.json
          git config user.name "YADO G0 Algorithm Readmission"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-g0-conjunctive-algorithm-readmission-v2-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist G0 conjunctive readmission decision V2 [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
