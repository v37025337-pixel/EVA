name: YADO G2 User External Corpus Learning V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-user-external-corpus-learning-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-user-external-corpus-learning-v1
  cancel-in-progress: true
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before learning
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile corpus learner
        run: python -m py_compile runtime/yado_g2_user_external_corpus_learning_v1.py
      - name: Fetch and index user external corpus
        id: learn
        continue-on-error: true
        run: python runtime/yado_g2_user_external_corpus_learning_v1.py
      - name: Canonical guard after learning
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist learned corpus and receipt
        if: always()
        run: |
          mkdir -p receipts experience
          if [ -f runtime/yado_g2_user_external_corpus_learning_v1_receipt.json ]; then
            cp runtime/yado_g2_user_external_corpus_learning_v1_receipt.json "receipts/yado-g2-user-external-corpus-learning-v1-run-${GITHUB_RUN_ID}.json"
          fi
          git config user.name "YADO External Corpus Learner"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f experience/yado-user-external-corpus-learning-v1.json ] && files+=(experience/yado-user-external-corpus-learning-v1.json)
          [ -f "receipts/yado-g2-user-external-corpus-learning-v1-run-${GITHUB_RUN_ID}.json" ] && files+=("receipts/yado-g2-user-external-corpus-learning-v1-run-${GITHUB_RUN_ID}.json")
          [ ${#files[@]} -gt 0 ] && git add "${files[@]}"
          git diff --cached --quiet || git commit -m "Persist YADO user external corpus learning [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce learning verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("runtime/yado_g2_user_external_corpus_learning_v1_receipt.json")
          if not p.exists(): raise SystemExit("MISSING_EXTERNAL_CORPUS_RECEIPT")
          r=json.loads(p.read_text())
          if r.get("status")!="PASS_G2_USER_EXTERNAL_CORPUS_LEARNING_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
          assert r.get("third_party_code_executed") is False,r
          assert r.get("canonical_mutation") is False,r
          print(r["status"],r["fetched_count"],r["source_count"])
          PY
      - name: Run optional fresh DNS GCP cross-domain research stress
        continue-on-error: true
        run: |
          python - <<'PY'
          import json,pathlib,subprocess,sys
          req=json.loads(pathlib.Path("architecture/yado-user-external-corpus-learning-v1-request.json").read_text())
          task=(req.get("cross_domain_task") or {}).get("id")
          if task=="USER_20260906_DNS_GCP_RESEARCH_V1":
              subprocess.check_call([sys.executable,"runtime/yado_g2_dns_gcp_cross_domain_research_stress_v1.py"])
          elif task=="USER_20260907_DNS_SCREENSHOT_RESEARCH_V2":
              subprocess.check_call([sys.executable,"runtime/yado_g2_dns_screenshot_research_stress_v2.py"])
          elif task=="USER_20260906_FOUR_DOMAIN_FRESH_STRESS_V1":
              subprocess.check_call([sys.executable,"runtime/yado_g2_four_domain_fresh_stress_v1.py"])
          elif task=="USER_20260906_TRI_ORGAN_ADMISSION_REVIEW_V2":
              subprocess.check_call([sys.executable,"runtime/yado_g2_all_experience_tri_organ_canonical_admission_review_v2.py"])
          elif task=="USER_20260906_TRI_ORGAN_CANONICAL_BINDING_V2":
              subprocess.check_call([sys.executable,"runtime/yado_g2_all_experience_tri_organ_additive_canonical_binding_v2.py"])
          elif task=="USER_20260906_TRI_ORGAN_CANONICAL_BURNIN_AB_V1":
              subprocess.check_call([sys.executable,"runtime/yado_g2_tri_organ_canonical_burnin_old_parent_comparative_ab_v1.py"])
          else:
              print("NO_OPTIONAL_CROSS_DOMAIN_STRESS",task)
          PY
      - name: Roll back incomplete optional canonical binding
        if: always()
        run: |
          task="$(python - <<'PY'
          import json
          r=json.load(open("architecture/yado-user-external-corpus-learning-v1-request.json"))
          print((r.get("cross_domain_task") or {}).get("id") or "")
          PY
          )"
          if [ "$task" = "USER_20260906_TRI_ORGAN_CANONICAL_BINDING_V2" ] && [ ! -f runtime/yado_tri_organ_binding_v2_commit_ready.marker ]; then
            echo "Binding did not reach commit-ready marker; restoring checkout to last committed state."
            git reset --hard HEAD
          fi
      - name: Canonical guard after optional cross-domain stress
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist optional cross-domain stress evidence
        if: always()
        run: |
          git config user.name "YADO DNS GCP Research Stress"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f candidates/kernel-self-generated/g2-dns-gcp-cross-domain-research-stress-v1.json ] && files+=(candidates/kernel-self-generated/g2-dns-gcp-cross-domain-research-stress-v1.json)
          [ -f experience/yado-dns-gcp-cross-domain-research-stress-v1.json ] && files+=(experience/yado-dns-gcp-cross-domain-research-stress-v1.json)
          [ -f candidates/kernel-self-generated/g2-dns-screenshot-research-stress-v2.json ] && files+=(candidates/kernel-self-generated/g2-dns-screenshot-research-stress-v2.json)
          [ -f experience/yado-dns-screenshot-research-stress-v2.json ] && files+=(experience/yado-dns-screenshot-research-stress-v2.json)
          [ -f candidates/kernel-self-generated/g2-four-domain-fresh-stress-v1.json ] && files+=(candidates/kernel-self-generated/g2-four-domain-fresh-stress-v1.json)
          [ -f experience/yado-four-domain-fresh-stress-v1.json ] && files+=(experience/yado-four-domain-fresh-stress-v1.json)
          [ -f candidates/kernel-self-generated/g2-all-experience-tri-organ-canonical-admission-review-v2.json ] && files+=(candidates/kernel-self-generated/g2-all-experience-tri-organ-canonical-admission-review-v2.json)
          [ -f candidates/kernel-self-generated/g2-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json ] && files+=(candidates/kernel-self-generated/g2-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json)
          [ -f experience/yado-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json ] && files+=(experience/yado-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json)
          if [ -f runtime/yado_tri_organ_binding_v2_commit_ready.marker ]; then
            files+=(
              canonical/yado-g2-all-experience-tri-organ-v1.json
              canonical/yado-main-head-g2.json
              canonical/yado-unified-core-v1.json
              canonical/yado-algorithm-provenance-registry-v1.json
              architecture/evolution-ledger.json
              runtime/yado_unified_core_v1.py
              runtime/yado_g2_unified_module_kernel_v1.py
              candidates/kernel-self-generated/g2-unified-module-kernel-v1.json
              audits/yado-g2-post-module-full-integrity-v1.json
              audits/yado-g2-module-dependency-graph-v1.json
              candidates/kernel-self-generated/g2-all-experience-tri-organ-additive-canonical-binding-v2.json
            )
            for rf in receipts/yado-g2-all-experience-tri-organ-additive-canonical-binding-v2-run-*.json; do
              [ -f "${rf}" ] && files+=("${rf}")
            done
          fi
          if [ ${#files[@]} -gt 0 ]; then
            git add "${files[@]}"
            git diff --cached --quiet || git commit -m "Persist YADO tri-organ/cross-domain evidence [skip ci]"
            # Every intended binding mutation is now inside the commit. Discard only
            # residual tracked runner output before rebase; never widen the staged set.
            git reset --hard HEAD
            git pull --rebase origin yado-architecture-shadow-search
            git push origin HEAD:yado-architecture-shadow-search
          fi
      - name: Enforce optional cross-domain stress verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          req=json.loads(pathlib.Path("architecture/yado-user-external-corpus-learning-v1-request.json").read_text())
          task=(req.get("cross_domain_task") or {}).get("id")
          if task=="USER_20260906_DNS_GCP_RESEARCH_V1":
              p=pathlib.Path("candidates/kernel-self-generated/g2-dns-gcp-cross-domain-research-stress-v1.json")
              if not p.exists(): raise SystemExit("MISSING_DNS_GCP_STRESS_REPORT")
              r=json.loads(p.read_text())
              if r.get("status")!="PASS_SHADOW_G2_DNS_GCP_CROSS_DOMAIN_RESEARCH_STRESS_V1":
                  raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
              print(r["status"],r["logic"],r["thinking"],r["intelligence"])
          elif task=="USER_20260907_DNS_SCREENSHOT_RESEARCH_V2":
              p=pathlib.Path("candidates/kernel-self-generated/g2-dns-screenshot-research-stress-v2.json")
              if not p.exists(): raise SystemExit("MISSING_DNS_SCREENSHOT_STRESS_REPORT")
              r=json.loads(p.read_text())
              if r.get("status")!="PASS_SHADOW_G2_DNS_SCREENSHOT_RESEARCH_STRESS_V2":
                  raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
              assert r["checks"]["all_address_claims_determined"] is True,r
              assert r["checks"]["google_absolute_no_ip_logs_exposed"] is True,r
              assert r["checks"]["cloudflare_default_filtering_exposed"] is True,r
              assert r["checks"]["opendns_familyshield_address_separation_exposed"] is True,r
              assert r["checks"]["nextdns_configuration_nuance_exposed"] is True,r
              assert r["canonical_mutation"] is False,r
              print(r["status"],r["summary"],r["next_required_capability"])
          elif task=="USER_20260906_FOUR_DOMAIN_FRESH_STRESS_V1":
              p=pathlib.Path("candidates/kernel-self-generated/g2-four-domain-fresh-stress-v1.json")
              if not p.exists(): raise SystemExit("MISSING_FOUR_DOMAIN_STRESS_REPORT")
              r=json.loads(p.read_text())
              if r.get("status")!="PASS_SHADOW_G2_FOUR_DOMAIN_FRESH_STRESS_V1":
                  raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
              assert r["checks"]["four_domains_present"] is True,r
              assert r["checks"]["all_domain_gates_pass"] is True,r
              assert r["checks"]["frozen_program_digests_unchanged"] is True,r
              assert r["checks"]["no_gene_reselection"] is True,r
              assert r["checks"]["no_resynthesis"] is True,r
              assert r["checks"]["canonical_unchanged"] is True,r
              print(r["status"],r["next_required_capability"])
          elif task=="USER_20260906_TRI_ORGAN_ADMISSION_REVIEW_V2":
              p=pathlib.Path("candidates/kernel-self-generated/g2-all-experience-tri-organ-canonical-admission-review-v2.json")
              if not p.exists(): raise SystemExit("MISSING_TRI_ORGAN_ADMISSION_REVIEW")
              r=json.loads(p.read_text())
              if r.get("status")!="PASS_REVIEW_G2_ALL_EXPERIENCE_TRI_ORGAN_CANONICAL_ADMISSION_V2":
                  raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
              assert r["checks"]["review_does_not_mutate_canonical"] is True,r
              assert r["admission_plan"]["replace_existing_organs"] is False,r
              assert r["canonical_mutation"] is False,r
              print(r["status"],r["next_required_capability"])
          elif task=="USER_20260906_TRI_ORGAN_CANONICAL_BINDING_V2":
              p=pathlib.Path("candidates/kernel-self-generated/g2-all-experience-tri-organ-additive-canonical-binding-v2.json")
              if not p.exists(): raise SystemExit("MISSING_TRI_ORGAN_BINDING_REPORT")
              r=json.loads(p.read_text())
              if r.get("status")!="PASS_G2_TRI_ORGAN_ADDITIVE_CANONICAL_BINDING_V2":
                  raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
              assert r["replace_existing_organs"] is False,r
              assert r["v4_preserved"] is True,r
              assert r["v7_preserved"] is True,r
              assert r["active_capability_count_before"]==28,r
              assert r["active_capability_count_after"]==31,r
              assert r["post_binding_gates"]["canonical_guard"] is True,r
              assert r["post_binding_gates"]["regression_tests"] is True,r
              assert r["post_binding_gates"]["unified_module_fresh_gate"]=="PASS_CURRENT_G2_UNIFIED_MODULE_ASSEMBLY_V1",r
              assert r["post_binding_gates"]["post_module_integrity"]=="PASS_G2_POST_MODULE_FULL_INTEGRITY_V1",r
              assert r["generation_transition"] is False,r
              assert r["g3_genesis_performed"] is False,r
              print(r["status"],r["active_capability_count_after"],r["next_required_capability"])
          elif task=="USER_20260906_TRI_ORGAN_CANONICAL_BURNIN_AB_V1":
              p=pathlib.Path("candidates/kernel-self-generated/g2-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json")
              if not p.exists(): raise SystemExit("MISSING_TRI_ORGAN_BURNIN_REPORT")
              r=json.loads(p.read_text())
              if r.get("status")!="PASS_G2_TRI_ORGAN_CANONICAL_BURNIN_OLD_PARENT_COMPARATIVE_AB_V1":
                  raise SystemExit("SEMANTIC_WITHHOLD:"+str(r.get("status")))
              assert r["checks"]["old_parent_native_accuracy_1"] is True,r
              assert r["checks"]["tri_logic_accuracy_1"] is True,r
              assert r["checks"]["tri_thinking_accuracy_1"] is True,r
              assert r["checks"]["tri_intelligence_accuracy_1"] is True,r
              assert r["checks"]["tri_unsupported_contract_fail_closed_all_cycles"] is True,r
              assert r["checks"]["frozen_program_digests_unchanged"] if "frozen_program_digests_unchanged" in r["checks"] else True
              assert r["checks"]["canonical_head_digest_unchanged"] is True,r
              assert r["checks"]["g3_not_started"] is True,r
              print(r["status"],r["cycles"],r["metrics"]["coverage_gain"],r["next_required_capability"])
          else:
              print("NO_OPTIONAL_CROSS_DOMAIN_STRESS_TO_ENFORCE",task)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-user-external-corpus-learning-v1-${{ github.run_id }}
          path: |
            runtime/yado_g2_user_external_corpus_learning_v1_receipt.json
            experience/yado-user-external-corpus-learning-v1.json
            candidates/kernel-self-generated/g2-dns-gcp-cross-domain-research-stress-v1.json
            experience/yado-dns-gcp-cross-domain-research-stress-v1.json
            candidates/kernel-self-generated/g2-dns-screenshot-research-stress-v2.json
            experience/yado-dns-screenshot-research-stress-v2.json
            candidates/kernel-self-generated/g2-four-domain-fresh-stress-v1.json
            experience/yado-four-domain-fresh-stress-v1.json
            candidates/kernel-self-generated/g2-all-experience-tri-organ-canonical-admission-review-v2.json
            candidates/kernel-self-generated/g2-all-experience-tri-organ-additive-canonical-binding-v2.json
            candidates/kernel-self-generated/g2-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json
            experience/yado-tri-organ-canonical-burnin-old-parent-comparative-ab-v1.json
            canonical/yado-g2-all-experience-tri-organ-v1.json
            audits/yado-g2-post-module-full-integrity-v1.json
            audits/yado-g2-module-dependency-graph-v1.json
          if-no-files-found: warn
