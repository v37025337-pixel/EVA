name: YADO Cross Structure Invariant Repair Transfer V1

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - 'runtime/yado_cross_structure_invariant_repair_transfer_v1.py'
      - 'architecture/yado-cross-structure-invariant-repair-transfer-v1.json'
      - 'experience/yado-endogenous-data-invariant-repair-v1.json'
      - 'candidates/cognitive/yado_database_web_usage_candidate_v1.py'
      - '.github/workflows/yado-cross-structure-invariant-repair-transfer-v1.yml'

permissions:
  contents: read

jobs:
  cross-structure-transfer:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare verified development kernel
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Self-test cross-structure transfer mechanism
        run: |
          python runtime/yado_cross_structure_invariant_repair_transfer_v1.py --self-test

      - name: Transfer invariant inference and repair to held-out structure
        run: |
          mkdir -p artifacts
          python runtime/yado_cross_structure_invariant_repair_transfer_v1.py \
            --config architecture/yado-cross-structure-invariant-repair-transfer-v1.json \
            --out artifacts/yado-cross-structure-invariant-repair-transfer-v1.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/yado-cross-structure-invariant-repair-transfer-v1.json'))
          assert r['status']=='PASS_CROSS_STRUCTURE_INVARIANT_REPAIR_TRANSFER_V1',r
          assert r['prior_experience']['selected_resource_id']=='JSONPLACEHOLDER_COMMENTS',r
          s=r['resource_selection']
          assert s['prior_resource_excluded'] is True,r
          assert s['selected_resource_id']!='JSONPLACEHOLDER_COMMENTS',r
          assert s['schema_distance_from_prior']>=0.25,r
          assert len(r['derived_profile']['invariants'])>=3,r
          assert len(r['derived_stressors'])>=2,r
          assert r['baseline']['status']=='DEFECT_DETECTED',r
          assert r['repair_selection']['repair_coverage'] is True,r
          assert r['repair_selection']['selection_driven_by_observed_violations'] is True,r
          v=r['verification']
          assert v['status']=='PASS',r
          assert v['fresh_holdout_disjoint'] is True and v['fresh_holdout_pass'] is True,r
          assert v['learned_candidate_query_correct'] is True,r
          assert v['rollback_preserved_state'] is True,r
          assert all(r['constraint_checks'].values()),r
          assert r['transfer_claim']['independent_profile_derivation'] is True,r
          assert r['transfer_claim']['repair_not_copied_as_fixed_tuple'] is True,r
          b=r['safety_boundary']
          assert b['credentials_used'] is False and b['external_writes'] is False,r
          assert b['remote_code_execution'] is False and b['canonical_mutation'] is False,r
          print('PASS_CROSS_STRUCTURE_TRANSFER', {
            'prior':r['prior_experience']['selected_resource_id'],
            'selected':s['selected_resource_id'],
            'distance':s['schema_distance_from_prior'],
            'stressors':[x['kind'] for x in r['derived_stressors']],
            'repairs':r['repair_selection']['selected_repair_strategies'],
            'holdout':v['fresh_holdout_count'],
          })
          PY

      - name: Full kernel audit
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          print('PASS_FULL_KERNEL_AUDIT',r['counts'])
          PY
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Fresh Successor and complete regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/cross-structure-transfer-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/cross-structure-transfer-successor/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['failures']==[] and r['errors']==[],r
          assert r['tests_run']>=200,r
          assert r['source_unchanged'] is True,r
          print('PASS_FULL_REGRESSION',r['tests_run'])
          PY

      - name: Upload cross-structure transfer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-cross-structure-invariant-repair-transfer-v1-${{ github.run_id }}
          path: |
            architecture/yado-cross-structure-invariant-repair-transfer-v1.json
            experience/yado-endogenous-data-invariant-repair-v1.json
            artifacts/yado-cross-structure-invariant-repair-transfer-v1.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
