name: YADO G2 Multi Function Module Repair V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-coding-multi-function-module-repair-v1-request.json"]
permissions: {contents: write}
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_coding_multi_function_module_repair_v1.py
      - name: Run dependency-aware module repair
        continue-on-error: true
        run: python runtime/yado_g2_coding_multi_function_module_repair_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist module repair evidence
        if: always()
        run: |
          git config user.name "YADO Multi Function Module Repair V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-coding-multi-function-module-repair-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-coding-multi-function-module-repair-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO dependency-aware module repair V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce module repair verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-coding-multi-function-module-repair-v1.json")
          if not p.exists():raise SystemExit("MISSING_MODULE_REPAIR_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_CODING_MULTI_FUNCTION_MODULE_REPAIR_V1":
              raise SystemExit("MODULE_REPAIR_WITHHOLD:"+r["status"]+":"+r["next_required_capability"])
          assert r["checks"]["dependency_blame_correct"] is True,r
          assert r["checks"]["hidden_never_seen"] is True,r
          assert r["checks"]["hidden_exact"] is True,r
          assert r["checks"]["full_caller_domain_exact"] is True,r
          assert r["checks"]["exact_parent_module_ast_recovered"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          print(r["status"],r["module_path"],r["defect_target"],r["repair_selected_target"],r["mutated_hidden_score"],r["repaired_hidden_score"],r["selected_probe_count"])
          PY
