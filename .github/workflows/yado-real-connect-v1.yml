name: YADO Real Connect V1

on:
  push:
    branches:
      - yado-real-connect-v1
    paths:
      - runtime/yado_real_connect_probe_v1.py
      - .github/workflows/yado-real-connect-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute YADO native read-only network probe
        run: python runtime/yado_real_connect_probe_v1.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-real-connect-v1-receipt
          path: receipts/yado-real-connect-probe-v1.json
