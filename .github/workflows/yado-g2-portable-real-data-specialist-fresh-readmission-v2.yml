name: YADO G2 Portable Real Data Specialist Fresh Readmission V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-portable-real-data-specialist-fresh-readmission-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-portable-real-data-specialist-fresh-readmission-v2
  cancel-in-progress: false
jobs:
  readmission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct verified native YADO runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
          python -m pip install --disable-pip-version-check pytest
      - name: Pre-readmission canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile readmission harness
        run: python -m py_compile runtime/yado_g2_portable_real_data_specialist_fresh_readmission_v2.py
      - name: Execute portable specialist fresh readmission
        run: python runtime/yado_g2_portable_real_data_specialist_fresh_readmission_v2.py
      - name: Enforce readmission gates
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_portable_real_data_specialist_fresh_readmission_v2_receipt.json"))
          assert r["status"]=="PASS_SHADOW_G2_PORTABLE_REAL_DATA_SPECIALIST_FRESH_READMISSION_V2",r
          assert all(r["checks"].values()),r
          assert r["metrics"]["fresh_balanced"]>=0.90,r
          assert r["metrics"]["causal_gain"]>=0.25,r
          assert r["metrics"]["preprocessing_causal_drop"]>=0.25,r
          assert r["canonical_mutation"] is False and r["promotion_applied"] is False and r["g3_genesis_performed"] is False,r
          print(r["status"],r["metrics"],r["fresh_temporal_evidence"])
          PY
      - name: Re-run cognitive continuity regression
        run: python -m pytest -q tests/test_g2_continuity_file_integrity.py
      - name: Post-readmission deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Require nonblocking deep self-audit
        run: |
          python - <<'PY'
          import json
          d=json.load(open("runtime/yado_unified_core_deep_self_audit_v1_receipt.json"))
          assert d["status"]=="PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1",d
          assert d["summary"]["blocking_findings"]==0,d
          assert d["summary"]["critical_failures"]==0,d
          print(d["overall_verdict"],d["summary"])
          PY
      - name: Post-readmission canonical guard
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist readmission evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_portable_real_data_specialist_fresh_readmission_v2_receipt.json "receipts/yado-g2-portable-real-data-specialist-fresh-readmission-v2-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Portable Readmission"
          git config user.email "actions@users.noreply.github.com"
          git add "receipts/yado-g2-portable-real-data-specialist-fresh-readmission-v2-run-${GITHUB_RUN_ID}.json"
          git diff --cached --quiet || git commit -m "Persist portable real-data specialist readmission evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/yado_rc8_v36
          git clean -f runtime/yado_g2_portable_real_data_specialist_fresh_readmission_v2_receipt.json runtime/yado_unified_core_deep_self_audit_v1_receipt.json
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
