name: YADO Repository Learning and Stateful Resume V1

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful workflow run containing a YADO continuation checkpoint
        required: true
        default: '35451019074'
      checkpoint_name:
        description: Exact checkpoint artifact name from that run
        required: true
        default: yado-continuation-checkpoint-v1-35451019074-1
  push:
    branches: [codex/yado-repository-learning-resume-20260919]
    paths:
      - '.github/workflows/yado-repository-learning-resume-v1.yml'
      - 'experiments/repository-learning-resume-20260919/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: yado-repository-learning-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  learn-and-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
      - name: Download predecessor checkpoint
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run || '35451019074' }}
          name: ${{ inputs.checkpoint_name || 'yado-continuation-checkpoint-v1-35451019074-1' }}
          path: ${{ runner.temp }}/yado-predecessor
      - name: Install the previously verified Hivemind release
        run: |
          curl --fail --location --retry 2 --output "$RUNNER_TEMP/hive" https://github.com/dip497/hivemind/releases/download/v1.17.1/hive-linux-x86_64
          echo "32a9f345f1bb69f0bda237449bbd28b8fb6262f1e1b7a13efff7dafe9d5c764d  $RUNNER_TEMP/hive" | sha256sum --check
          chmod +x "$RUNNER_TEMP/hive"
      - name: Run live learning, local Hivemind transport and native continuation
        env:
          SOURCE_RUN: ${{ inputs.source_run || '35451019074' }}
        run: |
          python experiments/repository-learning-resume-20260919/run.py \
            --checkpoint "$RUNNER_TEMP/yado-predecessor" --source-run "$SOURCE_RUN" \
            --output "$RUNNER_TEMP/yado-learning-checkpoint" --hive "$RUNNER_TEMP/hive" --cycles 20
      - name: Verify canonical continuity
        run: |
          git diff --exit-code -- canonical architecture/evolution-ledger.json
          python runtime/yado_canonical_invariant_guard_v1.py
      - name: Preserve complete state and learning evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-repository-learning-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/yado-learning-checkpoint/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
