name: YADO Main Native Cognitive Evolution V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/yado-main-native-cognitive-evolution-v2.yml'
      - 'architecture/yado-main-native-cognitive-evolution-v2-request.json'

permissions:
  contents: write

jobs:
  evolve-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Verify admitted tri-organ evidence
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          receipt=json.load(open('candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json'))
          candidate=pathlib.Path(receipt['candidate_path'])
          sha=hashlib.sha256(candidate.read_bytes()).hexdigest()
          assert receipt['status']=='PASS_SHADOW_BOUNDED_TRI_ORGAN_COGNITIVE_EVOLUTION_V2'
          assert sha==receipt['candidate_sha256']== '8a87fa90bd8b2d8d028ef10a1c1dcf02a92a176e8b449a68115ca010830e1ddf'
          assert min(receipt['selected_hidden'].values()) >= 0.80
          print('PASS_ADMITTED_TRI_ORGAN_EVIDENCE_BINDING')
          PY
      - name: Reproduce cognitive evolution on current main
        run: |
          python runtime/yado_cognitive_tri_organ_evolution_v2.py
          test "$(sha256sum candidates/cognitive/yado_cognitive_tri_organ_candidate_v2.py | awk '{print $1}')" = "8a87fa90bd8b2d8d028ef10a1c1dcf02a92a176e8b449a68115ca010830e1ddf"
      - name: Materialize verified policy into active runtime candidate
        run: |
          python - <<'PY'
          import json, pathlib
          r=json.load(open('candidates/cognitive/yado-cognitive-tri-organ-evolution-v2.json'))
          p=r['selected_genome']; scores=r['selected_hidden']
          dst=pathlib.Path('runtime/yado_cognitive_tri_organ_policy_v3.py')
          src=(
              'from __future__ import annotations\n\n'
              f"COGNITIVE_POLICY = {p!r}\n"
              f"VERIFIED_HIDDEN_SCORES = {scores!r}\n"
              "SOURCE_EVIDENCE = {'schema':'yado.cognitive_tri_organ_evolution.v2','source_run_id':34652204178,'candidate_sha256':'8a87fa90bd8b2d8d028ef10a1c1dcf02a92a176e8b449a68115ca010830e1ddf'}\n\n"
              "def component():\n"
              "    return {'schema':'yado.cognitive_tri_organ_policy.v3','policy':COGNITIVE_POLICY,'verified_hidden_scores':VERIFIED_HIDDEN_SCORES,'source_evidence':SOURCE_EVIDENCE,'canonical_active':True,'consciousness_claimed':False}\n"
          )
          compile(src, str(dst), 'exec')
          dst.write_text(src, encoding='utf-8')
          pathlib.Path('candidates/cognitive/yado-main-native-evolution-v2.json').write_text(json.dumps({
              'schema':'yado.main_native_cognitive_evolution.v2',
              'status':'PASS_PENDING_FULL_AUDIT_AND_REGRESSION',
              'organs':['LOGIC','THINKING','INTELLIGENCE'],
              'source_candidate_sha256':r['candidate_sha256'],
              'policy':p,
              'hidden_scores':scores,
              'external_model_used':False,
              'downloaded_code_executed':False,
              'consciousness_claimed':False,
              'main_mutation_target':str(dst),
          }, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          PY
      - name: Read current YADO self-selected frontier
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Compile full checkout
        run: python -m compileall -q runtime successor candidates/cognitive
      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"
      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
      - name: Finalize evolution receipt
        run: |
          python - <<'PY'
          import json
          p='candidates/cognitive/yado-main-native-evolution-v2.json'
          r=json.load(open(p)); r['status']='PASS_MAIN_NATIVE_COGNITIVE_EVOLUTION_V2'
          open(p,'w').write(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
      - name: Persist verified main evolution
        run: |
          git config user.name "YADO Main Native Evolution"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_cognitive_tri_organ_policy_v3.py candidates/cognitive/yado-main-native-evolution-v2.json audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md audits/yado-full-regression-v1-report.json
          git commit -m "YADO main evolution: activate verified tri-organ cognitive policy V3 [skip ci]"
          git push origin HEAD:main
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-main-native-cognitive-evolution-v2-${{ github.run_id }}
          path: |
            candidates/cognitive/yado-main-native-evolution-v2.json
            runtime/yado_cognitive_tri_organ_policy_v3.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
