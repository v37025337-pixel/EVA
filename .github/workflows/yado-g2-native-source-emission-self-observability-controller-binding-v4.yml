name: YADO G2 Native Source Emission Self Observability Controller Binding V4
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-source-emission-self-observability-controller-binding-v4-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-source-emission-self-observability-controller-binding-v4
  cancel-in-progress: true
jobs:
  bind:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V4
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V4 observer
        run: python -m py_compile runtime/yado_g2_native_source_emission_self_observability_controller_binding_v4.py
      - name: Let YADO self-observe native source emission
        id: bind
        continue-on-error: true
        run: python runtime/yado_g2_native_source_emission_self_observability_controller_binding_v4.py
      - name: Canonical guard after V4
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V4 evidence
        if: always()
        run: |
          git config user.name "YADO Source Emission Self Observation V4"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-source-emission-self-observability-controller-binding-v4.json ]; then
            git add candidates/kernel-self-generated/g2-native-source-emission-self-observability-controller-binding-v4.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO source-emission self-observation V4 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce V4 semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-source-emission-self-observability-controller-binding-v4.json")
          if not p.exists():raise SystemExit("MISSING_V4_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for k in ("external_coding_models_used","new_external_research_used","host_model_family_used",
                    "host_rule_used","host_source_template_used","host_patch_used","controller_source_mutation"):
              assert c[k] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SOURCE_EMISSION_SELF_OBSERVABILITY_CONTROLLER_BINDING_V4":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-source-emission-self-observability-v4-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-source-emission-self-observability-controller-binding-v4.json
          if-no-files-found: warn
