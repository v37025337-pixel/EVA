name: YADO field mapper sandbox probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-field-mapper-sandbox-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect FieldMapper program and sandbox
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('yado_core_v2_2.py'); txt=p.read_text(); tree=ast.parse(txt)
          for n in tree.body:
            if isinstance(n,ast.ClassDef) and n.name in {'FieldMapperProgram','FieldMapOp','FieldMapperSandbox'}:
              print('\n###',n.name)
              print(ast.get_source_segment(txt,n))
          PY
