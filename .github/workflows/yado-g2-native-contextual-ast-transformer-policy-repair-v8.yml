name: YADO G2 Contextual AST Transformer Policy Repair V8
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-contextual-ast-transformer-policy-repair-v8-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-contextual-ast-transformer-policy-repair-v8
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V8
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V8
        run: python -m py_compile runtime/yado_g2_native_contextual_ast_transformer_policy_repair_v8.py
      - name: Run contextual AST transformer policy repair V8
        id: repair
        continue-on-error: true
        run: python runtime/yado_g2_native_contextual_ast_transformer_policy_repair_v8.py
      - name: Canonical guard after V8
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V8 evidence
        if: always()
        run: |
          git config user.name "YADO Contextual AST Policy Repair"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-transformer-policy-repair-v8.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-transformer-policy-repair-v8.json
          fi
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-transformer-gene-v8.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-transformer-gene-v8.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO contextual AST policy repair V8 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V8 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-contextual-ast-transformer-policy-repair-v8.json")
          if not p.exists(): raise SystemExit("MISSING_CONTEXTUAL_AST_POLICY_V8")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_authored_transition_action","host_authored_ast_subtree",
                    "host_authored_transform_condition","external_models_used",
                    "automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["threshold_not_lowered"] is True,r
          assert c["blind_causal_classes_balanced"] is True,r
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_CONTEXTUAL_AST_TRANSFORMER_POLICY_REPAIR_V8":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["gene"] and r["gene"]["actual_ast_materialization_proven"] is False,r
          assert r["gene"]["python_source_emission_proven"] is False,r
          print(r["status"],r["gene"]["gene_id"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-contextual-ast-transformer-policy-v8-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-contextual-ast-transformer-policy-repair-v8.json
            candidates/kernel-self-generated/g2-native-contextual-ast-transformer-gene-v8.json
          if-no-files-found: warn
