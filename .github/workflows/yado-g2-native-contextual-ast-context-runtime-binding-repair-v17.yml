name: YADO G2 Native Contextual AST Context Runtime Binding Repair V17
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-contextual-ast-context-runtime-binding-repair-v17-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-contextual-ast-context-runtime-binding-repair-v17
  cancel-in-progress: true
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V17
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V17
        run: python -m py_compile runtime/yado_g2_native_contextual_ast_context_runtime_binding_repair_v17.py
      - name: Run contextual AST runtime context binding repair V17
        id: repair
        continue-on-error: true
        run: python runtime/yado_g2_native_contextual_ast_context_runtime_binding_repair_v17.py
      - name: Canonical guard after V17
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V17 evidence
        if: always()
        run: |
          git config user.name "YADO AST Runtime Context Binding Repair"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-repair-v17.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-repair-v17.json
          fi
          if [ -f candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-gene-v17.json ]; then
            git add candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-gene-v17.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO contextual AST runtime context V17 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V17 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-repair-v17.json")
          if not p.exists(): raise SystemExit("MISSING_RUNTIME_CONTEXT_V17")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_authored_feature_logic","host_authored_binder_binding",
                    "host_authored_tree_predict_import","host_selected_context",
                    "external_models_used","actual_target_source_integration_proven",
                    "automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_CONTEXTUAL_AST_CONTEXT_RUNTIME_BINDING_REPAIR_V17":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["full_v12_free_context_exact"] is True,r
          assert c["full_v12_context_has_no_unresolved_names"] is True,r
          assert c["binder_binding_is_yado_artifact_binding"] is True,r
          assert c["tree_predict_binding_is_yado_import"] is True,r
          assert c["native_selector_selected_full_context"] is True,r
          assert r.get("gene"),r
          print(r["status"],r["gene"]["gene_id"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-contextual-ast-context-runtime-binding-repair-v17-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-repair-v17.json
            candidates/kernel-self-generated/g2-native-contextual-ast-context-runtime-binding-gene-v17.json
          if-no-files-found: warn
