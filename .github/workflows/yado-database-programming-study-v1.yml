name: YADO Database Programming Study V1

on:
  workflow_dispatch:
  push:
    branches: [yado-deep-development-20260914]
    paths:
      - 'runtime/yado_database_programming_study_v1.py'
      - 'architecture/yado-database-programming-study-v1.json'
      - 'candidates/cognitive/yado_database_web_usage_candidate_v1.py'
      - 'candidates/cognitive/yado_structured_evidence_fusion_candidate_v1.py'
      - 'candidates/cognitive/yado-structured-evidence-fusion-evolution-v1.json'
      - '.github/workflows/yado-database-programming-study-v1.yml'

permissions:
  contents: read

jobs:
  public-docs-local-practice-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Prepare verified kernel
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m compileall -q runtime successor candidates

      - name: Study public database and programming documentation
        run: |
          mkdir -p artifacts
          python runtime/yado_database_programming_study_v1.py --self-test
          python runtime/yado_database_programming_study_v1.py \
            --config architecture/yado-database-programming-study-v1.json \
            --out artifacts/yado-database-programming-study-v1.json
          python - <<'PY'
          import json
          r=json.load(open('artifacts/yado-database-programming-study-v1.json'))
          assert r['status']=='PASS_DATABASE_PROGRAMMING_STUDY_V1',r
          assert r['fetched_sources']>=5,r
          assert r['database_source_success']>=3,r
          assert r['programming_source_success']>=2,r
          assert len(r['skill_coverage']['sql'])>=8,r
          assert len(r['skill_coverage']['web_http'])>=4,r
          assert r['local_database_lab']['status']=='PASS',r
          assert r['public_api_lab']['status']=='PASS',r
          s=r['safety_boundary']
          assert s['authenticated_access'] is False and s['remote_code_execution'] is False,r
          assert s['raw_remote_code_persisted'] is False and s['external_writes'] is False,r
          print('PASS_DATABASE_PROGRAMMING_GROUNDING',r['study_digest'],r['skill_coverage'])
          PY

      - name: Compile and replay documentation-grounded usage candidate
        run: |
          python -m py_compile candidates/cognitive/yado_database_web_usage_candidate_v1.py
          python - <<'PY'
          import importlib.util, sqlite3
          from pathlib import Path
          p=Path('candidates/cognitive/yado_database_web_usage_candidate_v1.py')
          s=importlib.util.spec_from_file_location('dbweb',p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          c=sqlite3.connect(':memory:')
          c.execute('CREATE TABLE items(id INTEGER PRIMARY KEY, kind TEXT, value INTEGER)')
          c.executemany('INSERT INTO items(kind,value) VALUES (?,?)',[('a',1),('b',2),('a',3)])
          rows=m.select_where(c,'items',['id','value'],'kind','a')
          assert rows==[(1,1),(3,3)],rows
          shape=m.summarize_json_shape({'id':1,'title':'x'})
          assert shape['type']=='object' and shape['size']==2,shape
          component=m.component()
          assert component['development_candidate'] is True and component['canonical_active'] is False,component
          assert component['remote_code_execution'] is False and component['authenticated_access'] is False,component
          print('PASS_DATABASE_WEB_USAGE_CANDIDATE_REPLAY',len(component['learned_skills']))
          PY

      - name: Full kernel audit after physical ancestry closure
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-kernel-audit-v1-report.json'))
          assert r['status']=='PASS' and r['findings']==[],r
          print('PASS_FULL_KERNEL_AUDIT',r['counts'])
          PY
          python runtime/yado_canonical_invariant_guard_v1.py

      - name: Fresh Successor and complete regression
        run: |
          python -m successor build --output "$RUNNER_TEMP/database-programming-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/database-programming-successor/manifest.json"
          python - <<'PY'
          import json
          r=json.load(open('audits/yado-full-regression-v1-report.json'))
          assert r['status']=='PASS',r
          assert r['failures']==[] and r['errors']==[],r
          assert r['tests_run']>=200,r
          assert r['source_unchanged'] is True,r
          print('PASS_FULL_REGRESSION',r['tests_run'])
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-database-programming-study-v1-${{ github.run_id }}
          path: |
            architecture/yado-database-programming-study-v1.json
            artifacts/yado-database-programming-study-v1.json
            candidates/cognitive/yado_database_web_usage_candidate_v1.py
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
