name: YADO G2 Evolutionary Successor Calibrated Centroid V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-evolutionary-successor-centroid-calibrated-v2-request.json"
permissions:
  contents: write
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Create kernel-selected calibrated CLONAL successor
        run: python runtime/yado_kernel_evolutionary_successor_centroid_calibrated_v2.py
      - name: Persist calibrated successor evidence and frontier
        run: |
          mkdir -p receipts candidates/kernel-self-generated
          cp runtime/yado_kernel_evolutionary_successor_centroid_calibrated_v2_receipt.json "receipts/yado-kernel-evolutionary-successor-centroid-calibrated-v2-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Calibrated Successor"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-evolutionary-successor-centroid-calibrated-v2.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json candidates/kernel-self-generated/evolutionary-centroid-calibrated-successor-v2.json "receipts/yado-kernel-evolutionary-successor-centroid-calibrated-v2-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 calibrated CLONAL successor V2 [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce calibrated successor receipt
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_evolutionary_successor_centroid_calibrated_v2_receipt.json"))
          assert r["status"]=="PASS_EVOLUTIONARY_SUCCESSOR_CENTROID_CALIBRATED_V2",r
          assert all(r["checks"].values()),r
          print(r["candidate_state"],r["metrics"],r["next_required_capability"],r["selected_threshold"])
          PY
