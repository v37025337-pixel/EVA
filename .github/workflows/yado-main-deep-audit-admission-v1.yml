name: YADO Main Deep Audit Admission V1

on:
  workflow_dispatch:
  push:
    branches:
      - yado-main-deep-audit-admission-v1
    paths:
      - 'runtime/**'
      - 'canonical/**'
      - 'architecture/**'
      - 'successor/**'
      - 'candidates/**'
      - '.github/workflows/yado-main-deep-audit-admission-v1.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deepest-main-admission-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify ancestry and admission manifest
        run: |
          git merge-base --is-ancestor origin/main HEAD
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('architecture/yado-main-deep-audit-admission-v1.json')
          x=json.loads(p.read_text())
          assert x['generation']=='G2_CANDIDATE_TRCG_V1'
          assert x['admission_scope']['silent_g3_transition'] is False
          assert x['admission_scope']['subjective_consciousness_claim'] is False
          assert x['admission_scope']['general_intelligence_claim'] is False
          assert x['promotion_rule']=='UPDATE_MAIN_ONLY_AFTER_ALL_DEEP_VALIDATION_GATES_PASS'
          print('PASS_ANCESTRY_AND_ADMISSION_MANIFEST')
          PY

      - name: Compile V1 through V6 controllers
        run: |
          python -m py_compile \
            runtime/yado_external_source_evolution_v1.py \
            runtime/yado_autonomous_meta_source_evolution_v2.py \
            runtime/yado_autonomous_grammar_extension_v3.py \
            runtime/yado_autonomous_meta_grammar_evolution_v4.py \
            runtime/yado_autonomous_external_library_discovery_v5.py \
            runtime/yado_autonomous_open_catalog_discovery_v6.py

      - name: Re-run complete V1 through V6 proof chain
        run: |
          python runtime/yado_external_source_evolution_v1.py
          python runtime/yado_autonomous_meta_source_evolution_v2.py
          python runtime/yado_autonomous_grammar_extension_v3.py
          python runtime/yado_autonomous_meta_grammar_evolution_v4.py
          python runtime/yado_autonomous_external_library_discovery_v5.py
          python runtime/yado_autonomous_open_catalog_discovery_v6.py

      - name: Verify fresh V1 through V6 evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected={
            'yado-external-source-evolution-v1.json':'PASS_SHADOW_G2_EXTERNAL_SOURCE_EVOLUTION_V1',
            'yado-autonomous-meta-source-evolution-v2.json':'PASS_SHADOW_G2_AUTONOMOUS_META_SOURCE_EVOLUTION_V2',
            'yado-autonomous-grammar-extension-v3.json':'PASS_SHADOW_G2_AUTONOMOUS_GRAMMAR_EXTENSION_V3',
            'yado-autonomous-meta-grammar-evolution-v4.json':'PASS_SHADOW_G2_AUTONOMOUS_META_GRAMMAR_EVOLUTION_V4',
            'yado-autonomous-external-library-discovery-v5.json':'PASS_SHADOW_G2_AUTONOMOUS_EXTERNAL_LIBRARY_DISCOVERY_V5',
            'yado-autonomous-open-catalog-discovery-v6.json':'PASS_SHADOW_G2_AUTONOMOUS_OPEN_CATALOG_DISCOVERY_V6',
          }
          for name,status in expected.items():
              row=json.loads((Path('receipts')/name).read_text())
              assert row['status']==status,(name,row.get('status'))
          v5=json.loads(Path('receipts/yado-autonomous-external-library-discovery-v5.json').read_text())
          v6=json.loads(Path('receipts/yado-autonomous-open-catalog-discovery-v6.json').read_text())
          for row in (v5,v6):
              g=row['gates']
              assert g['artifact_digest_verified'] is True
              assert g['external_write_methods_used'] is False
              assert g['credentials_used'] is False
              assert g['external_models_used'] is False
              assert g['canonical_mutation'] is False
          assert v6['discovery']['candidate_names_host_provided'] is False
          assert v6['selection']['host_provided_selected_package'] is False
          assert v6['artifact_connection']['wheel_metadata']['host_provided_dependency_name'] is False
          assert v6['sealed_validation']['matched'] is True
          assert v6['sealed_validation']['selection_data_used'] is False
          print('PASS_FRESH_V1_V6_EVIDENCE_CHAIN')
          PY

      - name: Reconstruct runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Parse canonical architecture and receipt JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          roots=[Path('canonical'),Path('architecture'),Path('receipts')]
          count=0
          for root in roots:
              for p in root.rglob('*.json'):
                  json.loads(p.read_text(encoding='utf-8'))
                  count+=1
          assert count>500,count
          print('PASS_JSON_PARSE_COUNT',count)
          PY

      - name: Compile all active and candidate Python layers
        run: python -m compileall -q runtime successor candidates/g2-self-evolution candidates/autonomous

      - name: Run native UnifiedYADOCoreV1 audit
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_unified_core_v1 import UnifiedYADOCoreV1
          core=UnifiedYADOCoreV1(Path('.'))
          report=core.audit()
          assert report['pass'] is True,report
          assert all(report['checks'].values()),report['checks']
          assert report['generation']=='G2_CANDIDATE_TRCG_V1'
          print('PASS_NATIVE_UNIFIED_CORE_AUDIT')
          PY

      - name: Run deepest unified-core self audit
        run: |
          python runtime/yado_unified_core_deep_self_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('runtime/yado_unified_core_deep_self_audit_v1_receipt.json')
          r=json.loads(p.read_text())
          assert r['status']=='PASS_YADO_UNIFIED_CORE_DEEP_SELF_AUDIT_V1',r['status']
          assert r['summary']['blocking_findings']==0,r['summary']
          assert r['canonical_mutation'] is False
          assert r['g3_genesis_performed'] is False
          print('PASS_DEEPEST_UNIFIED_CORE_SELF_AUDIT',r['summary'])
          PY
          git checkout -- architecture/evolution-ledger.json
          git diff --exit-code -- canonical architecture/evolution-ledger.json

      - name: Run full kernel audit after deep audit restoration
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS'
          assert r['canonical']['ledger_validation']=='PASS'
          assert r['canonical']['g3_genesis_performed'] is False
          print('PASS_FULL_KERNEL_AUDIT')
          PY

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression
        run: |
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==170,r
          assert not r['failures'] and not r['errors'] and not r['skipped']
          assert r['source_unchanged'] is True
          print('PASS_COMPLETE_REGRESSION_170_OF_170')
          PY

      - name: Final canonical immutability check
        run: |
          git diff --exit-code -- canonical architecture/evolution-ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('architecture/yado-main-deep-audit-admission-v1.json').read_text())
          assert x['admission_scope']['retain_existing_g2_control_plane'] is True
          print('PASS_FINAL_CANONICAL_IMMUTABILITY_CHECK')
          PY

      - name: Upload deepest admission evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-main-deep-audit-admission-v1-${{ github.run_id }}
          path: |
            architecture/yado-main-deep-audit-admission-v1.json
            receipts/yado-external-source-evolution-v1.json
            receipts/yado-autonomous-meta-source-evolution-v2.json
            receipts/yado-autonomous-grammar-extension-v3.json
            receipts/yado-autonomous-meta-grammar-evolution-v4.json
            receipts/yado-autonomous-external-library-discovery-v5.json
            receipts/yado-autonomous-open-catalog-discovery-v6.json
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
