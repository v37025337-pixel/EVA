name: YADO G2 Raw Representation Model Family Expansion V5
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-v5-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-representation-model-family-expansion-v5
  cancel-in-progress: true
jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V5 expansion
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5 expansion observer
        run: python -m py_compile runtime/yado_kernel_g2_native_raw_representation_model_family_expansion_v5.py
      - name: Let YADO select expanded representation family
        id: expand
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 1800s python runtime/yado_kernel_g2_native_raw_representation_model_family_expansion_v5.py
      - name: Canonical guard after V5 expansion
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V5 expansion evidence
        if: always()
        run: |
          git config user.name "YADO Raw Family Expansion V5"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-v5.json ] && files+=(architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-v5.json)
          [ -f candidates/kernel-self-generated/raw-task-representation-multiscale-family-v5.json ] && files+=(candidates/kernel-self-generated/raw-task-representation-multiscale-family-v5.json)
          [ -f resources/yado-raw-task-representation-model-family-expansion-v5-fresh.json ] && files+=(resources/yado-raw-task-representation-model-family-expansion-v5-fresh.json)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO raw family expansion V5 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest V5 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-v5.json")
          if not p.exists():raise SystemExit("MISSING_FAMILY_EXPANSION_V5")
          r=json.loads(p.read_text())
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_RAW_REPRESENTATION_MODEL_FAMILY_EXPANSION_V5":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          print(r["status"],r["selected_skill_id"],r["selected_spec"],r["fresh_metrics"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-raw-family-expansion-v5-${{ github.run_id }}
          path: |
            architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-v5.json
            candidates/kernel-self-generated/raw-task-representation-multiscale-family-v5.json
            resources/yado-raw-task-representation-model-family-expansion-v5-fresh.json
          if-no-files-found: warn
