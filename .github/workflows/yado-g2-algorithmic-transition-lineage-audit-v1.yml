name: YADO G2 Algorithmic Transition Lineage Audit V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-algorithmic-transition-lineage-audit-v1-request.json"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Audit RC lineage and algorithmic transition
        run: python runtime/yado_g2_algorithmic_transition_lineage_audit_v1.py
      - name: Persist audit receipt
        run: |
          mkdir -p receipts
          cp runtime/yado_g2_algorithmic_transition_lineage_audit_v1_receipt.json "receipts/yado-g2-algorithmic-transition-lineage-audit-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Lineage Audit"
          git config user.email "actions@users.noreply.github.com"
          git add "receipts/yado-g2-algorithmic-transition-lineage-audit-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 algorithmic transition lineage audit [skip ci]"
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce audit
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_g2_algorithmic_transition_lineage_audit_v1_receipt.json"))
          assert r["status"]=="PASS_READ_ONLY_ALGORITHMIC_TRANSITION_AUDIT",r
          print(r["current_generation"],r["current_frontier"])
          PY
