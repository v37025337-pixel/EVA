name: YADO G2 Continuity File Integrity V2
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-continuity-file-integrity-v2-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-continuity-file-integrity-v2
  cancel-in-progress: true
jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before file-integrity shadow
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V5 and focused regressions
        run: |
          python -m py_compile runtime/yado_g2_unified_execution_fabric_v5.py
          python -m py_compile runtime/yado_g2_continuity_file_integrity_gate_v2.py
          python -m py_compile tests/test_g2_continuity_file_integrity.py
      - name: Run focused continuity file-integrity regressions
        run: python -m unittest discover -s tests -p test_g2_continuity_file_integrity.py -v
      - name: Emit strict shadow receipt
        env:
          YADO_CONTINUITY_FILE_TESTS_PASS: "1"
        run: python runtime/yado_g2_continuity_file_integrity_gate_v2.py
      - name: Canonical guard after file-integrity shadow
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist file-integrity evidence
        if: always()
        run: |
          git config user.name "YADO Continuity File Integrity"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-continuity-file-integrity-v2.json ]; then
            git add candidates/kernel-self-generated/g2-continuity-file-integrity-v2.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO continuity file integrity V2 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ tests/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict file-integrity verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-continuity-file-integrity-v2.json")
          if not p.exists(): raise SystemExit("MISSING_CONTINUITY_FILE_INTEGRITY_V2")
          r=json.loads(p.read_text());c=r["checks"]
          if r["status"]!="PASS_SHADOW_G2_CONTINUITY_FILE_INTEGRITY_V2":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["focused_regressions_pass"] is True,r
          assert c["canonical_v4_is_parent_active"] is True,r
          assert c["kernel_generated_source_claimed"] is False,r
          assert c["general_intelligence_gain_claimed"] is False,r
          assert c["canonical_unchanged"] is True,r
          assert r["canonical_mutation"] is False,r
          assert r["promotion_applied"] is False,r
          print(r["status"],r["source_sha256"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-continuity-file-integrity-v2-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-continuity-file-integrity-v2.json
          if-no-files-found: warn
