name: YADO G2 Experience Conditioned LTI Evolution V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-g2-experience-conditioned-lti-evolution-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-experience-conditioned-lti-evolution-v1
  cancel-in-progress: true
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Preserve checked-in G2 runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before LTI evolution
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile LTI evolution runtime
        run: python -m py_compile runtime/yado_g2_experience_conditioned_lti_evolution_v1.py
      - name: Let YADO evolve LOGIC THINKING INTELLIGENCE from history
        id: evolve
        continue-on-error: true
        run: python runtime/yado_g2_experience_conditioned_lti_evolution_v1.py
      - name: Canonical guard after LTI evolution
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist LTI evidence
        if: always()
        run: |
          git config user.name "YADO Experience LTI Evolution"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-experience-conditioned-lti-evolution-v1.json ]; then
            git add candidates/kernel-self-generated/g2-experience-conditioned-lti-evolution-v1.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO experience-conditioned LTI evolution [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest LTI verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-experience-conditioned-lti-evolution-v1.json")
          if not p.exists():raise SystemExit("MISSING_LTI_EVIDENCE")
          r=json.loads(p.read_text());c=r["checks"]
          assert c["external_models_used"] is False,r
          assert c["host_selected_algorithm_family"] is False,r
          assert c["host_written_organ_model"] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_EXPERIENCE_CONDITIONED_LTI_EVOLUTION_V1":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["fresh_scores"],r["fresh_gains"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-experience-conditioned-lti-evolution-v1-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-experience-conditioned-lti-evolution-v1.json
          if-no-files-found: warn
