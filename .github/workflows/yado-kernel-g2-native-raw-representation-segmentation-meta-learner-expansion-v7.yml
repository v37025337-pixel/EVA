name: YADO G2 Raw Segmentation Meta Learner Expansion V7
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-raw-representation-segmentation-meta-learner-expansion-v7-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-segmentation-meta-learner-expansion-v7
  cancel-in-progress: false
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V7
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V7 observer
        run: python -m py_compile runtime/yado_kernel_g2_native_raw_representation_segmentation_meta_learner_expansion_v7.py
      - name: Let YADO expand the bounded segmentation meta learner
        id: evolve
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 2400s python runtime/yado_kernel_g2_native_raw_representation_segmentation_meta_learner_expansion_v7.py
      - name: Canonical guard after V7
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V7 evidence
        if: always()
        run: |
          git config user.name "YADO Segmentation Meta Learner V7"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f architecture/yado-kernel-g2-native-raw-representation-segmentation-meta-learner-expansion-v7.json ] && files+=(architecture/yado-kernel-g2-native-raw-representation-segmentation-meta-learner-expansion-v7.json)
          [ -f candidates/kernel-self-generated/raw-task-representation-segmentation-meta-learner-v7.json ] && files+=(candidates/kernel-self-generated/raw-task-representation-segmentation-meta-learner-v7.json)
          [ -f resources/yado-raw-task-representation-segmentation-meta-learner-v7-fresh.json ] && files+=(resources/yado-raw-task-representation-segmentation-meta-learner-v7-fresh.json)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO segmentation meta learner V7 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest V7 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("architecture/yado-kernel-g2-native-raw-representation-segmentation-meta-learner-expansion-v7.json")
          if not p.exists():raise SystemExit("MISSING_SEGMENTATION_META_V7")
          r=json.loads(p.read_text())
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_RAW_REPRESENTATION_SEGMENTATION_META_LEARNER_EXPANSION_V7":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["selected_family"] in ("CART_AXIS","CENTROID","KNN"),r
          print(r["status"],r["selected_skill_id"],r["window_validation"],r["window_blind"],r["fresh_metrics"],r["next_required_capability"])
          PY
