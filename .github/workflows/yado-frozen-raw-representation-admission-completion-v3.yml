name: YADO Frozen Raw Representation Admission Completion V3

on:
  push:
    branches: [yado-causal-ablation-cycle-v1]
    paths:
      - '.github/workflows/yado-frozen-raw-representation-admission-completion-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Verify latest shadow is based on main and canonical is untouched
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git diff --exit-code origin/main -- canonical architecture/evolution-ledger.json
          echo PASS_LATEST_SHADOW_CANONICAL_IMMUTABILITY

      - name: Compile frozen candidate and admission harness
        run: |
          python -m py_compile \
            runtime/yado_raw_task_representation_residual_repair_v3.py \
            runtime/yado_raw_task_representation_frozen_candidate_v3.py \
            runtime/yado_raw_task_representation_frozen_deep_admission_v1.py

      - name: Verify frozen provenance and run post-freeze holdout again
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('runtime').resolve()))
          from yado_raw_task_representation_frozen_candidate_v3 import FrozenResidualRepairCandidateV3
          assert FrozenResidualRepairCandidateV3.SELECTED_POLICY == 'CLEAN_PLURALITY_TIE_CORE'
          assert FrozenResidualRepairCandidateV3.SELECTION_RECEIPT_SHA256 == 'ab16a2e21bc2df656db0ba88f129fff239264b1971f869c32cd05482cab58320'
          print('PASS_FROZEN_PROVENANCE')
          PY
          python runtime/yado_raw_task_representation_frozen_deep_admission_v1.py --out "$RUNNER_TEMP/frozen-deep.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ['RUNNER_TEMP'])/'frozen-deep.json').read_text())
          assert r['status']=='PASS_SHADOW_FROZEN_RAW_REPRESENTATION_DEEP_ADMISSION_V1',r
          assert r['gate']['regression_preserved'] is True,r
          assert r['gate']['deep_fresh_all_families_preserved'] is True,r
          assert r['gate']['deep_fresh_positive_gain'] is True,r
          assert r['canonical_mutation'] is False,r
          print('PASS_POST_FREEZE_HOLDOUT',json.dumps({'delta':r['deep_fresh_holdout']['delta'],'improved_family_count':r['deep_fresh_holdout']['improved_family_count'],'receipt_sha256':r['receipt_sha256']},sort_keys=True))
          PY

      - name: Reconstruct inherited runtime and install audit dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Run Full Kernel Audit on corrected workflow contract
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['findings']==[],r['findings']
          assert r['canonical']['canonical_guard']=='PASS',r['canonical']
          assert r['canonical']['ledger_validation']=='PASS',r['canonical']
          assert r['canonical']['g3_genesis_performed'] is False,r['canonical']
          print('PASS_FULL_KERNEL_AUDIT',json.dumps(r['counts'],sort_keys=True))
          PY

      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"

      - name: Run complete inherited and Successor regression
        run: |
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('audits/yado-full-regression-v1-report.json').read_text())
          assert r['status']=='PASS',r
          assert r['tests_run']==r['expected_tests']==170,r
          assert not r['failures'] and not r['errors'] and not r['skipped'],r
          assert r['source_unchanged'] is True,r
          print('PASS_COMPLETE_REGRESSION_170_OF_170')
          PY

      - name: Repeat frozen holdout decision for reproducibility
        run: |
          python runtime/yado_raw_task_representation_frozen_deep_admission_v1.py --out "$RUNNER_TEMP/frozen-deep-repeat.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          a=json.loads((root/'frozen-deep.json').read_text())
          b=json.loads((root/'frozen-deep-repeat.json').read_text())
          assert a['status']==b['status']
          assert a['frozen_candidate']==b['frozen_candidate']
          assert a['deep_fresh_holdout']==b['deep_fresh_holdout']
          assert a['receipt_sha256']==b['receipt_sha256']
          print('PASS_REPRODUCIBLE_FROZEN_DEEP_ADMISSION',a['receipt_sha256'])
          PY

      - name: Final admission readiness boundary
        run: |
          git diff --exit-code origin/main -- canonical architecture/evolution-ledger.json
          python - <<'PY'
          print('PASS_SHADOW_ADMISSION_COMPLETION_READY_NOT_CANONICAL')
          print('NEXT_ACTION=PREPARE_EXPLICIT_CANONICAL_INTEGRATION_PATCH_AND_REAUDIT')
          PY
