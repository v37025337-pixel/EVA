name: YADO Advanced STEM Benchmark V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "runtime/yado_advanced_stem_benchmark_v1.py"
      - ".github/workflows/yado-advanced-stem-benchmark-v1.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Reconstruct verified v36 RC8
        run: python runtime/reconstruct_rc8v36.py
      - name: Install verified v36 dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run advanced programming mathematics exact-science benchmark
        run: python runtime/yado_advanced_stem_benchmark_v1.py
      - name: Upload benchmark receipt
        uses: actions/upload-artifact@v4
        with:
          name: yado-advanced-stem-benchmark-v1
          path: runtime/yado_advanced_stem_benchmark_v1_receipt.json
          retention-days: 30
      - name: Persist benchmark evidence
        run: |
          mkdir -p receipts
          cp runtime/yado_advanced_stem_benchmark_v1_receipt.json receipts/yado-advanced-stem-benchmark-v1-latest.json
          git config user.name "YADO Advanced STEM Runner"
          git config user.email "actions@users.noreply.github.com"
          git add receipts/yado-advanced-stem-benchmark-v1-latest.json
          if git diff --cached --quiet; then
            echo unchanged
          else
            git commit -m "Persist YADO advanced STEM benchmark receipt [skip ci]"
            git push origin HEAD:yado-architecture-shadow-search
          fi
