name: YADO G2 Native Hidden CODE Gene Source Emission Observation V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-hidden-code-gene-source-emission-observation-v3-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-hidden-code-gene-source-emission-observation-v3
  cancel-in-progress: true
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V3
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile passive observer
        run: python -m py_compile runtime/yado_g2_native_hidden_code_gene_source_emission_observation_v3.py
      - name: Observe native CODE gene emission
        id: observe
        continue-on-error: true
        run: python runtime/yado_g2_native_hidden_code_gene_source_emission_observation_v3.py
      - name: Canonical guard after V3
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V3 evidence
        if: always()
        run: |
          git config user.name "YADO Native CODE Source Observation V3"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f candidates/kernel-self-generated/g2-native-hidden-code-gene-source-emission-observation-v3.json ] && files+=(candidates/kernel-self-generated/g2-native-hidden-code-gene-source-emission-observation-v3.json)
          [ -f candidates/g2-self-evolution/yado_native_hidden_code_gene_emission_v3.py ] && files+=(candidates/g2-self-evolution/yado_native_hidden_code_gene_emission_v3.py)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist native CODE gene source emission V3 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce V3 semantic verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-hidden-code-gene-source-emission-observation-v3.json")
          if not p.exists():raise SystemExit("MISSING_V3_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          for k in ("observer_supplied_source_seed","observer_supplied_function_name","observer_supplied_training_examples",
                    "observer_supplied_ast_skeleton","observer_supplied_patch","observer_modified_native_arguments",
                    "observer_modified_native_return","external_coding_models_used","new_external_research_used"):
              assert c[k] is False,r
          assert r["canonical_mutation"] is False,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_HIDDEN_CODE_GENE_SOURCE_EMISSION_OBSERVATION_V3":
              raise SystemExit("SEMANTIC_WITHHOLD:"+r["status"])
          print(r["status"],r["selected_source_sha256"],r["next_required_capability"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-hidden-code-gene-source-emission-v3-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-native-hidden-code-gene-source-emission-observation-v3.json
            candidates/g2-self-evolution/yado_native_hidden_code_gene_emission_v3.py
          if-no-files-found: warn
