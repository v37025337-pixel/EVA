name: YADO kernel native task interface probe
on:
  push:
    branches: [yado-kernel-task-v37-repair]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct verified v36 base
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Inspect native YADO task/self-audit interfaces
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import inspect, json
          from yado_core_v3_0_rc8_external_cognitive import UnifiedYADOKernelV30RC8ExternalCognitive
          names=[]
          for n in dir(UnifiedYADOKernelV30RC8ExternalCognitive):
              low=n.lower()
              if any(k in low for k in ('goal','audit','deficit','repair','develop','evolv','task','plan','hypoth','learn','cycle')):
                  obj=getattr(UnifiedYADOKernelV30RC8ExternalCognitive,n)
                  if callable(obj):
                      try:sig=str(inspect.signature(obj))
                      except Exception:sig='?'
                      names.append({'name':n,'signature':sig})
          print(json.dumps(names,indent=2,sort_keys=True))
          PY
