name: YADO G2 Self Hosted Meta Language Family Constructor V4
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-hosted-meta-language-family-constructor-v4-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-hosted-meta-language-family-constructor-v4
  cancel-in-progress: true
jobs:
  constructor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V4
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V4
        run: python -m py_compile runtime/yado_g2_self_hosted_meta_language_family_constructor_v4.py
      - name: Run goal-only self-hosted family constructor V4
        id: constructor
        continue-on-error: true
        run: python runtime/yado_g2_self_hosted_meta_language_family_constructor_v4.py
      - name: Canonical guard after V4
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V4 evidence
        if: always()
        run: |
          git config user.name "YADO Self Hosted Family Constructor"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-self-hosted-meta-language-family-constructor-v4.json ]; then
            git add candidates/kernel-self-generated/g2-self-hosted-meta-language-family-constructor-v4.json
          fi
          if [ -f candidates/g2-self-evolution/yado_self_hosted_meta_language_family_constructor_v4.py ]; then
            git add candidates/g2-self-evolution/yado_self_hosted_meta_language_family_constructor_v4.py
          fi
          git diff --cached --quiet || git commit -m "Persist YADO self-hosted family constructor V4 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V4 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-self-hosted-meta-language-family-constructor-v4.json")
          if not p.exists(): raise SystemExit("MISSING_SELF_HOSTED_FAMILY_CONSTRUCTOR_V4")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_constructor_source_supplied","host_constructor_skeleton_supplied",
                    "host_target_patch_supplied","host_source_template_supplied",
                    "external_models_used","automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_SELF_HOSTED_META_LANGUAGE_FAMILY_CONSTRUCTOR_V4":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["new_target_semantic_python_source_created"] is True,r
          assert c["new_source_compiles"] is True,r
          assert c["new_source_identity_not_existing_family"] is True,r
          assert c["new_source_has_family_constructor_semantics"] is True,r
          print(r["status"],r["selected_source_candidate"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-self-hosted-meta-language-family-constructor-v4-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-self-hosted-meta-language-family-constructor-v4.json
            candidates/g2-self-evolution/yado_self_hosted_meta_language_family_constructor_v4.py
          if-no-files-found: warn
