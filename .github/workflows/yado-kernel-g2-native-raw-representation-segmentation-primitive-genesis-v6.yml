name: YADO G2 Raw Representation Segmentation Primitive Genesis V6
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-raw-representation-segmentation-primitive-genesis-v6-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-representation-segmentation-primitive-genesis-v6-retry-exact-linear-proof
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before segmentation V6
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile segmentation V6 observer
        run: python -m py_compile runtime/yado_kernel_g2_native_raw_representation_segmentation_primitive_genesis_v6.py
      - name: Let YADO learn segmentation primitive
        id: genesis
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 3600s python runtime/yado_kernel_g2_native_raw_representation_segmentation_primitive_genesis_v6.py
      - name: Canonical guard after segmentation V6
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist segmentation V6 evidence
        if: always()
        run: |
          git config user.name "YADO Segmentation Genesis V6"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f architecture/yado-kernel-g2-native-raw-representation-segmentation-primitive-genesis-v6.json ] && files+=(architecture/yado-kernel-g2-native-raw-representation-segmentation-primitive-genesis-v6.json)
          [ -f candidates/kernel-self-generated/raw-task-representation-segmentation-primitive-v6.json ] && files+=(candidates/kernel-self-generated/raw-task-representation-segmentation-primitive-v6.json)
          [ -f resources/yado-raw-task-representation-segmentation-primitive-genesis-v6-fresh.json ] && files+=(resources/yado-raw-task-representation-segmentation-primitive-genesis-v6-fresh.json)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO segmentation genesis V6 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest segmentation V6 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("architecture/yado-kernel-g2-native-raw-representation-segmentation-primitive-genesis-v6.json")
          if not p.exists():raise SystemExit("MISSING_SEGMENTATION_V6")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_NATIVE_RAW_REPRESENTATION_SEGMENTATION_PRIMITIVE_GENESIS_V6":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["canonical_mutation"] is False
          print(r["status"],r["meta_selected_algorithm"],r["fresh_metrics"],r["next_required_capability"])
          PY
