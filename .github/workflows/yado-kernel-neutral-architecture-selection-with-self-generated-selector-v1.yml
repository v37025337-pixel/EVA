name: YADO G2 Neutral Architecture Selection V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-neutral-architecture-selection-with-self-generated-selector-v1-request.json"
permissions:
  contents: write
jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Enforce canonical integrity before architecture selection
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile architecture-selection application
        run: python -m py_compile runtime/yado_kernel_neutral_architecture_selection_with_self_generated_selector_v1.py runtime/yado_current_frontier_execution_failure_history_v1.py
      - name: Apply canonical self-generated selector to neutral architecture evidence
        run: timeout --signal=TERM --kill-after=30s 900s python runtime/yado_kernel_neutral_architecture_selection_with_self_generated_selector_v1.py
      - name: Persist unexpected architecture-selection failure as causal history
        if: failure()
        env:
          YADO_FAILURE_WORKFLOW: YADO_G2_NEUTRAL_ARCHITECTURE_SELECTION_V1
        run: |
          git reset --hard HEAD
          git clean -fd
          python runtime/yado_current_frontier_execution_failure_history_v1.py
          mkdir -p receipts
          cp runtime/yado_current_frontier_execution_failure_history_v1_receipt.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Failure Memory"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json "receipts/yado-current-frontier-execution-failure-history-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Record architecture selection aborted execution as causal history [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Persist architecture-selection evidence
        if: success()
        run: |
          mkdir -p receipts candidates/kernel-self-generated resources
          cp runtime/yado_kernel_neutral_architecture_selection_with_self_generated_selector_v1_receipt.json "receipts/yado-kernel-neutral-architecture-selection-with-self-generated-selector-v1-run-${GITHUB_RUN_ID}.json"
          git config user.name "YADO G2 Neutral Architecture Selection"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/evolution-ledger.json architecture/yado-kernel-neutral-architecture-selection-with-self-generated-selector-v1.json canonical/yado-main-head-g2.json canonical/yado-unified-core-v1.json canonical/yado-algorithm-provenance-registry-v1.json candidates/kernel-self-generated/neutral-architecture-selection-v1.json resources/yado-neutral-architecture-selection-application-v1.json "receipts/yado-kernel-neutral-architecture-selection-with-self-generated-selector-v1-run-${GITHUB_RUN_ID}.json"
          git commit -m "Persist G2 neutral architecture selection V1 [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin yado-architecture-shadow-search
            if git push origin HEAD:yado-architecture-shadow-search; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Enforce canonical integrity after persistence
        if: success()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Enforce architecture-selection receipt
        if: success()
        run: |
          python - <<'PY'
          import json
          r=json.load(open("runtime/yado_kernel_neutral_architecture_selection_with_self_generated_selector_v1_receipt.json"))
          assert r["status"] in {"PASS_NEUTRAL_ARCHITECTURE_SELECTION_V1","WITHHOLD_NEUTRAL_ARCHITECTURE_SELECTION_V1"},r
          assert r["g3_genesis_performed"] is False,r
          print(r["candidate_state"],r["selected_family"],r["loo_support"],r["double_ablation_support"],r["next_required_capability"])
          PY
