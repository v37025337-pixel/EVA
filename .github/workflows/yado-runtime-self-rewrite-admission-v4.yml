name: YADO Runtime Self Rewrite Admission V4

on:
  push:
    branches: [yado-runtime-self-rewrite-admission-v4-20260918]
    paths:
      - "runtime/yado_runtime_self_rewrite_admission_v4.py"
      - "runtime/test_yado_runtime_self_rewrite_admission_v4.py"
      - "architecture/yado-runtime-self-rewrite-admission-v4.json"
      - ".github/workflows/yado-runtime-self-rewrite-admission-v4.yml"
  pull_request:
    branches: [main]
    paths:
      - "runtime/yado_runtime_self_rewrite_admission_v4.py"
      - "runtime/test_yado_runtime_self_rewrite_admission_v4.py"
      - "architecture/yado-runtime-self-rewrite-admission-v4.json"
      - ".github/workflows/yado-runtime-self-rewrite-admission-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-v4-and-active-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt pyyaml

      - name: Validate historical candidate and committed active generation
        env:
          PYTHONPATH: runtime
        run: |
          python -m unittest runtime.test_yado_runtime_self_rewrite_admission_v3 runtime.test_yado_runtime_self_rewrite_admission_v4 -v
          python - <<'PY'
          import json
          from pathlib import Path
          from yado_runtime_self_rewrite_admission_v4 import analyze_committed
          result = analyze_committed()
          assert result["status"] == "PASS_SHADOW_RUNTIME_SELF_REWRITE_ADMISSION_V4_PROBE", result
          assert result["repository_view"] == "COMMITTED_HEAD", result
          Path("audits").mkdir(exist_ok=True)
          Path("audits/yado-runtime-self-rewrite-admission-v4-probe.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Verify V4 at its recorded historical promotion commit
        env:
          PYTHONPATH: runtime
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          root = Path.cwd()
          receipt = json.loads((root / "candidates/autonomous/yado-runtime-self-rewrite-promotion-v4.json").read_text())
          revision = receipt["promotion_merge_commit"]
          commit = subprocess.check_output(["git", "rev-parse", revision + "^{commit}"], text=True).strip()
          assert commit == revision, (commit, revision)
          subprocess.run(["git", "merge-base", "--is-ancestor", commit, "HEAD"], check=True)
          shadow = Path(os.environ["RUNNER_TEMP"]) / "yado-historical-v4-promotion"
          subprocess.run(["git", "worktree", "add", "--detach", str(shadow), commit], check=True)
          expected = receipt["candidate_sha256"]
          for relative in ("runtime/yado_bounded_autonomous_learning_v1.py", "candidates/autonomous/yado_bounded_autonomous_learning_runtime_candidate_v4.py"):
              data = (shadow / relative).read_bytes()
              assert hashlib.sha256(data).hexdigest() == expected, relative
              compile(data, relative, "exec")
          script = 'import json; from yado_runtime_self_rewrite_admission_v4 import analyze; print(json.dumps(analyze()))'
          env = dict(os.environ, PYTHONPATH=str(shadow / "runtime"), PYTHONDONTWRITEBYTECODE="1")
          result = json.loads(subprocess.check_output(["python", "-c", script], cwd=shadow, env=env, text=True))
          assert result["status"] == "PASS_SHADOW_RUNTIME_SELF_REWRITE_ADMISSION_V4_PROBE", result
          assert result["runtime_state"] == "V4_CANDIDATE_APPLIED_IN_ISOLATED_WORKTREE", result
          assert result["target_sha256"] == expected, result
          result["tested_commit"] = commit
          result["verification_scope"] = "HISTORICAL_V4_BYTES_AND_ADMISSION_PROBE"
          (root / "audits/yado-historical-v4-promotion-probe.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Audit the current active kernel
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          report = json.load(open("audits/yado-full-kernel-audit-v1-report.json"))
          assert report["status"] == "PASS" and report["findings"] == [], report
          PY

      - name: Regress the current active runtime without substituting historical V4
        run: |
          python -m successor build --output "$RUNNER_TEMP/yado-successor-active-v4-maintenance"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-active-v4-maintenance/manifest.json"
          python - <<'PY'
          import json
          report = json.load(open("audits/yado-full-regression-v1-report.json"))
          assert report["status"] == "PASS", report
          assert report["tests_run"] == report["expected_tests"], report
          assert not report["failures"] and not report["errors"] and not report["skipped"], report
          assert report["source_unchanged"] is True, report
          PY

      - name: Preserve separate historical and active verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-runtime-self-rewrite-admission-v4-${{ github.run_id }}
          path: |
            audits/yado-runtime-self-rewrite-admission-v4-probe.json
            audits/yado-historical-v4-promotion-probe.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
          if-no-files-found: warn
