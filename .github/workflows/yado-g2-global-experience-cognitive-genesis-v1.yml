name: YADO G2 Global Experience Cognitive Genesis V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-global-experience-cognitive-genesis-v1-request.json"]
permissions: {contents: write}
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - name: Fetch all branch refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --force
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_g2_global_experience_cognitive_genesis_v1.py
      - name: Build global corpus and evolve cognitive genome
        continue-on-error: true
        run: python runtime/yado_g2_global_experience_cognitive_genesis_v1.py
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist global experience genesis
        if: always()
        run: |
          git config user.name "YADO Global Experience Cognitive Genesis V1"
          git config user.email "actions@users.noreply.github.com"
          git add experience/yado-global-experience-corpus-v1.json 2>/dev/null || true
          git add experience/yado-global-experience-cognitive-genesis-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-global-experience-cognitive-genesis-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO global experience cognitive genesis V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce genesis verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-global-experience-cognitive-genesis-v1.json")
          if not p.exists():raise SystemExit("MISSING_GLOBAL_GENESIS_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_GLOBAL_EXPERIENCE_COGNITIVE_GENESIS_V1":
              raise SystemExit("GLOBAL_GENESIS_WITHHOLD:"+r["next_required_capability"])
          assert r["checks"]["legacy_13_branches_consumed"] is True,r
          assert r["checks"]["all_receipt_files_scanned"] is True,r
          assert r["checks"]["logic_fresh_beats_baseline"] is True,r
          assert r["checks"]["thinking_fresh_beats_baseline"] is True,r
          assert r["checks"]["intelligence_fresh_beats_baseline"] is True,r
          assert r["checks"]["cognitive_native_commit"] is True,r
          assert r["checks"]["cognitive_unknown_fail_closed"] is True,r
          assert r["checks"]["canonical_unchanged"] is True,r
          print(r["status"],r["genome_id"],r["gene_ids"],r["fresh_scores"],r["next_required_capability"])
          PY
