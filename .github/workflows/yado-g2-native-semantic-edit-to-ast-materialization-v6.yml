name: YADO G2 Native Semantic Edit To AST Materialization V6
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-native-semantic-edit-to-ast-materialization-v6-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-native-semantic-edit-to-ast-materialization-v6
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V6
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V6
        run: python -m py_compile runtime/yado_g2_native_semantic_edit_to_ast_materialization_v6.py
      - name: Run native semantic edit to AST materialization V6
        id: materialize
        continue-on-error: true
        run: python runtime/yado_g2_native_semantic_edit_to_ast_materialization_v6.py
      - name: Canonical guard after V6
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V6 evidence
        if: always()
        run: |
          git config user.name "YADO Semantic AST Materialization"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-native-semantic-edit-to-ast-materialization-v6.json ]; then
            git add candidates/kernel-self-generated/g2-native-semantic-edit-to-ast-materialization-v6.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO semantic AST materialization V6 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V6 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-native-semantic-edit-to-ast-materialization-v6.json")
          if not p.exists(): raise SystemExit("MISSING_SEMANTIC_AST_V6")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_authored_replacement_ast","host_authored_condition_expression",
                    "host_selected_ast_primitive","external_models_used",
                    "automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_NATIVE_SEMANTIC_EDIT_TO_AST_MATERIALIZATION_V6":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["candidate_ast_materialized"] is True,r
          assert c["candidate_source_changed"] is True,r
          assert c["candidate_source_compiles"] is True,r
          print(r["status"],r["selected_primitive"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-native-semantic-edit-to-ast-materialization-v6-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-native-semantic-edit-to-ast-materialization-v6.json
          if-no-files-found: warn
