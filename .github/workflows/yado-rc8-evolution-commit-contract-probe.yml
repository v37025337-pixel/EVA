name: YADO RC8 evolution commit contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-rc8-evolution-commit-contract-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect commit and state contracts
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('yado_core_v3_0_rc3_autoevolution.py'); txt=p.read_text(); tree=ast.parse(txt)
          for n in tree.body:
            if isinstance(n,ast.ClassDef):
              for m in n.body:
                if isinstance(m,ast.FunctionDef) and m.name in {'__init__','_store_candidate','durable_commit_evolution_bundle','unified_snapshot'}:
                  print('\n---',m.name,'---')
                  print(ast.get_source_segment(txt,m))
          PY
