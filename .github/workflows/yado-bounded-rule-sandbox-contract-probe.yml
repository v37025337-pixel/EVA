name: YADO bounded rule sandbox contract probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-bounded-rule-sandbox-contract-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect BoundedRuleSandbox
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('yado_core_v2_1.py')
          txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
          for n in tree.body:
            if isinstance(n,ast.ClassDef) and n.name=='BoundedRuleSandbox':
              print(ast.get_source_segment(txt,n))
          PY
