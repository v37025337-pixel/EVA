name: YADO Bounded Autonomous Learning V1

on:
  push:
    branches: [yado-bounded-autonomous-learning-v1]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  learn:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: yado-bounded-autonomous-learning-v1
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Compile controller
        run: python -m py_compile runtime/yado_bounded_autonomous_learning_v1.py
      - name: Run bounded autonomous public-web learning
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: python runtime/yado_bounded_autonomous_learning_v1.py
      - name: Verify autonomous learning contract
        run: |
          python - <<'PY'
          import ast,json,pathlib
          r=json.load(open('candidates/autonomous/yado-bounded-autonomous-learning-v1.json'))
          assert r['status']=='PASS_SHADOW_BOUNDED_AUTONOMOUS_EXTERNAL_LEARNING_V1',r
          assert r['real_network_used'] is True
          assert r['external_model_used'] is False
          assert r['credentials_used'] is False
          assert r['external_mutation'] is False
          assert r['candidate_self_written'] is True
          assert r['candidate_canonical_active'] is False
          p=pathlib.Path(r['generated_capability']['path'])
          src=p.read_text()
          ast.parse(src)
          assert 'eval(' not in src and 'exec(' not in src and 'subprocess' not in src
          x=json.load(open('experience/autonomous/yado-autonomous-learning-latest.json'))
          pol=x['network_policy']
          assert pol['https_only'] is True and pol['methods']==['GET']
          assert pol['credentials_allowed'] is False
          assert pol['external_writes'] is False
          assert pol['downloaded_code_executed'] is False
          assert x['automatic_main_mutation'] is False
          print(json.dumps({'status':r['status'],'sources':r['source_success_count'],'candidate':r['generated_capability']['path'],'next':r['next_required_capability']},sort_keys=True))
          PY
      - name: Persist bounded experience to shadow branch
        run: |
          git config user.name 'YADO Autonomous Learning'
          git config user.email 'actions@users.noreply.github.com'
          git add experience/autonomous/yado-autonomous-learning-latest.json candidates/autonomous/
          if git diff --cached --quiet; then
            echo 'No new bounded experience to persist.'
          else
            git commit -m 'YADO autonomous learning: persist verified public-web experience [skip ci]'
            git push origin HEAD:yado-bounded-autonomous-learning-v1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-bounded-autonomous-learning-v1-${{ github.run_id }}
          path: |
            experience/autonomous/yado-autonomous-learning-latest.json
            candidates/autonomous/yado-bounded-autonomous-learning-v1.json
            candidates/autonomous/yado_learned_recall_*.py
