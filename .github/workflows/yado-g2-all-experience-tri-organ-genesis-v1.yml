name: YADO G2 All Experience Tri Organ Genesis V1
on:
  push:
    branches: [yado-all-experience-tri-organ-genesis-v1]
    paths:
      - "architecture/yado-g2-all-experience-tri-organ-genesis-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-all-experience-tri-organ-genesis-v1
  cancel-in-progress: true

jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before tri-organ genesis
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile tri-organ genesis transport
        run: python -m py_compile runtime/yado_g2_all_experience_tri_organ_genesis_v1.py
      - name: Give YADO accumulated-experience tri-organ task
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_all_experience_tri_organ_genesis_v1.py
      - name: Canonical guard after tri-organ genesis
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist tri-organ evidence
        if: always()
        run: |
          git config user.name "YADO Tri Organ Genesis"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-all-experience-tri-organ-genesis-v1.json 2>/dev/null || true
          git add experience/yado-all-experience-tri-organ-genesis-v1.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Persist YADO all-experience tri-organ genesis evidence [skip ci]"
          fi
          git reset --hard HEAD
          git clean -fd
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then break; fi
            sleep 2
          done
      - name: Enforce strict tri-organ verdict
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-all-experience-tri-organ-genesis-v1.json")
          if not p.exists():
              raise SystemExit("MISSING_TRI_ORGAN_EVIDENCE")
          r=json.loads(p.read_text())
          c=r["checks"]
          assert r["status"]=="PASS_SHADOW_G2_ALL_EXPERIENCE_TRI_ORGAN_GENESIS_V1",r
          assert c["all_experience_files_hashed"] is True,r
          assert c["all_experience_parse_failures_zero"] is True,r
          assert c["selected_underlying_genes_self_synthesized"] is True,r
          assert c["logic_new_type_not_canonical_parent"] is True,r
          assert c["thinking_new_type_not_canonical_parent"] is True,r
          assert c["logic_fresh_exact"] is True,r
          assert c["thinking_fresh_exact"] is True,r
          assert c["logic_structural_ablation_drop_ge_0_20"] is True,r
          assert c["thinking_structural_ablation_drop_ge_0_10"] is True,r
          assert c["intelligence_fresh_both_contracts_exact"] is True,r
          assert c["intelligence_portfolio_removal_causal"] is True,r
          assert c["intelligence_controller_has_no_explicit_gene_ids"] is True,r
          assert c["intelligence_controller_does_not_resynthesize_during_selection"] is True,r
          assert c["v7_meta_controller_canonical_active"] is True,r
          assert c["v4_remains_active"] is True,r
          assert c["canonical_unchanged"] is True,r
          assert r["canonical_mutation"] is False,r
          print(r["status"],r["genome_id"],r["next_required_capability"])
          PY
      - name: Run top-level regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Full kernel audit on unchanged canonical G2
        run: python runtime/yado_full_kernel_audit_v1.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-all-experience-tri-organ-genesis-v1-${{ github.run_id }}
          path: |
            candidates/kernel-self-generated/g2-all-experience-tri-organ-genesis-v1.json
            experience/yado-all-experience-tri-organ-genesis-v1.json
            audits/yado-full-kernel-audit-v1-report.json
          if-no-files-found: warn
