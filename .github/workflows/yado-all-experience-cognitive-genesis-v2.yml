name: YADO All Experience Cognitive Genesis V2

on:
  workflow_dispatch:
  push:
    branches: [yado-all-experience-cognitive-genesis-v2]
    paths:
      - 'runtime/yado_all_experience_cognitive_genesis_v2.py'
      - '.github/workflows/yado-all-experience-cognitive-genesis-v2.yml'

permissions:
  contents: read

jobs:
  all-experience-cognitive-genesis-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml
      - name: Build all-experience causal index and evolve cognition
        run: python runtime/yado_all_experience_cognitive_genesis_v2.py
      - name: Verify evidence integrity candidate hash and causal ablations
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          r=json.load(open('candidates/cognitive/yado-all-experience-cognitive-genesis-v2.json'))
          i=json.load(open('experience/all/yado-all-experience-index-v2.json'))
          assert r['status']=='PASS_SHADOW_ALL_EXPERIENCE_COGNITIVE_GENESIS_V2'
          assert i['integrity']['raw_blob_sha_preserved'] and i['integrity']['content_sha256_dedup']
          assert i['integrity']['negative_evidence_preserved'] and i['integrity']['branch_names_not_treated_as_semantic_evidence']
          p=Path('candidates/cognitive/yado_all_experience_cognitive_policy_candidate_v2.py')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==r['candidate_sha256']
          compile(p.read_text(),str(p),'exec')
          c=r['causal_checks']
          assert all(c.values()),c
          assert min(r['scores']['selected'].values())>=0.75
          print(json.dumps({'PASS':'ALL_EXPERIENCE_CAUSAL_GATE','summary':r['experience_summary'],'scores':r['scores'],'candidate_sha256':r['candidate_sha256']},sort_keys=True))
          PY
      - name: Run YADO deep self-audit
        run: python runtime/yado_unified_core_deep_self_audit_v1.py
      - name: Compile runtime successor and candidates
        run: python -m compileall -q runtime successor candidates
      - name: Run full kernel audit
        run: python runtime/yado_full_kernel_audit_v1.py
      - name: Build fresh Successor identity
        run: python -m successor build --output "$RUNNER_TEMP/yado-successor-birth"
      - name: Run complete inherited and Successor regression
        run: python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-successor-birth/manifest.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-all-experience-cognitive-genesis-v2-${{ github.run_id }}
          path: |
            experience/all/yado-all-experience-index-v2.json
            candidates/cognitive/yado-all-experience-cognitive-genesis-v2.json
            candidates/cognitive/yado_all_experience_cognitive_policy_candidate_v2.py
            runtime/yado_unified_core_deep_self_audit_v1_receipt.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-regression-v1-report.json
