name: YADO G2 Self Generated Primitive Algebra Genesis V3
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-self-generated-primitive-algebra-genesis-v3-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-self-generated-primitive-algebra-genesis-v3
  cancel-in-progress: true
jobs:
  genesis:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V3
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile V3
        run: python -m py_compile runtime/yado_g2_self_generated_primitive_algebra_genesis_v3.py
      - name: Run self-generated primitive algebra genesis V3
        id: genesis
        continue-on-error: true
        run: python runtime/yado_g2_self_generated_primitive_algebra_genesis_v3.py
      - name: Canonical guard after V3
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V3 evidence
        if: always()
        run: |
          git config user.name "YADO Primitive Algebra Genesis"
          git config user.email "actions@users.noreply.github.com"
          if [ -f candidates/kernel-self-generated/g2-self-generated-primitive-algebra-genesis-v3.json ]; then
            git add candidates/kernel-self-generated/g2-self-generated-primitive-algebra-genesis-v3.json
          fi
          git diff --cached --quiet || git commit -m "Persist YADO primitive algebra genesis V3 [skip ci]"
          git reset --hard HEAD
          git clean -fd runtime/__pycache__ runtime/yado_rc8_v36/__pycache__ || true
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce strict V3 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-self-generated-primitive-algebra-genesis-v3.json")
          if not p.exists(): raise SystemExit("MISSING_PRIMITIVE_ALGEBRA_V3")
          r=json.loads(p.read_text());c=r["checks"]
          for k in ("host_new_primitive_set_supplied","host_new_interpreter_supplied",
                    "host_string_grammar_used","host_primitive_inventory_used",
                    "host_interpreter_source_used","host_patch_used",
                    "external_models_used","automatic_canonical_promotion"):
              assert c[k] is False,(k,r)
          assert c["canonical_unchanged"] is True,r
          if r["status"]!="PASS_SHADOW_G2_SELF_GENERATED_PRIMITIVE_ALGEBRA_GENESIS_V3":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert c["new_self_generated_primitive_algebra_created"] is True,r
          assert c["new_algebra_has_novel_identity"] is True,r
          assert c["new_algebra_binds_current_failure"] is True,r
          print(r["status"],r["selected_candidate"],r["receipt_sha256"])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: yado-g2-self-generated-primitive-algebra-genesis-v3-${{ github.run_id }}
          path: candidates/kernel-self-generated/g2-self-generated-primitive-algebra-genesis-v3.json
          if-no-files-found: warn
