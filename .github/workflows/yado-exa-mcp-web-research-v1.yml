name: YADO Exa MCP Web Research V1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/yado_exa_mcp_web_research_v1.py'
      - 'runtime/test_yado_exa_mcp_web_research_v1.py'
      - 'architecture/yado-exa-mcp-web-research-v1.json'
      - '.github/workflows/yado-exa-mcp-web-research-v1.yml'

permissions:
  contents: read

jobs:
  prove-exa-mcp-shadow-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile and run protocol safety tests
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python -m py_compile runtime/yado_exa_mcp_web_research_v1.py
          python -m unittest runtime.test_yado_exa_mcp_web_research_v1 -v
      - name: Emit shadow admission evidence
        env:
          PYTHONPATH: runtime:runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from yado_exa_mcp_web_research_v1 import ExaMCPConfig
          evidence = {
              "schema": "yado.exa_mcp_web_research.real_run.v1",
              "status": "PASS_SHADOW_EXA_MCP_READ_ONLY_BRIDGE_V1",
              "endpoint": ExaMCPConfig().validated().endpoint,
              "tools": ["web_search_exa", "web_fetch_exa"],
              "external_write": False,
              "downloaded_code_executed": False,
              "automatic_canonical_mutation": False,
              "live_credentials_used": False,
              "note": "Protocol exercised with deterministic transport fixture; live Exa authentication is deployment-scoped.",
          }
          Path("exa-mcp-shadow-evidence.json").write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, sort_keys=True))
          PY
