name: YADO G2 Raw Strategy V4 Verdict Revalidation V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-raw-representation-strategy-genesis-repair-v4-verdict-revalidation-v1-request.json"
permissions:
  contents: write
jobs:
  revalidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before revalidation
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile verdict revalidator
        run: python -m py_compile runtime/yado_kernel_g2_native_raw_representation_strategy_genesis_repair_v4_verdict_revalidation_v1.py
      - name: Revalidate immutable V4 evidence
        run: python runtime/yado_kernel_g2_native_raw_representation_strategy_genesis_repair_v4_verdict_revalidation_v1.py
      - name: Canonical guard after revalidation
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist corrected verdict evidence
        run: |
          git config user.name "YADO V4 Verdict Revalidation"
          git config user.email "actions@users.noreply.github.com"
          git add architecture/yado-kernel-g2-native-raw-representation-strategy-genesis-repair-v4-verdict-revalidation-v1.json
          git diff --cached --quiet || git commit -m "Persist corrected V4 verdict revalidation [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
