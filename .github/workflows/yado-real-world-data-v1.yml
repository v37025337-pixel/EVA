name: YADO Real World Public Data V1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'successor/**'
      - 'runtime/**'
      - 'canonical/**'
      - 'architecture/evolution-ledger.json'
      - '.github/workflows/yado-real-world-data-v1.yml'

permissions:
  contents: read

concurrency:
  group: real-world-data-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  real-world-public-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r successor/requirements.txt -r runtime/yado_rc8_v36/requirements-github.txt pyyaml
      - name: Build fresh pinned Successor and run complete regression
        run: |
          python runtime/yado_canonical_invariant_guard_v1.py
          python -m successor build --output "$RUNNER_TEMP/real-birth"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/real-birth/manifest.json"
      - name: Run fresh public GitHub data benchmark
        run: |
          python -m successor.real_world_run \
            --manifest "$RUNNER_TEMP/real-birth/manifest.json" \
            --output "$RUNNER_TEMP/real-world-run"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'real-world-run' / 'receipt.json').read_text())
          assert report['status'] == 'PASS_REAL_WORLD_PUBLIC_DATA_V1', report
          assert report['goals_run'] == 9, report
          assert report['goals_verified'] == 9, report
          assert report['independent_checks_passed'] == 9, report
          assert report['answers_supplied_to_kernel'] is False, report
          assert report['state_verification']['status'] == 'PASS', report
          assert len({row['provenance']['head_sha'] for row in report['results']}) == 3, report
          assert report['consciousness_established'] is False, report
          print(json.dumps({
              'status': report['status'],
              'goals': f"{report['goals_verified']}/{report['goals_run']}",
              'independent': report['independent_checks_passed'],
              'repositories': report['repositories'],
              'heads': sorted({row['provenance']['head_sha'] for row in report['results']}),
          }))
          PY
      - name: Full kernel audit and final source guard
        run: |
          python runtime/yado_full_kernel_audit_v1.py
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('audits/yado-full-kernel-audit-v1-report.json').read_text())
          assert report['status'] == 'PASS' and report['findings'] == [], report
          PY
          python runtime/yado_canonical_invariant_guard_v1.py
          git diff --exit-code -- canonical architecture/evolution-ledger.json
      - name: Preserve real-world evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-real-world-data-v1-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/real-birth/
            ${{ runner.temp }}/real-world-run/
            audits/yado-full-regression-v1-report.json
            audits/yado-full-regression-v1-report.log
            audits/yado-full-kernel-audit-v1-report.json
