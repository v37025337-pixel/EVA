name: YADO G2 Multidomain Cognitive Curriculum V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths: ["architecture/yado-g2-multidomain-cognitive-curriculum-v1-request.json"]
permissions: {contents: write}
jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - run: python runtime/yado_canonical_invariant_guard_v1.py
      - run: python -m py_compile runtime/yado_advanced_stem_benchmark_v1.py
      - name: Run multidomain native curriculum
        run: python runtime/yado_advanced_stem_benchmark_v1.py
      - name: Convert curriculum receipt into durable experience
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,os
          root=pathlib.Path(".")
          src=root/"runtime"/"yado_advanced_stem_benchmark_v1_receipt.json"
          r=json.loads(src.read_text())
          tasks=r["tasks"]; summary=r["summary"]
          by_kind={}
          for t in tasks:
              by_kind.setdefault(t["kind"],[]).append(t)
          organ_map={
              "LOGIC":[t for t in tasks if t["kind"]=="LOGIC_EXACT"],
              "THINKING":[t for t in tasks if t["kind"]=="THINKING_CAUSAL_PLAN"],
              "INTELLIGENCE":[t for t in tasks if t["kind"]=="INTELLIGENCE_CLASSIFICATION"],
          }
          organ={}
          for name,xs in organ_map.items():
              organ[name]={
                  "task_count":len(xs),
                  "mean_fresh":sum(x["fresh_blind"] for x in xs)/max(1,len(xs)),
                  "min_fresh":min([x["fresh_blind"] for x in xs] or [0.0]),
                  "mean_baseline":sum(x["baseline"] for x in xs)/max(1,len(xs)),
                  "mean_gain":sum(x["gain"] for x in xs)/max(1,len(xs)),
                  "all_fresh_ge_0_75":all(x["fresh_blind"]>=.75 for x in xs) if xs else False,
              }
          exp={
            "schema":"yado.g2.multidomain_cognitive_curriculum.experience.v1",
            "status":"TRAINED",
            "source_receipt_sha256":r["receipt_sha256"],
            "task_count":len(tasks),
            "domains":summary["domains"],
            "organ_training":organ,
            "tasks":tasks,
            "canonical_mutation":False,
            "promotion_applied":False,
            "semantic_boundary":"SYNTHETIC/CONTROLLED MULTIDOMAIN CURRICULUM WITH FIT/VALIDATION/FRESH BLIND. THIS IS TRAINING EVIDENCE, NOT YET REAL-WORLD DATA TRANSFER."
          }
          def h(o): return hashlib.sha256(json.dumps(o,sort_keys=True,separators=(",",":"),default=str).encode()).hexdigest()
          exp["experience_digest"]=h(exp)
          p=root/"experience"/"yado-multidomain-cognitive-curriculum-v1.json"
          p.write_text(json.dumps(exp,indent=2,sort_keys=True)+"\n")
          rep={
            "schema":"yado.g2.multidomain_cognitive_curriculum.v1",
            "status":"PASS_SHADOW_G2_MULTIDOMAIN_COGNITIVE_CURRICULUM_V1" if (
              organ["LOGIC"]["all_fresh_ge_0_75"] and organ["THINKING"]["all_fresh_ge_0_75"] and organ["INTELLIGENCE"]["mean_fresh"]>=.80
            ) else "WITHHOLD_G2_MULTIDOMAIN_COGNITIVE_CURRICULUM_V1",
            "task_count":len(tasks),"overall":summary,"organ_training":organ,
            "experience_digest":exp["experience_digest"],
            "canonical_mutation":False,"promotion_applied":False,
            "next_required_capability":"MULTIDOMAIN_COGNITIVE_EXPERIENCE_CONSOLIDATION_V1"
          }
          rep["receipt_sha256"]=h(rep)
          q=root/"candidates"/"kernel-self-generated"/"g2-multidomain-cognitive-curriculum-v1.json"
          q.write_text(json.dumps(rep,indent=2,sort_keys=True)+"\n")
          print(json.dumps(rep,indent=2,sort_keys=True))
          if not rep["status"].startswith("PASS"): raise SystemExit(2)
          PY
      - run: python runtime/yado_canonical_invariant_guard_v1.py
        if: always()
      - name: Persist curriculum evidence
        if: always()
        run: |
          git config user.name "YADO Multidomain Cognitive Curriculum V1"
          git config user.email "actions@users.noreply.github.com"
          git add runtime/yado_advanced_stem_benchmark_v1_receipt.json 2>/dev/null || true
          git add experience/yado-multidomain-cognitive-curriculum-v1.json 2>/dev/null || true
          git add candidates/kernel-self-generated/g2-multidomain-cognitive-curriculum-v1.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Persist YADO multidomain cognitive curriculum V1 [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce curriculum verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("candidates/kernel-self-generated/g2-multidomain-cognitive-curriculum-v1.json")
          if not p.exists(): raise SystemExit("MISSING_CURRICULUM_EVIDENCE")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_SHADOW_G2_MULTIDOMAIN_COGNITIVE_CURRICULUM_V1":
              raise SystemExit("CURRICULUM_WITHHOLD")
          print(r["status"],r["task_count"],r["organ_training"])
          PY
