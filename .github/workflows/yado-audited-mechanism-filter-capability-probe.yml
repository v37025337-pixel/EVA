name: YADO audited mechanism filter capability probe
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - ".github/workflows/yado-audited-mechanism-filter-capability-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python runtime/reconstruct_rc8v36.py
      - name: Inspect audited mechanism selector and program kinds
        working-directory: runtime/yado_rc8_v36
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          wanted_classes={'AuditedMechanismSelector','PredicateProgram','FieldMapperProgram','RuleProgram'}
          wanted_funcs={'synthesize_candidates_with_diagnostics','execute','evaluate','apply'}
          for p in Path('.').glob('*.py'):
            try:
              txt=p.read_text(errors='ignore'); tree=ast.parse(txt)
            except: continue
            for n in tree.body:
              if isinstance(n,ast.ClassDef) and (n.name in wanted_classes or 'Mechanism' in n.name or 'Predicate' in n.name):
                print('\n====',p.name,n.name,'====')
                for m in n.body:
                  if isinstance(m,(ast.FunctionDef,ast.AsyncFunctionDef)) and (m.name in wanted_funcs or 'synth' in m.name.lower() or 'exec' in m.name.lower()):
                    print(ast.get_source_segment(txt,m))
          PY
