name: YADO G2 Autonomous Self Rewrite V1
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-autonomous-self-rewrite-v1-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-autonomous-self-rewrite-v1
  cancel-in-progress: true
jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Reconstruct inherited runtime
        run: python runtime/reconstruct_rc8v36.py
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before autonomous rewrite
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile rewrite controller
        run: python -m py_compile runtime/yado_g2_autonomous_self_rewrite_v1.py
      - name: Run kernel-priority-conditioned self rewrite
        run: python runtime/yado_g2_autonomous_self_rewrite_v1.py
      - name: Require strict shadow rewrite PASS
        run: |
          python - <<'PY'
          import json
          r=json.load(open("candidates/kernel-self-generated/g2-autonomous-self-rewrite-v1.json"))
          assert r["status"]=="PASS_SHADOW_G2_AUTONOMOUS_SELF_REWRITE_V1",r
          assert r["host_selected_target"] is False,r
          assert r["host_wrote_candidate_source"] is False,r
          assert r["candidate_executed"] is False,r
          assert r["canonical_mutation"] is False,r
          assert r["canonical_head_unchanged"] is True,r
          print(r["status"],r["target_selection"]["selected_path"],r["selected_skill_id"])
          PY
      - name: Canonical guard after autonomous rewrite
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist shadow rewrite evidence
        run: |
          git config user.name "YADO Autonomous Self Rewrite"
          git config user.email "actions@users.noreply.github.com"
          git add candidates/kernel-self-generated/g2-autonomous-self-rewrite-v1.json
          git add candidates/g2-self-evolution/*_autonomous_candidate_v1.py
          git diff --cached --quiet || git commit -m "Persist autonomous shadow self-rewrite candidate [skip ci]"
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
