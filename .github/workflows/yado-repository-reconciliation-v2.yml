name: YADO Repository Reconciliation V2

on:
  push:
    branches: [main, yado-repository-reconciliation-architecture-v2-20260919]
    paths:
      - "architecture/yado-unified-architecture-v2.json"
      - "runtime/yado_repository_reconciliation_v1.py"
      - "runtime/yado_full_kernel_audit_v2.py"
      - "runtime/yado_unified_core_v1.py"
      - "candidates/autonomous/yado-runtime-self-rewrite-promotion-v4.json"
      - ".github/workflows/yado-repository-reconciliation-v2.yml"
  pull_request:
    branches: [main]
    paths:
      - "architecture/yado-unified-architecture-v2.json"
      - "runtime/yado_repository_reconciliation_v1.py"
      - "runtime/yado_full_kernel_audit_v2.py"
      - "runtime/yado_unified_core_v1.py"
      - "candidates/autonomous/yado-runtime-self-rewrite-promotion-v4.json"
      - ".github/workflows/yado-repository-reconciliation-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Fetch complete branch topology
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Reconstruct runtime and install dependencies
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt -r successor/requirements.txt
          python -m pip install --disable-pip-version-check pyyaml

      - name: Compile reconciliation surface
        run: |
          python -m py_compile runtime/yado_repository_reconciliation_v1.py runtime/yado_full_kernel_audit_v2.py runtime/yado_unified_core_v1.py

      - name: Repository architecture reconciliation
        run: python runtime/yado_repository_reconciliation_v1.py --strict

      - name: Canonical invariant guard
        run: python runtime/yado_canonical_invariant_guard_v1.py

      - name: Full kernel audit V2
        run: |
          rm -f audits/yado-full-kernel-audit-v1-report.json audits/yado-full-kernel-audit-v1-summary.md audits/yado-full-kernel-audit-v2-report.json audits/yado-full-kernel-audit-v2-summary.md
          python runtime/yado_full_kernel_audit_v2.py
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-kernel-audit-v2-report.json"))
          assert d["status"]=="PASS", d
          assert d["repository_reconciliation"]["status"]=="PASS", d
          assert d["kernel_audit_v1"]["status"]=="PASS", d
          print("PASS_FULL_KERNEL_AUDIT_V2")
          PY

      - name: Unified core native audit
        env:
          PYTHONPATH: runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          from yado_unified_core_v1 import UnifiedYADOCoreV1
          report=UnifiedYADOCoreV1(Path(".")).audit()
          assert report["pass"] is True, report
          print("PASS_UNIFIED_CORE_NATIVE_AUDIT", report["generation"], report["branch_count"])
          PY

      - name: Complete Successor regression
        run: |
          rm -rf "$RUNNER_TEMP/yado-reconciled-successor"
          python -m successor build --output "$RUNNER_TEMP/yado-reconciled-successor"
          python runtime/yado_full_regression_v1.py --manifest "$RUNNER_TEMP/yado-reconciled-successor/manifest.json"
          python - <<'PY'
          import json
          d=json.load(open("audits/yado-full-regression-v1-report.json"))
          assert d["status"]=="PASS", d
          assert d["tests_run"]==d["expected_tests"], d
          assert not d["failures"] and not d["errors"] and not d["skipped"], d
          assert d["source_unchanged"] is True, d
          print("PASS_FULL_SUCCESSOR_REGRESSION",d["tests_run"])
          PY

      - name: Re-run reconciliation after all tests
        run: python runtime/yado_repository_reconciliation_v1.py --strict

      - name: Preserve reconciliation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-repository-reconciliation-v2
          path: |
            architecture/yado-unified-architecture-v2.json
            audits/yado-repository-reconciliation-v1-report.json
            audits/yado-full-kernel-audit-v1-report.json
            audits/yado-full-kernel-audit-v1-summary.md
            audits/yado-full-kernel-audit-v2-report.json
            audits/yado-full-kernel-audit-v2-summary.md
            audits/yado-full-regression-v1-report.json
          if-no-files-found: warn
