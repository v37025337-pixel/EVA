name: YADO Network Self Directed Repair V2

on:
  push:
    branches: [yado-public-dns-research-v1]
    paths:
      - 'runtime/yado_network_self_directed_repair_v2.py'
      - '.github/workflows/yado-network-self-directed-repair-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Prepare runtime
        run: |
          python runtime/reconstruct_rc8v36.py
          python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Run YADO self-directed network repair
        run: |
          python -m py_compile runtime/yado_network_self_directed_repair_v2.py
          PYTHONPATH=runtime:runtime/yado_rc8_v36 python runtime/yado_network_self_directed_repair_v2.py
      - name: Verify bounded cognitive contract
        run: |
          python - <<'PY'
          import json
          x=json.load(open('candidates/network/yado-network-self-directed-repair-v2.json'))
          assert x['external_model_used'] is False
          assert x['credentials_used'] is False
          assert x['mutation'] is False
          assert x['status'] in {'PASS_SHADOW_NETWORK_CONTRACT_REPAIR_V2','WITHHOLD_EXPLICIT_NETWORK_CAPABILITY_DEFICIT_V2'}
          assert x['next_required_capability']
          print(json.dumps({'status':x['status'],'selected':x['selected_hypothesis'],'diagnosis':x['diagnosis'],'next':x['next_required_capability']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yado-network-self-directed-repair-v2-${{ github.run_id }}
          path: candidates/network/yado-network-self-directed-repair-v2.json
