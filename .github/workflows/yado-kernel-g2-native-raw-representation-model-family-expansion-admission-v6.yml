name: YADO G2 Raw Representation Family Expansion Admission V6
on:
  push:
    branches: [yado-architecture-shadow-search]
    paths:
      - "architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-admission-v6-request.json"
permissions:
  contents: write
concurrency:
  group: yado-g2-raw-representation-family-expansion-admission-v6
  cancel-in-progress: true
jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {fetch-depth: 0}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python runtime/reconstruct_rc8v36.py
      - run: python -m pip install --disable-pip-version-check -r runtime/yado_rc8_v36/requirements-github.txt
      - name: Canonical guard before V6 admission
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Compile reusable multiscale runtime and V6 admission
        run: |
          python -m py_compile runtime/yado_raw_task_representation_multiscale_v6.py
          python -m py_compile runtime/yado_kernel_g2_native_raw_representation_model_family_expansion_admission_v6.py
      - name: Run independent V6 admission
        id: admit
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=30s 1800s python runtime/yado_kernel_g2_native_raw_representation_model_family_expansion_admission_v6.py
      - name: Canonical guard after V6 admission
        if: always()
        run: python runtime/yado_canonical_invariant_guard_v1.py
      - name: Persist V6 admission evidence
        if: always()
        run: |
          git config user.name "YADO Raw Family Admission V6"
          git config user.email "actions@users.noreply.github.com"
          files=()
          [ -f architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-admission-v6.json ] && files+=(architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-admission-v6.json)
          [ -f resources/yado-raw-task-representation-model-family-expansion-admission-v6-fresh.json ] && files+=(resources/yado-raw-task-representation-model-family-expansion-admission-v6-fresh.json)
          if [ ${#files[@]} -gt 0 ]; then git add "${files[@]}"; fi
          git diff --cached --quiet || git commit -m "Persist YADO raw family admission V6 evidence [skip ci]"
          git reset --hard HEAD
          git clean -fd
          git pull --rebase origin yado-architecture-shadow-search
          git push origin HEAD:yado-architecture-shadow-search
      - name: Enforce honest V6 verdict
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("architecture/yado-kernel-g2-native-raw-representation-model-family-expansion-admission-v6.json")
          if not p.exists():raise SystemExit("MISSING_V6_ADMISSION")
          r=json.loads(p.read_text())
          if r["status"]!="PASS_READY_G2_NATIVE_RAW_REPRESENTATION_MODEL_FAMILY_EXPANSION_ADMISSION_V6":
              raise SystemExit("SEMANTIC_WITHHOLD:"+str(r["status"]))
          assert r["canonical_mutation"] is False
          print(r["status"],r["selected_spec"],r["admission_metrics"],r["post_selection_fresh"],r["next_required_capability"])
          PY
